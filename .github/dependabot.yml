version: 2
updates:
  # Security updates only, for every committed lockfile. `allow` and `ignore`
  # filter security updates too, not just version updates, so an `allow` list
  # here silently stops fix PRs for every alert outside it — the earlier
  # `allow: @playwright/test` did exactly that. `open-pull-requests-limit: 0`
  # turns version updates off and leaves security updates on (they have no PR
  # limit). With a group on a `directories` block, Dependabot groups security
  # fixes across all listed directories of one ecosystem, so every fix lands in
  # one PR.
  #
  # Every `directories` entry must hold a committed lockfile: a directory
  # without one makes Dependabot open manifest-only PRs that fail the
  # frozen-lockfile install (PR #13152). `dependabot-coverage.test.mjs` pins
  # both rules.
  #
  # Playwright stays out of the group. The pnpm catalog version and the
  # mcr.microsoft.com/playwright tag in .github/workflows/e2e.yml move together
  # in one PR, which Dependabot cannot do (playwright-version-sync.test.mjs), so
  # a Playwright fix gets its own PR and never blocks the rest.
  - package-ecosystem: "npm"
    directories:
      # The pnpm workspace: one root pnpm-lock.yaml covers every workspace package.
      - "/"
      # Separate npm trees with their own package-lock.json, outside pnpm.overrides.
      - "/performance-tests"
      - "/examples/next/docs/*"
      - "/examples/next/visual-tests/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"
