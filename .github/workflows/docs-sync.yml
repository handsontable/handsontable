name: Sync Docs Content to Production

# Ports content-only documentation commits from develop to the live
# prod-docs/<major>.<minor> branch through one bot-owned pull request.
# `develop` documents the NEXT release, so this is not a plain branch sync: an
# LLM (through the LiteLLM proxy) decides per commit whether the change applies
# to the released version; everything else is deterministic and unit-tested.
# Script: .github/scripts/docs-sync.mjs (run it locally with --dry-run).
on:
  # 05:00 UTC, Mon-Fri = 06:00 Warsaw in winter (CET) / 07:00 in summer (CEST).
  # GitHub cron is UTC-only and cannot track DST, so 05:00 UTC keeps it at 06:00
  # local during standard time. Nothing merges to develop on weekends, so a
  # weekend run would only re-derive Friday's empty report.
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only: rebuild the branch locally, push nothing, open nothing'
        type: boolean
        default: true
      target:
        description: 'prod-docs/<major>.<minor> to sync into; blank picks the highest'
        type: string
        default: ''

# The job pushes a branch, opens/updates a pull request, applies the `docs-sync`
# labels, and posts a hold comment. It uses the built-in GITHUB_TOKEN with these
# scopes granted per-workflow -- `issues: write` is the Issues API, which both
# labels and issue comments need -- so there is no separate GitHub App to install
# or keep permissioned (handsontable/examples' import workflows open their bot
# pull requests the same way). Trade-off: a pull request opened by GITHUB_TOKEN
# does not trigger `pull_request` workflows, so the sync pull request gets no CI
# (docs lint, build, preview); there is no run to "re-run" -- a maintainer closes
# and reopens the pull request, or pushes a commit, to fire CI. Accepted here.
# Pre-flight for the first live run: Settings -> Actions -> General -> "Allow
# GitHub Actions to create and approve pull requests" must be on (repo AND org);
# the `permissions:` block does not override that toggle, and `gh pr create`
# 403s without it.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs content to the live prod-docs branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          ref: develop
          fetch-depth: 0
          # The script sets its own push credentials from GH_TOKEN below; the
          # checkout must not leave a different token in .git/config where it
          # would be used instead.
          persist-credentials: false

      - name: Point pushes at GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        name: Install pnpm

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # Needed only for docs:lint, which validates the synced sidebar.js files.
      - run: pnpm install --frozen-lockfile

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          # Repository variable, so the model can change without a pull request.
          DOCS_SYNC_MODEL: ${{ vars.DOCS_SYNC_MODEL }}
          # Optional repository variable. Unset (empty) omits temperature from
          # the request, so the provider's own default applies -- required for a
          # model that rejects any non-default temperature -- many current
          # reasoning models do, the latest Claude models included (a 400).
          # Set it (e.g. to 0) only for a model that still accepts one.
          DOCS_SYNC_TEMPERATURE: ${{ vars.DOCS_SYNC_TEMPERATURE }}
          # Optional repository variable, on by default. Set it to off for a
          # model that rejects `response_format`; the classifier parses the JSON
          # object out of prose either way.
          DOCS_SYNC_JSON_MODE: ${{ vars.DOCS_SYNC_JSON_MODE }}
          DOCS_SYNC_REVIEWERS: ${{ vars.DOCS_SYNC_REVIEWERS }}
          # A scheduled run is never a dry run; a manual dispatch defaults to one.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          TARGET: ${{ inputs.target }}
        run: node .github/scripts/docs-sync.mjs
