name: Tests

# ── PR pipeline ORCHESTRATOR ────────────────────────────────────────────────
# This file is the DAG only: it wires the module reusable workflows (one per
# domain — Checks, Lint, Code Quality, Unit, Types, Build, E2E, Walkontable,
# Integration, Emitted Types, Visual, Docs, Performance) via `needs` (tiers +
# artifact ordering) and `if` (scope gating from the Checks router's outputs).
# The jobs/steps live in the module files, so each is small and reviewable.
#
# The filename and the `workflow_call` `test-all` input are a stable contract:
# publish.yml (rc/stable/release) calls this workflow with `test-all: true`, and
# a master push runs it with run-all — both get the SAME jobs (nested one level
# deeper) with only display names changed. develop is NOT handled here anymore:
# it has its own orchestrator (develop.yml — the same modules plus the trunk-only
# stages, ending in the experimental npm publish).
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - 'master'
  workflow_dispatch:
    inputs:
      test-all:
        description: 'Test all?'
        type: boolean
        default: false
  workflow_call:
    inputs:
      test-all:
        description: 'Test all?'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 0: the gatekeepers. Scope routing + the gates that STOP the pipeline
  # when red (presence warn, changelog block). Everything downstream needs this.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      test-all: ${{ inputs.test-all || false }}
    secrets: inherit

  # The tracked human exception — a manual gate armed by ticking "This change
  # needs a manual QA pass" in the PR description (read live by the Checks
  # scope router). Runs ONLY when ticked: the sign-off job then waits on the
  # `manual-qa` environment approval, holding this module in progress so CI
  # Gate (which needs it) cannot report — the merge stays blocked without any
  # job going red. Unticked PRs skip the module entirely (skipped, never a
  # misleading green, no runner spent). See manual-qa.yml.
  manual-qa:
    name: Manual QA
    needs: [ checks ]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && needs.checks.outputs.manual-qa == 'true' }}
    uses: ./.github/workflows/manual-qa.yml
    secrets: inherit

  # ── Tier 1: no-build checks. Fast build-validity gates (Lint/Unit/Types) that
  # the build depends on, plus parallel merge gates (Code Quality) that never
  # block a build. PR-only where a merged PR already proved them.
  lint:
    name: Lint
    needs: [ checks ]
    # Skip on a pipeline-only PR (only .github/** changed) — there is no library
    # source to lint. `outside-ci` is false in that case; run-all keeps trunk/full runs.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.outside-ci == 'true') }}
    uses: ./.github/workflows/lint.yml
    with:
      run-visual: ${{ needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-visual == 'true' }}
    secrets: inherit

  code-quality:
    name: Code Quality
    needs: [ checks ]
    # Skip the scans (Sonar/CodeQL/FOSSA/audit) on a pipeline-only PR — nothing in
    # the library changed to scan. See `outside-ci` in checks.yml. NOTE: this also
    # skips CodeQL's Actions-workflow analysis on a workflow-only PR; the nightly
    # baseline scan still covers trunk. Carve CodeQL out at the job level if PR-time
    # workflow-injection scanning is wanted.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.outside-ci == 'true') }}
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  unit:
    name: Unit
    needs: [ checks ]
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-handsontable-unit == 'true') }}
    uses: ./.github/workflows/unit.yml
    with:
      is-pr: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  types:
    name: Types
    needs: [ checks ]
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-handsontable-types == 'true') }}
    uses: ./.github/workflows/types.yml
    secrets: inherit

  # ── Build stage: gated on the fast build-validity checks (CORE_GATE = tier 0 +
  # Lint + Unit + Types). Skipped/PR-only gates don't block (status functions).
  build:
    name: Build
    needs: [ checks, lint, unit, types ]
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.build-handsontable-umd == 'true' || needs.checks.outputs.build-handsontable-es-cjs == 'true') }}
    uses: ./.github/workflows/build.yml
    with:
      run-all: ${{ needs.checks.outputs.run-all == 'true' }}
      run-umd: ${{ needs.checks.outputs.build-handsontable-umd == 'true' }}
      run-es-cjs: ${{ needs.checks.outputs.build-handsontable-es-cjs == 'true' }}
    secrets: inherit

  # Walkontable builds its own engine, so it is gated like the build stage.
  walkontable:
    name: Walkontable
    needs: [ checks, lint, unit, types ]
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-handsontable-walkontable == 'true') }}
    uses: ./.github/workflows/walkontable.yml
    secrets: inherit

  # ── Test stage: consumes the shared build artifacts.
  e2e:
    name: E2E
    needs: [ checks, build ]
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-handsontable-e2e == 'true' || needs.checks.outputs.test-handsontable-e2e-min == 'true' || needs.checks.outputs.build-handsontable-umd == 'true') }}
    uses: ./.github/workflows/e2e.yml
    with:
      run-all: ${{ needs.checks.outputs.run-all == 'true' }}
      run-e2e: ${{ needs.checks.outputs.test-handsontable-e2e == 'true' }}
      run-e2e-min: ${{ needs.checks.outputs.test-handsontable-e2e-min == 'true' }}
      run-playwright: ${{ needs.checks.outputs.build-handsontable-umd == 'true' }}
    secrets: inherit

  integration:
    name: Integration
    needs: [ checks, build ]
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-angular-wrapper == 'true' || needs.checks.outputs.test-react-wrapper == 'true' || needs.checks.outputs.test-vue3 == 'true' || needs.checks.outputs.pkg-preview == 'true') }}
    uses: ./.github/workflows/integration.yml
    with:
      run-all: ${{ needs.checks.outputs.run-all == 'true' }}
      run-pkg-preview: ${{ needs.checks.outputs.pkg-preview == 'true' }}
      # preview packages compose tmp/ + dist/ + styles/, so BOTH bundles must
      # have been built for the prebuilt path (else it full-builds locally).
      hot-prebuilt: ${{ needs.build.outputs.umd-built == 'true' && needs.build.outputs.es-cjs-built == 'true' }}
      # Wrapper list precomputed by the Checks scope job (no setup-job stage).
      wrapper-matrix: ${{ needs.checks.outputs.wrapper-matrix }}
    secrets: inherit

  emitted-types:
    name: Emitted Types
    needs: [ checks, build ]
    # Runs on PRs (verify-types scope) AND on trunk push / release run-all — the old
    # verify-emitted-types.yml ran on develop/master push too, so gating on the event
    # would silently drop the check on trunk and the publish.yml release path. Gate on
    # scope only, never on github.event_name.
    if: ${{ !failure() && !cancelled() && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.verify-types == 'true') }}
    uses: ./.github/workflows/emitted-types.yml
    with:
      # publint checks the composed package (tmp/ + dist/ + styles/) → needs both.
      hot-prebuilt: ${{ needs.build.outputs.umd-built == 'true' && needs.build.outputs.es-cjs-built == 'true' }}
    secrets: inherit

  performance:
    name: Performance
    needs: [ checks, build ]
    # PR-only: the trunk golden baseline runs on performance-tests.yml's own push.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && (needs.checks.outputs.run-all == 'true' || needs.checks.outputs.test-performance == 'true') }}
    uses: ./.github/workflows/performance.yml
    with:
      # Performance consumes the UMD dist only.
      hot-prebuilt: ${{ needs.build.outputs.umd-built == 'true' }}
    secrets: inherit

  # ── Post-test: the visual budgeting gate — runs only after the functional
  # tests pass (browser minutes spent on an already-green build).
  visual:
    name: Visual
    needs: [ checks, build, e2e, integration ]
    # Gated on the ES+CJS build (the visual examples consume it) OR the visual
    # scope — NOT on the build module merely succeeding. A tests/**-only PR
    # builds UMD (for Playwright) but not ES+CJS, and must not pay for the full
    # visual suite (matches the pre-split behaviour).
    if: ${{ !failure() && !cancelled() && (needs.build.outputs.es-cjs-built == 'true' || needs.checks.outputs.test-visual == 'true') }}
    uses: ./.github/workflows/visual.yml
    secrets: inherit

  # ── Docs: its own internal DAG (lint/plugins/angular → preview → visual).
  docs:
    name: Docs
    needs: [ checks ]
    if: |
      !failure() && !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'push') && (
        (needs.checks.outputs.run-all == 'true' && github.event_name == 'pull_request') ||
        needs.checks.outputs.docs == 'true'
      )
    uses: ./.github/workflows/docs.yml
    with:
      run-all: ${{ needs.checks.outputs.run-all == 'true' }}
      run-angular: ${{ needs.checks.outputs.docs-angular == 'true' }}
      is-pr: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  # ── Single merge gate ──────────────────────────────────────────────────────
  # THE one status check to pin in branch protection. Every other job here is
  # conditional (scope-gated) or matrix-expanded, so pinning individual names is
  # fragile: a scope-skipped matrix job never emits its per-leg check runs, which
  # then sit as "Expected — waiting for status to be reported" and block the PR
  # forever. This job instead ALWAYS runs (so it always reports one stable name)
  # and derives a single verdict from every other job's result: it fails if any
  # job that actually ran failed or was cancelled, and passes when everything
  # else succeeded or was legitimately scope-skipped. Branch protection should
  # require ONLY "CI Gate" and unpin every individual/matrix check name. The
  # manual-QA gate blocks through its needs edge here: a ticked PR's pending
  # sign-off keeps this job from ever reporting.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - checks
      - manual-qa
      - lint
      - code-quality
      - unit
      - types
      - build
      - walkontable
      - e2e
      - integration
      - emitted-types
      - performance
      - visual
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Verify every pipeline job passed or was scope-skipped
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Upstream job results: $results"
          failed=0
          IFS=',' read -ra arr <<< "$results"
          for r in "${arr[@]}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Pipeline job result '$r' — merge blocked."; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All pipeline jobs passed or were legitimately scope-skipped."
