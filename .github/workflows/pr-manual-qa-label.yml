name: PR Manual QA label

# Makes the manual-QA request VISIBLE in the pull-request list. The gate itself
# is the `Manual QA / sign-off` job in the Tests pipeline (see manual-qa.yml);
# this workflow only mirrors the request onto a label, so a PR waiting for a
# human pass is recognizable without opening it.
#
# Ticking "This change needs a manual QA pass" in the PR description applies
# the label; unticking removes it. It fires on `edited` too, so ticking the box
# after opening is picked up immediately. The label is created on first use in
# RED and re-asserted on every run, so it cannot drift to another colour.
#
# AUTO-ARM, NEVER AUTO-DISARM. Enforcement is decided per RUN, when the Checks
# scope router reads the box. Ticking the box after a run already went green
# would otherwise leave the PR mergeable with no gate — a real hole — so on the
# unticked -> ticked transition this workflow RE-RUNS the latest Tests run for
# the head commit, which re-reads the box and arms the gate. The reverse is
# deliberately manual: automation here can only ever ADD the human gate, never
# remove one. To drop enforcement, untick and press "Re-run all jobs" (or push)
# — a person does it, and it is recorded as their action.
#
# Deliberately standalone, NOT a Tests module: it needs `issues: write`, and a
# nested job-level permission request inside a reusable module is validated
# against the caller's grant at run startup (see the develop.yml note in
# AGENTS.md). Nothing depends on this workflow, so it can never take CI Gate
# down. It runs on the plain `pull_request` trigger — the base-ref variant that
# hands a write token to a fork's branch is banned repo-wide, and asserted by
# .github/scripts/__tests__/fork-guards.test.mjs — so the trade-off is that fork
# and Dependabot PRs get no label (the guard below skips them, since their
# read-only token would 403). The GATE still applies to them in full.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  # Re-running the Tests run when the box is newly ticked (see "auto-arm").
  actions: write

concurrency:
  group: pr-manual-qa-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: sync the label with the tickbox
    # Fork PRs and Dependabot PRs run on a read-only GITHUB_TOKEN, so the label
    # write would 403. Canonical guard (all three halves) — see the fork-guard
    # bullet in AGENTS.md and .github/scripts/__tests__/fork-guards.test.mjs.
    if: github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Apply or remove the manual-QA label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            // Keep in sync with the tickbox regex in checks.yml and the
            // template line in .github/PULL_REQUEST_TEMPLATE.md.
            const LABEL = 'Requires Manual QA';
            const COLOR = 'b60205'; // GitHub's red — a stop sign in the PR list.
            const DESCRIPTION = 'Waits for a manual-qa environment sign-off before it can merge';

            // Assert the label's appearance every time: created on first use,
            // and repaired if someone recolours it by hand. Without this the
            // first addLabels call would invent a random colour.
            const ensureLabel = async () => {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
                });
                if (existing.color === COLOR && existing.description === DESCRIPTION) return;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: LABEL, color: COLOR, description: DESCRIPTION,
                });
                core.notice(`Restored the "${LABEL}" label's colour and description.`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: LABEL, color: COLOR, description: DESCRIPTION,
                });
                core.notice(`Created the "${LABEL}" label.`);
              }
            };
            const prNumber = context.payload.pull_request.number;
            // Live read: another workflow may have moved the labels since this
            // event was queued.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const ticked = /^\s*-\s*\[[xX]\]\s+This change needs a manual QA pass/m.test(pr.body || '');
            const labelled = pr.labels.some((label) => label.name === LABEL);

            if (ticked === labelled) {
              core.notice(`Label already ${labelled ? 'applied' : 'absent'} — nothing to do.`);
              return;
            }
            if (ticked) {
              await ensureLabel();
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: [LABEL],
              });
              core.notice(`Applied "${LABEL}" — this PR waits for a manual-qa sign-off.`);

              // Auto-arm: the box went from unticked to ticked, so the Tests run
              // that already evaluated it decided "no gate". Re-run it so the
              // scope router re-reads the box and the sign-off job appears.
              // Best-effort — a failure here must not fail the label sync.
              try {
                const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner, repo: context.repo.repo,
                  head_sha: pr.head.sha, per_page: 50,
                });
                const tests = runs.workflow_runs
                  .filter((run) => run.path === '.github/workflows/test.yml')
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                const latest = tests[0];

                if (!latest) {
                  core.notice('No Tests run for this commit yet — the next one reads the box and arms the gate.');
                } else if (latest.status === 'completed') {
                  await github.rest.actions.reRunWorkflow({
                    owner: context.repo.owner, repo: context.repo.repo, run_id: latest.id,
                  });
                  core.notice(`Re-ran Tests run ${latest.id} so the manual-QA gate arms on this commit.`);
                } else {
                  core.notice(`Tests run ${latest.id} is still ${latest.status}; if it already passed `
                    + '"Checks / scope", press "Re-run all jobs" to arm the gate.');
                }
              } catch (error) {
                core.warning(`Could not re-run the Tests workflow (${error.message}). `
                  + 'Press "Re-run all jobs" on the Tests run to arm the manual-QA gate.');
              }
              return;
            }
            await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, name: LABEL,
            });
            core.notice(`Removed "${LABEL}" — the manual-QA box is no longer ticked. `
              + 'Enforcement is NOT lifted automatically: a Tests run already waiting on the '
              + 'manual-qa environment stays waiting. Press "Re-run all jobs" (or push) to '
              + 'evaluate the unticked box and drop the gate.');
