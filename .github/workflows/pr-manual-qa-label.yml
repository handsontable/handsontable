name: PR Manual QA label

# One job serving one invariant: IF the PR ticks "MANUAL QA NEEDED", THEN it
# carries the red `Requires Manual QA` label and the latest Tests run for the
# head commit actually contains the gate.
#
# APPLY-ONLY, and AUTO-ARM but NEVER AUTO-DISARM. An unticked box does nothing
# at all: the label is a marker (like every other label here, it can be removed
# by hand), and a gate already waiting on the environment is dropped by a person
# pressing "Re-run all jobs" — never by automation, so the audit trail always
# names a human. The gate itself is the tickbox the Checks scope router reads
# (checks.yml) plus the environment-approval job (manual-qa.yml); this workflow
# never decides anything.
#
# Two triggers, because arming must survive both orderings. A PR event cannot
# arm a run that is still in progress (and re-running mid-flight would just
# discard work), so the Tests completion event re-checks; and a completion
# event cannot exist for a box ticked after the run finished, so the PR event
# covers that. The check is state-based, so running it twice is harmless.
#
# It runs on the plain `pull_request` trigger — the base-ref variant that hands
# a write token to a fork's branch is banned repo-wide and asserted by
# .github/scripts/__tests__/fork-guards.test.mjs — so fork and Dependabot PRs
# are served only by the `workflow_run` path, which runs in the base repo.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read
  # Labelling a pull request is billed to BOTH scopes (GitHub answers a label
  # write with `x-accepted-github-permissions: issues=write; pull_requests=write`).
  issues: write
  pull-requests: write
  # Re-running the Tests workflow to arm the gate.
  actions: write

concurrency:
  group: pr-manual-qa-label-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  arm:
    name: label and arm when the box is ticked
    # On a Tests completion this must always run (base-repo context, full
    # token — this is what serves fork PRs). On a PR event it needs the write
    # token, so it carries the canonical fork/Dependabot guard: see the
    # fork-guard bullet in AGENTS.md.
    if: github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Label the PR and re-run Tests if the gate is missing
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            // The regex and the label are pinned by
            // .github/scripts/__tests__/manual-qa-gate.test.mjs against
            // checks.yml and the PR template, which must all agree.
            const TICKED = /^\s*-\s*\[[xX]\]\s+MANUAL QA NEEDED/m;
            const LABEL = 'Requires Manual QA';
            const TESTS = '.github/workflows/test.yml';
            // No module after this many attempts is a bug, not a race.
            const MAX_ATTEMPTS = 3;
            const { owner, repo } = context.repo;
            const completed = context.payload.workflow_run;

            let prNumber = context.payload.pull_request?.number ?? completed?.pull_requests?.[0]?.number;

            if (!prNumber && completed) {
              // `pull_requests` is empty for fork runs.
              const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: completed.head_sha,
              });

              prNumber = associated.find((candidate) => candidate.state === 'open')?.number;
            }
            if (!prNumber) {
              core.notice('No open pull request for this event — nothing to do.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            if (!TICKED.test(pr.body || '')) {
              core.notice('Manual QA not requested — nothing to do. (Unticking never removes the '
                + 'label or lifts a waiting gate: remove the label by hand, and press "Re-run all '
                + 'jobs" to drop the gate.)');
              return;
            }

            // Marker only. Idempotent, and the label already exists in red, so
            // this never invents a colour.
            await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [LABEL] });

            // Enforcement is decided per RUN, when the scope router reads the
            // box, so a box ticked after the fact would leave a green PR
            // mergeable with no gate. Assert otherwise, against the CURRENT
            // head — a run for a superseded commit no longer gates the merge.
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: pr.head.sha, per_page: 50,
            });
            const latest = runs.workflow_runs
              .filter((run) => run.path === TESTS)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (!latest) {
              core.notice('No Tests run for the head commit yet — the next one reads the box and arms the gate.');
              return;
            }
            if (latest.status !== 'completed') {
              core.notice(`Tests run ${latest.id} is ${latest.status}; this job re-checks when it completes.`);
              return;
            }
            if (latest.conclusion !== 'success') {
              // A red pipeline blocks the merge already, so there is no gate to
              // skip — and re-running could loop when the failure is in
              // `Checks` itself, which would keep the module from being created.
              core.notice(`Tests run ${latest.id} concluded ${latest.conclusion} — the merge is blocked already.`);
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner, repo, run_id: latest.id, attempt_number: latest.run_attempt, per_page: 100,
            });

            if (jobs.jobs.some((job) => job.name.includes('Manual QA'))) {
              core.notice(`Tests run ${latest.id} already carries the manual-QA gate.`);
              return;
            }
            if (latest.run_attempt >= MAX_ATTEMPTS) {
              core.setFailed(`Tests run ${latest.id} still has no manual-QA job after `
                + `${latest.run_attempt} attempts, though the box is ticked. Investigate the Checks scope job.`);
              return;
            }

            await github.rest.actions.reRunWorkflow({ owner, repo, run_id: latest.id });
            core.notice(`The box is ticked but Tests run ${latest.id} went green without the gate — `
              + 're-ran it so the manual-QA sign-off is required on this commit.');
