name: Docs visual seed

# Writes the golden records of the docs visual suite -- `docs/base/<branch>/`
# in R2, the baseline every docs pull request into <branch> is compared
# against -- from the staging deploy of the commit that was just pushed.
#
# Why `workflow_run` on the staging deploy. The docs are built from a base
# branch in exactly one place: docs-staging.yml's push build, which deploys
# develop to handsontable-docs-staging.pages.dev and release/x.y.z to
# rc-x-y-z.handsontable-docs-staging.pages.dev. Chaining on its completion
# seeds `docs/base/<branch>` from exactly what it deployed, with the specs of
# the same commit (the job checks out `head_sha`), and costs no second docs
# build. Before DEV-2860 nothing seeded the docs baseline at all: the cache the
# suite restored from was scoped to the pull request, so commit 2 of a pull
# request was compared against commit 1 and never against develop (PR #13440),
# and a cache miss wrote the preview's own render as the goldens and passed.
#
# Two consequences of the trigger, the same ones test-health.yml lives with.
# GitHub runs the copy of this file on the DEFAULT branch, whatever branch the
# deploy came from, so a change here is exercised only after it lands on
# develop -- the dispatch exists for that, and for re-seeding a baseline
# someone has confirmed is poisoned. And it never runs for a pull request: a
# pull request's staging deploy is the `workflow_call` path inside Tests, which
# produces no run of its own, and a deploy whose triggering event is not a
# push is skipped below in any case (a dispatched staging deploy does not
# chain; dispatch this workflow after it).
#
# The known lag, stated so nobody rediscovers it: docs-staging.yml's push
# trigger fires on `docs/**` and `handsontable/package.json` only, so a
# core-only merge that changes how the grid renders is not in the docs baseline
# until the next docs merge deploys, and a docs pull request opened in that gap
# reports develop's own rendering change as its difference. Widening that
# trigger is a separate call: it costs a docs deploy of about 10 minutes per
# core merge.
#
# A seed writes only a render of one build that passes the layout gate. Before
# it renders anything, the docs-visual-run action checks that the alias serves
# the deploy's own build (see the seed step) and runs
# docs/tests/exampleGridLayout.spec.ts against it; after the render it checks
# the build again. It fails without writing when an example grid is collapsed
# or wider than its root. When a newer deploy took the alias, it writes nothing
# and ends green, because that deploy's own seed writes the baseline. Between
# #13381 and #13626, 21 seeds wrote blank grids into this baseline and every
# docs pull request "matched" them. So a red run here can mean that the deploy
# is broken, not the seed. The `notify` job posts every failed automatic seed
# to Slack, because nothing else says the baseline stopped moving.
#
# The group never cancels (visual-seed.yml's rule): GitHub keeps one running
# and one pending run per group, so the LAST deploy of a burst is always
# seeded, and an in-flight seed is never killed halfway through its
# `--delete` reconcile.
on:
  workflow_run:
    workflows: ['Docs Staging Deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'develop or release/x.y.z — which staging deploy to seed from'
        type: string
        default: 'develop'

concurrency:
  # Static prefix, keyed on the branch being seeded rather than on `github.ref`,
  # which is the default branch for every workflow_run.
  group: docs-visual-seed-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: false

jobs:
  seed:
    name: seed
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A failed or canceled deploy has nothing to seed from, and a deploy that a
    # pull request or a dispatch triggered is not a base branch's.
    if: github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    # Read-only: no comment, no pull request. The R2 writes go through the
    # action's inputs, not the token.
    permissions:
      contents: read
    steps:
      # The specs must match the deployed docs: a page added to paths.js in the
      # deployed commit has to be declared by the suite that seeds it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch }}

      # The URL shapes are docs-staging.yml's cf-target step: develop is the
      # project's apex branch; a release branch deploys to `rc-<version>` with
      # the dots turned into dashes. Anything else is not a base branch and has
      # no baseline to seed. The branch name goes through `env:`, never into the
      # script body.
      - name: Resolve the staging deploy to seed from
        id: target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
        run: |
          if [ "$BRANCH" = "develop" ]; then
            url="https://handsontable-docs-staging.pages.dev/docs"
          elif [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${BRANCH#release/}"
            url="https://rc-${version//./-}.handsontable-docs-staging.pages.dev/docs"
          else
            echo "::error::$BRANCH is neither develop nor release/x.y.z; only those have a staging deploy and a docs baseline."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Seeding docs/base/$BRANCH from $url."

      # `expected-sha` pins the seed to the build it chains on: the action reads
      # the build SHA the deploy prints into its sandbox links and writes nothing
      # unless the alias serves that commit both before the check and after the
      # render. Develop only: a release branch's staging build runs in production
      # mode and prints a version instead, and a dispatch has no deploy to chain
      # on, so both pin to whatever the alias serves when the seed starts.
      - name: Seed the docs golden records
        uses: ./.github/actions/docs-visual-run
        with:
          test-url: ${{ steps.target.outputs.url }}
          expected-sha: ${{ steps.target.outputs.branch == 'develop' && github.event.workflow_run.head_sha || '' }}
          mode: seed
          base-key: docs/base/${{ steps.target.outputs.branch }}
          actual-key: docs/base/${{ steps.target.outputs.branch }}
          pass-cookie: ${{ secrets.PASS_COOKIE }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # A failed seed leaves `docs/base/<branch>` where it was, and that is quiet on
  # its own: this workflow is not a required check, and GitHub's failure email
  # reaches only whoever triggered the deploy. visual-seed.yml's notify job has
  # the same reason and the same shape. Automatic seeds only: whoever dispatches
  # a seed is watching it, and a mistyped branch is not news for the channel.
  # The `!cancelled()` is load-bearing: a job `if:` with no status-check
  # function gets an implicit `success()`, which can never hold together with
  # `needs.seed.result == 'failure'` (.ai/CI.md, the status-function entry). A
  # superseded seed ends green, so it posts nothing. An absent secret is an
  # empty string, so the step skips itself and the hook stays optional.
  notify:
    name: Notify Slack
    needs: [ seed ]
    if: ${{ !cancelled() && needs.seed.result == 'failure' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_VISUAL_WEBHOOK_URL }}
    steps:
      - name: Send the failure to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # https://github.com/slackapi/slack-github-action/releases/tag/v3.0.2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: Docs visual seed failed on ${{ github.event.workflow_run.head_branch }} (${{ github.event.workflow_run.head_sha }}).\nThe seed did not finish, so `docs/base/${{ github.event.workflow_run.head_branch }}` most likely still holds the previous render, and docs pull requests are compared against that.\nIf it failed at `Check that the example grids are laid out`, the deploy's example grids did not pass the layout check (a grid collapsed or wider than its root, a page with no grid, or a page that did not load); the check's report is in the run's `docs-visual-report` artifact. Fix the deploy, and the next docs deploy seeds again.\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nRe-seed by hand: dispatch `Docs visual seed` with the branch."
            }
