name: Performance

# The CDP performance regression suite (build-dependent). Uses the shared
# performance-run composite; the standalone performance-tests.yml keeps the
# trunk golden-baseline push trigger until the higher pipelines are reworked.
on:
  workflow_call:
    inputs:
      hot-prebuilt:
        description: 'The shared UMD build artifact is available — skip the internal build'
        type: boolean
        default: false

jobs:
  run:
    name: run
    runs-on: self-hosted
    # The download attempts have their own step timeouts, so this is only the
    # backstop for a hang elsewhere. It must outlast the slowest run the suite
    # itself allows, or a run whose scenarios time out is cancelled before its
    # teardown and reports nothing: setup (the slowest successful run took 19.3
    # minutes, a 10.7-minute pnpm cache restore), both download attempts, and 18
    # scenarios run one at a time, each up to its 5-minute Playwright timeout,
    # plus the regression gate's confirm re-run of up to CONFIRM_MAX_SCENARIOS
    # (performance-tests/lib/gate.mjs) failing ones at the same timeout.
    # perf-artifact-download.test.mjs derives that sum from the config and fails
    # when a scenario or a longer timeout outgrows this.
    timeout-minutes: 146
    permissions:
      contents: write
      pull-requests: write
      actions: read
    # The regression gate's outcome, which `approve` keys on, and where its
    # deployment links to.
    outputs:
      verdict: ${{ steps.perf.outputs.verdict }}
      summary: ${{ steps.perf.outputs.summary }}
      report-url: ${{ steps.perf.outputs.report-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          # `clean: true` is already the checkout default; it is pinned here to
          # document intent, not to fix a broken default, because the persistent
          # runner keeps ignored output and dependency directories between jobs and a
          # future default change must not stop removing them. Requires Git on the
          # runner; the composite's Verify Git checkout step fails loudly when it is
          # missing.
          clean: true

      # PR pipeline: reuse the shared UMD build artifact instead of rebuilding.
      # The download lives here, not in the performance-run composite, because
      # only a job step can take `timeout-minutes`. In run 37947963835 the action
      # logged "Download artifact has finished successfully" and then never
      # exited, so the job sat until its timeout. A healthy download takes 4 to
      # 15 seconds, but that run's first `ListArtifacts` call stalled for 6
      # minutes before the toolkit's own retry fetched the file, so each attempt
      # gets 8. A first attempt that failed or timed out (a step outcome does not
      # tell the two apart) may still have written a complete archive: the check
      # keeps one that lists cleanly, deletes anything else, and the retry runs
      # only when no archive is left. Hand-synced with performance-tests.yml;
      # perf-artifact-download.test.mjs pins both.
      - name: Download the Handsontable UMD build artifact
        id: download-umd
        if: inputs.hot-prebuilt
        timeout-minutes: 8
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd

      - name: Keep a complete archive the first attempt left
        id: check-umd
        if: inputs.hot-prebuilt && steps.download-umd.outcome == 'failure'
        run: |
          if [ -f dist.tar.gz ] && tar -tzf dist.tar.gz > /dev/null 2>&1; then
            echo "The first attempt failed after writing a complete dist.tar.gz; keeping it."
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            rm -f dist.tar.gz
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry the Handsontable UMD build artifact download
        if: inputs.hot-prebuilt && steps.download-umd.outcome == 'failure' && steps.check-umd.outputs.usable != 'true'
        timeout-minutes: 8
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd

      - name: Extract the prebuilt dist
        if: inputs.hot-prebuilt
        run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz

      # !cancelled(), not the default success(): when the download or the extract
      # failed, the composite still runs, stops at its prebuilt check with the
      # reason, and its always() steps write the job summary and the sticky
      # comment, which would otherwise keep the previous push's numbers.
      - uses: ./.github/actions/performance-run
        id: perf
        if: ${{ !cancelled() }}
        with:
          hot-prebuilt: ${{ inputs.hot-prebuilt }}

  # The human decision on a regression, the same mechanism as visual.yml's
  # `approve` job and manual-qa.yml. When the gate (performance-tests/lib/gate.mjs,
  # block mode) finds a scenario slower than its line and the confirm re-run
  # repeats it, this job pauses on the `performance-approval` ENVIRONMENT until
  # someone on its reviewer list approves the run ("Review pending deployments"
  # on the run page; GitHub notifies the reviewers, and "View deployment" opens
  # the report). While it waits the Performance module never completes, so
  # `CI Gate` -- which needs it -- cannot report; a rejection fails this job and
  # turns `CI Gate` red. Approval is per run, so a new push measures again and
  # asks again; it works for fork and Dependabot pull requests, because the
  # reviewer's approval does not go through their token. In warn mode the gate
  # never exports `regressed`, so this job never runs.
  #
  # Cutover (repo admin), before the gate moves to block mode: create the
  # `performance-approval` environment WITH required reviewers and "Prevent
  # self-review" OFF, as on the other approval environments (the reasoning, and
  # the rule that an agent must never approve a deployment, are in `.ai/CI.md`).
  # A job that references a missing environment silently auto-creates it
  # UNPROTECTED and runs straight through, so the step below asserts the
  # control's OUTCOME -- an approval recorded against this run -- and fails
  # closed when none is.
  approve:
    name: approve
    runs-on: ubuntu-26.04
    needs: [ run ]
    # `!failure()` as well as `!cancelled()`: an `if:` that contains a status
    # function replaces the implicit `success()` on `needs` (see `.ai/CI.md`), so
    # `!cancelled()` alone would ask a reviewer to approve a run that is red for
    # another reason and cannot go green whatever they click.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request'
      && needs.run.outputs.verdict == 'regressed' }}
    # The approvals API below reads the run's environment approvals, and the last
    # step rewrites the sticky comment. Requested explicitly: a nested job-level
    # request is validated against the caller's grant at run startup, and `run`
    # already requests both the same way.
    permissions:
      actions: read
      pull-requests: write
    environment:
      name: performance-approval
      # The report is deployed for same-repo pull requests only; elsewhere the
      # run page, which links the job summary and the artifact, stands in.
      url: ${{ needs.run.outputs.report-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - name: Assert a human approval is recorded for this run
        id: assert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            let approvals;

            try {
              // Raw request: the reusable workflow shares the parent's run id,
              // and this endpoint lists the environment approvals for it.
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
                { owner, repo, run_id: context.runId },
              );

              approvals = response.data;
            } catch (error) {
              core.setFailed(`Could not read this run's approvals (${error.status} ${error.message}). `
                + 'The performance gate cannot confirm a human approved the regression, so it fails closed. '
                + 'If this is a token-permission error, grant `actions: read` to the Tests workflow.');
              return;
            }

            const approval = approvals.find((entry) => entry.state === 'approved'
              && (entry.environments || []).some((environment) => environment.name === 'performance-approval'));

            if (!approval) {
              core.setFailed('This job ran without a recorded performance-approval approval, which means the '
                + '`performance-approval` environment has no required reviewers (a missing environment is '
                + 'auto-created unprotected). Configure it -- required reviewers -- and re-run; the gate '
                + 'is not enforcing anything until then.');
              return;
            }

            core.setOutput('approved-by', approval.user.login);
            core.notice(`Performance regression approved by @${approval.user.login}`
              + `${approval.comment ? `: ${approval.comment}` : ''}.`);

      # `run` posted a comment saying the run waits for an approval, and nothing
      # else would take that back down: there is no re-run here to refresh it.
      # Same sticky header, so this replaces that comment rather than adding a
      # second one; the numbers stay in the run's job summary and report. Inline,
      # because this job has no checkout and `run`'s result.md is on another
      # runner. `success()`, not `!cancelled()`: the step above fails when no
      # approval is recorded, and this one would then announce "approved by @"
      # with an empty login -- the opposite of what happened. Write-token runs
      # only, like `run`'s own comment step (see .ai/CI.md, "fork and Dependabot
      # pull requests").
      - name: Record the approval on the pull request
        if: ${{ success() && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]') }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
        with:
          header: performance-tests
          message: |
            ## ⚡ Performance: ✅ regression approved

            @${{ steps.assert.outputs.approved-by }} approved this run's performance regression on the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}),
            where the job summary and the report have the numbers: ${{ needs.run.outputs.summary }}.

            Approval covers this run only: a new push measures again and asks again.
