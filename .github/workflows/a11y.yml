name: A11y

# The accessibility scan: axe-core over the curated Playwright fixture pages, on the
# three themes, compared with the committed baseline (tests/a11y/axe-baseline.json;
# the policy is tests/AGENTS.md, "A11y: the axe scan and its baseline"). The `axe` job is
# one job on purpose: the run has about fifty jobs already, and the scan takes a minute,
# so it does not fan out by theme. It runs in warn mode: a finding that needs action (new,
# grown, improved or fixed) is a ::warning annotation and a row in the job summary, and the
# job stays green. The `A11y / axe report` check run carries the verdict, by the severity rule
# (tests/AGENTS.md, "A11y: the verdict of a check run"): red on a critical or serious finding,
# neutral with a warning on a moderate or minor one, green on none. On a pull request or a push
# only a new or grown finding counts, a tracked one as a warning at most; on the nightly (a
# schedule or a dispatch) every open finding counts. The job's only reds are tooling failures:
# a fixture that does not load, an invalid baseline, a run that completed no scan. The flip to blocking is one constant, `A11Y_MODE` in
# tests/lib/a11y-baseline.mjs, after a replay over recent pull requests shows the
# comparator is precise.
#
# The reports. The job summary. The HTML report (tests/lib/a11y-report.mjs), one
# self-contained file uploaded unzipped (`archive: false`) so it opens in the browser
# from the run page, built to locate every element (fixture, steps, selector, DOM path,
# screenshot). The `A11y / axe report` check run on the pull request's head commit: its
# icon is the visible verdict, and its annotations sit on the line to change. Only `CI Gate`
# is required, so a red check run never blocks a merge by itself. A sticky pull request comment on every pull
# request the scan ran on, edited in place by later runs: the headline, what needs
# action, what the pull request added to the baseline (compared with the base commit's)
# and the report link. And `a11y-findings.json` for an
# implementer agent, in the zipped raw results with a short retention: they are the
# evidence behind a warning, not a record.
#
# Build-dependent like the Playwright legs (e2e.yml): it downloads the UMD build
# artifact, so the orchestrator gates it on the build-umd scope, which includes
# tests/**. It runs inside the pinned Playwright container, so the contrast results
# come from the same Chromium as the functional legs.
#
# The checks beyond axe (the `checks` job): one Playwright project per check of
# tests/playwright.a11y-checks.config.ts (the keyboard walker first), each writing an evidence
# document the Accessibility Conformance Report generator cites per criterion
# (tests/test-results/a11y-checks/<check>.json, the `a11y-checks-evidence` artifact). A finding never
# fails a test or the job: it is a row in the job summary and an annotation on the
# `A11y / <check> report` check run, whose verdict follows the same severity rule, and the job carries
# `continue-on-error`, so a tooling failure turns the job red, as it does the axe job, and never the
# calling pipeline.
# The job runs only when the caller sets `checks: true`: the A11y nightly (a11y-nightly.yml) does, the
# pull-request Tests pipeline (test.yml) does not, so a pull request runs the axe scan alone. The checks
# are report-only and the accessibility program is still building its picture, so a pull request learned
# nothing from them it could act on; the nightly on develop keeps every check and its evidence. `nightly`
# picks the suite: every check, or the short suite a check earns by finishing in under two minutes
# (`pullRequest` in EVIDENCE_CHECKS, tests/lib/a11y-evidence.mjs), which a developer runs locally or
# through a dispatch of the nightly that asks for it. `check-ids` names the checks to run instead of the
# suite (the nightly's `checks` input, the proof run of one check): it reaches the config and the report
# script as `A11Y_CHECKS`, so the run builds the named projects only and the summary names them.
# The policy is tests/AGENTS.md, "A11y: the checks beyond axe".
on:
  workflow_call:
    inputs:
      checks:
        description: Run the checks beyond axe. Off by default, so a pull request runs the axe scan only; the A11y nightly turns it on.
        type: boolean
        default: false
      nightly:
        description: Run every check beyond axe, not only the short suite, and keep the evidence longer.
        type: boolean
        default: false
      check-ids:
        description: The checks beyond axe to run instead of the suite, comma-separated check ids. Empty runs the suite `nightly` picks.
        type: string
        default: ''

jobs:
  axe:
    name: axe
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Job-level, like docs.yml's angular-types and visual.yml's compare: `checks: write` posts the
    # report check run, `pull-requests: write` the sticky comment. Kept off the workflow level so
    # nothing else in the run inherits them.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      # The commit the check run goes on and the report names. On a pull request it is the
      # head, not the merge commit `github.sha` names, or the check never shows on the PR.
      A11Y_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        id: checkout
      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
      - run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm
      - name: Install the Playwright test package
        run: pnpm install --filter handsontable-tests
      # The reporter (tests/reporters/a11y.ts) writes the job summary, the annotations, the HTML
      # report and comparison.json, and decides the exit status from the mode.
      - name: Run the axe scan
        id: axe
        run: cd tests && npx playwright test --config playwright.a11y.config.ts
      # Every run, red or green: the raw axe result per page and theme (`scans/`), the
      # comparison with the baseline (`comparison.json`) and the summary.
      - name: Upload the axe results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: a11y-axe-results
          path: tests/test-results/a11y
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
      # One file, unzipped, so the browser opens it from the run page; the artifact is named
      # after the file. A week, so a reviewer who comes back to the pull request still has it.
      - name: Upload the HTML report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          path: tests/test-results/a11y/a11y-report.html
          archive: false
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Link the HTML report in the job summary
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: printf '\n📊 [Open the HTML report](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
      # The visible verdict on the pull request (tests/lib/a11y-check-run.mjs), by the severity rule;
      # GITHUB_EVENT_NAME says what counts and GITHUB_RUN_ID is stamped on it for the nightly's run
      # verdict. A fork's or Dependabot's token cannot write checks, so the canonical guard skips it
      # there; the job summary and the report still carry everything. It reports and never decides the job.
      - name: Post the report check run
        id: check
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11Y_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: node tests/scripts/a11y-check-run.mjs
      # The sticky comment (tests/lib/a11y-pr-comment.mjs): posted on the first run, clean or not,
      # and edited in place by every later one; never a screenshot, it links the HTML report. It
      # reads the baseline at the first parent of the checked-out merge commit (A11Y_CHECKOUT_SHA,
      # through the REST API) to list what the pull request adds to it: the payload's base.sha can
      # be older than the tip the merge ref was built on (a re-run, a base merged in), so it is
      # only the fallback. Pull requests only, behind the same guard (a fork's token cannot
      # comment).
      - name: Post the report comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11Y_PR_NUMBER: ${{ github.event.pull_request.number }}
          A11Y_CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
          A11Y_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          A11Y_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          A11Y_CHECK_URL: ${{ steps.check.outputs.check-url }}
        run: node tests/scripts/a11y-pr-comment.mjs

  checks:
    name: checks
    # Only when the caller asks (the A11y nightly does, test.yml does not). A skipped job runs no step,
    # so a pull request gets no `A11y / <check> report` check run, stale or otherwise.
    if: ${{ inputs.checks }}
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Report-only: a red check is a tooling failure (a fixture that did not load, a state the keyboard
    # did not reach), recorded in the evidence document as a target that was not measured, and it
    # never turns the Tests pipeline red.
    continue-on-error: true
    timeout-minutes: 30
    # Job-level, like the axe job's: `checks: write` posts the evidence check runs. No comment here.
    permissions:
      contents: read
      checks: write
    env:
      A11Y_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HOT_A11Y_CHECKS_SUITE: ${{ inputs.nightly && 'nightly' || 'pull-request' }}
      # A subset run (`check-ids`): the config runs the named checks instead of the suite, and the report
      # script expects their documents and names them in the summary. Empty on every other run.
      A11Y_CHECKS: ${{ inputs.check-ids }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
      - run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm
      - name: Install the Playwright test package
        run: pnpm install --filter handsontable-tests
      # The reporter (tests/reporters/a11y-checks.ts) writes one evidence document per check. A red
      # step is a tooling failure the document already records: it turns the job red, the steps below
      # still run (`!cancelled()`), and the job's `continue-on-error` keeps the Tests pipeline green.
      # The step times out before the job (a step timeout is a step failure, so the evidence, the summary
      # and the check runs below still come), sized per suite: the short suite runs only the checks that
      # finish in under two minutes, every check gets twenty.
      - name: Run the checks beyond axe
        id: run
        timeout-minutes: ${{ inputs.nightly && 20 || 10 }}
        run: cd tests && npx playwright test --config playwright.a11y-checks.config.ts
      # The evidence: the documents, every target's detail and the Playwright traces of a red test. A
      # nightly's run of every check is what the conformance report cites, so it is kept for 30 days; the
      # short suite's and a subset's (`check-ids`, a proof run on a branch) cite nothing and keep 7.
      - name: Upload the evidence
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: a11y-checks-evidence
          path: tests/test-results/a11y-checks
          if-no-files-found: warn
          retention-days: ${{ inputs.nightly && inputs.check-ids == '' && 30 || 7 }}
          overwrite: true
      - name: Write the job summary
        if: ${{ !cancelled() }}
        env:
          A11Y_EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node tests/scripts/a11y-evidence-report.mjs
      # One `A11y / <check> report` check run per check (tests/lib/a11y-evidence.mjs), on the pull
      # request's head commit, by the severity rule; a check that left nothing readable is a red tooling
      # check run. A fork's or Dependabot's token cannot write checks, so the canonical guard skips it
      # there; the job summary and the evidence still carry everything.
      - name: Post the evidence check runs
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11Y_EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node tests/scripts/a11y-evidence-report.mjs --check-run
