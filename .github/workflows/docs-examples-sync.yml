name: Docs Examples Sync

on:
  push:
    branches:
      # "develop" is the next-version docs bucket (published as "latest"), and
      # "prod-docs/<major>.<minor>" holds a released version. No other docs
      # branch feeds the examples runner - the stale "prod-docs/latest" branch
      # included.
      - develop
      - 'prod-docs/[0-9]+.[0-9]+'
    paths:
      - 'docs/content/guides/**'
      - 'docs/content/recipes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Trigger examples snapshot import
    runs-on: ubuntu-latest
    steps:
      # Push events are already filtered by the branch patterns above, but
      # workflow_dispatch bypasses that filter, so validate the ref here
      # instead of dispatching a branch the importer in handsontable/examples
      # cannot resolve. Runs before the checkout below so an invalid manual
      # dispatch ref fails fast without paying for a fetch first.
      - name: Validate docs branch
        env:
          DOCS_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$DOCS_BRANCH" != 'develop' && ! "$DOCS_BRANCH" =~ ^prod-docs/[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$DOCS_BRANCH\" is not a docs branch the examples importer accepts (expected \"develop\" or \"prod-docs/<major>.<minor>\")."
            exit 1
          fi

      # Only a push carries BEFORE_SHA/AFTER_SHA for the gate step below to
      # diff; workflow_dispatch has neither, and decide() (docs-examples-gate.mjs)
      # short-circuits to "always dispatch" before touching git in that case,
      # so there is nothing for this checkout to provide on that trigger.
      #
      # Full history (not a shallow clone) so those SHAs are reachable, and
      # sparse/blobless so this stays a cheap partial checkout, not a full
      # monorepo clone, for a job that previously checked out nothing at all.
      # `.github` must be listed too (cone-mode sparse-checkout only
      # materializes the directories named here, plus top-level files) --
      # without it the gate step has no `.github/scripts/*.mjs` to run.
      #
      # continue-on-error: true is load-bearing, not a convenience. A custom
      # `if:` (on Mint/Dispatch below) is implicitly ANDed with success() by
      # GitHub Actions, so a genuine failure HERE (network error, bad ref)
      # would otherwise skip Mint/Dispatch regardless of `needs_sync` --
      # exactly the silent-drop failure mode this gate exists to prevent, and
      # exactly what shipped in this PR's first two commits until review
      # caught it. This step failing outright now degrades to "no checkout,"
      # which is also what the gate step below fails open into.
      - name: Checkout docs content
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            docs/content/guides
            docs/content/recipes
            .github
          persist-credentials: false

      # Deterministic (DEV-3029): example content is never inline in a guide's
      # .md -- it's referenced from sibling files beside it -- so whether a
      # push touches example content is a diff-matching problem, not a
      # judgment call. Skips the mint + dispatch below when nothing under the
      # matched paths is example-relevant, saving the cross-repo call for a
      # prose-only doc commit (a typo fix, a wording tweak, a link repair).
      #
      # continue-on-error: true for the same reason as the checkout above: if
      # this step crashes outright (e.g. the checkout above was skipped for
      # workflow_dispatch, so `.github/scripts/docs-examples-gate.mjs` isn't
      # on disk to run, or a bug in the script itself throws before its own
      # try/catch), `needs_sync` is simply never written -- still `!= 'false'`
      # below, so Mint/Dispatch still run. A crash here does lose the
      # human-readable reason in the step summary, but never loses the sync.
      - name: Determine whether the change touches example content
        id: gate
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: node .github/scripts/docs-examples-gate.mjs

      # Mint a short-lived, repository-scoped token from the GitHub App.
      # The built-in GITHUB_TOKEN cannot reach another repository, so a
      # cross-repo dispatch requires an App installation token (or a PAT).
      #
      # `!= 'false'` (not `== 'true'`): an unset output (the gate step never
      # ran to completion) is not the string "false", so this -- and the
      # dispatch step below -- still proceed. This is only structural BECAUSE
      # of `continue-on-error: true` on the checkout and gate steps above --
      # without it, GitHub Actions' implicit `success()` on this `if:` would
      # skip this step whenever either of those two failed outright, no
      # matter what `needs_sync` says.
      - name: Mint GitHub App token
        id: app-token
        if: steps.gate.outputs.needs_sync != 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
        with:
          app-id: ${{ secrets.EXAMPLES_SYNC_APP_ID }}
          private-key: ${{ secrets.EXAMPLES_SYNC_APP_KEY }}
          owner: handsontable
          repositories: examples

      - name: Send repository_dispatch to handsontable/examples
        if: steps.gate.outputs.needs_sync != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_BRANCH: ${{ github.ref_name }}
        run: |
          gh api repos/handsontable/examples/dispatches \
            -f event_type=docs-examples-sync \
            -f "client_payload[docs_branch]=$DOCS_BRANCH"
