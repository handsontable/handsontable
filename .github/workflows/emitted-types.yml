name: Emitted types

# Verifies the emitted .d.ts against the oldest supported consumer TS (5.1) +
# publint + attw, on the composed publishable package (tmp/ + dist/ + styles/).
# Needs the build artifacts, so it is its own build-dependent module.
on:
  workflow_call:
    inputs:
      hot-prebuilt:
        description: 'Both build artifacts (ES+CJS tmp + UMD dist/styles) are available'
        type: boolean
        default: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOT_PREBUILT: ${{ inputs.hot-prebuilt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # Prebuilt path: the ES+CJS artifact carries tmp/ with the downleveled
      # .d.ts; the UMD artifact's dist/ + styles/ are merged into tmp/ — exactly
      # what prepare-package-for-publish does after a full build.
      - name: Download the Handsontable ES + CJS build artifact
        if: env.HOT_PREBUILT == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-es-cjs
      - name: Extract the prebuilt tmp
        if: env.HOT_PREBUILT == 'true'
        run: tar -zxf tmp.tar.gz ./handsontable/tmp && rm tmp.tar.gz
      - name: Download the Handsontable UMD build artifact
        if: env.HOT_PREBUILT == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
      - name: Merge dist and styles into the package under test
        if: env.HOT_PREBUILT == 'true'
        run: |
          tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz
          rm -rf handsontable/tmp/dist handsontable/tmp/styles
          cp -R handsontable/dist handsontable/tmp/dist
          cp -R handsontable/styles handsontable/tmp/styles
      - run: pnpm install --frozen-lockfile
        if: env.HOT_PREBUILT != 'true'
      - name: Build Handsontable (includes downlevel:types)
        if: env.HOT_PREBUILT != 'true'
        run: npm run build --prefix handsontable
      - name: Type-check downleveled .d.ts with pinned TS 5.1.6
        run: |
          cd handsontable
          node -e "
            const fs = require('fs');
            fs.writeFileSync('tsconfig.verify-types.json', JSON.stringify({
              compilerOptions: {
                noEmit: true,
                target: 'es2015',
                lib: ['es2015','es2016','es2017','es2020','esnext','dom','dom.iterable'],
                moduleResolution: 'node',
                strict: true,
                skipLibCheck: false
              },
              include: ['tmp/**/*.d.ts']
            }, null, 2));
          "
          npx -y -p typescript@5.1.6 tsc -p tsconfig.verify-types.json
          rm tsconfig.verify-types.json
      - name: Check package exports and well-formedness (publint)
        run: |
          cd handsontable/tmp
          npx -y publint@0.3.21
      - name: Check type-declaration resolution (attw)
        run: |
          cd handsontable/tmp
          # false-export-default — Babel CJS interop; untyped-resolution — dist/
          # UMD + languages ship no types; no-resolution — CSS/theme assets.
          npx -y @arethetypeswrong/cli@0.18.3 --pack . --format table \
            --ignore-rules false-export-default untyped-resolution no-resolution
