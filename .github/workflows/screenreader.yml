name: Screen reader

# The screen reader lanes: a real screen reader driven through Guidepup over the scenarios of
# tests/screenreader/scenarios/ (the policy is tests/AGENTS.md, "Screen readers: the NVDA and VoiceOver lanes"). The
# transcripts are the evidence a future report version can cite for what a cell, a header, a state and
# a status message announce (WCAG 1.3.1, 4.1.2, 4.1.3): what a screen reader makes of the accessibility
# tree, which the axe scan (a11y.yml) reads on its own. No verdict of the current Accessibility
# Conformance Report comes from here.
#
# Report-only, by design, and nothing here gates a pull request: the job has `continue-on-error`, the
# test never fails on a token group in report mode, and the verdict is the `Screen reader / <project>
# report` check run (neutral when a token group is missing or a golden differs) plus the job summary.
# The only reds inside the job are tooling: a fixture that does not load, a screen reader that does
# not start, a scenario that never reached its `after` state.
#
# One job per screen reader and browser (a job per screen reader, a matrix per browser), because
# Guidepup runs one screen reader per machine and the browsers are headed: NVDA on `windows-2025`, the
# runner Guidepup's own suite is green on (2 to 2.5 minutes per job there), and VoiceOver on `macos-26`.
# The mitigations that suite uses are here too: Playwright `retries: 2` and a five-minute test timeout
# (the config), a fresh screen reader per test with a stop in a `finally` (Guidepup's fixture), and
# Guidepup 0.36.1+ for the NVDA quit fix. The run step's `timeout-minutes: 25` bounds a hung screen
# reader, and every step that downloads (the setup CLI, the browser, the screen reader) carries its own
# timeout too: a step timeout is a step failure, so the `!cancelled()` summary, uploads and check run
# still come, where a job timeout cancels them. Each job's timeout is a backstop above the sum of its
# steps' timeouts, for a runner that hangs outside them.
#
# Build-dependent like a11y.yml: it downloads the UMD build artifact the caller's Build module uploads.
# The caller is screenreader-nightly.yml (a cron, and a dispatch from any ref); the pull-request Tests
# pipeline does not call it. With `update-goldens` the run records the goldens on the runner and
# uploads them as an artifact, which is the only way to record an NVDA golden without a Windows
# machine or a VoiceOver golden without a prepared Mac (`npm run test:screenreader:update-goldens`
# records them on one): download, commit under tests/screenreader/goldens/<project>/, done.
on:
  workflow_call:
    inputs:
      update-goldens:
        description: Record the goldens from this run and upload them as an artifact instead of comparing.
        type: boolean
        default: false

jobs:
  nvda:
    name: NVDA (${{ matrix.browser }})
    runs-on: windows-2025
    # The backstop above the step timeouts below (5 + 5 + 5 + 25 minutes).
    timeout-minutes: 45
    # Report-only: a red job here would show as a failure on the run, and the run is a report.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox ]
    # Job-level, like a11y.yml: `checks: write` posts the report check run. Kept off the workflow level
    # so nothing else in the run inherits it.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: bash
    env:
      # The commit the check run goes on. On a pull request it is the head, not the merge commit
      # `github.sha` names, or the check never shows on the pull request.
      SCREENREADER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SCREENREADER_PROJECT: nvda-${{ matrix.browser }}
    steps:
      # Nothing in this job pushes, so the token stays out of .git/config: the `npx -y` steps below
      # resolve the setup CLI's dependencies fresh on every run, and the token carries `checks: write`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
      - run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        name: Use Node.js
        with:
          node-version-file: '.nvmrc'
      - name: Install the Playwright test package
        run: pnpm install --filter handsontable-tests
      # Guidepup's own recipe, in its order: the environment first (`setup --ci` is a no-op on Windows
      # today and stays for the day it is not), the browser, then the screen reader assets. `install
      # nvda` resolves the NVDA build from the installed @guidepup/guidepup's manifest (portable NVDA
      # 2026.2 with the Guidepup add-on), so it runs inside tests/, where that package is installed.
      # The setup CLI runs through `npx -y` at a pinned version, the way Guidepup's own CI runs it, and
      # is never installed: its optional recording helper depends on a GPL-licensed ffmpeg build, which
      # the dependency rule (root AGENTS.md) keeps out of the lockfile. The version is pinned here and in
      # tests/AGENTS.md ("Screen readers: the NVDA and VoiceOver lanes").
      - name: Prepare the environment for screen reader automation
        timeout-minutes: 5
        run: cd tests && npx -y @guidepup/setup@0.29.3 setup --ci
      - name: Install the browser
        timeout-minutes: 5
        run: cd tests && npx playwright install ${{ matrix.browser }}
      - name: Install NVDA
        timeout-minutes: 5
        run: cd tests && npx -y @guidepup/setup@0.29.3 install nvda
      # 25 minutes: a step timeout is a step failure, so the summary, the uploads and the check run
      # below still run, where a job timeout cancels them and leaves no evidence. The worst case is 2
      # scenarios x 3 attempts x the config's 300 s test timeout, 30 minutes.
      - name: Run the scenarios
        id: scenarios
        timeout-minutes: 25
        env:
          HOT_SR_UPDATE_GOLDENS: ${{ inputs.update-goldens && '1' || '' }}
        run: cd tests && npx playwright test --config playwright.screenreader.config.ts --project=nvda-${{ matrix.browser }}
      # Every run, red or green: the transcripts (one JSON and one log per scenario), the summary the
      # report step writes below, and the Playwright report with the traces of a red scenario.
      - name: Write the job summary
        if: ${{ !cancelled() }}
        run: node tests/scripts/screenreader-report.mjs
      - name: Upload the transcripts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-transcripts-nvda-${{ matrix.browser }}
          path: tests/test-results/screenreader
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Upload the Playwright report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-playwright-report-nvda-${{ matrix.browser }}
          path: tests/playwright-report/screenreader
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Upload the recorded goldens
        if: ${{ !cancelled() && inputs.update-goldens }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-goldens-nvda-${{ matrix.browser }}
          path: tests/screenreader/goldens
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      # The visible verdict (tests/lib/screenreader-report.mjs), on the commit the run tested. A
      # fork's or Dependabot's token cannot write checks, so the canonical guard skips it there; the
      # summary and the transcripts still carry everything. It reports and never decides the job.
      - name: Post the report check run
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENREADER_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: node tests/scripts/screenreader-report.mjs --check-run

  voiceover:
    name: VoiceOver (${{ matrix.browser }})
    runs-on: macos-26
    # The backstop above the step timeouts below (10 + 5 + 5 + 25 minutes). A hung step fails on its own
    # timeout first, so the evidence still uploads; this only stops a runner that hangs outside them.
    timeout-minutes: 55
    # Report-only: a red job here would show as a failure on the run, and the run is a report.
    continue-on-error: true
    strategy:
      fail-fast: false
      # The organization runs at most five macOS jobs at once: this lane takes two of them.
      max-parallel: 2
      matrix:
        browser: [ webkit, chromium ]
    # Job-level, like the NVDA job: `checks: write` posts the report check run.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: bash
    env:
      SCREENREADER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SCREENREADER_PROJECT: vo-${{ matrix.browser }}
    steps:
      # Nothing in this job pushes, so the token stays out of .git/config: the `npx -y` steps below
      # resolve the setup CLI's dependencies fresh on every run, and the token carries `checks: write`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
      - run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        name: Use Node.js
        with:
          node-version-file: '.nvmrc'
      - name: Install the Playwright test package
        run: pnpm install --filter handsontable-tests
      # Guidepup's own recipe, in its order: the environment first, the browser, then the screen reader
      # assets. On macOS `setup --ci` is the real work: it writes the automation permissions into the
      # TCC database, enables VoiceOver's AppleScript control, turns off its splash screen and
      # dictation, and turns on Do Not Disturb. `--macos-record` screen-records that setup into
      # tests/recordings/, uploaded below: a setup that fails (about one job in a hundred on
      # Guidepup's own CI, and a whole-job re-run passes) shows what the runner's screen did. The
      # recorder is the CLI's optional dependency, resolved by npx and never installed (the GPL-licensed
      # ffmpeg build, root AGENTS.md). `install voiceover` fetches Guidepup's VoiceOver preferences
      # bundle for this macOS from the installed @guidepup/guidepup's manifest, so it runs inside
      # tests/. The CLI version is pinned here, in the NVDA job and in tests/AGENTS.md together.
      - name: Prepare the environment for screen reader automation
        timeout-minutes: 10
        run: cd tests && npx -y @guidepup/setup@0.29.3 setup --ci --macos-record
      # Playwright's own browser builds: `webkit` is Playwright's WebKit (Playwright.app), not
      # Safari.app, and `chromium` is Chrome for Testing; Guidepup activates each by its bundle id.
      - name: Install the browser
        timeout-minutes: 5
        run: cd tests && npx playwright install ${{ matrix.browser }}
      - name: Install VoiceOver
        timeout-minutes: 5
        run: cd tests && npx -y @guidepup/setup@0.29.3 install voiceover
      # 25 minutes, like the NVDA job's: a step timeout is a step failure, so the summary, the uploads
      # and the check run below still run, where a job timeout cancels them and leaves no evidence.
      - name: Run the scenarios
        id: scenarios
        timeout-minutes: 25
        env:
          HOT_SR_UPDATE_GOLDENS: ${{ inputs.update-goldens && '1' || '' }}
        run: cd tests && npx playwright test --config playwright.screenreader.config.ts --project=vo-${{ matrix.browser }}
      - name: Write the job summary
        if: ${{ !cancelled() }}
        run: node tests/scripts/screenreader-report.mjs
      - name: Upload the transcripts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-transcripts-vo-${{ matrix.browser }}
          path: tests/test-results/screenreader
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Upload the Playwright report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-playwright-report-vo-${{ matrix.browser }}
          path: tests/playwright-report/screenreader
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      # The screen recording of the setup step, red or green.
      - name: Upload the setup recording
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-recordings-vo-${{ matrix.browser }}
          path: tests/recordings
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Upload the recorded goldens
        if: ${{ !cancelled() && inputs.update-goldens }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: screenreader-goldens-vo-${{ matrix.browser }}
          path: tests/screenreader/goldens
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      # The same check-run write as the NVDA job's, behind the same canonical guard.
      - name: Post the report check run
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENREADER_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: node tests/scripts/screenreader-report.mjs --check-run
