name: Docs

# Everything docs — lint, plugin tests, Angular-example type-check, the
# Cloudflare preview deploy, the functional Playwright specs against that
# preview (report-only for one sprint), and the label-gated visual suite. The
# visual suite probes R2 for `docs/base/<base branch>/out.json`, compares the
# preview against those golden records, turns the result into a verdict and a
# sticky comment, and holds a `changed` verdict on the `docs-visual-approval`
# environment — visual.yml's contract, implemented once in the docs-visual-run
# action (DEV-2860; the action's probe step has the history of the cache it
# replaced). Internal ordering: lint/plugins/angular in parallel → preview
# (needs lint+plugins) → functional, and visual (needs preview + the live label
# gate) → approve. The orchestrator gates the whole module on docs scope.
on:
  workflow_call:
    inputs:
      run-all: { type: boolean, default: false }
      run-angular: { type: boolean, default: false }
      is-pr: { type: boolean, default: false }

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Lint
        run: npm run docs:lint --prefix docs

  plugins:
    name: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Test plugins
        run: npm run docs:test:plugins --prefix docs
      # Report-only: always exits 0, writes its findings to the step summary.
      - name: Check changelog API reference links
        run: npm run docs:validate-changelog-links --prefix docs

  angular-types:
    name: Angular types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR-only, and only when the Angular-relevant scope changed.
    if: inputs.is-pr && (inputs.run-all || inputs.run-angular)
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/docs-angular-typecheck
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Cheap, early label read (independent of the preview build) — the PR's CURRENT
  # labels, so adding `run-docs-visual` + "Re-run all jobs" activates the visual
  # suite mid-review.
  visual-label:
    name: visual label
    runs-on: ubuntu-latest
    if: inputs.is-pr
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Evaluate the gate
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) { core.setOutput('run', 'false'); return; }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const run = pr.labels.some(l => l.name === 'run-docs-visual');
            core.setOutput('run', String(run));
            if (!run) {
              core.notice('docs-visual skipped — add the "run-docs-visual" label to the PR and press "Re-run all jobs" to run it inside this pipeline.');
            }

  # Deploys the PR's Cloudflare preview (the standalone docs-staging.yml keeps
  # the trunk develop/release push deploys). PR-only. Depends on all the docs
  # gates so it lands at the BUILD stage (alongside the core build jobs); skipped
  # gates (angular-types/visual-label off-scope) don't block it.
  preview:
    name: preview
    # Depends on the docs QUALITY gates only — NOT visual-label, which is a live
    # API label read for the optional visual suite (a routing flag, not a gate);
    # coupling the preview to it would skip the deploy if that API call flaked.
    needs: [ lint, plugins, angular-types ]
    # Fork-hostile twice over. `docs-staging.yml`'s FIRST step posts a sticky
    # comment, so on a fork PR the job dies there in ~14s and every build and
    # deploy step after it is already skipped (verified: fork PR #13207, run
    # 32481421878); the Cloudflare deploy would then fail for want of
    # CLOUDFLARE_API_TOKEN. Skipping the call is therefore behavior-neutral
    # versus today, not a loss of the docs build. Restoring build verification
    # for fork PRs needs per-step guards inside `docs-staging.yml` (it has two
    # sticky comments and three `github-script` steps) and is a separate task.
    # The dependent `visual` job requires this one to succeed, so it skips on
    # its own. .ai/CI.md, "fork pull requests".
    if: ${{ !failure() && !cancelled() && inputs.is-pr
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]')) }}
    uses: ./.github/workflows/docs-staging.yml
    secrets: inherit

  # The 11 functional docs specs (docs/tests/*.spec.ts other than visualDocs)
  # share the visual suite's testDir, so until DEV-2860 they ran only under the
  # `run-docs-visual` label — on one pull request in three weeks. Now their own
  # Playwright project, on every docs pull request with a preview. Report-only
  # for one sprint (the DEV-2860 report's decision): their pass rate against a
  # live preview has never been measured, so `continue-on-error` keeps them
  # from blocking merges while it is. Flip it off after a sprint of green runs;
  # the outcome line in the job summary is what to read until then.
  functional:
    name: functional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ preview ]
    if: ${{ !failure() && !cancelled() && inputs.is-pr && needs.preview.result == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Install the Playwright browser
        working-directory: ./docs
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the functional docs specs against the preview
        id: functional
        # Report-only for one sprint — see the job comment above.
        continue-on-error: true
        working-directory: ./docs
        env:
          BASE_URL: ${{ needs.preview.outputs.preview-url }}
          PASS_COOKIE: ${{ secrets.PASS_COOKIE }}
        run: npx playwright test --project=functional
      - name: Report the outcome to the job summary
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.functional.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then result=passed; else result=failed; fi
          echo "Docs functional specs: $result — report-only for one sprint; see docs/AGENTS.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the functional report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: docs-functional-report
          path: ./docs/tests/test-artifacts/results
          retention-days: 7
          overwrite: true

  # Opt-in through the `run-docs-visual` label in this PR: 441 full-page
  # captures per run. Drop the label gate once the R2 baseline has proven
  # stable over a few weeks of seeds — the action, the gate and the approval
  # need no change for that, only this job's `needs`/`if`.
  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [ visual-label, preview ]
    if: |
      !failure() && !cancelled() &&
      needs.visual-label.outputs.run == 'true' &&
      needs.preview.result == 'success'
    # What the gate found, for the `approve` job below: `changed` holds the run
    # on the docs-visual-approval environment; anything else lets it skip.
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
      report-url: ${{ steps.run.outputs.report-url }}
    # Job-level, like visual.yml's compare job: the sticky-comment step below
    # needs it to post the verdict. Fine inside a called module (angular-types
    # already does this); never on the caller's job in test.yml.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      # A composite action cannot read `secrets`, so the R2 credentials travel
      # as inputs. `base-key` is the branch the pull request targets, so a pull
      # request into a release branch picks up that branch's baseline for free.
      - id: run
        uses: ./.github/actions/docs-visual-run
        with:
          test-url: ${{ needs.preview.outputs.preview-url }}
          mode: compare
          base-key: docs/base/${{ github.base_ref }}
          actual-key: docs/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          pass-cookie: ${{ secrets.PASS_COOKIE }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # One sticky comment, rewritten in place, with the counts, the report link
      # and how to accept the changes (the action writes it; `!cancelled()` so a
      # failed run replaces the previous push's verdict too). `preview` already
      # excludes forks and Dependabot, so this never runs without a write
      # token — the guard is the canonical one all the same, so the set stays
      # greppable and fork-guards.test.mjs can assert it.
      - name: Comment the docs visual verdict on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]') }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
        with:
          header: docs-visual-tests
          path: docs/tests/test-artifacts/comment.md

  # The human decision, the mechanism visual.yml's `approve` and manual-qa.yml
  # use: when the visual job found differences, this job pauses on the
  # `docs-visual-approval` ENVIRONMENT until someone on its reviewer list
  # approves the run ("Review pending deployments" on the run page; the
  # deployment's "View deployment" button opens the Playwright report). While
  # it waits the Docs module never completes, so `CI Gate` -- which needs it --
  # cannot report and the merge stays blocked; a rejection fails this job and
  # turns `CI Gate` red. Approval is PER RUN (a push re-asks) and all-or-nothing
  # for the build, and it needs no re-commit and no re-run.
  #
  # Cutover (repo admin): create the `docs-visual-approval` environment WITH
  # required reviewers before the first labeled pull request with differences
  # runs. A job that references a missing environment silently auto-creates it
  # UNPROTECTED and runs straight through, so the step below asserts the
  # control's OUTCOME -- an approval recorded against this run -- rather than
  # trusting its configuration, and fails closed when none is.
  approve:
    name: visual approve
    runs-on: ubuntu-latest
    needs: [ visual ]
    # `!failure()` as well as `!cancelled()`, matching visual.yml's `approve`. An
    # `if:` that contains a status-check function replaces the implicit `success()`
    # on `needs`, so `!cancelled()` alone still runs this job when `visual` FAILED —
    # and the verdict is exported before two steps that can still fail (the action's
    # `Upload test report`, and this workflow's own sticky-comment step), so
    # `verdict == 'changed'` can survive on a red job. A reviewer would then be asked
    # to approve a build that cannot go green whatever they click, and the comment
    # step below would post "differences approved" over an accurate verdict.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request'
      && needs.visual.outputs.verdict == 'changed' }}
    # `actions: read` for the approvals API below; `pull-requests: write` for the
    # comment the last step rewrites. Requested explicitly, as visual.yml's `approve`
    # does, so a repository default too narrow for either fails at run startup rather
    # than 403ing on the first docs pull request that has differences.
    permissions:
      actions: read
      pull-requests: write
    environment:
      name: docs-visual-approval
      url: ${{ needs.visual.outputs.report-url }}
    steps:
      - name: Assert a human approval is recorded for this run
        id: assert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            let approvals;

            try {
              // Raw request: the reusable workflow shares the parent's run id,
              // and this endpoint lists the environment approvals for it.
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
                { owner, repo, run_id: context.runId },
              );

              approvals = response.data;
            } catch (error) {
              core.setFailed(`Could not read this run's approvals (${error.status} ${error.message}). `
                + 'The docs visual gate cannot confirm a human approved the differences, so it fails closed. '
                + 'If this is a token-permission error, grant `actions: read` to the Tests workflow.');
              return;
            }

            const approval = approvals.find((entry) => entry.state === 'approved'
              && (entry.environments || []).some((environment) => environment.name === 'docs-visual-approval'));

            if (!approval) {
              core.setFailed('This job ran without a recorded docs-visual-approval approval, which means the '
                + '`docs-visual-approval` environment has no required reviewers (a missing environment is '
                + 'auto-created unprotected). Configure it -- required reviewers -- and re-run; the gate '
                + 'is not enforcing anything until then.');
              return;
            }
            core.setOutput('approved-by', approval.user.login);
            core.notice(`Docs visual differences approved by @${approval.user.login}`
              + `${approval.comment ? `: ${approval.comment}` : ''}.`);

      # The `visual` job posted a comment asking for an approval, and nothing else
      # would ever take that request back down: the sticky comment keeps asking
      # through review, merge and afterwards, and the thread carries no record of
      # who approved or when. The core gate solves it the same way (visual.yml's
      # `Record the approval on the pull request`); this is that step, relabeled.
      # Same sticky header as the `visual` job's comment, so it REPLACES the request
      # rather than adding a second comment, and the message is inline because this
      # job has no checkout and the verdict's `comment.md` is on another runner.
      #
      # `success()`, not `!cancelled()`: the step above fails when no approval is
      # recorded, and `!cancelled()` would let this post "differences approved" with
      # an empty login on exactly that run.
      - name: Record the docs approval on the pull request
        if: ${{ success() && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]') }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
        with:
          header: docs-visual-tests
          message: |
            ## Docs visual tests — differences approved

            @${{ steps.assert.outputs.approved-by }} approved this build's docs visual differences on the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}),
            where the report is linked.

            Approval covers this build only: a new push renders again and asks again.
