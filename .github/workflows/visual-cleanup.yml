name: Visual cleanup

# Housekeeping for the visual regression bucket, split from the Visual workflow
# because both jobs react to pull request lifecycle events rather than to a
# test run.
#
#   purge           - a merged or abandoned pull request keeps no screenshots.
#   reset-approval  - `visual-approved` accepts one specific set of screenshots,
#                     so a new push has to be re-reviewed. Without this the
#                     label would stay open over commits nobody looked at.
on:
  pull_request:
    types: [ closed, synchronize ]

permissions:
  contents: read

env:
  R2_BUCKET_NAME: handsontable-visual

jobs:
  purge:
    name: Purge screenshots
    # Same-repo only. A fork or Dependabot run gets no secrets, so `aws s3 rm`
    # would hard-fail on every external contributor's PR close -- and it would
    # be a no-op anyway, because the credentialed publish steps are themselves
    # same-repo-guarded and `compare-fork.mjs` never writes to R2, so no
    # `pr-<n>/` prefix exists for those pull requests.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
      && (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # The AWS CLI ships on the runner image. `wrangler r2 object delete` has
      # no recursive mode, so the S3 API is the practical way to drop a prefix.
      - name: Delete this pull request's screenshots from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm "s3://$R2_BUCKET_NAME/pr-${{ github.event.number }}/" \
            --recursive \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

  reset-approval:
    name: Reset visual approval
    # Same-repo only, for the same reason: a fork or Dependabot pull_request run
    # holds a read-only token, so this write 403s. The visual gate compensates by
    # ignoring `visual-approved` entirely on those runs, so a label that cannot
    # be cleared here can never approve anything either.
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
      && (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Drop the visual-approved label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        # An absent label is the common case and fine. Anything else is not:
        # a silently swallowed failure would leave a stale approval covering
        # screenshots nobody reviewed, which is the one thing this job exists
        # to prevent.
        run: |
          if gh pr edit "$PR_NUMBER" --remove-label visual-approved 2>/tmp/err; then
            echo "Removed the visual-approved label."
          elif grep -qiE "not (found|labeled)|does not have" /tmp/err; then
            echo "No visual-approved label to remove."
          else
            echo "::error::Could not remove the visual-approved label:"
            cat /tmp/err
            exit 1
          fi
