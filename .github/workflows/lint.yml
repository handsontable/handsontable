name: Lint

# Linters — core (JS/TS/CSS/D.TS) always; the visual-tests package lint only
# when its scope changed. Called by test.yml on PRs (a merged PR already proved
# lint, so no trunk runs).
#
# The core job also runs the custom ESLint rules' own RuleTester tests
# (`handsontable/.config/plugin/eslint/__tests__/`). They import `eslint`, so
# they cannot join the root `test:tooling` glob — the `tooling tests` job in
# checks.yml installs no dependencies — and this is the job that already has the
# core package installed and whose scope (`outside-ci`) covers a rule edit.
on:
  workflow_call:
    inputs:
      run-visual:
        description: 'Also lint the visual-tests package (its scope changed)'
        type: boolean
        default: false

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: JavaScript lint
        run: npm run lint
      - name: CSS lint
        run: npm run in handsontable stylelint
      - name: Custom ESLint rule tests (RuleTester)
        run: npm run in handsontable test:eslint-rules

  visual-tests:
    name: visual tests
    runs-on: ubuntu-latest
    if: inputs.run-visual
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Lint
        run: npm run in visual-tests lint
