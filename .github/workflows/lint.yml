name: Lint

# Linters — core (JS/TS/CSS/D.TS) always; the visual-tests package lint only
# when its scope changed; the determinism ratchet (a step of `core`) only when
# a handsontable spec/unit tree changed. Called by test.yml on PRs (a merged PR
# already proved lint, so no trunk runs).
#
# The core job also runs the custom ESLint rules' own RuleTester tests
# (`handsontable/.config/plugin/eslint/__tests__/`). They import `eslint`, so
# they cannot join the root `test:tooling` glob — the `tooling tests` job in
# checks.yml installs no dependencies — and this is the job that already has the
# core package installed and whose scope (`outside-ci`) covers a rule edit.
on:
  workflow_call:
    inputs:
      run-visual:
        description: 'Also lint the visual-tests package (its scope changed)'
        type: boolean
        default: false
      run-ratchet:
        description: 'Also run the determinism ratchet (a handsontable spec/unit tree changed)'
        type: boolean
        default: false
      run-codemod:
        description: 'Also run the codemod suite on Windows and on the other supported Node versions (its scope changed)'
        type: boolean
        default: false

jobs:
  core:
    name: core
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          # Full history only on the runs where the determinism ratchet step
          # below executes: it diffs from the merge-base with the PR base
          # branch, which a one-commit clone cannot reach. Every other lint run
          # keeps the shallow checkout (the pack is close to a gigabyte).
          fetch-depth: ${{ (inputs.run-ratchet && github.event_name == 'pull_request') && '0' || '1' }}
      - uses: ./.github/actions/setup-workspace
      - name: JavaScript lint
        run: npm run lint
      - name: CSS lint
        run: npm run in handsontable stylelint
      - name: Custom ESLint rule tests (RuleTester)
        run: npm run in handsontable test:eslint-rules
      # The codemod's own suite (`node --test`, literal file list). It imports jscodeshift and postcss, so it
      # cannot join the root `test:tooling` glob, whose job installs nothing; this job has the workspace
      # installed. The package's `lint` already ran in `npm run lint` above. It runs only when the codemod
      # scope changed or on a run-all (`run-codemod`, set by `test.yml`), because the suite takes about a
      # minute and every pull request reaches this job, on the critical path of `build`. When it does run,
      # this step is the Linux leg on the Node version of `.nvmrc`, and the `codemod` job below adds Node 20
      # and 24 on Linux and Node 22 on Windows, so the supported versions are all covered whenever the
      # scope changes.
      - name: Codemod tests
        if: inputs.run-codemod
        run: npm run test --prefix codemod

      # The frozen Jasmine suite's determinism rules (no-fixed-sleep-in-spec,
      # no-new-it-flaky, no-skipped-test) are `warn`, and `npm run lint` above
      # exits 0 with warnings. This step is the ratchet: the same rules on a line
      # the PR ADDED fail; pre-existing debt stays a warning. The same script
      # blocks in the pre-push hook, so local scope == CI scope. A step here
      # rather than its own job: the install is already warm, and `build` needs
      # this job, so a second runner would sit on the critical path. PR-only,
      # scope-gated by `run-ratchet`. No token, no secret: safe on fork and
      # Dependabot PRs without a guard.
      #
      # The base is the PR base branch's LIVE tip, fetched right here — never
      # the event payload's frozen `base.sha`. The checkout is `refs/pull/N/merge`,
      # whose first parent is the base as it was when GitHub last rebuilt the
      # merge ref; a "Re-run all jobs" replays an old payload against a newer
      # merge ref, so `base.sha` is already an ancestor of HEAD, the merge-base
      # is `base.sha` itself, and every base commit after it would read as a
      # line this PR added. A branch that merged the base after it forked has
      # the same shape. Against the live tip the merge-base is the merge ref's
      # base parent (or the last base commit the branch merged in), and the
      # diff is the PR's own changes in both cases. The fetch only refreshes
      # the copy the full-history checkout already holds; should it fail, the
      # ratchet reads that copy, and with no copy at all it skips (exit 0) —
      # the gate never blocks on its own tooling.
      - name: Fail on new sleep() / it.flaky() / skip in the changed specs
        if: inputs.run-ratchet && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            || echo "::warning::could not refresh origin/${BASE_REF}; diffing from the checkout's copy"
          GATE_BASE="origin/${BASE_REF}" node .github/scripts/lint-ratchet.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  visual-tests:
    name: visual tests
    runs-on: ubuntu-26.04
    if: inputs.run-visual
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Lint
        run: npm run in visual-tests lint
      # The lint config's own self-test: the capture-adjacency and spec docblock
      # rules run through ESLint on fixtures, because a selector esquery cannot
      # use matches nothing and lints green. It imports `eslint`, so it cannot join
      # the root `test:tooling` glob (that job installs nothing); this job has the
      # workspace installed and runs whenever the visual-tests scope changed.
      - name: Lint config self-test
        run: npm run in visual-tests test:lint-config

  # The codemod is a CLI customers run on their own machines, so its suite also
  # runs where they do: Windows (path separators, CRLF, git) and the Node versions
  # its `engines` field allows. The `Codemod tests` step of the `core` job above
  # covers Linux on the Node version of `.nvmrc`, on the same `run-codemod` gate.
  # Only the codemod's own dependencies are installed.
  codemod:
    name: codemod (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    if: inputs.run-codemod
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            node: 20
          - os: ubuntu-26.04
            node: 24
          - os: windows-2025-vs2026
            node: 22
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      # No `version:` here: the action reads `packageManager` from the root `package.json`, and naming a
      # second version makes it refuse to install.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the codemod's dependencies
        run: pnpm install --filter @handsontable/codemod --ignore-scripts --frozen-lockfile
      - name: Codemod tests
        run: npm run test --prefix codemod
