name: Visual seed

# Writes the golden records for `develop` — `base/develop/` in R2, the baseline
# every pull request into develop is compared against — from the render of the
# commit that was just pushed.
#
# Why this is its own workflow and not a job of develop.yml. develop.yml runs
# under `cancel-in-progress: true`, deliberately: a follow-up merge cancels the
# in-flight run so the newest sha starts testing at once. For the golden seed
# that policy is the defect. The seed sits at the END of that run (after E2E
# and Integration), so a burst of merges cancels it again and again: on
# 2026-09-08, 23 of 30 develop runs never reached it, and the baseline lagged
# develop by 3.7 hours during the day and by 16 to 70 hours over nights and
# weekends. A pull request renders `refs/pull/N/merge`, which already contains
# develop's tip, so every pull request opened in such a gap was compared
# against a baseline older than its own render — and reported the base branch's
# own changes as its differences. Roughly three quarters of the red visual gates
# in the four weeks before DEV-2797 had one or two changed items, and the stale
# baseline was the largest single cause.
#
# Here the group never cancels. GitHub keeps one running and one pending run per
# group and drops the older pending ones, so the LAST push of any burst is
# always seeded, and a seed lands about 12 to 15 minutes after its push instead
# of 25 (or never). Intermediate pushes in a burst are skipped; their pull
# requests compare against the next seed, which contains them. The baseline is
# therefore behind for the middle of a burst and for that quarter of an hour —
# shorter and bounded, not zero.
#
# Four consequences worth stating, because none of them is visible from the diff.
#
# 1. EVERY develop push seeds, including docs-only, changelog-only and CI-only
#    merges that the old `visual:` job skipped through its scope gate. That is
#    deliberate: the gate cannot be recreated safely here. A pull request renders
#    `refs/pull/N/merge`, so the baseline has to describe develop's tip whatever
#    moved it, and a `paths:` filter would put back exactly the stale-baseline
#    bug this file exists to remove — with the extra failure mode that the list
#    would have to name every input the render depends on (core, wrappers, the
#    demos, the lockfile, the build config) and would go stale silently the day
#    one is added. The price is a render on a merge that could not have changed a
#    pixel; `visual-seed.test.mjs` pins that no path filter appears.
# 2. A failed seed no longer reds the Develop run, so it no longer blocks the
#    experimental publish that `publish.yml` chains on that run's conclusion.
#    That direction of the decoupling is intended too: a visual-infrastructure
#    failure is not a reason to withhold a package.
# 3. Which means nothing else notices a broken seed. `Visual seed` is not a
#    required check and is not in test-health.yml's list. How a person finds out:
#    GitHub notifies the pusher on a failed run, and the diagnostic in
#    visual-tests/AGENTS.md starts by checking this workflow's last successful
#    run whenever a baseline looks stale. A stale baseline shows up downstream as
#    the same one-or-two-item diffs on unrelated pull requests that DEV-2797
#    measured, so the symptom is known even when the cause is quiet.
# 4. A hand dispatch shares this concurrency key with the pushes, so a merge
#    landing while a re-seed is pending drops the pending dispatch. That is
#    usually the right outcome — the push seeds a NEWER commit over the same
#    prefix, which fixes a poisoned record just as well — but if pushes stop
#    before it runs, the dispatch has to be re-issued. visual-tests/AGENTS.md
#    says so where it tells people to dispatch this workflow.
#
# The trade the header states so nobody rediscovers it: this seed does not wait
# for the functional suite to be green. A golden record describes what the
# commit renders, not whether its tests passed, and the alternative — chaining
# on the Develop run's conclusion — inherits exactly the cancellations above.
# Pull requests still render Visual only after E2E and Integration (test.yml);
# that ordering is unchanged.
#
# visual.yml needs nothing new: on a `push` event it already resolves
# `REG_EXPECTED_KEY=REG_ACTUAL_KEY=base/<branch>`, compares the fresh render
# against the previous baseline and reconciles the prefix. That comparison is
# NOT in the job summary — `visual-gate.mjs` and the summary step it writes for
# are both pull-request-only — so a seed's own diff lives in `.reg/out.json` on
# the runner and, after the reconcile, in `base/develop/out.json` in R2. Read
# those, not a blank summary. With no Build artifacts to download the render
# takes visual.yml's own build fallback for the core and the wrappers, which is
# where the extra minutes go; that fallback's task list is pinned against
# build.yml's by `visual-seed.test.mjs`, because the seed is the one caller that
# ALWAYS takes it and a task that only build.yml runs would make the baseline
# differ from every pull request's render for a reason nobody caused.
on:
  push:
    branches: [ develop ]
  # A re-seed by hand, for a baseline someone has confirmed is poisoned (the
  # byte-equality diagnostic in visual-tests/AGENTS.md) or after a failed seed.
  workflow_dispatch:
  # Self-validation, as develop.yml does it: this file never runs on an ordinary
  # pull request, so a broken workflow_call graph would first execute AFTER
  # merging, on the next develop push. With this trigger a pull request that
  # touches the file gets a startup-validated run whose only job skips itself.
  pull_request:
    paths: [ '.github/workflows/visual-seed.yml' ]

# NO permissions block — same parity rule as develop.yml: the called visual.yml
# validates its nested job-level grant (the Compare job's `pull-requests: write`)
# against the default token this caller hands down, the same token the pull
# request path is proven against.

concurrency:
  # Static prefix (never the workflow-name expression, which a called workflow
  # resolves to the caller's name). `cancel-in-progress: false` is the whole
  # point of this file — see the header. One key for pushes and dispatches alike,
  # so two runs can never write `base/develop` at once; the cost is consequence 4
  # in the header (a pending dispatch yields to a newer push).
  group: visual-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual:
    name: Visual
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/visual.yml
    secrets: inherit
