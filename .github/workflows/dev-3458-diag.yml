name: DEV-3458 diagnostic (temporary)

on:
  push:
    branches:
      - 'feature/DEV-3458_**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.os }} ${{ matrix.mix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        mix: ['0', '1']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: .github/dev-3458-diag
        run: |
          npm init -y >/dev/null
          npm install playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Load the export-to-csv page like the visual suite does
        working-directory: .github/dev-3458-diag
        env:
          LOADS: '40'
          WORKERS: '4'
          MIX: ${{ matrix.mix }}
        run: node diag.mjs 2>&1 | tee diag-output.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: diag-${{ matrix.os }}-mix${{ matrix.mix }}
          path: .github/dev-3458-diag/diag-output.txt
