name: Visual

# Visual regression. What renders is the `tier` input, one
# row of `VISUAL_TIERS` in visual-tests/src/config.mjs:
#   pr    js × {main, main-dark} on chromium, plus a wrapper only when the
#         `wrappers` input names it (the Checks scope router's `visual-wrappers`
#         list: the wrappers whose own wrappers/<pkg>/** tree changed — never
#         the Integration matrix, which lights all three on any core change).
#         Every pull request (test.yml). No bare "classic" render and no
#         cross-browser leg.
#   seed  everything the golden records hold: js bare + the four themes, the
#         cross-browser leg, and the three wrappers COPIED from the js render.
#         The develop push (visual-seed.yml); the master push and the RC path
#         (test.yml). The only tier whose Reconcile step rewrites
#         `base/<branch>`; a branch with no goldens yet is still bootstrapped
#         by whichever tier its first pull request renders (the Seed step).
#   full  everything, with the wrappers rendered for real from their own demos.
#         The weekday nightly (visual-nightly.yml), which compares against
#         `base/develop` and never writes it; and a pull request that touches
#         the visual tier itself (test.yml, the router's `visual-full`:
#         visual-tests/** and its demos), so a spec or demo change is proven
#         on every variant.
# Why (DEV-2797, measured on 82 pull requests): the full render added a mean
# 15.1 minutes per run, and no real regression in that window was confined to
# one theme, browser or wrapper — every one hit all of them. Each render job
# downloads the core + wrapper build artifacts, falling back to a local build
# if an artifact is missing. The renders are two configs — multi-framework
# chromium, and cross-browser chromium+firefox+webkit — run as a matrix; the
# compare job then consumes both screenshot sets.
#
# Two callers, two shapes. On a pull request this is the post-test budgeting gate:
# test.yml runs it only after the functional tests pass, and its verdict decides
# whether the pull request can merge. On a develop push it is the golden seed, and
# `visual-seed.yml` calls it FIRST — no functional gate, by design, because a
# baseline describes what a commit renders rather than whether its tests passed
# (that file's header has the reasoning). The seed also never downloads a Build
# artifact, so it always takes the local-build fallback below.
on:
  workflow_call:
    inputs:
      tier:
        description: 'Which variants to render and compare: pr | seed | full (visual-tests/src/config.mjs VISUAL_TIERS)'
        type: string
        required: true
      wrappers:
        description: 'pr tier only: the wrappers to render for real, a JSON array of wrapper directory names (the Checks scope router''s visual-wrappers output) — empty renders none'
        type: string
        default: ''

# Not secrets, so these stay readable on fork runs too. The tier travels as
# environment as well, so every `npm run in visual-tests …` and every
# `node ./visual-tests/scripts/…` below resolves the same tier through
# visual-tests/lib/visual-tiers.mjs.
env:
  R2_BUCKET_NAME: handsontable-visual
  VISUAL_REPORT_DOMAIN: visual.handsontable.com
  VISUAL_TIER: ${{ inputs.tier }}
  VISUAL_WRAPPERS: ${{ inputs.wrappers }}

jobs:
  render:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    # A cap, because the seed's concurrency group deliberately never cancels: a
    # render wedged on a browser install or an `aws s3 sync` would otherwise hold
    # that group for GitHub's six-hour default and every push behind it waits —
    # the same gap visual-seed.yml exists to close. Generous against the observed
    # 9-11 minutes, since this job also builds the core, the three wrappers and
    # the demos whenever it takes the artifact fallback.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The pr tier drops the cross-browser leg: a firefox or webkit difference
        # is nothing a pull request author can reproduce locally, and the leg is
        # 7 minutes and one more job under the org's 60-job cap. `strategy`
        # cannot read `env`, so the two matrix shapes are spelled out in full;
        # `demos` says which visual-test demos the leg serves (the tier's
        # frameworks, or the js demo alone through `serve-example`).
        config: ${{ fromJSON(inputs.tier == 'pr'
          && '[{"name":"multi-framework","browsers":"chromium","cache":"chromium","test":"test","artifact":"vt-screenshots-multi","tar":"screenshots-multi.tar.gz","demos":"tier"}]'
          || '[{"name":"multi-framework","browsers":"chromium","cache":"chromium","test":"test","artifact":"vt-screenshots-multi","tar":"screenshots-multi.tar.gz","demos":"tier"},{"name":"cross-browser","browsers":"chromium firefox webkit","cache":"all","test":"test:cross-browser","artifact":"vt-screenshots-cross","tar":"screenshots-cross.tar.gz","demos":"js"}]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # https://github.com/actions/cache/releases/tag/v5.0.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # pnpm-workspace.yaml is in the key because the Playwright version
          # lives in its catalog — package.json alone no longer changes on bumps.
          key: playwright-${{ matrix.config.cache }}-${{ runner.os }}-${{ hashFiles('visual-tests/package.json', 'pnpm-workspace.yaml') }}
      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no playwright install ${{ matrix.config.browsers }}
        working-directory: visual-tests
      - name: Install Playwright system dependencies
        run: npx --no playwright install-deps ${{ matrix.config.cache == 'chromium' && 'chromium' || '' }}
        working-directory: visual-tests

      - name: Download the Handsontable ES + CJS build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-es-cjs
          path: ./handsontable-build-es-cjs
        continue-on-error: true
      - run: |
          if test -f "handsontable-build-es-cjs/tmp.tar.gz"; then
            tar -zxf handsontable-build-es-cjs/tmp.tar.gz
            rm -r handsontable-build-es-cjs
          else
            npm run in handsontable build:es
            npm run in handsontable build:commonjs
            npm run in handsontable build:languages.es
            # The exports map's `./languages/all` require target is `languages/all.js`,
            # which only `build:languages` emits; the UMD artifact carries dist/ and
            # styles/, not languages/, so a run whose ES+CJS job was scope-skipped
            # while UMD ran has to build the packs here (same tasks as build.yml's
            # ES+CJS job) or `postbuild:partial` fails on that one export.
            npm run in handsontable build:languages
            npm run in handsontable build:languages.min
            # The `exports` map that `postbuild:partial` verifies below names the
            # type declarations, so this path has to emit them too or the check
            # fails on eight missing `.d.ts`/`.d.mts` files. Same pair, same
            # order as build.yml's ES+CJS job, whose tree passes that check.
            # `downlevel:types` has no package.json shim, so it goes through the
            # dispatcher exactly as build.yml calls it.
            npm run in handsontable build:types
            (cd handsontable && node scripts/run.mjs downlevel:types)
          fi

      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
          path: ./handsontable-build-umd
        continue-on-error: true
      - run: |
          if test -f "handsontable-build-umd/dist.tar.gz"; then
            tar -zxf handsontable-build-umd/dist.tar.gz
            rm -r handsontable-build-umd
          else
            npm run in handsontable build:umd
            npm run in handsontable build:umd.min
            npm run in handsontable build:languages
            npm run in handsontable build:languages.min
            # Deliberately NOT build.yml's two theme UMD tasks (`build:themes-umd`,
            # `build:themes-umd.min`). They emit `dist/themes/**` for the published
            # package; the demos load a theme as a STYLESHEET from `styles/`
            # (`examples/next/visual-tests/js/demo/src/index.js`), which
            # `postbuild:partial` composes either way, so they change no pixel here.
            # This is the only difference between the two lists, and the seed takes
            # THIS one on every develop push — so a task that does affect rendering
            # must be added to both, or the baseline drifts from every pull
            # request's render with nothing to blame. `visual-seed.test.mjs` pins
            # the delta to exactly these two names.
          fi
          # Composes a tree for the screenshot runs, not for publishing (no theme UMD
          # bundles on the fallback path), so it skips the packaging checks.
          npm run in handsontable postbuild:partial

      # A wrapper build is fetched (or built) only where a wrapper demo will
      # actually render: on the leg that serves the tier's demos, and only in
      # the full tier or in a pr tier whose `wrappers` input names that wrapper.
      # Exact on purpose — the seed tier copies the js render into the wrapper
      # directories and never renders one, so `!= 'pr'` would still pay for
      # three wrapper builds (the Angular one alone is about 2 minutes) that
      # nothing reads. Both halves of each pair carry the same condition.
      - name: Download the Angular wrapper build artifact
        if: matrix.config.demos == 'tier' && (inputs.tier == 'full' || (inputs.tier == 'pr' && contains(inputs.wrappers, 'angular-wrapper')))
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: angular-wrapper-build
          path: ./angular-wrapper-build
        continue-on-error: true
      - if: matrix.config.demos == 'tier' && (inputs.tier == 'full' || (inputs.tier == 'pr' && contains(inputs.wrappers, 'angular-wrapper')))
        run: |
          if test -f "angular-wrapper-build/angular-wrapper.tar.gz"; then
            tar -zxf angular-wrapper-build/angular-wrapper.tar.gz
            rm -r angular-wrapper-build
          else
            npm run in angular-wrapper build
          fi

      - name: Download the React wrapper build artifact
        if: matrix.config.demos == 'tier' && (inputs.tier == 'full' || (inputs.tier == 'pr' && contains(inputs.wrappers, 'react-wrapper')))
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: react-wrapper-build
          path: ./react-wrapper-build
        continue-on-error: true
      - if: matrix.config.demos == 'tier' && (inputs.tier == 'full' || (inputs.tier == 'pr' && contains(inputs.wrappers, 'react-wrapper')))
        run: |
          if test -f "react-wrapper-build/react-wrapper.tar.gz"; then
            tar -zxf react-wrapper-build/react-wrapper.tar.gz
            rm -r react-wrapper-build
          else
            npm run in react-wrapper build
          fi

      - name: Download the Vue3 wrapper build artifact
        if: matrix.config.demos == 'tier' && (inputs.tier == 'full' || (inputs.tier == 'pr' && contains(inputs.wrappers, 'vue3')))
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: vue3-build
          path: ./vue3-build
        continue-on-error: true
      - if: matrix.config.demos == 'tier' && (inputs.tier == 'full' || (inputs.tier == 'pr' && contains(inputs.wrappers, 'vue3')))
        run: |
          if test -f "vue3-build/vue3.tar.gz"; then
            tar -zxf vue3-build/vue3.tar.gz
            rm -r vue3-build
          else
            npm run in vue3 build
          fi

      # The multi-framework leg builds the tier's frameworks through build.mjs
      # (js plus the wrappers the `wrappers` input names for pr; js alone for
      # seed; js and the three wrappers for full). The
      # cross-browser leg serves only the js demo through `serve-example`, so it
      # installs and builds that one tree — the same two commands
      # visual-stability.yml uses. The matrix value goes through `env:`, never
      # straight into the script body.
      - name: Build visual test examples
        env:
          DEMOS: ${{ matrix.config.demos }}
        run: |
          if [ "$DEMOS" = "js" ]; then
            npm run examples:install next/visual-tests/js
            npm --prefix examples/next/visual-tests/js/demo run build
          else
            npm run in visual-tests build
          fi
      - name: Run visual tests (${{ matrix.config.name }})
        run: npm run in visual-tests ${{ matrix.config.test }}
      - run: tar -zcf ${{ matrix.config.tar }} ./visual-tests/screenshots
      - name: Upload the screenshots artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ matrix.config.tar }}
          # "Re-run all jobs" re-uploads under a name that already exists; without
          # this the render job fails and Compare never runs.
          overwrite: true

  compare:
    name: Compare
    runs-on: ubuntu-latest
    # Same reason as the render job's cap. Observed at 1.5-2.5 minutes; the fetch
    # and publish of 1646 objects is the only part that can hang.
    timeout-minutes: 30
    needs: [ render ]
    # Tags reach here through publish.yml -> test.yml. They are not base
    # branches: publishing would leave a full tree under `base/<tag>/` that
    # nothing reads and no lifecycle rule purges.
    if: ${{ !failure() && !cancelled() && github.ref_type != 'tag' }}
    # What the gate found, for the `approve` job below: `changed` holds the run
    # on the visual-approval environment; anything else lets it skip.
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      report-url: ${{ steps.gate.outputs.report-url }}
    # Job-level, mirroring integration.yml's preview job: the sticky-comment
    # step below needs it to post the verdict. Kept off the workflow level so
    # the `render` jobs keep the caller's default grant untouched.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No `fetch-depth: 0` — the snapshot keys come from the event context, not
      # from walking the git graph, so a shallow clone is enough.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Download multi-framework screenshots
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: vt-screenshots-multi
          path: ./
      - run: tar -zxf screenshots-multi.tar.gz
      # The pr tier renders no cross-browser leg (see the matrix), so its
      # artifact does not exist there, and download-artifact fails on a name it
      # cannot find.
      - name: Download cross-browser screenshots
        if: inputs.tier != 'pr'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: vt-screenshots-cross
          path: ./
      - if: inputs.tier != 'pr'
        run: tar -zxf screenshots-cross.tar.gz
      # Golden records live under `base/<branch>` and are rewritten by every
      # seed-tier build of that branch. A PR compares against the branch it
      # targets, so PRs into a release or LTS branch pick up the right baseline
      # for free. `VISUAL_WRITES_BASE` is what the Reconcile step keys on: only
      # the seed tier writes the baseline.
      - name: Resolve the snapshot keys
        # Context values go through the environment rather than into the script
        # body, so a branch name can never be read as shell.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          TIER: ${{ inputs.tier }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "REG_EXPECTED_KEY=base/$BASE_REF" >> "$GITHUB_ENV"
            echo "REG_ACTUAL_KEY=pr-$PR_NUMBER/$PR_HEAD_SHA" >> "$GITHUB_ENV"
            echo "VISUAL_WRITES_BASE=false" >> "$GITHUB_ENV"
          else
            # Every caller that runs this module on a push, a schedule or a
            # dispatch passes seed or full; a pr tier here would compare a
            # two-theme subset against the whole baseline and then reconcile
            # the baseline down to that subset.
            if [ "$TIER" = "pr" ]; then
              echo "::error::The pr tier is for pull requests; a $GITHUB_EVENT_NAME event must pass tier: seed or tier: full."
              exit 1
            fi

            # `lts/*` is listed for correctness, but nothing triggers this
            # workflow on an LTS push today: test.yml pushes on master,
            # visual-seed.yml on develop (NOT develop.yml — the seed moved out of
            # it in DEV-2797), publish.yml on release/** and explicitly excludes
            # lts/. So an LTS baseline is seeded by the first pull request into
            # that branch and never refreshed -- see the caveat in
            # visual-tests/README.md.
            case "$REF_NAME" in
              develop|master|release/*|lts/*) ;;
              *)
                echo "::notice::$REF_NAME is not a base branch; skipping the visual comparison."
                echo "VISUAL_SKIP=true" >> "$GITHUB_ENV"
                ;;
            esac

            if [ "$TIER" = "full" ]; then
              # A full render (the nightly) is compared against the goldens and
              # published under its own key, but it is never the baseline: it
              # renders the wrappers for real, and the baseline is the seed
              # tier's shape by design (visual-tests/AGENTS.md, js-copied
              # baselines). `nightly/<branch>/` is a fixed key rewritten by
              # every nightly, so only the latest report is kept and nothing
              # needs purging.
              echo "REG_EXPECTED_KEY=base/$REF_NAME" >> "$GITHUB_ENV"
              echo "REG_ACTUAL_KEY=nightly/$REF_NAME" >> "$GITHUB_ENV"
              echo "VISUAL_WRITES_BASE=false" >> "$GITHUB_ENV"
            else
              echo "REG_EXPECTED_KEY=base/$REF_NAME" >> "$GITHUB_ENV"
              echo "REG_ACTUAL_KEY=base/$REF_NAME" >> "$GITHUB_ENV"
              echo "VISUAL_WRITES_BASE=true" >> "$GITHUB_ENV"
            fi
          fi

      # A branch with no golden records yet must not wedge every PR opened
      # against it. The probe is a plain HTTPS GET against the public bucket, so
      # it works on fork runs too, and it reads the same `out.json` that the
      # fetch contract relies on.
      - name: Check for golden records
        if: env.VISUAL_SKIP != 'true'
        run: |
          # Only a definite 404 means "no baseline yet". A transport failure or
          # any other status must never be read as absence: the seed step below
          # would then overwrite `base/<branch>`, the baseline every other pull
          # request compares against, with this build's render.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -L -I "https://$VISUAL_REPORT_DOMAIN/$REG_EXPECTED_KEY/out.json") || code=000
          case "$code" in
            2??)
              echo "VISUAL_BOOTSTRAP=false" >> "$GITHUB_ENV"
              echo "Golden records found for $REG_EXPECTED_KEY."
              ;;
            404)
              echo "VISUAL_BOOTSTRAP=true" >> "$GITHUB_ENV"
              echo "No golden records for $REG_EXPECTED_KEY — this build seeds them."
              ;;
            *)
              echo "::error::Could not tell whether golden records exist for $REG_EXPECTED_KEY (HTTP $code)."
              echo "Refusing to guess — seeding on a transient failure would overwrite the baseline."
              exit 1
              ;;
          esac

      # Two comparison paths, one verdict. Both write `.reg/out.json`, and the
      # gate below reads only that, so a fork is held to the same standard.
      - name: Compare against the golden records
        if: env.VISUAL_SKIP != 'true'
          && (github.event_name != 'pull_request'
              || (github.event.pull_request.head.repo.full_name == github.repository
                  && github.actor != 'dependabot[bot]'))
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: npm run in visual-tests compare

      # A fork gets no secrets, so it reads the golden records over anonymous
      # HTTPS and publishes nothing. Guarding the comparison away instead would
      # delete visual review for external contributors -- see the fork-guard
      # rules in .ai/CI.md.
      - name: Compare against the golden records (no credentials)
        if: github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name != github.repository
              || github.actor == 'dependabot[bot]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node ./visual-tests/scripts/compare-fork.mjs "$BASE_REF"

      # On a push, a schedule or a dispatch nothing else reads the comparison:
      # the gate below is pull-request-only, so until this step a seed's own
      # differences — what the merged commit changed — went unread, and a
      # nightly had no verdict at all. The script writes the build's differences
      # to the job summary; for the seed tier a difference never fails it (the
      # seed must land, and its differences are the merge's) — only a missing
      # or empty comparison does, and that comparison has already failed the
      # job; for the full tier any difference is the job's failure. It sits
      # BEFORE Reconcile so a seed still reconciles after reporting. Context
      # values go through `env:`: a commit message can contain shell.
      - name: Report this build's differences
        id: report
        if: ${{ !cancelled() && github.event_name != 'pull_request' && env.VISUAL_SKIP != 'true' }}
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          VISUAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node ./visual-tests/scripts/seed-report.mjs

      # Attribution for what a pull request never rendered. The pr tier renders
      # js × {main, main-dark}, so a merge that changed the classic render, a
      # horizon theme, Firefox, WebKit or a wrapper copy passed its own visual
      # check without showing it — the seed is the first build that renders
      # those variants, and it reconciles them straight into the baseline below.
      # So the seed's out-of-tier differences go onto the merged pull request
      # (the number comes from the squash commit's `(#N)` suffix), where the
      # author reads them minutes after the merge instead of in a run summary
      # nobody opens. Sticky by header and number, so a re-run edits rather than
      # repeats. Push events only — a seed always is one, and the push token
      # carries the `pull-requests: write` this job already requests for the
      # verdict comment; no fork can reach this step. `continue-on-error`: a
      # failed comment must never keep the seed from landing.
      - name: Comment the seed's out-of-tier differences on the merged pull request
        if: ${{ !cancelled() && github.event_name == 'push' && steps.report.outputs.comment == 'true' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
        with:
          header: visual-seed
          number: ${{ steps.report.outputs.pull }}
          path: visual-tests/.reg/seed-comment.md

      # reg-suit only ever PUTs, and its fetch lists the whole prefix, so a
      # deleted or renamed screenshot would linger under `base/<branch>/actual/`
      # and show up as a phantom deletion on every later pull request. Reconcile
      # the prefix to exactly what this build rendered. Only the seed tier gets
      # here (`VISUAL_WRITES_BASE`, set above): the nightly's full render is not
      # the baseline's shape and never reaches it.
      - name: Reconcile the golden records
        if: env.VISUAL_SKIP != 'true' && env.VISUAL_WRITES_BASE == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # `--delete` makes a failed render catastrophic rather than harmless:
          # it would remove objects under `base/<branch>/actual/`, and the gate is
          # pull-request-only, so this run stays green while every open pull
          # request fails against a baseline that is no longer there.
          #
          # Count only the buckets that prove something was rendered. A missing
          # screenshots directory still fetches the goldens, so the report comes
          # back as all `deletedItems` and a plain "is the report empty" test
          # passes it straight through.
          rendered=$(jq '(.failedItems | length) + (.newItems | length) + (.passedItems | length)' \
            ./visual-tests/.reg/out.json)
          deleted=$(jq '(.deletedItems | length)' ./visual-tests/.reg/out.json)

          if [ "$rendered" = "0" ]; then
            echo "::error::The comparison rendered no screenshots; refusing to reconcile."
            echo "Syncing with --delete here would erase the baseline ($deleted goldens)."
            exit 1
          fi

          # A partial render is not distinguishable from a deliberate mass
          # removal, so this warns rather than blocks -- a false refusal here
          # blocks trunk, which is worse. It gives the run a searchable marker if
          # a later PR reports a baseline that lost screenshots.
          if [ "$deleted" -gt "$((rendered / 4))" ]; then
            echo "::warning::Reconcile is removing $deleted goldens against $rendered rendered." \
              "If that was not a deliberate removal or rename, check the render step."
          fi

          aws s3 sync ./visual-tests/.reg/actual "s3://$R2_BUCKET_NAME/$REG_EXPECTED_KEY/actual" \
            --delete --endpoint-url "$R2_ENDPOINT"

      # First build for this base branch: promote what we just rendered to the
      # golden records, so the next PR has something to compare against. The
      # base branch's own next build overwrites this with the authoritative
      # render, so an unreviewed baseline can survive at most one merge.
      - name: Seed the golden records
        if: env.VISUAL_BOOTSTRAP == 'true'
          && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # The probe alone is not enough. A base build killed mid-publish leaves
          # `actual/**` up with no manifest: the probe then reads 404 while
          # reg-suit compares against those actuals for real. Seeding there would
          # replace the baseline with one pull request's render, and this step
          # runs before the gate, so the damage would be done before anything
          # went red. Same signal the evaluator uses.
          if [ -f ./visual-tests/.reg/out.json ]; then
            checked=$(jq '(.failedItems | length) + (.passedItems | length) + (.deletedItems | length)' \
              ./visual-tests/.reg/out.json)
            total=$(jq '(.failedItems | length) + (.newItems | length) + (.deletedItems | length) + (.passedItems | length)' \
              ./visual-tests/.reg/out.json)

            if [ "$checked" != "0" ]; then
              echo "::error::The probe reported no golden records, but the comparison found some."
              echo "Refusing to seed: the baseline exists and this build must not replace it."
              exit 1
            fi

            # An empty report means reg-suit globbed nothing, not that this is a
            # clean first build. Seeding it would publish a blank manifest, and
            # the probe would then return 200 forever.
            if [ "$total" = "0" ]; then
              echo "::error::The comparison produced an empty report; there is nothing to seed."
              exit 1
            fi
          fi

          aws s3 cp ./visual-tests/screenshots "s3://$R2_BUCKET_NAME/$REG_EXPECTED_KEY/actual" \
            --recursive --endpoint-url "$R2_ENDPOINT"
          aws s3 cp ./visual-tests/.reg/out.json "s3://$R2_BUCKET_NAME/$REG_EXPECTED_KEY/out.json" \
            --endpoint-url "$R2_ENDPOINT"

      # `reg-suit run` exits 0 whatever it finds, so this step is the gate's verdict.
      # It fails only when the comparison itself failed (no report, nothing
      # compared); differences become the `changed` output, and the `approve` job
      # below turns that into a human decision. It runs on `always()`, not the
      # implicit `success()`: an earlier failure would otherwise skip it, leave
      # `.reg/comment.md` unwritten, and let the sticky step below fail on a
      # missing path, leaving the previous push's verdict standing as if it
      # described this one. That is the staleness this arrangement rules out -- a
      # verdict outliving the commit it was about. It is NOT a live status within
      # a run: the approval necessarily happens after this step, so the comment
      # would otherwise ask for a review that has already happened. The `approve`
      # job rewrites it once a reviewer has acted.
      - name: Visual verdict
        id: gate
        if: always() && github.event_name == 'pull_request'
        env:
          # A fork or Dependabot run publishes nothing, so there is no hosted
          # report to link; the artifact and the job summary carry the verdict.
          IS_UNTRUSTED: ${{ github.event.pull_request.head.repo.full_name != github.repository
            || github.actor == 'dependabot[bot]' }}
          VISUAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$IS_UNTRUSTED" = "true" ]; then
            export VISUAL_PUBLISHED=false VISUAL_SEEDED=false
          else
            export VISUAL_PUBLISHED=true VISUAL_SEEDED=true
          fi

          node ./visual-tests/scripts/visual-gate.mjs

      # One sticky comment, rewritten in place, carrying the counts, the report
      # link and how to accept the changes. Fork runs have no write token, so
      # they are excluded by the same guard the rest of the repo uses.
      # Unguarded, and needs no token: on a fork run the comment step below is
      # guarded off, so this is the only place the verdict is readable. Root
      # .ai/CI.md: "Withheld content goes to $GITHUB_STEP_SUMMARY".
      - name: Mirror the verdict to the job summary
        if: always() && github.event_name == 'pull_request'
        run: cat visual-tests/.reg/comment.md >> "$GITHUB_STEP_SUMMARY" || true

      # Kept whenever there is something to review or the comparison failed: a
      # fork run has no hosted report, and a reviewer approving a `changed`
      # verdict may want the images without the CDN. A nightly with differences
      # (a red run, or the report step's `changed`) keeps its images the same
      # way; so does a seed whose merge changed something. A clean run needs it
      # for nothing, so it is skipped there.
      #
      # `== 'changed'` rather than `!= 'clean'` on the pull-request arm: the
      # latter also matched `bootstrap`, a run that compared nothing and seeded
      # the baseline instead, so it uploaded the whole `.reg` tree with nothing
      # in it to review. The `error` verdict still uploads, through `failure()` —
      # the gate step exits non-zero there, which is exactly when a reader wants
      # the images.
      - name: Upload the visual diff report
        if: ${{ !cancelled() && (failure()
          || (github.event_name == 'pull_request' && steps.gate.outputs.verdict == 'changed')
          || steps.report.outputs.verdict == 'changed') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: visual-diff-report
          path: visual-tests/.reg
          retention-days: 3
          overwrite: true

      - name: Comment the visual verdict on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]') }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
        with:
          header: visual-tests
          path: visual-tests/.reg/comment.md

  # The human decision, as a GitLab-style manual gate inside the Tests DAG -- the
  # same mechanism manual-qa.yml uses. When Compare found differences, this job
  # pauses on the `visual-approval` ENVIRONMENT until someone on its reviewer
  # list approves the run ("Review pending deployments" on the run page; the
  # deployment's "View deployment" button opens the diff report). While it waits
  # the Visual module never completes, so `CI Gate` -- which needs it -- cannot
  # report and the merge stays blocked; a rejection fails this job and turns
  # `CI Gate` red. GitHub records who approved, when, and any comment as the
  # deployment review.
  #
  # Semantics that follow from the mechanism: approval is PER RUN, so every new
  # push re-asks -- screenshots nobody looked at never inherit one; it is
  # all-or-nothing for the build, as the label it replaces was; it needs no
  # re-commit and no re-run; and it works for fork and Dependabot pull requests,
  # whose downgraded token the old label machinery could not clear -- the
  # reviewer's approval does not go through that token.
  #
  # Cutover (repo admin), both steps before this lands:
  #
  #   1. Create the `visual-approval` environment WITH required reviewers, and
  #      TICK "Prevent self-review". The tick is part of the decision, not an
  #      option: without it the person who pushed the branch can approve their own
  #      differences, which is the rubber-stamping this replaces rather than a fix
  #      for it. The assertion below cannot stand in for the box — a self-approval
  #      is still a recorded approval, and reads identically through the API.
  #      `manual-qa`'s environment is configured the same way.
  #
  #   2. DELETE the `visual-approved` label from the repository's label list. The
  #      workflows that acted on it go with this change, so a label left in the
  #      picker is a button that silently does nothing: whoever applies it waits
  #      for a re-run that never comes. Open pull requests carrying it need no
  #      other action — deleting the label removes it from them too.
  #
  # A job that references a missing environment silently auto-creates it
  # UNPROTECTED and runs straight through, so the step below asserts the
  # control's OUTCOME -- an approval recorded against this run -- rather than
  # trusting its configuration, and fails closed when none is.
  approve:
    name: approve
    runs-on: ubuntu-latest
    needs: [ compare ]
    # `!failure()` as well as `!cancelled()`, matching `compare`'s own guard. An
    # `if:` that CONTAINS a status-check function replaces the implicit `success()`
    # on `needs` — one that contains none has `success()` ANDed onto it instead,
    # which is its own trap (see `.ai/CI.md`). Here a function is present, so
    # `!cancelled()` alone
    # would run this job when `compare` FAILED — and the verdict step writes its
    # output on `always()`, so a failure in a later step of `compare` leaves
    # `verdict == 'changed'` on a red job. A reviewer would then be asked to
    # approve a build that cannot go green whatever they click.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request'
      && needs.compare.outputs.verdict == 'changed' }}
    # The approvals API below reads the run's environment approvals, which needs
    # `actions: read`. Requested explicitly rather than inherited: a nested
    # job-level request is validated against the caller's grant at run startup,
    # so a repository default too narrow for it fails loudly and immediately
    # instead of 403ing later, on the first pull request that has differences.
    # `compare` already requests `pull-requests: write` through the same path, so
    # the caller's grant is known to be wider than this. `pull-requests: write` is
    # for the comment the last step rewrites.
    permissions:
      actions: read
      pull-requests: write
    environment:
      name: visual-approval
      url: ${{ needs.compare.outputs.report-url }}
    steps:
      - name: Assert a human approval is recorded for this run
        id: assert
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            let approvals;

            try {
              // Raw request: the reusable workflow shares the parent's run id,
              // and this endpoint lists the environment approvals for it.
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
                { owner, repo, run_id: context.runId },
              );

              approvals = response.data;
            } catch (error) {
              core.setFailed(`Could not read this run's approvals (${error.status} ${error.message}). `
                + 'The visual gate cannot confirm a human approved the differences, so it fails closed. '
                + 'If this is a token-permission error, grant `actions: read` to the Tests workflow.');
              return;
            }

            const approval = approvals.find((entry) => entry.state === 'approved'
              && (entry.environments || []).some((environment) => environment.name === 'visual-approval'));

            if (!approval) {
              core.setFailed('This job ran without a recorded visual-approval approval, which means the '
                + '`visual-approval` environment has no required reviewers (a missing environment is '
                + 'auto-created unprotected). Configure it -- required reviewers -- and re-run; the gate '
                + 'is not enforcing anything until then.');
              return;
            }
            core.setOutput('approved-by', approval.user.login);
            core.notice(`Visual differences approved by @${approval.user.login}`
              + `${approval.comment ? `: ${approval.comment}` : ''}.`);

      # `compare` posted a comment asking for an approval, and nothing else would
      # ever take that request back down: the sticky comment keeps asking through
      # review, merge, and afterwards. The label flow got this for free, because
      # approving started a re-run that rewrote the comment; the environment gate
      # has no re-run, so the rewrite has to be explicit. Same sticky header, so
      # this replaces that comment rather than adding a second one, and the
      # message is inline because this job has no checkout and the compare job's
      # `.reg/comment.md` lives on a different runner.
      # `success()`, not `!cancelled()`: the step above fails when no approval is
      # recorded, and `!cancelled()` would let this one post "approved by @" with
      # an empty login on exactly that run — announcing the opposite of what
      # happened. This is the step-level shape of the bug the job's own `if:`
      # guards against.
      - name: Record the approval on the pull request
        if: ${{ success() && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]') }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
        with:
          header: visual-tests
          message: |
            ## Visual tests — differences approved

            @${{ steps.assert.outputs.approved-by }} approved this build's visual differences on the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}),
            where the report and the images are linked.

            Approval covers this build only: a new push renders again and asks again.
