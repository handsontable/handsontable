name: Visual

# Visual regression — the post-test budgeting gate (the orchestrator runs it
# only after the functional tests pass). Two render configs (multi-framework
# chromium, cross-browser chromium+firefox+webkit) as a matrix; then the compare
# job consumes both screenshot sets. Each config downloads the core + wrapper
# build artifacts, falling back to a local build if an artifact is missing.
on:
  workflow_call:

# Not secrets, so these stay readable on fork runs too.
env:
  R2_BUCKET_NAME: handsontable-visual
  VISUAL_REPORT_DOMAIN: visual.handsontable.com

jobs:
  render:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: 'multi-framework', browsers: 'chromium', cache: 'chromium', test: 'test', artifact: 'vt-screenshots-multi', tar: 'screenshots-multi.tar.gz' }
          - { name: 'cross-browser', browsers: 'chromium firefox webkit', cache: 'all', test: 'test:cross-browser', artifact: 'vt-screenshots-cross', tar: 'screenshots-cross.tar.gz' }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # https://github.com/actions/cache/releases/tag/v5.0.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.config.cache }}-${{ runner.os }}-${{ hashFiles('visual-tests/package.json') }}
      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no playwright install ${{ matrix.config.browsers }}
        working-directory: visual-tests
      - name: Install Playwright system dependencies
        run: npx --no playwright install-deps ${{ matrix.config.cache == 'chromium' && 'chromium' || '' }}
        working-directory: visual-tests

      - name: Download the Handsontable ES + CJS build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-es-cjs
          path: ./handsontable-build-es-cjs
        continue-on-error: true
      - run: |
          if test -f "handsontable-build-es-cjs/tmp.tar.gz"; then
            tar -zxf handsontable-build-es-cjs/tmp.tar.gz
            rm -r handsontable-build-es-cjs
          else
            npm run in handsontable build:es
            npm run in handsontable build:commonjs
            npm run in handsontable build:languages.es
          fi

      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd
          path: ./handsontable-build-umd
        continue-on-error: true
      - run: |
          if test -f "handsontable-build-umd/dist.tar.gz"; then
            tar -zxf handsontable-build-umd/dist.tar.gz
            rm -r handsontable-build-umd
          else
            npm run in handsontable build:umd
            npm run in handsontable build:umd.min
            npm run in handsontable build:languages
            npm run in handsontable build:languages.min
          fi
          # Composes a tree for the screenshot runs, not for publishing (no theme UMD
          # bundles on the fallback path), so it skips the packaging checks.
          npm run in handsontable postbuild:partial

      - name: Download the Angular wrapper build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: angular-wrapper-build
          path: ./angular-wrapper-build
        continue-on-error: true
      - run: |
          if test -f "angular-wrapper-build/angular-wrapper.tar.gz"; then
            tar -zxf angular-wrapper-build/angular-wrapper.tar.gz
            rm -r angular-wrapper-build
          else
            npm run in angular-wrapper build
          fi

      - name: Download the React wrapper build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: react-wrapper-build
          path: ./react-wrapper-build
        continue-on-error: true
      - run: |
          if test -f "react-wrapper-build/react-wrapper.tar.gz"; then
            tar -zxf react-wrapper-build/react-wrapper.tar.gz
            rm -r react-wrapper-build
          else
            npm run in react-wrapper build
          fi

      - name: Download the Vue3 wrapper build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: vue3-build
          path: ./vue3-build
        continue-on-error: true
      - run: |
          if test -f "vue3-build/vue3.tar.gz"; then
            tar -zxf vue3-build/vue3.tar.gz
            rm -r vue3-build
          else
            npm run in vue3 build
          fi

      - name: Build visual test examples
        run: npm run in visual-tests build
      - name: Run visual tests (${{ matrix.config.name }})
        run: npm run in visual-tests ${{ matrix.config.test }}
      - run: tar -zcf ${{ matrix.config.tar }} ./visual-tests/screenshots
      - name: Upload the screenshots artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ matrix.config.tar }}

  compare:
    name: Compare
    runs-on: ubuntu-latest
    needs: [ render ]
    if: ${{ !failure() && !cancelled() }}
    # Job-level, mirroring integration.yml's preview job: reg-suit's notifier
    # comments the report URL on the PR. Kept off the workflow level so the
    # `render` jobs keep the caller's default grant untouched.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No `fetch-depth: 0` — the snapshot keys come from the event context, not
      # from walking the git graph, so a shallow clone is enough.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: ./.github/actions/setup-workspace
      - name: Download multi-framework screenshots
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: vt-screenshots-multi
          path: ./
      - name: Download cross-browser screenshots
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: vt-screenshots-cross
          path: ./
      - run: |
          tar -zxf screenshots-multi.tar.gz
          tar -zxf screenshots-cross.tar.gz
      - run: tar -zcf screenshots.tar.gz ./visual-tests/screenshots
      - name: Upload the test results artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: visual-tests-screenshots
          path: screenshots.tar.gz

      # Golden records live under `base/<branch>` and are rewritten by every
      # build of that branch. A PR compares against the branch it targets, so
      # PRs into a release or LTS branch pick up the right baseline for free.
      - name: Resolve the snapshot keys
        # Context values go through the environment rather than into the script
        # body, so a branch name can never be read as shell.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "REG_EXPECTED_KEY=base/$BASE_REF" >> "$GITHUB_ENV"
            echo "REG_ACTUAL_KEY=pr-$PR_NUMBER/$PR_HEAD_SHA" >> "$GITHUB_ENV"
          else
            echo "REG_EXPECTED_KEY=base/$REF_NAME" >> "$GITHUB_ENV"
            echo "REG_ACTUAL_KEY=base/$REF_NAME" >> "$GITHUB_ENV"
          fi

      # A branch with no golden records yet must not wedge every PR opened
      # against it. The probe is a plain HTTPS GET against the public bucket, so
      # it works on fork runs too, and it reads the same `out.json` that the
      # fetch contract relies on.
      - name: Check for golden records
        run: |
          if curl -sfI --max-time 20 "https://$VISUAL_REPORT_DOMAIN/$REG_EXPECTED_KEY/out.json" >/dev/null; then
            echo "VISUAL_BOOTSTRAP=false" >> "$GITHUB_ENV"
            echo "Golden records found for $REG_EXPECTED_KEY."
          else
            echo "VISUAL_BOOTSTRAP=true" >> "$GITHUB_ENV"
            echo "No golden records for $REG_EXPECTED_KEY — this build seeds them."
          fi

      # Two comparison paths, one verdict. Both write `.reg/out.json`, and the
      # gate below reads only that, so a fork is held to the same standard.
      - name: Compare against the golden records
        if: github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The plugin needs the head branch to find the PR to comment on: a
          # pull_request checkout is a detached HEAD, so it cannot infer one.
          REG_NOTIFY_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || '' }}
        run: npm run in visual-tests compare

      # A fork gets no secrets, so it reads the golden records over anonymous
      # HTTPS and publishes nothing. Guarding the comparison away instead would
      # delete visual review for external contributors -- see the fork-guard
      # rules in the root AGENTS.md.
      - name: Compare against the golden records (no credentials)
        if: github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name != github.repository
              || github.actor == 'dependabot[bot]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node ./visual-tests/scripts/compare-fork.mjs "$BASE_REF"

      # First build for this base branch: promote what we just rendered to the
      # golden records, so the next PR has something to compare against. The
      # base branch's own next build overwrites this with the authoritative
      # render, so an unreviewed baseline can survive at most one merge.
      - name: Seed the golden records
        if: env.VISUAL_BOOTSTRAP == 'true'
          && github.event_name == 'pull_request'
          && (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp ./visual-tests/screenshots "s3://$R2_BUCKET_NAME/$REG_EXPECTED_KEY/actual" \
            --recursive --endpoint-url "$R2_ENDPOINT"
          aws s3 cp ./visual-tests/.reg/out.json "s3://$R2_BUCKET_NAME/$REG_EXPECTED_KEY/out.json" \
            --endpoint-url "$R2_ENDPOINT"

      # Fallback for reading the diff when the report URL is not reachable.
      - name: Upload the visual diff report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: visual-diff-report
          path: visual-tests/.reg

      # `reg-suit run` exits 0 whatever it finds, so this step is the whole
      # gate. Adding the `visual-approved` label accepts every diff at once.
      - name: Visual approval gate
        if: github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'visual-approved')
        run: node ./visual-tests/scripts/visual-gate.mjs
