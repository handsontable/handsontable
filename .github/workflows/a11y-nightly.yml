name: A11y nightly

# Every accessibility check on develop, every weeknight: the axe scan and every check beyond axe
# (a11y.yml with `checks: true` and `nightly: true`; tests/AGENTS.md, "A11y: the checks beyond axe").
# This is the only run of the checks beyond axe: the pull-request Tests pipeline runs the axe scan
# alone, because the checks are report-only and the accessibility program is still building its
# picture, so a pull request learned nothing from them it could act on. The evidence is kept 30 days,
# which is what the Accessibility Conformance Report cites per criterion. A dispatch runs every check
# too, unless it asks for the short suite (`suite: pull-request`), the one a developer runs locally.
# Each check's verdict is its `A11y / <check> report` check run and the job summary, by the severity rule
# (tests/AGENTS.md, "A11y: the verdict of a check run"): red on a critical or serious finding, neutral with
# a warning on a moderate or minor one, green on none. The run is an audit, so every open finding counts,
# tracked or not. No finding fails a scan or stops one: the checks job carries `continue-on-error`, and
# every scan runs to the end. Then the `verdict` job reads the check runs this run posted and fails the
# run when any is red, so the run's own conclusion says what its checks found. Only `CI Gate` is
# required, and it is not in this run, so a red nightly blocks no merge.
#
# Triage. A finding is about the product: record it, never fix it in the check's change. A target
# that was not measured, or one flagged flaky, is a finding against the check: fix the measurement.
on:
  schedule:
    # 05:30 UTC Tue–Sat: after the screen reader nightly (04:30), clear of the E2E nightly (03:30), the
    # visual nightly (02:00), the visual stability run (02:30), the code-quality baseline (03:00), the
    # readme (04:00) and the docs sync (05:00).
    - cron: '30 5 * * 2-6'
  # From any ref: a dispatch from a feature branch is how a new check proves itself before it merges.
  workflow_dispatch:
    inputs:
      suite:
        description: "Which checks beyond axe to run: every check (nightly), or the short suite (pull-request) a developer also runs locally."
        type: choice
        options: [ nightly, pull-request ]
        default: nightly
  # Self-validation, as screenreader-nightly.yml does it: this file never runs on an ordinary pull
  # request, so a broken workflow_call graph would first execute after merging. With this trigger a
  # pull request that touches the file gets a startup-validated run whose jobs skip themselves.
  pull_request:
    paths: [ '.github/workflows/a11y-nightly.yml' ]

# NO permissions block: the called workflow validates its job-level grants against the default token
# this caller hands down (the parity rule of e2e-nightly.yml and screenreader-nightly.yml).

concurrency:
  # Static prefix, never the workflow-name expression (a called workflow resolves it to the caller's).
  group: a11y-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      run-umd: true
    secrets: inherit

  a11y:
    name: A11y
    needs: [ build ]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/a11y.yml
    with:
      checks: true
      # Every check on the cron and on a plain dispatch (`inputs` is empty on the cron); a dispatch may
      # ask for the short suite instead.
      nightly: ${{ inputs.suite != 'pull-request' }}
    # No `secrets: inherit`: the called workflow reads only secrets.GITHUB_TOKEN, which every job has.

  # The run's verdict: the worst of the check runs this run posted (tests/scripts/a11y-run-verdict.mjs),
  # red when any is red or one the suite should have posted is missing. It runs after every scan and
  # check has finished (`!cancelled()`, so a red job before it never skips it), reads the check runs by
  # the run id their posters stamp as `external_id`, and fails this job, which fails the run. It stops
  # nothing: by the time it runs, everything else has run and reported. Never on the self-validating
  # pull request run, whose jobs post nothing.
  verdict:
    name: Verdict
    needs: [ a11y ]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      # The script and the modules it imports, nothing else: no package to install, no build.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/lib
            tests/scripts
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
      - name: Follow the worst check run of this run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          # Every check on the cron (`inputs` is empty there) and on a plain dispatch, as the a11y job runs them.
          A11Y_SUITE: ${{ inputs.suite == 'pull-request' && 'pull-request' || 'nightly' }}
        run: node tests/scripts/a11y-run-verdict.mjs --prefix "A11y / " --a11y-suite "$A11Y_SUITE"

  # Optional Slack ping, develop only, when the run never reached the checks (the UMD build failed or
  # the called workflow could not start). The checks job carries `continue-on-error`, so a red check is
  # never reported here, and neither is the `verdict` job's red: their verdict is the check runs. The
  # same webhook as the other nightlies.
  notify:
    name: Notify Slack
    needs: [ a11y ]
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref_name == 'develop' }}
    runs-on: ubuntu-26.04
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_VISUAL_WEBHOOK_URL }}
    steps:
      - name: Send the failure to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # https://github.com/slackapi/slack-github-action/releases/tag/v3.0.2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: A11y nightly on ${{ github.ref_name }} failed outside the checks: the UMD build, or the axe scan's tooling. A finding of a check beyond axe is not reported here; its verdict is its A11y check run.\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTriage: tests/AGENTS.md, A11y: the checks beyond axe."
            }
