name: A11y nightly

# Every accessibility check on develop, on a dispatch: the axe scan and every check beyond axe
# (a11y.yml with `checks: true` and `nightly: true`; tests/AGENTS.md, "A11y: the checks beyond axe").
# Manual trigger only, no schedule: the accessibility program runs one audit, fixes, and re-audits
# (.ai/CI.md), so a cron would spend the compute on nights nobody reads. The tiers come back with the
# schedule, not before: axe on a pull request (test.yml today), a semi-lite set on a nightly, the full
# set on a release candidate and a stable release. The name stays: the ledger, the Slack text and the
# docs know this workflow as the A11y nightly.
# This is the only run of the checks beyond axe: the pull-request Tests pipeline runs the axe scan
# alone, because the checks are report-only and the accessibility program is still building its
# picture, so a pull request learned nothing from them it could act on. The evidence is kept 30 days,
# which is what the Accessibility Conformance Report cites per criterion. A plain dispatch runs every
# check (the audit, on develop); a dispatch may ask for the short suite (`suite: pull-request`), the one
# a developer runs locally, or name the checks to run (`checks: keyboard-walker`), the proof run of a
# change to one check from its branch.
# Report-only: the checks job carries `continue-on-error`, and the verdict of each check is its
# `A11y / <check> report` check run and the job summary.
#
# Triage. A finding is about the product: record it, never fix it in the check's change. A target
# that was not measured, or one flagged flaky, is a finding against the check: fix the measurement.
on:
  # From any ref: a dispatch on develop with no inputs is the audit (test-health.yml collects it into
  # the findings ledger), and a dispatch from a feature branch is how a new check proves itself before
  # it merges. Never dispatch two screen reader runs at once; this workflow has no such limit.
  workflow_dispatch:
    inputs:
      suite:
        description: "Which checks beyond axe to run: every check (nightly), or the short suite (pull-request) a developer also runs locally."
        type: choice
        options: [ nightly, pull-request ]
        default: nightly
      checks:
        description: "The checks beyond axe to run instead of the suite: comma-separated check ids (keyboard-walker,reflow). Empty runs the suite."
        type: string
        default: ''
  # Self-validation, as screenreader-nightly.yml does it: this file never runs on an ordinary pull
  # request, so a broken workflow_call graph would first execute after merging. With this trigger a
  # pull request that touches the file gets a startup-validated run whose jobs skip themselves.
  pull_request:
    paths: [ '.github/workflows/a11y-nightly.yml' ]

# NO permissions block: the called workflow validates its job-level grants against the default token
# this caller hands down (the parity rule of e2e-nightly.yml and screenreader-nightly.yml).

concurrency:
  # Static prefix, never the workflow-name expression (a called workflow resolves it to the caller's).
  group: a11y-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      run-umd: true
    secrets: inherit

  a11y:
    name: A11y
    needs: [ build ]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/a11y.yml
    with:
      checks: true
      # Every check on a plain dispatch; a dispatch may ask for the short suite instead.
      nightly: ${{ inputs.suite != 'pull-request' }}
      # A subset dispatch names its checks; empty (the audit, the pull_request trigger) runs the suite.
      check-ids: ${{ inputs.checks }}
    # No `secrets: inherit`: the called workflow reads only secrets.GITHUB_TOKEN, which every job has.

  # Optional Slack ping, develop only, when the run never reached the checks (the UMD build failed or
  # the called workflow could not start). The checks job carries `continue-on-error`, so a red check is
  # never reported here; its verdict is its check run. The same webhook as the other nightlies.
  notify:
    name: Notify Slack
    needs: [ a11y ]
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref_name == 'develop' }}
    runs-on: ubuntu-26.04
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_VISUAL_WEBHOOK_URL }}
    steps:
      - name: Send the failure to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # https://github.com/slackapi/slack-github-action/releases/tag/v3.0.2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: A11y nightly on ${{ github.ref_name }} failed outside the checks: the UMD build, or the axe scan's tooling. A finding of a check beyond axe is not reported here; its verdict is its A11y check run.\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTriage: tests/AGENTS.md, A11y: the checks beyond axe."
            }
