name: Code quality baseline (nightly)

# Restores the TRUNK baseline scan that used to run on every push to
# develop/master/release (the old code-quality.yml). Those scans are now PR-only
# (folded into test.yml as [SCAN] SonarCloud / CodeQL / FOSSA), which left two
# gaps this workflow closes on a schedule instead of per-push:
#   - SonarCloud "new code" needs a base-branch (trunk) analysis, or the new-code
#     baseline PRs compare against goes stale.
#   - GitHub's code-scanning (CodeQL) dashboard for the default branch only
#     refreshes from an analysis of that branch — PR-only CodeQL analyzes diffs,
#     not the trunk HEAD.
# Runs on the default branch (what CodeQL's dashboard tracks and what PRs base
# their new-code comparison on). workflow_dispatch allows an on-demand refresh.
on:
  schedule:
    # 03:00 UTC daily — off-peak; the exact minute is arbitrary.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  # Static prefix (never ${{ github.workflow }}); one baseline run at a time.
  group: code-quality-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: "[SCAN] SonarCloud (baseline)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # https://github.com/SonarSource/sonarqube-scan-action/releases/tag/v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # https://github.com/SonarSource/sonarqube-quality-gate-action/releases/tag/v1.2.0
        timeout-minutes: 1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: "[SCAN] CodeQL (baseline)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@89a39a4e59826350b863aa6b6252a07ad50cf83e # https://github.com/github/codeql-action/releases/tag/v4.32.4
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@89a39a4e59826350b863aa6b6252a07ad50cf83e # https://github.com/github/codeql-action/releases/tag/v4.32.4
        with:
          category: "/language:javascript-typescript"

  fossa-scan:
    name: "[SCAN] FOSSA (baseline)"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: fossas/fossa-action@ff70fe9fe17cbd2040648f1c45e8ec4e4884dcf3 # https://github.com/fossas/fossa-action/releases/tag/v1.9.0
        with:
          api-key: ${{secrets.FOSSA_API_KEY}}
