name: Performance tests
description: >-
  Run the CDP performance scenarios and publish the report/baseline. Reused by
  the PR Tests pipeline; the standalone performance-tests.yml keeps its own copy
  for the trunk push (golden baseline) until the higher pipelines are reworked.
  Requires checkout first. PERF_MODE is derived from the event (push → golden,
  otherwise compare), matching the standalone workflow.

inputs:
  hot-prebuilt:
    description: 'A shared UMD build artifact from the calling run is available — skip the internal build'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 10.30.2

    - name: Use Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        registry-url: https://registry.npmjs.org/

    # PR pipeline: reuse the shared UMD build artifact instead of rebuilding
    # (one of the 5→2 build de-duplications). Trunk pushes still self-build.
    - name: Download the Handsontable UMD build artifact
      if: inputs.hot-prebuilt == 'true'
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
      with:
        name: handsontable-build-umd

    - name: Extract the prebuilt dist
      if: inputs.hot-prebuilt == 'true'
      shell: bash
      run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz

    - name: Fetch golden snapshots from GitHub Pages
      if: ${{ (github.event_name == 'push' && 'golden' || 'compare') == 'compare' }}
      shell: bash
      run: |
        git fetch origin gh-pages:gh-pages 2>/dev/null || true
        mkdir -p performance-tests/golden

        # Single-file fallback, kept for when the history/ fetch below is empty or
        # has nothing with a marked trace window on every scenario.
        if git show gh-pages:performance-reports/develop/latest.json > performance-tests/golden/snapshots.json 2>/dev/null; then
          echo "Golden baseline (latest.json) restored from gh-pages"
        else
          echo "No golden baseline found on gh-pages -- running without baseline"
          rm -f performance-tests/golden/snapshots.json
        fi

        # Rolling-median history, shared with .github/workflows/performance-tests.yml
        # so the two golden-restore call sites can't drift on the fetch count or the
        # timestamp pattern.
        node .github/scripts/fetch-golden-history.mjs

    - name: Compute report URL
      id: report-url
      # Same guard as the gh-pages deploy below: PAGES_URL flows into result.md,
      # and report-builder.mjs only emits the "Full interactive report" link when
      # it is set. Without this, a fork PR's job summary would advertise a URL
      # that 404s, because the deploy that would publish it is skipped.
      if: github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
      shell: bash
      # HEAD_REF via env, never inlined as ${{ }}: on a fork PR the branch name
      # is attacker-controlled text and inlining it into the script is a
      # command-injection vector (actionlint `expression`).
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        BRANCH_SLUG=$(echo "$HEAD_REF" | sed 's/[^a-zA-Z0-9._-]/-/g')
        PAGES_URL="https://handsontable.github.io/handsontable/performance-reports/${BRANCH_SLUG}/"
        echo "branch_slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
        echo "pages_url=${PAGES_URL}" >> "$GITHUB_OUTPUT"

    - name: Run performance tests
      working-directory: performance-tests
      shell: bash
      env:
        CI: true
        HOT_PREBUILT: ${{ inputs.hot-prebuilt == 'true' && '1' || '' }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        PAGES_URL: ${{ steps.report-url.outputs.pages_url || '' }}
        GITHUB_HEAD_REF: ${{ github.head_ref || '' }}
        # The commit the report names. On a pull_request event the default GITHUB_SHA is the
        # ephemeral refs/pull/N/merge commit, which does not exist on the branch under review, so
        # the report would cite a SHA nobody can look up. Fall back to GITHUB_SHA off the PR path.
        PERF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PERF_MODE: ${{ github.event_name == 'push' && 'golden' || 'compare' }}
      run: PERF_MODE=$PERF_MODE node scripts/run.mjs

    - name: Upload performance-tests output
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
      with:
        name: performance-tests-output
        path: performance-tests/output
        retention-days: 14
        if-no-files-found: warn

    - name: Deploy golden to GitHub Pages
      if: ${{ always() && github.event_name == 'push' }}
      shell: bash
      run: |
        if [ ! -f performance-tests/output/snapshots.json ]; then
          echo "No snapshots.json to deploy"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin gh-pages:gh-pages 2>/dev/null || true

        TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
        DEPLOY_DIR="performance-reports/develop/${TIMESTAMP}"

        WORK_DIR=$(mktemp -d)
        git worktree add "$WORK_DIR" gh-pages

        mkdir -p "${WORK_DIR}/${DEPLOY_DIR}"
        cp performance-tests/output/snapshots.json "${WORK_DIR}/${DEPLOY_DIR}/snapshots.json"
        if [ -f performance-tests/output/report.html ]; then
          cp performance-tests/output/report.html "${WORK_DIR}/${DEPLOY_DIR}/index.html"
        fi

        cp performance-tests/output/snapshots.json "${WORK_DIR}/performance-reports/develop/latest.json"

        node performance-tests/lib/build-history-index.mjs "${WORK_DIR}/performance-reports/develop"

        cd "$WORK_DIR"
        git add performance-reports/develop/
        if git diff --cached --quiet; then
          echo "No changes to deploy"
        else
          git commit -m "perf: golden baseline ${TIMESTAMP}"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "Deployed golden to ${DEPLOY_DIR}/"
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed, pulling and retrying..."
            git pull --rebase origin gh-pages
          done
          if [ "$pushed" = false ]; then
            echo "ERROR: all push attempts failed"
            exit 1
          fi
        fi

        cd -
        git worktree remove "$WORK_DIR" --force

    - name: Deploy PR report to GitHub Pages
      # Write-token runs only. Fork PRs AND Dependabot PRs both get a read-only
      # GITHUB_TOKEN, so this would 403 and take CI Gate down with it.
      # See AGENTS.md, "fork and Dependabot pull requests".
      if: always() && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
      shell: bash
      env:
        BRANCH_SLUG: ${{ steps.report-url.outputs.branch_slug }}
      run: |
        if [ ! -f performance-tests/output/report.html ]; then
          echo "No report.html to deploy"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin gh-pages:gh-pages 2>/dev/null || true

        DEPLOY_DIR="performance-reports/${BRANCH_SLUG}"

        WORK_DIR=$(mktemp -d)
        git worktree add "$WORK_DIR" gh-pages

        mkdir -p "${WORK_DIR}/${DEPLOY_DIR}"
        cp performance-tests/output/report.html "${WORK_DIR}/${DEPLOY_DIR}/index.html"

        cd "$WORK_DIR"
        git add "${DEPLOY_DIR}/index.html"

        if git diff --cached --quiet; then
          echo "No changes to deploy"
        else
          git commit -m "perf: update report for ${BRANCH_SLUG}"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "Deployed to ${DEPLOY_DIR}/"
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed, pulling and retrying..."
            git pull --rebase origin gh-pages
          done
          if [ "$pushed" = false ]; then
            echo "ERROR: all push attempts failed"
            exit 1
          fi
        fi

        cd -
        git worktree remove "$WORK_DIR" --force

    - name: Ensure PR comment body exists
      if: always() && github.event_name == 'pull_request'
      shell: bash
      run: |
        mkdir -p performance-tests/output
        if [ ! -f performance-tests/output/result.md ]; then
          {
            echo '## Performance tests'
            echo
            echo 'No result.md was generated. Check the workflow log and downloaded artifacts.'
          } > performance-tests/output/result.md
        fi

    # Token-free mirror of the sticky comment: the ONLY way a fork PR sees these
    # numbers, since the comment below is internal-only. always() so it still
    # renders when the run step failed, which is when it matters most.
    - name: Write the performance summary to the job summary
      if: always() && github.event_name == 'pull_request'
      shell: bash
      run: cat performance-tests/output/result.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post performance summary to pull request
      # Write-token runs only. Fork PRs AND Dependabot PRs both get a read-only
      # GITHUB_TOKEN, so this would 403 and take CI Gate down with it.
      # See AGENTS.md, "fork and Dependabot pull requests".
      if: always() && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # https://github.com/marocchino/sticky-pull-request-comment/releases/tag/v3.0.4
      with:
        header: performance-tests
        path: performance-tests/output/result.md
