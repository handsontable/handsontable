name: Docs examples type check
description: >-
  Type-check the javascript, react and vue docs examples a pull request changed,
  against the core types built from the current checkout, and fail only on the
  errors the pull request introduced (base vs head, per file). Builds the core
  types only (about 4 s), not the full package. Requires checkout first.

inputs:
  base-sha:
    description: 'The pull request base commit to compare the changed examples against'
    required: true

runs:
  using: composite
  steps:
    # `pnpm install` at the root also installs `tsc` (docs/) and `vue-tsc`
    # (wrappers/vue3), the two tools check.mjs resolves; nothing is added.
    - uses: ./.github/actions/setup-workspace

    - name: Fetch the base commit
      shell: bash
      run: git fetch --no-tags --depth=1 origin ${{ inputs.base-sha }}

    - name: Build the core types
      shell: bash
      run: npm run build:types --prefix handsontable

    - name: Run type check
      shell: bash
      run: npm run docs:type-check-content --prefix docs
      env:
        BASE_REF: ${{ inputs.base-sha }}
