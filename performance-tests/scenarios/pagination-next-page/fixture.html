<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pagination next page</title>
  <link rel="stylesheet" href="../../fixtures/handsontable.css">
  <script src="../../fixtures/handsontable.full.js"></script>
  <script src="../../fixtures/test-license-key.js"></script>
</head>
<body>
  <div id="hot"></div>
  <script>
    const hot = new Handsontable(document.getElementById('hot'), {
      data: Handsontable.helper.createSpreadsheetData(100000, 20),
      rowHeaders: true,
      colHeaders: true,
      width: 1280,
      height: 600,
      autoRowSize: false,
      autoColumnSize: false,
      pagination: {
        pageSize: 50,
      },
      licenseKey: window.htTestLicenseKey,
    });

    // A named function: the trace parser bills script run from `page.evaluate` only to named frames.
    window.__nextPages = function nextPages(count) {
      const pagination = hot.getPlugin('pagination');

      for (let i = 0; i < count; i += 1) {
        pagination.nextPage();
      }
    };

    window.__hot = hot;
  </script>
</body>
</html>
