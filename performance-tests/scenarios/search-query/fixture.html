<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Search query</title>
  <link rel="stylesheet" href="../../fixtures/handsontable.css">
  <script src="../../fixtures/handsontable.full.js"></script>
  <script src="../../fixtures/test-license-key.js"></script>
</head>
<body>
  <div id="hot"></div>
  <script>
    const ROWS = 100000;
    const COLUMNS = 20;
    const hot = new Handsontable(document.getElementById('hot'), {
      data: Handsontable.helper.createSpreadsheetData(ROWS, COLUMNS),
      search: true,
      rowHeaders: true,
      colHeaders: true,
      width: 1280,
      height: 600,
      autoRowSize: false,
      autoColumnSize: false,
      licenseKey: window.htTestLicenseKey,
    });

    // A data load drops every stored cell meta, so each query starts from the meta a fresh grid has.
    window.__reload = () => hot.loadData(Handsontable.helper.createSpreadsheetData(ROWS, COLUMNS));
    window.__hot = hot;
  </script>
</body>
</html>
