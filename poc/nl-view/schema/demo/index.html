<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nl-view schema</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <header>
    <h1>nl-view A · schema</h1>
    <p class="sub">Type a view. The grid filters, sorts, or hides columns. One prompt is one undo.</p>
  </header>
  <section class="controls">
    <label>Dataset
      <select id="dataset">
        <option value="orders">orders</option>
        <option value="tickets">tickets</option>
      </select>
    </label>
    <label class="grow">Request
      <input id="prompt" type="text" placeholder="paid EMEA orders from the last 7 days, newest first" />
    </label>
    <button id="apply" type="button">Apply</button>
    <button id="undo" type="button">Undo</button>
    <button id="reset" type="button">Reset view</button>
    <label class="check"><input id="sample" type="checkbox" checked /> sample values</label>
    <label>Schema
      <select id="schema">
        <option value="full">full</option>
        <option value="lean">lean</option>
      </select>
    </label>
    <label>Model
      <select id="model">
        <option value="gpt-5.6-luna">gpt-5.6-luna</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
      </select>
    </label>
    <label>Effort
      <select id="effort">
        <option value="">default</option>
        <option value="minimal">minimal</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
      </select>
    </label>
    <label>API
      <input id="api" type="text" placeholder="/api/chat" spellcheck="false" />
    </label>
  </section>
  <p id="explanation" class="explanation"></p>
  <p id="not-expressible" class="not-expressible" hidden></p>
  <p id="error" class="error" hidden></p>
  <p id="meta" class="meta"></p>
  <div id="grid"></div>
  <details id="debug" open>
    <summary>Debug</summary>
    <pre id="debug-body"></pre>
  </details>
  <script type="module" src="./main.js"></script>
</body>
</html>
