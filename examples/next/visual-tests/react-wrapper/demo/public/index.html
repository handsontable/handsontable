<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href=".">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handsontable for React example</title>
    <script>
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const theme = urlParams.get('theme');
        const themeLink = document.createElement('link');

        themeLink.rel = 'stylesheet';
        // The class the capture guard looks for (assertStylesheetsLoaded in
        // visual-tests/src/test-runner.ts). No tier themes a wrapper today, so nothing checks this
        // link yet; setting it now means the day one does, a missing theme file fails the render
        // instead of being photographed as an unthemed grid.
        themeLink.className = 'dynamic-css';

        if (theme === 'main' || theme === 'main-dark') {
          themeLink.href = `/static/css/handsontable/styles/ht-theme-main.css`;

        } else if (theme === 'horizon' || theme === 'horizon-dark') {
          themeLink.href = `/static/css/handsontable/styles/ht-theme-horizon.css`;

        } else if (theme === 'classic' || theme === 'classic-dark') {
          themeLink.href = `/static/css/handsontable/styles/ht-theme-classic.css`;

        }

        [themeLink].forEach((link) => {
          if (link.href) {
            document.head.appendChild(link);
          }
        });
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
