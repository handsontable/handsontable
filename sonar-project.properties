sonar.projectKey=handsontable_handsontable
sonar.organization=handsontable
sonar.projectName=Handsontable
sonar.sources=handsontable/src,wrappers
sonar.exclusions=**/__tests__/**,**/test/**,**/*.spec.js,**/*.spec.ts
sonar.coverage.exclusions=**/*
# prevent specific files or directories from being checked for duplications. The
# dictionaries share one shape by design. SonarCloud skips every file git ignores,
# so they were out of the analysis while an unanchored `languages/` rule matched them.
sonar.cpd.exclusions=handsontable/src/i18n/languages/*.ts
sonar.sourceEncoding=UTF-8
