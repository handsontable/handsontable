<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    DEV-2905: a two-sheet workbook bound to one HyperFormula engine, with AutoColumnSize on. A
    sheet switch is `updateSettings()` + `loadData()`; the fixture counts how many columns
    AutoColumnSize measures per switch and exposes the engine so a test can remove the bound
    sheet behind the plugin's back. Every leg runs exactly ONE engine: the `umd` legs load
    HyperFormula as an external script (the base bundle ships none); the `full-min` legs use the
    engine baked into the bundle.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // HyperFormula comes from THIS package's own node_modules (declared in tests/package.json,
    // pinned to the exact version the handsontable package locks): CI installs only the filtered
    // handsontable-tests workspace, so a path into another package's node_modules would 404
    // there. Loaded ONLY on the base-bundle legs — handsontable.full.min.js sets
    // window.HyperFormula itself as it loads and would overwrite this global anyway.
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    // The bundle under test, selected above from the sanitized allowlist. The closing tag is
    // split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const hf = HyperFormula.buildEmpty({ licenseKey: 'internal-use-in-handsontable' });
    const sheetData = (name, rows, cols, formulaAt, salt = '') => Array.from({ length: rows }, (_, r) =>
      Array.from({ length: cols }, (_, c) => {
        if (r === formulaAt[0] && c === formulaAt[1]) {
          return `=SUM(B2:B${rows})&" ${name} total"`;
        }

        return c === 1 ? r : `${name}${salt} R${r}C${c}`;
      }));

    // 8 columns at most in a 1100px grid: every column of every sheet is visible on every theme,
    // so the render-time measurement covers exactly `countCols()` columns and the counts the spec
    // pins do not depend on the theme's cell padding.
    const hot = new Handsontable(container, {
      colHeaders: true,
      rowHeaders: true,
      renderer: testIdRenderer,
      width: 1100,
      height: 260,
      autoColumnSize: true,
      sheetsBar: {
        sheets: [{
          name: 'Budget',
          data: sheetData('Budget', 40, 4, [0, 0]),
          settings: { formulas: { engine: hf, sheetName: 'Budget' } },
        }],
        activeSheet: 0,
      },
      licenseKey: 'non-commercial-and-evaluation',
    });

    // Added at runtime with no `settings`, the way the ticket's sheet was: it inherits the shared
    // engine under its own name. Because it holds data, a switch to it runs `loadData()` twice:
    // the bar applies the inherited formula settings through `updateSettings()`, the Formulas
    // plugin's `switchSheet` loads the engine sheet's content, and then the bar loads its own
    // array - so AutoColumnSize sweeps the arriving sheet twice by design (a blank sheet is
    // loaded once). The spec pins that sequence, so the third pass it guards against is visible.
    hot.getPlugin('sheetsBar').addSheet('Big', sheetData('Big', 400, 8, [0, 3]));
    hot.getPlugin('sheetsBar').setActiveSheet('Budget');

    window.hot = hot;
    window.htEngine = hf;

    // Replaces the active sheet's data with values the engine has not seen yet, through a plain
    // `loadData()` - the general case of the AutoColumnSize sweep racing the engine update.
    window.loadFreshBudget = () => {
      hot.loadData(sheetData('Budget', 40, 4, [0, 0], ' fresh'));
    };

    // Counts the columns AutoColumnSize measures. Each measured column is one `addColumn()` call on
    // the plugin's ghost table, whichever sweep asked for it. The patch relies on the plugin creating
    // its `GhostTable` once, in a field initializer, and never reassigning it; a lifecycle change there
    // loses the patch and shows up here as a poll timeout, not as a wrong pass.
    const ghostTable = hot.getPlugin('autoColumnSize').ghostTable;
    const originalAddColumn = ghostTable.addColumn.bind(ghostTable);

    window.measuredColumns = 0;
    ghostTable.addColumn = (...args) => {
      window.measuredColumns += 1;

      return originalAddColumn(...args);
    };

    const stamp = (element, id) => {
      if (element) {
        element.setAttribute('data-testid', id);
      }
    };
    const stampBar = () => {
      document.querySelectorAll('.ht-sheets-bar__tab').forEach((tab, index) => {
        stamp(tab, `sheet-tab-${index}`);
      });
    };

    stampBar();
    hot.addHook('afterSheetTabChange', stampBar);
    new MutationObserver(stampBar).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
