<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unresolved menu item key warning e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the "does not match any available menu item" warning.

    The warning is raised while the grid is being built, so the page builds nothing on its own: the
    page object starts listening to the console first and then builds one named preset through
    `window.buildMenuGrid(name)`. Each build gets a fresh root element, which is the scope the
    warn-once record binds to, so two presets built in one page do not silence each other.

    Presets:
    - bare: no menu and no plugin, the starting point for `updateSettings()`;
    - filters: Filters items named explicitly in `dropdownMenu` (Filters enables AFTER the dropdown
      menu, which is the false positive);
    - filters-typo: the same list with one misspelled key (a true positive);
    - typo-only: a misspelled key and no plugin involved, the control for a spec that expects silence;
    - filters-off: the same keys with Filters disabled (a true positive);
    - context-menu: explicit `contextMenu` keys of plugins that enable after it.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    var container = document.querySelector('[data-testid="grid"]');

    container.className = 'ht-theme-' + window.htTheme;

    var PRESETS = {
      bare: {},
      filters: {
        filters: true,
        dropdownMenu: ['filter_by_condition', 'filter_by_value', 'filter_action_bar'],
      },
      'filters-typo': {
        filters: true,
        dropdownMenu: ['filter_by_condition', 'filter_by_valeu'],
      },
      'typo-only': {
        dropdownMenu: ['col_lfet'],
      },
      'filters-off': {
        filters: false,
        dropdownMenu: ['filter_by_condition'],
      },
      'context-menu': {
        contextMenu: ['hidden_columns_hide', 'mergeCells'],
        hiddenColumns: true,
        mergeCells: true,
      },
    };

    window.updateMenuGrid = function(name) {
      if (!Object.prototype.hasOwnProperty.call(PRESETS, name)) {
        throw new Error('Unknown preset: ' + JSON.stringify(name));
      }

      window.hot.updateSettings(PRESETS[name]);

      return true;
    };

    window.buildMenuGrid = function(name) {
      if (!Object.prototype.hasOwnProperty.call(PRESETS, name)) {
        throw new Error('Unknown preset: ' + JSON.stringify(name));
      }

      if (window.hot) {
        window.hot.destroy();
        window.hot = null;
      }

      window.hot = new Handsontable(container, Object.assign({
        data: [
          ['a1', 'b1', 'c1'],
          ['a2', 'b2', 'c2'],
          ['a3', 'b3', 'c3'],
        ],
        colHeaders: ['A', 'B', 'C'],
        rowHeaders: true,
        width: 400,
        height: 200,
        licenseKey: 'non-commercial-and-evaluation',
      }, PRESETS[name]));

      return true;
    };
  </script>
</body>
</html>
