<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Walkontable (exact row heights) e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    The rendering engine's `rowHeightMode` setting. Every row is given a provided height (through
    the `modifyRowHeight` hook, which reaches the engine unclamped) that is SHORTER than its content.
    In the `min` mode (the default) the height is a floor and the rows render at their content
    height; in the `exact` mode they render at the provided height and the content is clipped.

    The mode is flipped on the engine directly — Handsontable itself does not expose it yet.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const params = new URLSearchParams(location.search);
    // The provided height of every row. Deliberately below every theme's default row height.
    const ROW_HEIGHT = Number(params.get('rowHeight') ?? 10);
    // `?hook=0&rowHeights=40` provides the height through the `rowHeights` OPTION instead of the
    // hook. The option is clamped to the theme default by Handsontable, so it has to sit above every
    // theme's default (37px in `horizon`), but it is the UNIFORM source: `rowHeightsUniform` is
    // true only with the option and no hook, and that is what engages the uniform-band shortcut in
    // `markOversizedRows` and the uniform strategy of the row-height cache.
    const USE_HOOK = params.get('hook') !== '0';
    const ROW_HEIGHTS_OPTION = params.get('rowHeights') ? Number(params.get('rowHeights')) : undefined;
    const ROWS = Number(params.get('rows') ?? 40);
    const ROW_HEADERS = params.get('rowHeaders') !== '0';
    const FIXED_COLUMNS_START = Number(params.get('fixedColumnsStart') ?? 1);
    // A row whose content wraps onto three lines, in a column the master renders.
    const MULTILINE_ROW = 3;
    const MULTILINE_COLUMN = 4;
    // A row holding a fixed-height block in the FROZEN column, which only the inline-start overlay
    // renders once the master's band starts past the frozen columns.
    const TALL_FROZEN_ROW = 5;
    const TALL_FROZEN_COLUMN = 0;
    const TALL_CONTENT_HEIGHT = 60;

    const data = Array.from({ length: ROWS }, (_, r) =>
      Array.from({ length: 12 }, (_, c) => {
        if (c === 1) {
          return r % 2 === 0;
        }
        if (r === MULTILINE_ROW && c === MULTILINE_COLUMN) {
          return 'line one\nline two\nline three';
        }

        return `R${r + 1}C${c + 1}`;
      }));

    const renderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);

      // Stamp the row id on the TR from whichever cell renders first. Every table
      // (master and each overlay clone) renders a different column range, so a
      // per-cell id could not identify the same row across them.
      if (td.parentElement) {
        td.parentElement.setAttribute('data-testid', `row-${row}`);
      }

      if (row === TALL_FROZEN_ROW && col === TALL_FROZEN_COLUMN) {
        td.innerHTML = `<div data-testid="tall-block" style="height: ${TALL_CONTENT_HEIGHT}px"></div>`;
      }
    };

    const columns = Array.from({ length: 12 }, (_, c) => {
      if (c === 1) {
        return { type: 'checkbox' };
      }
      if (c === 2) {
        return { type: 'autocomplete', source: ['alpha', 'beta', 'gamma'] };
      }

      return { renderer };
    });

    const hot = window.hot = new Handsontable(container, {
      data,
      columns,
      width: 600,
      height: 300,
      colWidths: 100,
      fixedColumnsStart: FIXED_COLUMNS_START,
      rowHeaders: ROW_HEADERS,
      colHeaders: true,
      // The hook reaches the engine unclamped, unlike the `rowHeights` option.
      ...(USE_HOOK ? { modifyRowHeight: () => ROW_HEIGHT } : {}),
      ...(ROW_HEIGHTS_OPTION ? { rowHeights: ROW_HEIGHTS_OPTION } : {}),
      licenseKey: 'non-commercial-and-evaluation',
    });

    // Flips the engine's row-height mode. Overlay clones share the master's settings object, so
    // one update reaches every table.
    window.setRowHeightMode = (mode) => {
      hot.view._wt.wtSettings.update('rowHeightMode', () => mode);
      hot.render();
    };

    window.setRowHeightMode(params.get('mode') === 'exact' ? 'exact' : 'min');

    // Counts row-height cache invalidations over `renders` full draws. A settled grid must cost
    // none — an exact band that kept re-recording itself would show up only here.
    window.countRowCacheInvalidations = (renders) => {
      const { wtViewport } = hot.view._wt;
      const original = wtViewport.invalidateRowHeightCache.bind(wtViewport);
      let count = 0;

      wtViewport.invalidateRowHeightCache = (...args) => {
        count += 1;

        return original(...args);
      };

      for (let i = 0; i < renders; i++) {
        hot.render();
      }

      wtViewport.invalidateRowHeightCache = original;

      return count;
    };
  </script>
</body>
</html>
