<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — row height under sub-100% device scaling</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }

    // Sub-100% rendering, applied through CSS zoom on the root element. Chrome routes it
    // through the same effective-zoom machinery as browser page zoom, so the cells' 1px
    // border is inflated exactly as it is under Ctrl+minus or Windows display scaling — the
    // computed width reads 1.111px at 0.9 either way.
    //
    // It has to be CSS zoom rather than a `--force-device-scale-factor` launch flag: that
    // flag needs `viewport: null`, which every project's `devices['Desktop Chrome']` forbids
    // by pinning `deviceScaleFactor`. Playwright's own context-level `deviceScaleFactor` is
    // not an option either — it reports the ratio faithfully but never inflates the border,
    // so a test built on it passes on the unfixed code.
    //
    // Applied here, before the grid is constructed: the row height is measured once at init,
    // and CSS zoom — unlike real page zoom — does not move `devicePixelRatio` to invalidate it.
    const htZoom = Number(htParams.get('zoom') ?? '1');

    if (!Number.isFinite(htZoom) || htZoom <= 0 || htZoom > 4) {
      throw new Error('Unknown ?zoom= value: ' + JSON.stringify(htParams.get('zoom')));
    }

    window.htZoom = htZoom;
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    #wrap { width: 700px; }
    /* Deliberately no height on the grid container: that is the only mode this
       defect reaches, because the container's height is then the sum of the row
       heights rather than a number the page dictates. */
    #below {
      background: #ffd0d0;
      border: 1px solid #c00;
      padding: 4px;
    }
  </style>
</head>
<body>
  <!--
    GitHub #6280. Below 100% zoom or display scaling a browser cannot paint the cells'
    1px bottom border thinner than one device pixel, so it inflates it — 1.111px at 90%,
    1.25px at 80%. Every row then renders that fraction taller than the theme declared.
    Handsontable used to size the grid from the declared height, so its scroll range fell
    short of its own content by that fraction times the row count: the bottom rows spilled
    past the container onto whatever followed it, and the row-header clone — sized from the
    same sum — clipped its own last row numbers away.

    The fixture is the reporters' setup: an auto-height grid with an element directly
    underneath. Row virtualization is switched off so the last row is always in the DOM,
    which is what makes the accumulated error measurable in one shot.
  -->
  <script>
    // Before the bundle loads, so the first render already measures the zoomed cell.
    document.documentElement.style.zoom = String(window.htZoom);
  </script>

  <div id="wrap">
    <div id="grid" data-testid="grid"></div>
    <div id="below" data-testid="below">The element below the grid</div>
  </div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    // Enough rows that a per-row error is unmistakable: at 90% the pre-fix shortfall was
    // ~0.1px per row, so ~10px here, against a 1px tolerance.
    const ROWS = 100;

    const data = [];

    for (let row = 0; row < ROWS; row++) {
      data.push([`R${row}C0`, `R${row}C1`, `R${row}C2`, `R${row}C3`]);
    }

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    window.hot = new Handsontable(document.getElementById('grid'), {
      data,
      colHeaders: true,
      rowHeaders: true,
      colWidths: 100,
      renderer: testIdRenderer,
      // Defeat row virtualization: without the last row in the DOM there is nothing to
      // compare the container's bottom edge against.
      viewportRowRenderingOffset: ROWS + 10,
      licenseKey: 'non-commercial-and-evaluation',
    });

    window.htRowCount = ROWS;
  </script>
</body>
</html>
