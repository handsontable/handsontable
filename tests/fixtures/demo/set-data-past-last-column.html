<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - setDataAtCell past the last column of object data</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD); an
    // unknown value THROWS rather than falling back, so a typo in the project config is one red
    // leg instead of a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    An object data source whose `dataSchema` declares two fields, so the grid has two columns and
    can never gain a third. A `setDataAtCell()` addressed to column 2 is therefore skipped (#5409).
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    window.hot = new Handsontable(container, {
      data: [
        { id: 1, name: 'Ted Right' },
        { id: 2, name: 'Frank Honest' },
      ],
      dataSchema: { id: null, name: null },
      colHeaders: true,
      rowHeaders: true,
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: 'non-commercial-and-evaluation',
    });
  </script>
</body>
</html>
