<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NestedHeaders rowspan headers e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document - no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back - a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    .grid { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <!--
    Header cells that span header levels (`rowspan` in `nestedHeaders`). These checks were legacy
    Jasmine specs that never ran: an `it.skip` above them threw while the file loaded (DEV-3177).

    `menus-grid` is three header levels deep and carries every header control a rowspan header can
    hold (collapse button, dropdown menu button, sorting). `scroll-grid` is two levels deep and
    scrolls vertically, for the header's bottom border.

    Every header cell is stamped `data-testid="col-header-<level>-<column>"`, with the level as the
    `afterGetColHeader` hook reports it. The top overlay renders the copy of each header the user
    sees, so the page object scopes these ids to `.ht_clone_top`.
  -->
  <div id="menus-grid" class="grid" data-testid="menus-grid"></div>
  <div id="scroll-grid" class="grid" data-testid="scroll-grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    function stampHeaderTestId(column, TH, level) {
      TH.setAttribute('data-testid', `col-header-${level}-${column}`);
    }

    /**
     * Build one grid. A constructor that throws stamps its message on the container instead of
     * taking the whole page down, so a failure reads as the real error rather than a bare
     * "element not visible".
     */
    function build(testId, settings) {
      const container = document.querySelector(`[data-testid="${testId}"]`);

      container.className = `grid ht-theme-${window.htTheme}`;

      try {
        return new Handsontable(container, Object.assign({
          colHeaders: true,
          rowHeaders: true,
          afterGetColHeader: stampHeaderTestId,
          licenseKey: 'non-commercial-and-evaluation',
        }, settings));
      } catch (error) {
        container.setAttribute('data-init-error', String(error && error.message));

        return null;
      }
    }

    window.hots = {
      'menus-grid': build('menus-grid', {
        data: Handsontable.helper.createSpreadsheetData(5, 10),
        height: 'auto',
        navigableHeaders: true,
        collapsibleColumns: true,
        dropdownMenu: true,
        filters: true,
        columnSorting: true,
        nestedHeaders: [
          [{ label: 'Header title', colspan: 8 }, { label: 'I/J', rowspan: 2, colspan: 2 }],
          [
            { label: 'This is a very long header title', rowspan: 2 },
            'B',
            'C',
            { label: 'D/E', rowspan: 2, colspan: 2 },
            'F',
            'G',
            'H',
          ],
          ['B2', 'C2', 'F2', 'G2', 'H2', 'I2', 'J2'],
        ],
      }),
      'scroll-grid': build('scroll-grid', {
        data: Handsontable.helper.createSpreadsheetData(50, 3),
        height: 180,
        nestedHeaders: [
          [{ label: 'This is a very long header title', rowspan: 2 }, 'B', 'C'],
          ['B2', 'C2'],
        ],
      }),
    };
  </script>
</body>
</html>
