<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cells() valueGetter on unrendered rows e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    With `applyCellsToDataReads` on, a `valueGetter` that the `cells` function supplies must apply to
    every row a data read returns, not only to the rows the grid has rendered. Only a rendered row stores cell meta, and the grid
    evicts that meta once the row scrolls out of view, so the read must run the `cells` function
    itself. jsdom renders every row and never evicts, so the scroll part can only be checked here.

    The same holds for the Filters column read: a condition compares the value the getter shows.

    Column 0 shows each value with an `X` prefix. Column 1 holds the numbers 0-999 and shows 999
    minus each one, so sorting it by the displayed value reverses the rows.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const ROWS = 1000;
    const data = Array.from({ length: ROWS }, (_, row) => [`v${row}`, row]);

    try {
      window.hot = new Handsontable(container, {
        data,
        height: 300,
        colHeaders: true,
        columnSorting: true,
        filters: true,
        applyCellsToDataReads: true,
        cells(row, column) {
          if (column === 0) {
            return { valueGetter: value => `X${value}` };
          }

          return { valueGetter: value => (ROWS - 1) - value };
        },
        afterGetColHeader(column, TH) {
          if (column >= 0) {
            TH.setAttribute('data-testid', `col-header-${column}`);
          }
        },
        afterRenderer(TD, row, column) {
          TD.setAttribute('data-testid', `cell-${row}-${column}`);
        },
        licenseKey: window.htTestLicenseKey,
      });
    } catch (error) {
      window.htBuildError = String((error && error.stack) || error);
    }
  </script>
</body>
</html>
