<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — viewport refill after column autosize (#6452 / DEV-406)</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } #toolbar { margin-bottom: .8rem; } </style>
</head>
<body>
  <!--
    #6452 / DEV-406. Column C starts 40px wide. Rows 1-7 get a long sentence written via
    `setDataAtCell` AFTER the grid is constructed (matching the original report's fiddle), so a
    second draw settles those rows to their wrapped, tall height and shrinks the rendered band to
    a handful of rows before the test starts — writing the long values into the initial `data`
    instead would let the very first draw's height guess absorb them, leaving the precondition
    vacuous. Widening C (double-click autosize) or replacing the sentences collapses the rows
    again; the grid must then render enough rows to fill the viewport in the same draw. Cells
    carry data-testid="cell-<row>-<col>".
  -->
  <div id="toolbar">
    <button data-testid="shorten-texts" type="button">Shorten texts</button>
  </div>
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const LONG_TEXT = 'This is a really long sentence that will hopefully wrap in the cell. Isnt it amazing how long it is?';
    const data = Handsontable.helper.createSpreadsheetData(100, 10);

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const hot = new Handsontable(container, {
      data,
      colHeaders: true,
      width: 800,
      height: 320,
      // Column C is persisted narrow, as in the original report (the fiddle used the removed
      // persistentState plugin for that); the other columns keep their automatic width.
      manualColumnResize: [undefined, undefined, 40],
      renderer: testIdRenderer,
      licenseKey: 'non-commercial-and-evaluation',
    });

    window.hot = hot;

    // Written after init on purpose (matches the original report's fiddle): this second draw is
    // what settles rows 1-7 into their wrapped, tall height and shrinks the rendered band, which
    // is the starting state the reported double-click/replace bug needs.
    for (let row = 1; row <= 7; row++) {
      hot.setDataAtCell(row, 2, LONG_TEXT);
    }

    document.querySelector('[data-testid="shorten-texts"]').addEventListener('click', () => {
      hot.setDataAtCell([1, 2, 3, 4, 5, 6, 7].map(row => [row, 2, 'short']));
    });
  </script>
</body>
</html>
