<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable selection features e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Active theme from the ?theme= query param set by the Playwright project.
    // Mapped through a fixed allowlist to a LITERAL (default main), so a crafted
    // ?theme= can never be reflected into the document — no XSS. Exposed as
    // window.htTheme so the grid init below reuses the sanitized value.
    window.htTheme = ({ horizon: 'horizon', classic: 'classic' })[new URLSearchParams(location.search).get('theme')] || 'main';
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the selection border features: the selectionHandles
    resize handles (.wtSelectionHandle) and the moveCells edge move bands
    (.wtMoveZone). Cells are stamped with data-testid via a renderer
    (data-testid="cell-<row>-<col>"). window.initSelectionGrid(overrides)
    rebuilds the instance per test with that test's setting overrides —
    one instance per test, no cross-test state.
  -->
  <div id="grid" data-testid="grid"></div>

  <script src="/handsontable/dist/handsontable.full.min.js"></script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // Built fresh on every init: moveCells and undo/redo mutate the data array in place, so a
    // single shared array would leak one test's moves into the next.
    const buildData = () => Array.from({ length: 10 }, (_, r) =>
      Array.from({ length: 10 }, (_, c) => `R${r + 1}C${c + 1}`));

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // (Re)creates the grid with the default selection-feature settings merged
    // with the given overrides (e.g. { moveCells: false }).
    // Records moveCells hook calls so a test can assert the arguments a hook received, and can veto
    // a move. Reset on every init together with the grid.
    window.moveCellsHookLog = [];
    window.vetoBeforeMoveCells = false;
    window.vetoBeforeRowMove = false;
    window.vetoBeforeColumnMove = false;

    window.initSelectionGrid = (overrides = {}) => {
      if (window.hot) {
        window.hot.destroy();
      }

      // Reset the hook log and every veto flag with the grid, so a test that re-inits after
      // arming a veto does not carry it into the new instance.
      window.moveCellsHookLog = [];
      window.vetoBeforeMoveCells = false;
      window.vetoBeforeRowMove = false;
      window.vetoBeforeColumnMove = false;

      window.hot = new Handsontable(container, Object.assign({
        beforeMoveCells: (source, target, isCopy) => {
          window.moveCellsHookLog.push({
            hook: 'beforeMoveCells',
            source: [
              source.getTopStartCorner().row, source.getTopStartCorner().col,
              source.getBottomEndCorner().row, source.getBottomEndCorner().col,
            ],
            target: [target.row, target.col],
            isCopy,
          });

          return window.vetoBeforeMoveCells ? false : undefined;
        },
        afterMoveCells: (source, target, isCopy) => {
          window.moveCellsHookLog.push({
            hook: 'afterMoveCells',
            source: [
              source.getTopStartCorner().row, source.getTopStartCorner().col,
              source.getBottomEndCorner().row, source.getBottomEndCorner().col,
            ],
            target: [
              target.getTopStartCorner().row, target.getTopStartCorner().col,
              target.getBottomEndCorner().row, target.getBottomEndCorner().col,
            ],
            isCopy,
          });
        },
        // Registered through the settings on purpose: a settings hook is added after the plugin
        // hooks, which is what lets a veto slip past a `beforeRowMove`-based undo listener.
        beforeRowMove: () => (window.vetoBeforeRowMove ? false : undefined),
        beforeColumnMove: () => (window.vetoBeforeColumnMove ? false : undefined),
        data: buildData(),
        width: 500,
        height: 400,
        rowHeaders: true,
        colHeaders: true,
        selectionMode: 'multiple',
        selectionHandles: true,
        moveCells: true,
        renderer: testIdRenderer,
        licenseKey: 'non-commercial-and-evaluation',
      }, overrides));

      return true;
    };

    // Toggles the beforeMoveCells veto for the veto tests.
    window.setBeforeMoveCellsVeto = (shouldVeto) => {
      window.vetoBeforeMoveCells = shouldVeto;

      return true;
    };

    // Toggles the beforeRowMove / beforeColumnMove vetoes for the move-undo tests.
    window.setBeforeRowMoveVeto = (shouldVeto) => {
      window.vetoBeforeRowMove = shouldVeto;

      return true;
    };

    window.setBeforeColumnMoveVeto = (shouldVeto) => {
      window.vetoBeforeColumnMove = shouldVeto;

      return true;
    };

    window.vetoBeforeMoveCells = false;
    window.initSelectionGrid();
  </script>
</body>
</html>
