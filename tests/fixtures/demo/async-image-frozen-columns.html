<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - image renderer in a scrolling column beside frozen columns</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD); an
    // unknown value THROWS rather than falling back, so a typo in the project config is one red
    // leg instead of a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    DEV-307: a renderer writes an <img> into a scrolling column. The image arrives after the draw
    measured the row, so the master row grows while the frozen overlay keeps the drawn height. The
    renderer rebuilds its <img> on every render, so a redraw that did not check the row height would
    loop. `window.renderCount` counts the draws.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    const variant = new URLSearchParams(location.search);

    container.className = `ht-theme-${window.htTheme}`;
    window.renderCount = 0;

    // An image arrives with the first `load` or `error` of its source: that is when its row can grow. A
    // renderer that recreates its images gets them again from the cache without growing a row, so later
    // events of a source do not count. The grid redraws at most once per animation frame for all the
    // arrivals in it (and only for a row whose height changed), so `contentBatches` counts the frames that
    // saw an arrival, and `drawsBeforeContent` the draws made before the first one. A frame is counted
    // here rather than a draw interval: a draw closes an interval, so a grid that drew once per arrival
    // would open a new interval with every arrival and pass.
    const arrivedSources = new Set();
    const arrivalFrames = new Set();
    let frame = 0;
    const countFrame = () => {
      frame += 1;
      requestAnimationFrame(countFrame);
    };

    requestAnimationFrame(countFrame);
    window.arrivedSources = arrivedSources;

    window.contentArrivals = 0;
    window.contentBatches = 0;
    window.drawsBeforeContent = null;

    const onContentArrival = (event) => {
      const src = event.target instanceof HTMLImageElement ? event.target.getAttribute('src') : null;

      if (src === null || arrivedSources.has(src)) {
        return;
      }

      arrivedSources.add(src);
      window.contentArrivals = arrivedSources.size;
      window.drawsBeforeContent ??= window.renderCount;

      arrivalFrames.add(frame);
      window.contentBatches = arrivalFrames.size;
    };

    // `load` and `error` do not bubble, so they are caught on the capture phase.
    container.addEventListener('load', onContentArrival, true);
    container.addEventListener('error', onContentArrival, true);

    // ?variant flags: headers=0 (no column headers), auto=1 (autoRowSize), end=1 (the image column
    // is frozen at the end), col=N (the image column, default 3), small=1 (images that barely grow a
    // row), broken=1 (images that fail), shared=1 (one failing URL for every row), reuse=1 (the renderer
    // keeps an image that already has the right source instead of recreating it), rows=N (default 6).
    const failing = variant.get('broken') === '1' || variant.get('shared') === '1';
    const imageSrc = row => (variant.get('shared') === '1'
      ? '/fixture-image/missing-shared.svg'
      : variant.get('broken') === '1'
        ? '/fixture-image/missing-' + row + '.svg'
        : '/fixture-image/' + row + '.svg' + (variant.get('small') === '1' ? '?small=1' : ''));

    function imageRenderer(instance, td, row, col, prop, value) {
      const src = imageSrc(row);
      const existing = td.querySelector('img');

      if (variant.get('reuse') === '1' && existing && existing.getAttribute('src') === src) {
        return;
      }

      td.innerHTML = '<img src="' + src + '" alt="' + (failing ? 'a long alternative text that wraps' : '') + '">';
    }

    window.hot = new Handsontable(container, {
      data: Array.from({ length: Number(variant.get('rows') ?? 6) }, (_, row) => ['r' + row, 'x', 'y', '']),
      width: 500,
      height: 400,
      colHeaders: variant.get('headers') !== '0',
      rowHeaders: true,
      autoRowSize: variant.get('auto') === '1',
      fixedColumnsStart: 2,
      fixedColumnsEnd: variant.get('end') === '1' ? 1 : 0,
      columns: [0, 1, 2, 3].map(index => (index === Number(variant.get('col') ?? 3) ?
        { renderer: imageRenderer, width: failing ? 60 : undefined } : {})),
      afterRender() {
        window.renderCount += 1;
      },
      licenseKey: 'non-commercial-and-evaluation',
    });
  </script>
</body>
</html>
