<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>limitFixedToViewport e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document, so there is no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back: a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    A 500 x 300 grid of 60 rows and 30 columns, 100px wide each, with `limitFixedToViewport` on. Nothing is
    frozen unless a query param asks for it: ?start=N, ?end=N, ?top=N and ?bottom=N freeze that many columns
    or rows. ?limit=0 turns the option off, ?rtl=1 lays the grid out right to left, ?win=1 lets the window
    scroll the rows (150 rows, automatic height), ?hidden=1 hides column 2, ?colw=N sets the width of every column,
    ?bar=1 turns the freezeBar plugin on, ?tall=1 wraps the text of the first column of the first 40 rows into tall rows, ?hide=1 builds the grid inside a hidden box (the page shows it later).
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    const flag = (name, fallback) => htParams.has(name) ? htParams.get(name) !== '0' : fallback;
    const count = name => Number(htParams.get(name) ?? 0);

    container.className = `ht-theme-${window.htTheme}`;

    const settings = {
      data: Handsontable.helper.createSpreadsheetData(60, 30),
      rowHeaders: true,
      colHeaders: true,
      colWidths: count('colw') || 100,
      width: 500,
      height: 300,
      fixedColumnsStart: count('start'),
      fixedColumnsEnd: count('end'),
      fixedRowsTop: count('top'),
      fixedRowsBottom: count('bottom'),
      limitFixedToViewport: flag('limit', true),
      layoutDirection: flag('rtl', false) ? 'rtl' : 'ltr',
      freezeBar: flag('bar', false),
      manualColumnMove: true,
      manualRowMove: true,
      licenseKey: 'non-commercial-and-evaluation',
    };

    if (flag('win', false)) {
      settings.data = Handsontable.helper.createSpreadsheetData(150, 30);
      settings.height = 'auto';
    }

    if (flag('hidden', false)) {
      settings.hiddenColumns = { columns: [2] };
    }

    window.viewRenders = 0;
    settings.afterViewRender = () => { window.viewRenders += 1; };

    if (flag('tall', false)) {
      // wrapped text makes the rows taller than the default height, which is only known once they are drawn
      settings.data = settings.data.map((row, index) => (
        index < 40 ? [row[0] + ' ' + 'lorem ipsum dolor sit amet '.repeat(6), ...row.slice(1)] : row
      ));
    }

    if (flag('hide', false)) {
      container.style.display = 'none';
    }

    try {
      window.hot = new Handsontable(container, settings);
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }
  </script>
</body>
</html>
