<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the autocomplete editor's choices list: a one-column grid that the page object rebuilds per
    test through `window.initGrid(overrides)`, which merges serializable overrides over the defaults below.
    Cells are stamped with data-testid="cell-<row>-<col>".

    A function-valued `source` cannot cross `page.evaluate()`, so `window.useFilteringSource(list)` installs one
    from inside the page: it answers synchronously with the entries whose text matches the query read as a
    case-insensitive regular expression, the way the sync sources of the legacy Jasmine cases did. The editor
    runs with `filter: false`, so the source alone decides which entries are listed and the editor only
    highlights the matching phrase in them.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    var container = document.querySelector('[data-testid="grid"]');

    container.className = 'ht-theme-' + window.htTheme;

    window.initGrid = function(overrides) {
      // The shared fixture contract: a constructor throw lands in `window.htBuildError`, which
      // `awaitFixtureBuilt()` and the page object rethrow with its stack. Cleared before each rebuild.
      delete window.htBuildError;

      try {
        if (window.hot) {
          window.hot.destroy();
        }

        window.hot = new Handsontable(container, Object.assign({
          data: [[null], [null], [null], [null], [null]],
          colWidths: 160,
          afterRenderer: function(td, row, col) {
            td.setAttribute('data-testid', 'cell-' + row + '-' + col);
          },
          licenseKey: 'non-commercial-and-evaluation',
        }, overrides || {}));
      } catch (error) {
        window.htBuildError = String((error && error.stack) || error);
        throw error;
      }

      return true;
    };

    // Rebuilds the grid with one autocomplete column whose source is a function listing the entries of `list`
    // that match the query read as a case-insensitive regular expression (not escaped on purpose: the cases
    // type `M|F` to prove the editor does not read the query that way when it highlights).
    window.useFilteringSource = function(list) {
      return window.initGrid({
        columns: [
          {
            editor: 'autocomplete',
            source: function(query, process) {
              process(list.filter(function(choice) {
                return choice.search(new RegExp(query, 'i')) !== -1;
              }));
            },
            filter: false,
          },
        ],
      });
    };

    window.initGrid();
  </script>
</body>
</html>
