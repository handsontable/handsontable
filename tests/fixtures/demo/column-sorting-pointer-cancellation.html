<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - column sorting pointer cancellation</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD) so the
    // fixture stays browsable by hand; an unknown value THROWS rather than falling back: a typo
    // in the project config must be one red leg, never a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    // `Object.hasOwn`, not a bare lookup: a plain object inherits `constructor`, `toString` and
    // `__proto__`, so `?theme=constructor` would resolve to a truthy inherited value, sail past the
    // guard below and be written into the document. Only the map's own keys are allowed.
    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick(
      { main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');
    // Which sorting plugin the grid runs: `column` (ColumnSorting), `multi` (MultiColumnSorting), or
    // `nested` (ColumnSorting under two header levels, the top one spanning two columns).
    window.htVariant = htPick(
      { column: 'column', multi: 'multi', nested: 'nested' }, htParams.get('variant'), 'column', 'variant');
    // `rtl` builds the grid right to left, `frozen` freezes the first two columns so their headers live
    // in an overlay clone, and `shadow` mounts the grid in a native open shadow root.
    window.htDirection = htPick({ ltr: 'ltr', rtl: 'rtl' }, htParams.get('dir'), 'ltr', 'dir');
    window.htFrozen = htPick({ off: false, on: true }, htParams.get('frozen'), 'off', 'frozen');
    window.htShadow = htPick({ off: false, on: true }, htParams.get('shadow'), 'off', 'shadow');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    Fixture for header sort pointer cancellation. A sort completes on the release over the header that
    was pressed, so the specs press a header and release over another header, over a body cell, and
    outside the grid.

    Data is seeded in descending order so an ascending sort visibly reorders the rows, cells carry
    data-testid="cell-<row>-<col>", and `window.sortCount` counts the sorts so a gesture that must not
    sort is asserted on the count: a header class cannot show a stray sort that lands on the same column.
  -->
  <div id="grid-host"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    // The grid lives in the light DOM, or in an open shadow root whose own stylesheets are linked
    // inside it, because document styles do not cross the boundary.
    const host = document.getElementById('grid-host');
    const mountPoint = window.htShadow ? host.attachShadow({ mode: 'open' }) : host;

    if (window.htShadow) {
      ['/handsontable/styles/handsontable.min.css', `/handsontable/styles/ht-theme-${window.htTheme}.min.css`]
        .forEach((href) => {
          const link = document.createElement('link');

          link.rel = 'stylesheet';
          link.href = href;
          mountPoint.appendChild(link);
        });
    }

    // A right to left grid sits in a right to left page, as a real RTL page does.
    if (window.htDirection === 'rtl') {
      document.documentElement.dir = 'rtl';
    }

    const container = document.createElement('div');

    container.setAttribute('data-testid', 'grid');
    container.className = `ht-theme-${window.htTheme}`;
    mountPoint.appendChild(container);

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    window.sortCount = 0;

    window.hot = new Handsontable(container, {
      data: [
        ['A5', 'B5', 'C5', 'D5'],
        ['A4', 'B4', 'C4', 'D4'],
        ['A3', 'B3', 'C3', 'D3'],
        ['A2', 'B2', 'C2', 'D2'],
        ['A1', 'B1', 'C1', 'D1'],
      ],
      colWidths: 120,
      colHeaders: true,
      rowHeaders: true,
      navigableHeaders: true,
      layoutDirection: window.htDirection,
      fixedColumnsStart: window.htFrozen ? 2 : 0,
      // A frozen grid is narrower than its columns, so it scrolls sideways and the frozen columns have
      // to be drawn by their overlay clones to stay in view.
      width: window.htFrozen ? 520 : undefined,
      height: window.htFrozen ? 240 : undefined,
      columnSorting: window.htVariant !== 'multi',
      multiColumnSorting: window.htVariant === 'multi',
      nestedHeaders: window.htVariant === 'nested' ? [
        ['Group 1', { label: 'Group 2', colspan: 2 }, 'Group 3'],
        ['A', 'B', 'C', 'D'],
      ] : false,
      renderer: testIdRenderer,
      afterColumnSort() {
        window.sortCount += 1;
      },
      // The test id is the header's text (`header-A`, `header-Group-2`), which a nested header level
      // and a spanning group share with the plain one.
      afterGetColHeader(col, TH) {
        TH.setAttribute('data-testid', `header-${TH.textContent.trim().replace(/\s+/g, '-')}`);
      },
      licenseKey: window.htTestLicenseKey,
    });
  </script>
</body>
</html>
