<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable license capabilities e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for license keys that name license tiers (`tier:<name>`). ?licenseKey= is the key the grid
    is built with. ?presets= is a JSON object of made-up tiers, each with the feature ids it lists: before
    the grid is built, every registered plugin's static LICENSE getter is redefined to add each made-up
    tier that lists its feature, so a key naming such a tier unlocks exactly those plugins, whatever the
    real tiers of the build hold. ?plugins= picks the options the grid asks for, through an allowlist; an
    unknown value throws. The keys are built by the spec (tests/fixtures/licenseTiers.ts) and are
    perpetual, so no state depends on the clock.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    /**
     * Adds the made-up tiers of ?presets= to the LICENSE of every registered plugin whose feature they
     * list. Each plugin class gets a getter of its own, and every original is read before any getter is
     * redefined, so a plugin that inherits its parent's getter starts from the original too.
     */
    function applyPresets() {
      const presets = JSON.parse(htParams.get('presets') ?? '{}');

      if (presets === null || typeof presets !== 'object' || Array.isArray(presets) ||
          Object.values(presets).some(features => !Array.isArray(features))) {
        throw new Error('?presets= must be a JSON object of tier names to feature id lists');
      }

      const registries = Handsontable._registries;
      const originals = registries.getPluginsNames()
        .map(name => [registries.getPlugin(name), registries.getPlugin(name).LICENSE])
        .filter(([, license]) => license && typeof license.capability === 'string' && Array.isArray(license.tiers));

      originals.forEach(([PluginClass, license]) => {
        const madeUp = Object.keys(presets).filter(tier => presets[tier].includes(license.capability));
        const patched = Object.freeze({ ...license, tiers: Object.freeze([...license.tiers, ...madeUp]) });

        Object.defineProperty(PluginClass, 'LICENSE', { configurable: true, get: () => patched });
      });
    }

    const PLUGIN_SETTINGS = {
      filters: { filters: true },
      'column-menu': { filters: true, dropdownMenu: true },
      // A checkbox column with a header checkbox, which the grid checks against the key while it renders.
      'header-checkbox': {
        data: [['Alpha', true], ['Beta', false], ['Gamma', true]],
        columns: [{}, { type: 'checkbox', headerCheckbox: true }],
      },
    };
    const pluginsName = htParams.get('plugins') ?? 'filters';

    if (!Object.prototype.hasOwnProperty.call(PLUGIN_SETTINGS, pluginsName)) {
      throw new Error('Unknown ?plugins= value: ' + JSON.stringify(pluginsName));
    }

    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    try {
      // Before the grid is built: a key's tiers are resolved against the plugins' LICENSE when it is first read.
      applyPresets();
      window.hot = new Handsontable(container, {
        data: [
          ['Alpha', 10],
          ['Beta', 20],
          ['Gamma', 30],
        ],
        colHeaders: ['Name', 'Value'],
        rowHeaders: true,
        width: 500,
        height: 200,
        licenseKey: htParams.get('licenseKey') ?? undefined,
        ...PLUGIN_SETTINGS[pluginsName],
      });
    } catch (error) {
      window.htBuildError = String(error && error.message || error);
      throw error;
    }

    // Read in the same task as the constructor, before any observer or frame: the height a page reads
    // right after building the grid.
    window.sizeAtConstruction = {
      barMounted: window.hot.rootSlotBottomElement.querySelector('.hot-display-license-info') !== null,
      outerHeight: window.hot.rootElement.offsetHeight +
        window.hot.rootSlotTopElement.offsetHeight +
        window.hot.rootSlotBottomElement.offsetHeight,
    };
  </script>
</body>
</html>
