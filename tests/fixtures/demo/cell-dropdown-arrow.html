<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cell dropdown arrow fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);
    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    window.htCellType = ({
      autocomplete: 'autocomplete', dropdown: 'dropdown', handsontable: 'handsontable',
      multiselect: 'multiselect', text: 'text', select: 'select',
    })[htParams.get('cellType') ?? 'autocomplete'];
    if (!window.htCellType) {
      throw new Error('Unknown ?cellType= value: ' + JSON.stringify(htParams.get('cellType')));
    }
  </script>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // `?source=200` gives `autocomplete` and `dropdown` 200 choices (`Al 001` to `Al 200`), so the list
    // scrolls and an option a spec moves to is rendered only after that scroll. Every choice starts
    // with the seeded `Al`, so `autocomplete`, which filters by the cell value, lists them all.
    // `?source=async` gives them the same three choices through a function `source` that answers only
    // when a spec calls `htResolveQueries()`, so a spec can let a response land after the editor closed.
    const sourceMode = ({ 200: 'long', async: 'async' })[htParams.get('source') ?? ''] ?? null;
    if (htParams.has('source') && sourceMode === null) {
      throw new Error('Unknown ?source= value: ' + JSON.stringify(htParams.get('source')));
    }
    const longSource = sourceMode === 'long';
    // `?allowHtml=true` turns `allowHtml` on for `autocomplete` and `dropdown` and wraps each choice in
    // markup, so a spec can tell the text a choice shows from its raw HTML.
    const allowHtml = ({ true: true, false: false })[htParams.get('allowHtml') ?? 'false'];
    if (allowHtml === undefined) {
      throw new Error('Unknown ?allowHtml= value: ' + JSON.stringify(htParams.get('allowHtml')));
    }
    const PLAIN_CHOICES = longSource
      ? Array.from({ length: 200 }, (unused, i) => `Al ${String(i + 1).padStart(3, '0')}`)
      : ['Alpha', 'Alfa', 'Alto'];
    const CHOICES = allowHtml ? PLAIN_CHOICES.map(choice => `<b>${choice}</b>`) : PLAIN_CHOICES;

    window.htPendingQueries = [];

    /**
     * Answers every query still waiting, oldest first, and returns how many it answered.
     */
    window.htResolveQueries = function() {
      const pending = window.htPendingQueries.filter(entry => !entry.resolved);

      pending.forEach((entry) => {
        entry.resolved = true;
        entry.process(CHOICES);
      });

      return pending.length;
    };

    const listSource = sourceMode === 'async'
      ? function(query, process) {
        window.htPendingQueries.push({ query, process, resolved: false });
      }
      : CHOICES;

    // `?ariaTags=false` turns the grid's ARIA off, which the list editors must follow.
    const ariaTags = htParams.get('ariaTags') !== 'false';

    // Three of the four cell types render the SAME arrow: `dropdownRenderer` and
    // `handsontableRenderer` both delegate to `autocompleteRenderer`, which is where
    // `htAutocompleteArrow` and its `mousedown` listener come from. They configure their choices
    // differently though - `autocomplete` and `dropdown` take a flat `source`, while `handsontable`
    // takes a whole nested grid config - which is why this fixture exists instead of a third value
    // on the async-source fixture, whose `source` is a query recorder that a nested grid would
    // never call.
    //
    // `multiselect` is the fourth, and it reaches a DIFFERENT element and listener:
    // `.ht-multi-select-arrow`, built by `multiSelectRenderer`. It is covered here anyway so the
    // affordance shared by every list cell type has one home (#13316).
    // `?strict=true` makes the `autocomplete` column strict, so the list highlights the choice the typed
    // text completes to while it still narrows the list. It makes the `handsontable` column strict too,
    // whose list then opens with its first row highlighted.
    const strict = ({ true: true, false: false })[htParams.get('strict') ?? 'false'];
    if (strict === undefined) {
      throw new Error('Unknown ?strict= value: ' + JSON.stringify(htParams.get('strict')));
    }

    // `?enterMoves=stay` keeps the selection on the edited cell after Enter commits.
    const enterMoves = ({ stay: { row: 0, col: 0 } })[htParams.get('enterMoves') ?? ''];
    if (htParams.has('enterMoves') && enterMoves === undefined) {
      throw new Error('Unknown ?enterMoves= value: ' + JSON.stringify(htParams.get('enterMoves')));
    }

    // `?validator=held` gives the column a validator that answers only when a spec calls
    // `htReleaseValidations()`, so the editor waits for the answer as long as the spec needs.
    // `?validator=pass` gives it one that accepts every value at once, and `?validator=reject` one that rejects
    // every value at once, with `allowInvalid: false`, so a commit reopens the editor.
    const validatorMode = ({ held: 'held', pass: 'pass', reject: 'reject' })[htParams.get('validator') ?? ''] ?? null;
    if (htParams.has('validator') && validatorMode === null) {
      throw new Error('Unknown ?validator= value: ' + JSON.stringify(htParams.get('validator')));
    }
    window.htHeldValidations = [];
    window.htReleaseValidations = function() {
      const held = window.htHeldValidations.splice(0);

      held.forEach(callback => callback(true));

      return held.length;
    };
    const heldValidator = function(value, callback) {
      window.htHeldValidations.push(callback);
    };
    // `?outsideClickDeselects=false` keeps the selection when a press lands outside the grid.
    const outsideClickDeselects = ({ true: true, false: false })[htParams.get('outsideClickDeselects') ?? 'true'];
    if (outsideClickDeselects === undefined) {
      throw new Error('Unknown ?outsideClickDeselects= value: ' + JSON.stringify(htParams.get('outsideClickDeselects')));
    }
    // `?contextMenu=true` turns the context menu on, a surface in the grid's portal.
    const contextMenu = ({ true: true, false: false })[htParams.get('contextMenu') ?? 'false'];
    if (contextMenu === undefined) {
      throw new Error('Unknown ?contextMenu= value: ' + JSON.stringify(htParams.get('contextMenu')));
    }

    // `?imeFastEdit=true` turns `imeFastEdit` on, so the browser focus rests on the editor's field, not on the
    // selected cell, between edits.
    const imeFastEdit = ({ true: true, false: false })[htParams.get('imeFastEdit') ?? 'false'];
    if (imeFastEdit === undefined) {
      throw new Error('Unknown ?imeFastEdit= value: ' + JSON.stringify(htParams.get('imeFastEdit')));
    }

    // `?columns=2` gives the `handsontable` column's list a second column (`Alpha` | `Alpha code`), so a
    // spec can move across the list's columns.
    const listColumns = ({ 1: 1, 2: 2 })[htParams.get('columns') ?? '1'];
    if (listColumns === undefined) {
      throw new Error('Unknown ?columns= value: ' + JSON.stringify(htParams.get('columns')));
    }
    // `?innerAria=false` sets `ariaTags: false` in the `handsontable` column's own list settings, which
    // win over the defaults the editor gives its list.
    const innerAria = ({ true: true, false: false })[htParams.get('innerAria') ?? 'true'];
    if (innerAria === undefined) {
      throw new Error('Unknown ?innerAria= value: ' + JSON.stringify(htParams.get('innerAria')));
    }
    // `?dir=rtl` builds a right-to-left grid in a right-to-left document.
    const layoutDirection = ({ ltr: 'ltr', rtl: 'rtl' })[htParams.get('dir') ?? 'ltr'];
    if (layoutDirection === undefined) {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(htParams.get('dir')));
    }
    if (layoutDirection === 'rtl') {
      document.documentElement.dir = 'rtl';
    }
    const handsontableList = {
      data: CHOICES.map(choice => (listColumns === 2 ? [choice, `${choice} code`] : [choice])),
      ...(innerAria ? {} : { ariaTags: false }),
    };

    const columnByCellType = {
      autocomplete: { type: 'autocomplete', source: listSource, strict, allowHtml },
      dropdown: { type: 'dropdown', source: listSource, allowHtml },
      handsontable: { type: 'handsontable', handsontable: handsontableList, ...(strict ? { strict } : {}) },
      multiselect: { type: 'multiselect', source: CHOICES },
      // `text` is the control the list editors' focus after a commit is compared with.
      text: { type: 'text' },
      // `select` edits in a native `<select>`, an editor without the text editors' field.
      select: { editor: 'select', selectOptions: PLAIN_CHOICES },
    };

    const validatorByMode = {
      held: heldValidator,
      pass: (value, callback) => callback(true),
      reject: (value, callback) => callback(false),
    };
    const column = validatorMode === null
      ? columnByCellType[window.htCellType]
      : {
        ...columnByCellType[window.htCellType],
        validator: validatorByMode[validatorMode],
        ...(validatorMode === 'reject' ? { allowInvalid: false } : {}),
      };

    // A fresh value per cell: `multiselect` stores an array, and sharing one instance across cells
    // would let a chip removal in one cell show up in the others.
    const seed = () => (window.htCellType === 'multiselect' ? ['Alpha'] : 'Al');

    // Rows 0 and 1 are seeded so the column is not at its default minimum width, which is the width
    // where a centred click lands on the arrow. Cases here address the arrow directly, so this only
    // keeps an ordinary cell click available as a control. Row 2 is left empty on purpose: an empty
    // list cell is where a missing indicator shows most, and it is the state `multiselect` used to
    // render completely blank.
    // `?frozen=1` freezes the first column and adds enough plain columns to scroll past it, so a
    // spec can reach the state where the frozen cell exists ONLY in the inline-start overlay clone
    // and no longer in the master table's rendered range. Absent, the grid is exactly the two-column
    // one every other case here measures against — the param must not move their geometry.
    const frozen = htParams.get('frozen') === '1';
    const filler = frozen
      ? Array.from({ length: 8 }, () => ({}))
      : [];
    const fillerCell = frozen ? Array.from({ length: 8 }, (unused, i) => `f${i}`) : [];

    // `?overflow=1` puts more chips in a `multiselect` cell than a fixed narrow column can show, so
    // the renderer hides the ones that do not fit and adds the `+N` badge. That is the only state
    // where the indicator's width reservation is observable: with a single chip there is slack, and
    // a chip can sit under the indicator without any assertion noticing. Only meaningful for
    // `multiselect` — the other three cell types render text, not chips.
    const overflow = htParams.get('overflow') === '1';
    const OVERFLOW_VALUES = ['Alpha', 'Alfa', 'Alto', 'Alpine', 'Almond', 'Altair'];

    // Each mode below builds one grid. Every branch keeps the same `afterRenderer` test ids, so the
    // page object addresses cells identically whichever mode is on.
    const settings = overflow
      ? {
        data: [[OVERFLOW_VALUES.slice()], [OVERFLOW_VALUES.slice()]],
        columns: [{ type: 'multiselect', source: OVERFLOW_VALUES }],
        colWidths: 200,
      }
      : {
        data: [
          [seed(), seed(), ...fillerCell],
          [seed(), seed(), ...fillerCell],
          [null, null, ...fillerCell],
        ],
        columns: [column, column, ...filler],
        ...(frozen ? { fixedColumnsStart: 1, colWidths: 140, width: 420, height: 260 } : {}),
      };

    window.hot = new Handsontable(container, {
      ...settings,
      ariaTags,
      ...(layoutDirection === 'rtl' ? { layoutDirection } : {}),
      ...(enterMoves ? { enterMoves } : {}),
      ...(contextMenu ? { contextMenu: true } : {}),
      ...(outsideClickDeselects ? {} : { outsideClickDeselects: false }),
      ...(imeFastEdit ? { imeFastEdit: true } : {}),
      colHeaders: true,
      rowHeaders: true,
      // Stamp test ids from `afterRenderer`, not from a grid-level `renderer`: a column `type`
      // installs its own renderer, which would override the grid-level one and leave the typed
      // columns with no test id at all.
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: window.htTestLicenseKey,
    });
  </script>
</body>
</html>
