<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable FormulaBuilder e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The grid variant, through the same kind of allowlist: the name maps to a literal key of
    // the VARIANTS table below, and an unknown value throws. An absent param is the default grid.
    window.htVariant = ({
      default: 'default',
      sorting: 'sorting',
      nested: 'nested',
      'popups-host': 'popups-host',
      'no-aria': 'no-aria',
      rtl: 'rtl',
      frozen: 'frozen',
      'hidden-row': 'hidden-row',
      'read-only': 'read-only',
    })[htParams.get('variant') ?? 'default'];
    if (!window.htVariant) {
      throw new Error('Unknown ?variant= value: ' + JSON.stringify(htParams.get('variant')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    /* The FormulaBuilder adapter clips its highlight overlay via overflow:hidden
       on the grid root, which makes Handsontable treat the container as
       size-defined - so the fixture gives it an explicit height, as real
       integrations do. */
    #grid { height: 320px; }
  </style>
</head>
<body>
  <!--
    FormulaBuilder plugin e2e fixture. Cells are stamped with data-testid via a
    renderer (data-testid="cell-<row>-<col>"). The hyperformula-ui module is loaded as
    a native ES module from this package's own node_modules (`tests/package.json`
    pins `hyperformula-ui`, so CI installs it with the `handsontable-tests`
    workspace) and injected into the plugin via the `builder` setting.

    `?variant=` picks one of the grid configurations in VARIANTS; an absent param is
    the default grid (formula bar on, formulas in column C), which the a11y scan uses too.
    The text field before the grid is where a keyboard user starts: Tab from it enters
    the formula bar, and Shift+Tab out of the bar lands back on it. It is a text field,
    not a link or a button, because WebKit leaves those out of the Tab order by default.
  -->
  <input type="text" aria-label="Before the grid" data-testid="before-grid">
  <div id="grid" data-testid="grid"></div>
  <div id="suggestions-host" data-testid="suggestions-host"></div>

  <script>
    // The full bundle bakes HyperFormula in; the base bundle needs it as an external script.
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script type="module">
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // Settings each variant adds over the default grid. `formulaBuilder` extras are merged
    // into the plugin settings, so the `builder` module stays the one imported below.
    const VARIANTS = {
      default: {},
      sorting: { settings: { columnSorting: true } },
      nested: {
        settings: {
          colHeaders: false,
          columnSorting: true,
          nestedHeaders: [
            [{ label: 'Inputs', colspan: 2 }, 'Sum'],
            ['A', 'B', 'C'],
          ],
        },
      },
      'popups-host': { formulaBuilder: { popups: { suggestions: { container: '#suggestions-host' } } } },
      'no-aria': { settings: { ariaTags: false } },
      rtl: { settings: { layoutDirection: 'rtl' } },
      frozen: { settings: { fixedRowsTop: 1, fixedColumnsStart: 1 } },
      'hidden-row': { settings: { hiddenRows: { rows: [1] } } },
      'read-only': { settings: { cell: [{ row: 0, col: 2, readOnly: true }] } },
    };

    // The shared fixture contract: a failed module import or a constructor throw lands in
    // `window.htBuildError`, which `awaitFixtureBuilt()` rethrows with its stack.
    try {
      const FormulaBuilderModule = await import('/tests/node_modules/hyperformula-ui/dist/index.js');
      const variant = VARIANTS[window.htVariant];

      window.FormulaBuilderModule = FormulaBuilderModule;
      window.hot = new Handsontable(container, Object.assign({
        data: [
          [1, 2, '=A1+B1'],
          [3, 4, '=A2+B2'],
          [5, 6, '=SUM(C1:C2)'],
          ['', '', ''],
          ['', '', '=IF(\n  A1>0,\n  "yes",\n  "no"\n)'],
        ],
        colHeaders: true,
        rowHeaders: true,
        renderer: testIdRenderer,
        editor: 'formula',
        formulas: {
          engine: HyperFormula,
        },
        formulaBuilder: Object.assign({
          builder: FormulaBuilderModule,
          showFormulaBar: true,
        }, variant.formulaBuilder || {}),
        licenseKey: 'non-commercial-and-evaluation',
      }, variant.settings || {}));
    } catch (error) {
      window.htBuildError = String((error && error.stack) || error);
      throw error;
    }
  </script>
</body>
</html>
