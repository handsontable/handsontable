<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - clear column with collapsed nested rows</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }

    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[
      htParams.get('bundle') ?? 'umd'
    ];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }

    // `nested` (default) - the DEV-150 tree; `custom` - the same tree with a user callback under the
    // `clear_column` key; `formulas` - the same tree with numbers and a formula per row reading them;
    // `numeric` - the same tree with numbers in a `type: 'numeric'` Value column, so every write to
    // it is validated; `trim` - a flat grid with TrimRows instead of Nested Rows.
    window.htMode = ({ nested: 'nested', custom: 'custom', formulas: 'formulas', numeric: 'numeric', trim: 'trim' })[
      htParams.get('mode') ?? 'nested'
    ];
    if (!window.htMode) {
      throw new Error('Unknown ?mode= value: ' + JSON.stringify(htParams.get('mode')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <div id="grid" data-testid="grid"></div>

  <script>
    // HyperFormula comes from THIS package's own node_modules, on the base-bundle legs only:
    // handsontable.full.min.js sets `window.HyperFormula` itself.
    if (window.htMode === 'formulas' && window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    container.className = `ht-theme-${window.htTheme}`;

    const COLUMN_HEADERS = ['Name', 'Value', 'Note'];

    // Physical rows: 0 P1, 1 C1.1, 2 C1.2 (read-only value), 3 C1.3, 4 G1.3.1, 5 G1.3.2,
    // 6 P2, 7 C2.1, 8 C2.2, 9 L3.
    const nestedData = () => [
      {
        name: 'P1', value: 'p1', note: 'n-p1',
        __children: [
          { name: 'C1.1', value: 'c11', note: 'n-c11' },
          { name: 'C1.2', value: 'c12', note: 'n-c12' },
          {
            name: 'C1.3', value: 'c13', note: 'n-c13',
            __children: [
              { name: 'G1.3.1', value: 'g131', note: 'n-g131' },
              { name: 'G1.3.2', value: 'g132', note: 'n-g132' },
            ],
          },
        ],
      },
      {
        name: 'P2', value: 'p2', note: 'n-p2',
        __children: [
          { name: 'C2.1', value: 'c21', note: 'n-c21' },
          { name: 'C2.2', value: 'c22', note: 'n-c22' },
        ],
      },
      { name: 'L3', value: 'l3', note: 'n-l3' },
    ];

    // The same tree with a number in `value` and, in `note`, a formula reading it ten times over -
    // `B<n>` is the row's own value, because the engine sheet holds the flattened tree.
    const formulasData = () => {
      const numbers = { P1: 1, 'C1.1': 11, 'C1.2': 12, 'C1.3': 13, 'G1.3.1': 131, 'G1.3.2': 132, P2: 2, 'C2.1': 21, 'C2.2': 22, L3: 3 };
      let physicalRow = 0;
      const convert = nodes => nodes.map((node) => {
        physicalRow += 1;

        const row = { name: node.name, value: numbers[node.name], note: `=B${physicalRow}*10` };

        if (node.__children) {
          row.__children = convert(node.__children);
        }

        return row;
      });

      return convert(nestedData());
    };

    // The same tree with the physical row number plus one in `value`.
    const numericData = () => {
      let physicalRow = 0;
      const convert = nodes => nodes.map((node) => {
        physicalRow += 1;

        const row = { ...node, value: physicalRow };

        if (node.__children) {
          row.__children = convert(node.__children);
        }

        return row;
      });

      return convert(nestedData());
    };

    const flatData = () => [
      { name: 'R0', value: 'r0', note: 'n-r0' },
      { name: 'R1', value: 'r1', note: 'n-r1' },
      { name: 'R2', value: 'r2', note: 'n-r2' },
      { name: 'R3', value: 'r3', note: 'n-r3' },
    ];

    window.hookLog = [];
    window.customClearCalls = [];

    const testIdRenderer = function(instance, td, row, col) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const settings = {
      data: ({ trim: flatData, formulas: formulasData, numeric: numericData })[window.htMode]?.() ?? nestedData(),
      columns: [
        { data: 'name' },
        window.htMode === 'numeric' ? { data: 'value', type: 'numeric' } : { data: 'value' },
        { data: 'note' },
      ],
      colHeaders: COLUMN_HEADERS,
      rowHeaders: true,
      manualColumnMove: true,
      dropdownMenu: true,
      contextMenu: ['clear_column'],
      undo: true,
      renderer: testIdRenderer,
      height: 'auto',
      licenseKey: 'non-commercial-and-evaluation',
      afterGetRowHeader(row, TH) {
        TH.setAttribute('data-testid', `row-header-${row}`);
      },
      afterGetColHeader(column, TH) {
        if (column >= 0) {
          TH.setAttribute('data-testid', `header-${COLUMN_HEADERS[this.toPhysicalColumn(column)]}`);
        }
      },
    };

    if (window.htMode === 'trim') {
      settings.trimRows = [1, 2];

    } else {
      settings.nestedRows = true;
      // `cells` receives the physical row, so the read-only flag stays on C1.2 whatever is collapsed.
      settings.cells = (row, col, prop) => (row === 2 && prop === 'value' ? { readOnly: true } : {});
    }

    if (window.htMode === 'formulas') {
      settings.formulas = { engine: HyperFormula };
    }

    if (window.htMode === 'custom') {
      settings.dropdownMenu = {
        items: {
          clear_column: {
            callback() {
              window.customClearCalls.push(this.countRows());
            },
          },
        },
      };
    }

    // Fail loud: a constructor throw is reported to `goto()`, which rethrows it, instead of
    // surfacing as a timeout on the first header wait.
    try {
      window.hot = new Handsontable(container, settings);

      ['beforeRowCollapse', 'afterRowCollapse', 'beforeRowExpand', 'afterRowExpand', 'afterDeselect'].forEach((hook) => {
        window.hot.addHook(hook, () => window.hookLog.push(hook));
      });
      window.hot.addHook('afterChange', (changes, source) => {
        if (changes) {
          window.hookLog.push(`afterChange:${source}:${changes.length}`);
        }
      });
      window.hot.addHook('afterSetSourceDataAtCell', (changes, source) => {
        window.hookLog.push(`afterSetSourceDataAtCell:${source}:${changes.length}`);
      });
    } catch (error) {
      window.htFixtureError = error && error.message ? error.message : String(error);
    }
  </script>
</body>
</html>
