<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <!--
    Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright projects, mapped
    through fixed allowlists to literals, so a crafted param is never reflected into the document. An
    absent param keeps the default (main, plain UMD); an unknown value throws, so a typo in the project
    config is one red leg. The themed stylesheet is written into the head so it applies before the first
    render, and the bundle is picked from the same allowlist (umd = handsontable.js, full-min =
    handsontable.full.min.js). The bundle's closing script tag is split so the parser does not end the
    block that writes it.
  -->
  <script>
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    A two-sheet workbook, 'Alpha' and 'Beta', three columns each, with ImportFile on. The file input
    imports the picked workbook into the visible sheet with its styles, and the status counts the
    imports that finished. Cells carry a `cell-<row>-<col>` test id from an `afterRenderer` hook.
  -->
  <input type="file" data-testid="import-input" accept=".xlsx">
  <output data-testid="status">0</output>
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const rows = () => [['a1', 'b1', 'c1'], ['a2', 'b2', 'c2'], ['a3', 'b3', 'c3']];
    const settings = {
      rowHeaders: true,
      colHeaders: true,
      width: 700,
      height: 360,
      importFile: true,
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      sheetsBar: {
        sheets: [
          { name: 'Alpha', data: rows() },
          { name: 'Beta', data: rows() },
        ],
      },
      licenseKey: 'non-commercial-and-evaluation',
    };

    try {
      window.hot = new Handsontable(container, settings);
    } catch (error) {
      window.htBuildError = String((error && error.stack) || error);
      throw error;
    }

    const hot = window.hot;

    const status = document.querySelector('[data-testid="status"]');
    const input = document.querySelector('[data-testid="import-input"]');

    input.addEventListener('change', async() => {
      const [file] = input.files;

      input.value = '';
      await hot.getPlugin('importFile').importFromBlob('xlsx', file, { importStyles: true });
      status.textContent = String(Number(status.textContent) + 1);
    });

    const stampBar = () => {
      document.querySelectorAll('.ht-sheets-bar__tab').forEach((tab, index) => {
        tab.setAttribute('data-testid', `sheet-tab-${index}`);
      });
    };

    stampBar();
    new MutationObserver(stampBar).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
