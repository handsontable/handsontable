<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — overlay alignment under CSS zoom</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD) so the
    // fixture stays browsable by hand; an unknown value THROWS rather than falling back — a typo
    // in the project config must be one red leg, never a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    // `Object.hasOwn`, not a bare lookup: a plain object inherits `constructor`, `toString` and
    // `__proto__`, so `?theme=constructor` would resolve to a truthy inherited value, sail past the
    // guard below and be written into the document - the silently mislabeled leg this is meant to
    // prevent. Only the map's own keys are allowed.
    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick(
      { main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');

    // Page zoom through CSS `zoom` on the root element, the mechanism `row-height-device-scale.html`
    // and `auto-height-scrollbar-zoom.html` use and for the same reasons: Chrome routes it through
    // the effective-zoom machinery that snaps the cells' 1px border to whole device pixels, a
    // `--force-device-scale-factor` launch flag needs `viewport: null` (which every project's
    // `devices['Desktop Chrome']` forbids), and Playwright's context `deviceScaleFactor` reports
    // the ratio without ever touching the border, so a test built on it passes on unfixed code.
    //
    // `?zoom=` is applied BEFORE the grids are constructed, so their first render measures zoomed
    // cells. `applyZoom()` below changes it afterwards, which is what the retired visual spec did.
    const htZoom = Number(htParams.get('zoom') ?? '1');

    if (!Number.isFinite(htZoom) || htZoom <= 0 || htZoom > 4) {
      throw new Error('Unknown ?zoom= value: ' + JSON.stringify(htParams.get('zoom')));
    }

    window.htZoom = htZoom;
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    /* Wide enough for the row header plus eight 100px columns on every theme, so the whole
       table renders without a horizontal scrollbar, and still inside a 1280px viewport at 125%. */
    #wrap { width: 960px; }
    .grid { margin-bottom: 2rem; }
  </style>
</head>
<body>
  <!--
    The grid is several tables painted over each other: the master holds every cell, and each
    overlay (the column headers, the row headers, the frozen rows, and the corners where they meet)
    is a separate table positioned over the master's cells. They stay aligned only while each table
    lays its rows and columns out to the same pixels, and page zoom is where that can break: the
    browser snaps borders and row heights to device pixels per table, so a height rule that differs
    between a header cell and a data cell shows up as row headers drifting from their rows once the
    page is zoomed. #11465 was that shape — the first body row's `th` was declared a pixel shorter
    than its `td` — and shipped with a screenshot of the complex demo at 125% as its only check.

    Two grids, both with the complex demo's layout: four levels of nested column headers, a merged
    block, a row frozen at the top and two at the bottom, and row headers. The first also freezes a
    column, as the demo does. The second does not, and that is the one the #11465 shape can move: a
    table row is as tall as its tallest cell, so a `th` beside a `td` takes the `td`'s height and the
    split hides — only a row-header overlay whose rows hold a `th` alone renders the shorter rule.
    The height is left to the rows, so the whole table is in the DOM and every overlay row has a
    master row underneath to compare with.
  -->
  <div id="wrap">
    <div id="grid-frozen-column" class="grid" data-testid="grid-frozen-column"></div>
    <div id="grid-row-headers-only" class="grid" data-testid="grid-row-headers-only"></div>
  </div>

  <script>
    // Before the bundle loads, so the first render already measures the zoomed cell.
    document.documentElement.style.zoom = String(window.htZoom);
  </script>
  <script>
    // The bundle under test, selected above from the sanitized allowlist. The closing tag is split
    // so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const ROWS = 30;
    const COLUMNS = 8;

    // How many times each grid has drawn itself. A zoom applied after construction may or may not
    // make a grid redraw; a spec reads this to know which state it is measuring.
    window.renderCounts = {};

    /**
     * Build one grid. A constructor that throws stamps its message on the container instead of
     * taking the whole page down, so a failure reads as the real error rather than a bare
     * "element not visible".
     */
    function build(testId, settings) {
      const container = document.querySelector(`[data-testid="${testId}"]`);

      container.className = `grid ht-theme-${window.htTheme}`;
      window.renderCounts[testId] = 0;

      try {
        return new Handsontable(container, Object.assign({
          data: Handsontable.helper.createSpreadsheetData(ROWS, COLUMNS),
          colHeaders: true,
          rowHeaders: true,
          colWidths: 100,
          nestedHeaders: [
            ['A', { label: 'B', colspan: 6 }, 'C'],
            ['D', { label: 'E', colspan: 3 }, { label: 'F', colspan: 3 }, 'G'],
            ['H', { label: 'I', colspan: 2 }, 'J', { label: 'K', colspan: 2 }, 'L', 'M'],
            ['Col 0', 'Col 1', 'Col 2', 'Col 3', 'Col 4', 'Col 5', 'Col 6', 'Col 7'],
          ],
          mergeCells: [{ row: 1, col: 3, rowspan: 2, colspan: 2 }],
          fixedRowsTop: 1,
          // Two, not the demo's one: the bottom overlay's FIRST row draws its own top border (no
          // header row above it in that table), so its box is one border taller than the master's
          // copy by design, and only a second frozen row gives that overlay a row whose height can
          // be compared with the master's.
          fixedRowsBottom: 2,
          // Defeat row virtualization: an auto-height grid still renders only the rows near the
          // window's viewport, and every overlay row needs a master row underneath it.
          viewportRowRenderingOffset: ROWS + 10,
          afterViewRender() {
            window.renderCounts[testId] += 1;
          },
          licenseKey: 'non-commercial-and-evaluation',
        }, settings));
      } catch (error) {
        container.setAttribute('data-init-error', String(error && error.message));

        return null;
      }
    }

    window.hots = {
      'grid-frozen-column': build('grid-frozen-column', { fixedColumnsStart: 1 }),
      'grid-row-headers-only': build('grid-row-headers-only', {}),
    };

    window.htRowCount = ROWS;

    /**
     * Changes the page zoom after the grids have been built, the way the retired visual spec did
     * (`document.body.style = "zoom: 1.25"` on the loaded complex demo).
     *
     * @param {number} zoom The CSS zoom to apply.
     */
    window.applyZoom = function(zoom) {
      document.documentElement.style.zoom = String(zoom);
      window.htZoom = zoom;
    };
  </script>
</body>
</html>
