<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cell description e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    The accessible description of a cell that holds more than its text. Row 0 holds a plain value (A1), a
    read-only cell (B1), a link made by autoLink (C1) and a read-only formula (D1, `=SUM(1,2)`); row 3 holds a formula that returns the link of C1 (C4) and a
    `HYPERLINK` formula (D4), so a spec can
    prove each part and their combination in one name. A2:B3 is one merged block. `?readonlygrid=on` makes
    every cell read only, `?comment=on` comments B1 (a read-only commented cell: the Comments indicator is the
    cell's `::after` too), `?headers=off`, `?ariaTags=off`, `?render=onChange` and `?dir=rtl` build the other layouts the
    description has to survive. Every leg runs exactly ONE engine: the `umd` legs load HyperFormula as an
    external script; the `full-min` legs use the engine baked into the bundle.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    // Same fail-loud allowlists as the theme: an absent param keeps the default, an unknown value throws.
    const ariaTags = ({ on: true, off: false })[htParams.get('ariaTags') ?? 'on'];

    if (ariaTags === undefined) {
      throw new Error('Unknown ?ariaTags= value: ' + JSON.stringify(htParams.get('ariaTags')));
    }

    const renderModeByParam = { default: 'all', onChange: 'onChange' };
    const renderParam = htParams.get('render') ?? 'default';

    if (!Object.hasOwn(renderModeByParam, renderParam)) {
      throw new Error('Unknown ?render= value: ' + JSON.stringify(renderParam));
    }

    const directionParam = htParams.get('dir') ?? 'ltr';

    if (directionParam !== 'ltr' && directionParam !== 'rtl') {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(directionParam));
    }

    document.documentElement.dir = directionParam;

    const flagParam = (name) => {
      const value = htParams.get(name) ?? 'off';

      if (value !== 'on' && value !== 'off') {
        throw new Error('Unknown ?' + name + '= value: ' + JSON.stringify(value));
      }

      return value === 'on';
    };
    const withComment = flagParam('comment');
    const readOnlyGrid = flagParam('readonlygrid');
    // `?headers=off` builds the grid without column and row headers, so a cell has no header reference to join.
    const hasHeaders = !htParams.has('headers') || flagParam('headers');

    container.className = `ht-theme-${window.htTheme}`;

    window.hot = new Handsontable(container, {
      data: [
        ['plain', 'locked', 'https://example.com/one', '=SUM(1,2)'],
        ['merged', '', 'x', 'y'],
        ['', '', 'a', 'b'],
        ['c', 'd', '=C1', '=HYPERLINK("https://example.com/hf", "HF label")'],
      ],
      formulas: {
        engine: HyperFormula,
        sheetName: 'Sheet1',
        hyperlinks: true,
      },
      autoLink: true,
      mergeCells: [{ row: 1, col: 0, rowspan: 2, colspan: 2 }],
      width: 500,
      height: 200,
      rowHeaders: hasHeaders,
      colHeaders: hasHeaders,
      readOnly: readOnlyGrid,
      ariaTags,
      layoutDirection: directionParam,
      comments: withComment,
      cell: [
        { row: 0, col: 1, readOnly: true, ...(withComment ? { comment: { value: 'A note' } } : {}) },
        { row: 0, col: 3, readOnly: true },
      ],
      renderMode: renderModeByParam[renderParam],
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: window.htTestLicenseKey,
    });
  </script>
</body>
</html>
