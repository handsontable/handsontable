<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu viewport clamp e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme, bundle, direction, and page width come from the ?theme=/?bundle=/?dir=/?page= query params,
    // mapped through fixed allowlists to LITERALS so a crafted param can never be reflected into the
    // document — no XSS. An ABSENT param keeps the default (main / plain UMD / ltr / fit) so the fixture
    // stays browsable by hand; an unknown value THROWS instead of falling back — a typo in the project
    // config must be one red leg, never a silently mislabeled green one (nothing else asserts which
    // file loaded).
    const htParams = new URLSearchParams(location.search);

    // Null-prototype maps, so an inherited key ('constructor', 'toString', ...) cannot pass as a value.
    const htThemes = Object.assign(Object.create(null), { main: 'main', horizon: 'horizon', classic: 'classic' });
    const htBundles = Object.assign(Object.create(null), { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' });
    const htDirections = Object.assign(Object.create(null), { ltr: 'ltr', rtl: 'rtl' });
    const htPages = Object.assign(Object.create(null), { fit: 'fit', wide: 'wide' });

    window.htTheme = htThemes[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = htBundles[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The direction of the DOCUMENT; the grid follows it (`layoutDirection: 'inherit'`).
    window.htDirection = htDirections[htParams.get('dir') ?? 'ltr'];
    if (!window.htDirection) {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(htParams.get('dir')));
    }
    document.documentElement.setAttribute('dir', window.htDirection);
    // `wide` makes the page 3000px wide and tall with the grid 1000px in from its inline start and top, so
    // the WINDOW can scroll to the grid on both axes and a menu's position is measured in a scrolled page.
    window.htPage = htPages[htParams.get('page') ?? 'fit'];
    if (!window.htPage) {
      throw new Error('Unknown ?page= value: ' + JSON.stringify(htParams.get('page')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 0; }
    /* The grid is exactly as wide as the 320px viewport the spec runs at (the WCAG 1.4.10 reflow
       width). On the wide page it sits 1000px in from the inline start and the top, where the spec scrolls to. */
    [data-testid="grid"] { width: 320px; }
    body.wide { width: 3000px; height: 3000px; }
    body.wide [data-testid="grid"] { margin-inline-start: 1000px; margin-block-start: 1000px; }
  </style>
</head>
<body>
  <!--
    A narrow grid whose menus fit on neither side of the point they open at. The columns are 160px wide, so
    the first column's dropdown button sits near the middle of the 320px viewport, and the menus are about
    200px wide: they miss the room on both sides of a point that far in, on every theme. The dropdown
    menu is the one in the report (a filter by condition and an action bar), the context menu is the
    default one. On a short viewport the same menus are taller than the room above and below a point
    near the top. The window scrolls only with `?page=wide`.
  -->
  <div id="grid" data-testid="grid"></div>
  <script>
    document.body.className = window.htPage;
  </script>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. The message is stamped on the container and the page object rethrows it,
    // so a broken build reads as its own error instead of a cell that never appeared.
    try {
      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(20, 4),
        layoutDirection: 'inherit',
        colHeaders: true,
        colWidths: 160,
        height: 400,
        filters: true,
        contextMenu: true,
        dropdownMenu: ['filter_by_condition', 'filter_action_bar'],
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }
  </script>
</body>
</html>
