<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - selection announcements</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);

    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick(
      { main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    Fixture for the polite announcement a user's selection makes.

    A 10 x 6 grid with row and column headers. ?aria=on|off sets `ariaTags`, ?headers=default|custom
    picks the default A, B, C labels or Name, Price, Total, Tax, Qty, Note, and
    ?plugin=none|columnSorting|contextMenu turns one plugin on.

    Cells carry data-testid="cell-<row>-<col>", column headers "col-header-<col>" and row headers
    "row-header-<row>".
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const ariaTags = htPick({ on: true, off: false }, htParams.get('aria'), 'on', 'aria');
    const colHeaders = htPick(
      { default: true, custom: ['Name', 'Price', 'Total', 'Tax', 'Qty', 'Note'] },
      htParams.get('headers'), 'default', 'headers');
    const pluginKey = htPick(
      { none: null, columnSorting: 'columnSorting', contextMenu: 'contextMenu' },
      htParams.get('plugin'), 'none', 'plugin');

    const testIdRenderer = function(instance, td, row, col) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const settings = {
      data: Array.from({ length: 10 }, (_, row) =>
        Array.from({ length: 6 }, (__, col) => `${String.fromCharCode(65 + col)}${row + 1}`)),
      colHeaders,
      rowHeaders: true,
      ariaTags,
      renderer: testIdRenderer,
      afterGetColHeader(col, TH) {
        if (col >= 0) {
          TH.setAttribute('data-testid', `col-header-${col}`);
        }
      },
      afterGetRowHeader(row, TH) {
        if (row >= 0) {
          TH.setAttribute('data-testid', `row-header-${row}`);
        }
      },
      licenseKey: window.htTestLicenseKey,
    };

    if (pluginKey) {
      settings[pluginKey] = true;
    }

    try {
      window.hot = new Handsontable(container, settings);
    } catch (error) {
      window.htBuildError = String((error && error.stack) || error);
      throw error;
    }
  </script>
</body>
</html>
