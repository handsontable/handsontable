<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable formulas + moveCells e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Active theme from the ?theme= query param set by the Playwright project.
    // Mapped through a fixed allowlist to a LITERAL (default main), so a crafted
    // ?theme= can never be reflected into the document — no XSS. Exposed as
    // window.htTheme so the grid init below reuses the sanitized value.
    window.htTheme = ({ horizon: 'horizon', classic: 'classic' })[new URLSearchParams(location.search).get('theme')] || 'main';
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the Formulas + moveCells integration. The full dist bundle
    exposes both the Handsontable and HyperFormula globals, so the grid runs
    with a real formula engine. Cells are stamped with data-testid via a
    renderer (data-testid="cell-<row>-<col>") so tests hook into them
    unambiguously. window.initGrid(data) rebuilds the instance per test with
    that test's dataset — one instance per test, no cross-test state.
  -->
  <div id="grid" data-testid="grid"></div>

  <script src="/handsontable/dist/handsontable.full.min.js"></script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // (Re)creates the grid with the given dataset merged with the given setting
    // overrides (e.g. { trimRows: [1] }). Destroying and recreating —
    // instead of updateSettings({ data }) — guarantees a fresh HyperFormula
    // sheet per test.
    window.initGrid = (data, overrides = {}) => {
      if (window.hot) {
        window.hot.destroy();
      }

      // Kept so a test can read the array the grid was handed, not the grid's
      // projection of it - that is the difference issue #10388 turns on.
      window.rawData = data;

      window.hot = new Handsontable(container, Object.assign({
        data,
        colHeaders: true,
        rowHeaders: true,
        renderer: testIdRenderer,
        formulas: {
          engine: HyperFormula,
        },
        moveCells: true,
        licenseKey: 'non-commercial-and-evaluation',
      }, overrides));

      return true;
    };

    window.initGrid([
      ['A1', 'B1', 'C1'],
      ['A2', 'B2', 'C2'],
      ['A3', 'B3', 'C3'],
    ]);
  </script>
</body>
</html>
