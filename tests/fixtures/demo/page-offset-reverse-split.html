<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page offset with a vertically clipping ancestor e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright projects,
    // mapped through fixed allowlists to LITERALS so a crafted param can never be reflected into
    // the document. An unknown value THROWS instead of falling back.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }

    // The layout knobs, each mapped to a literal or a clamped integer.
    window.htLayout = {
      dir: ({ ltr: 'ltr', rtl: 'rtl' })[htParams.get('dir') ?? 'ltr'],
      overflowY: ({ clip: 'clip', hidden: 'hidden', auto: 'auto', visible: 'visible' })[htParams.get('overflowY') ?? 'clip'],
      preventOverflow: ({ none: undefined, vertical: 'vertical' })[htParams.get('preventOverflow') ?? 'none'],
      margin: Math.min(Math.max(parseInt(htParams.get('margin') ?? '0', 10) || 0, 0), 1000),
      fixedColumnsStart: Math.min(Math.max(parseInt(htParams.get('fixedColumnsStart') ?? '0', 10) || 0, 0), 5),
    };
    if (!window.htLayout.dir || !window.htLayout.overflowY) {
      throw new Error('Unknown layout param: ' + location.search);
    }
    document.documentElement.dir = window.htLayout.dir;
  </script>
  <style> body { font-family: sans-serif; margin: 0; } </style>
</head>
<body>
  <!--
    A grid with no width or height inside a 300px tall wrapper that clips the vertical axis only
    (`overflow-y: clip`) and is offset from the page's inline-start edge (`?margin=`). The wrapper
    owns the vertical axis, so the window owns neither axis' scrollbar the way it does on a plain
    page: the holder scrolls the columns, the reverse split. `?overflowY=` swaps the clip for the
    other values the wrapper can take, and `?dir=rtl` mirrors the page.
  -->
  <div id="wrap" data-testid="wrap">
    <div id="grid" data-testid="grid"></div>
  </div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const { dir, overflowY, preventOverflow, margin, fixedColumnsStart } = window.htLayout;
    const wrap = document.getElementById('wrap');
    const container = document.getElementById('grid');

    wrap.style.height = '300px';
    wrap.style.overflowY = overflowY;
    wrap.style[dir === 'rtl' ? 'marginRight' : 'marginLeft'] = margin + 'px';
    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    try {
      window.hot = new Handsontable(container, {
        data: Array.from({ length: 60 }, (_, r) => Array.from({ length: 100 }, (_, c) => `${r}-${c}`)),
        colWidths: 100,
        rowHeaders: true,
        colHeaders: true,
        fixedColumnsStart,
        preventOverflow,
        layoutDirection: dir,
        renderer: testIdRenderer,
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      window.htBuildError = String(error && error.message);
    }
  </script>
</body>
</html>
