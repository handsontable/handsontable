<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merged cells in the frozen columns e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    Merged blocks inside, or across, the frozen columns. Every pane (the master and each clone)
    renders its own copy of such a block, and each copy must agree with the others on the content
    position and on the row heights.

    A cell whose value is `markers:<n>` renders <n> fixed-size inline blocks instead of text, so
    positions, wrapping and row heights do not depend on the runner's font metrics. A cell whose
    value is `tall:<px>` renders one block of that height, and `kept:<n>` renders the markers once and keeps them
    across paints.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const MARKER_WIDTH = 40;
    const MARKER_HEIGHT = 12;

    function renderer(instance, td, row, col, prop, value, cellProperties) {
      // `kept:<n>` stands for a renderer that keeps its DOM across paints, the way a framework component
      // renderer updates a mounted component in place: it builds the markers once and leaves them after that.
      if (typeof value === 'string' && value.startsWith('kept:')) {
        if (td.parentElement) {
          td.parentElement.setAttribute('data-testid', `row-${row}`);
        }

        if (!td.querySelector('[data-testid="marker"]')) {
          renderer.call(this, instance, td, row, col, prop, value.replace('kept:', 'markers:'), cellProperties);
        }

        return;
      }

      Handsontable.renderers.TextRenderer.apply(this, arguments);

      // Stamp the row id on the TR from whichever cell renders first: every pane renders a
      // different column range, so a per-cell id could not identify the same row across them.
      if (td.parentElement) {
        td.parentElement.setAttribute('data-testid', `row-${row}`);
      }

      if (typeof value !== 'string') {
        return;
      }

      const root = td;
      const [kind, amount] = value.split(':');

      if (kind === 'markers') {
        Handsontable.dom.empty(root);

        for (let i = 0; i < Number(amount); i++) {
          const marker = document.createElement('span');

          marker.setAttribute('data-testid', 'marker');
          marker.style.display = 'inline-block';
          marker.style.verticalAlign = 'top';
          marker.style.width = `${MARKER_WIDTH}px`;
          marker.style.height = `${MARKER_HEIGHT}px`;
          marker.style.marginInlineEnd = '4px';
          marker.style.background = 'currentColor';
          root.appendChild(marker);
        }

      } else if (kind === 'tall') {
        Handsontable.dom.empty(root);

        const block = document.createElement('div');

        block.setAttribute('data-testid', 'tall-block');
        block.style.height = `${Number(amount)}px`;
        root.appendChild(block);
      }
    }

    window.initGrid = (settings) => {
      if (window.hot) {
        window.hot.destroy();
      }

      const { rows = 40, cols = 30, values = [], ...rest } = settings;
      const data = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (__, c) => `R${r}C${c}`));

      values.forEach(({ row, col, value }) => {
        data[row][col] = value;
      });

      window.hot = new Handsontable(container, {
        data,
        width: 600,
        height: 320,
        colWidths: 60,
        rowHeaders: true,
        colHeaders: true,
        renderer,
        licenseKey: 'non-commercial-and-evaluation',
        ...rest,
      });
    };
  </script>
</body>
</html>
