<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — dataProvider.refetchAfterCreate</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for DEV-1679 (`dataProvider.refetchAfterCreate`).

    A sorted, server-backed grid whose `onRowsCreate` applies the server response itself with
    `updateData()` and turns the automatic post-create refetch off. The in-page "server" is a plain
    array: `fetchRows` sorts a copy of it by the query's `sort`, and every call is counted so the
    spec can prove that a context-menu insert did NOT trigger a refetch.

    Cells carry `data-testid="cell-<row>-<col>"` and `data-row-id="<record id>"`, and column headers
    carry `data-testid="col-header-<col>"`, so the spec addresses records rather than positions.
  -->
  <div data-testid="status">idle</div>
  <div data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    const status = document.querySelector('[data-testid="status"]');

    container.className = `ht-theme-${window.htTheme}`;

    /**
     * The in-page server. Names are deliberately out of id order so that sorting by name
     * visibly reorders the rows.
     */
    const server = {
      rows: [
        { id: 1, name: 'Mango' },
        { id: 2, name: 'Apple' },
        { id: 3, name: 'Kiwi' },
        { id: 4, name: 'Banana' },
        { id: 5, name: 'Lemon' },
        { id: 6, name: 'Cherry' },
        { id: 7, name: 'Grape' },
        { id: 8, name: 'Fig' },
        { id: 9, name: 'Date' },
        { id: 10, name: 'Peach' },
        { id: 11, name: 'Olive' },
        { id: 12, name: 'Plum' },
      ],
      fetchCount: 0,
      createCount: 0,
    };

    window.htServer = server;

    /**
     * Sort a copy of the server rows the way the query asks.
     */
    function sortRows(rows, sort) {
      if (!sort) {
        return rows;
      }

      const direction = sort.order === 'desc' ? -1 : 1;

      return rows.sort((a, b) => String(a[sort.prop]).localeCompare(String(b[sort.prop])) * direction);
    }

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);

      const record = instance.getSourceDataAtRow(instance.toPhysicalRow(row));

      td.setAttribute('data-testid', `cell-${row}-${col}`);
      td.setAttribute('data-row-id', record ? String(record.id) : '');
    };

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. The message is stamped on the container and the page object rethrows it.
    try {
      window.hot = new Handsontable(container, {
        data: [],
        columns: [{ data: 'id' }, { data: 'name' }],
        colHeaders: ['ID', 'Name'],
        rowHeaders: true,
        columnSorting: true,
        contextMenu: true,
        renderer: testIdRenderer,
        // Tall enough to render every row of the fixture, so the DOM row count is the data row count.
        width: 500,
        height: 600,
        dataProvider: {
          rowId: 'id',
          fetchRows: async({ sort }) => {
            server.fetchCount += 1;

            const rows = sortRows(server.rows.slice(), sort);

            return { rows, totalRows: rows.length };
          },
          onRowsCreate: async({ rowsAmount }) => {
            server.createCount += 1;

            const created = Array.from({ length: rowsAmount }, (_, i) => ({
              id: 100 + (server.createCount * 10) + i,
              name: `New ${server.createCount}.${i}`,
            }));

            server.rows.push(...created);

            // The documented apply pattern: append with `updateData()`, never `loadData()`.
            const rows = window.hot.getSourceData();

            rows.push(...created);
            window.hot.updateData(rows);

            return created;
          },
          onRowsUpdate: async() => {},
          onRowsRemove: async() => {},
          refetchAfterCreate: false,
        },
        afterGetColHeader(col, TH) {
          TH.setAttribute('data-testid', `col-header-${col}`);
        },
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }

    /**
     * Ids of the records whose name cell is `readOnly`, in visual order. Read through cell meta so
     * the check is about which RECORD carries the meta, not which position.
     */
    window.htReadOnlyRecordIds = () => {
      const ids = [];

      for (let row = 0; row < window.hot.countRows(); row++) {
        if (window.hot.getCellMeta(row, 1).readOnly) {
          ids.push(window.hot.getSourceDataAtRow(window.hot.toPhysicalRow(row)).id);
        }
      }

      return ids;
    };

    /**
     * Mark the name cell of the given visual row `readOnly` and report the record it belongs to.
     */
    window.htMarkReadOnly = (row) => {
      window.hot.setCellMeta(row, 1, 'readOnly', true);
      window.hot.render();

      return window.hot.getSourceDataAtRow(window.hot.toPhysicalRow(row)).id;
    };

    status.textContent = 'ready';
  </script>
</body>
</html>
