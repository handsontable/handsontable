<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - sorting rows pinned by fixedRowsTop / fixedRowsBottom</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for DEV-59 / DEV-1713: which rows a sort is allowed to move.

    Rows pinned by `fixedRowsTop` and `fixedRowsBottom` are out of the sortable range by
    default - that landed in #12627 and shipped in 18.0.0, because a footer row holding a
    SUM over absolute addresses was being permuted into the middle of the data. The
    `sortFixedRows: true` option puts them back in, which is the pre-18.0.0 behavior.

    The seed data is built so BOTH pinned rows have to move once the option is on, in BOTH
    sort directions. Column 1 gives the pinned rows values in the MIDDLE of the range (25 at
    the top, 35 at the bottom, against data values 10/20/30/40), so a sort that includes them
    drops each one into the middle of the data - `Header` lands at visual row 2 ascending and
    `Total` at row 4. Extreme values would not do: with the largest value pinned at the top
    and the smallest pinned at the bottom, a DESCENDING sort leaves both exactly where they
    already were, and the test would pass with the range guard deleted.

    The grid is rebuilt per test through `window.initSortingFixedRowsGrid`, so one test
    cannot leak its sort state into the next, and the `multiColumnSorting` variant (which
    inherits the same range calculation) is one override rather than a second fixture.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    var container = document.querySelector('[data-testid="grid"]');

    container.className = 'ht-theme-' + window.htTheme;

    // One pinned row at each end. The pinned rows' column-1 values sit in the MIDDLE of the
    // range (25 and 35 against 10/20/30/40), so either sort direction moves them into the
    // middle of the data if - and only if - they are inside the sortable range.
    // Sorted ascending, the whole column reads 10, 20, 25, 30, 35, 40.
    window.SORTING_FIXED_ROWS_DATA = [
      ['Header', 25],
      ['Banana', 20],
      ['Apple', 10],
      ['Date', 40],
      ['Cherry', 30],
      ['Total', 35],
    ];

    window.initSortingFixedRowsGrid = function(overrides) {
      if (window.hot) {
        window.hot.destroy();
      }

      window.hot = new Handsontable(container, Object.assign({
        data: window.SORTING_FIXED_ROWS_DATA.map(function(row) { return row.slice(); }),
        colHeaders: ['Fruit', 'Amount'],
        rowHeaders: true,
        fixedRowsTop: 1,
        fixedRowsBottom: 1,
        columnSorting: true,
        // Stamped from a hook rather than a renderer so every cell type keeps its own
        // renderer and still gets an id. The pinned rows are cloned into the top and
        // bottom overlays, so the SAME id exists more than once in the document - every
        // locator in the page object is scoped to one overlay layer for that reason.
        afterRenderer: function(td, row, col) {
          td.setAttribute('data-testid', 'cell-' + row + '-' + col);
        },
        afterGetColHeader: function(col, TH) {
          if (col >= 0) {
            TH.setAttribute('data-testid', 'col-header-' + col);
          }
        },
        licenseKey: 'non-commercial-and-evaluation',
      }, overrides || {}));

      return true;
    };

    window.initSortingFixedRowsGrid();
  </script>
</body>
</html>
