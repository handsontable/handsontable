<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - collapsible indicator and dropdown button hit areas</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document - no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back - a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // `?dir=rtl` builds the grid right to left; an absent param keeps left to right.
    window.htDirection = ({ ltr: 'ltr', rtl: 'rtl' })[htParams.get('dir') ?? 'ltr'];
    if (!window.htDirection) {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(htParams.get('dir')));
    }
    // `?pageDir=rtl` makes the page itself right to left, whatever direction the grid has.
    window.htPageDirection = ({ ltr: 'ltr', rtl: 'rtl' })[htParams.get('pageDir') ?? 'ltr'];
    if (!window.htPageDirection) {
      throw new Error('Unknown ?pageDir= value: ' + JSON.stringify(htParams.get('pageDir')));
    }
    document.documentElement.dir = window.htPageDirection;
    // `?sort=1` sorts the first column, which draws the sort indicator in group "C"'s header cell.
    window.htSorted = ({ 0: false, 1: true })[htParams.get('sort') ?? '0'];
    if (window.htSorted === undefined) {
      throw new Error('Unknown ?sort= value: ' + JSON.stringify(htParams.get('sort')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    E2E fixture for the hit areas of the CollapsibleColumns indicator and the dropdown menu button. The
    groups "C" and "D" sit in the LAST header row, so each of their header cells holds both buttons: the
    dropdown button of the cell and the indicator of the group. A constructor error lands in
    `window.htBuildError`, which the page object rethrows.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    try {
      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(3, 4),
        colHeaders: true,
        colWidths: 120,
        layoutDirection: window.htDirection,
        nestedHeaders: [
          [{ label: 'A', colspan: 4 }],
          [{ label: 'C', colspan: 2 }, { label: 'D', colspan: 2 }],
        ],
        collapsibleColumns: true,
        dropdownMenu: true,
        columnSorting: window.htSorted ? { initialConfig: { column: 0, sortOrder: 'asc' } } : false,
        licenseKey: window.htTestLicenseKey,
      });
    } catch (error) {
      window.htBuildError = String(error && error.stack || error);
    }
  </script>
</body>
</html>
