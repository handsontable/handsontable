<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — dialog states</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme, bundle and the fixture's own options come from query params, each mapped through a fixed
    // allowlist to LITERALS so a crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default so the fixture stays browsable by hand; an unknown value THROWS
    // instead of falling back — a typo in a spec must be one red test, never a silently mislabeled green
    // one.
    const htParams = new URLSearchParams(location.search);
    const htPick = (name, allowed, fallback) => {
      const value = allowed[htParams.get(name) ?? fallback];

      if (value === undefined) {
        throw new Error(`Unknown ?${name}= value: ${JSON.stringify(htParams.get(name))}`);
      }

      return value;
    };

    window.htTheme = htPick('theme', { main: 'main', horizon: 'horizon', classic: 'classic' }, 'main');
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min = handsontable.full.min.js).
    window.htBundle = htPick('bundle', { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, 'umd');
    window.htDirection = htPick('dir', { ltr: 'ltr', rtl: 'rtl' }, 'ltr');
    window.htBackground = htPick('background', { solid: 'solid', 'semi-transparent': 'semi-transparent' }, 'solid');
    window.htContentBackground = htPick('contentbackground', { 0: false, 1: true }, '0');
    window.htTemplate = htPick('template', { none: null, confirm: 'confirm' }, 'none');
    window.htFocus = htPick('focus', { 0: false, 1: true }, '0');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } input { margin: 10px; } </style>
</head>
<body>
  <!--
    E2E fixture for the dialog plugin, laid out as the visual suite's `/dialog-demo` route lays it out:
    a page input before a 400 x 400 grid, a second one after it, and a dialog shown over the grid on
    load. The params are that route's: `background`, `contentbackground`, `template=confirm` (a confirm
    dialog whose Cancel and OK both hide it), and `focus=1` (two inputs in the dialog's content, and an
    `afterDialogFocus` listener that sends the focus to the first one unless the dialog was clicked).
    `animation: false` so every state is reached synchronously; the visual demo animates, which the
    visual fixture switches off with the transitions anyway.
  -->
  <input data-testid="input-before" placeholder="Input">
  <div data-testid="grid"></div>
  <input data-testid="input-after" placeholder="Input 2">

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    let content;
    let template;

    if (window.htTemplate === 'confirm') {
      template = {
        type: 'confirm',
        title: 'Confirm',
        description: 'This is a confirm',
        buttons: [
          { text: 'Cancel', type: 'secondary', callback: () => window.hot.getPlugin('dialog').hide() },
          { text: 'OK', type: 'primary', callback: () => window.hot.getPlugin('dialog').hide() },
        ],
      };
    } else {
      content = document.createElement('div');
      content.innerHTML = '<h6>Hello world</h6><p>Lorem ipsum</p>';

      const button = document.createElement('button');

      button.textContent = 'Close modal';
      content.appendChild(button);

      if (window.htFocus) {
        ['Input 1', 'Input 2'].forEach((placeholder, index) => {
          const input = document.createElement('input');

          input.placeholder = placeholder;
          input.setAttribute('data-testid', `dialog-input-${index + 1}`);
          content.appendChild(input);
        });
      }
    }

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. `awaitFixtureBuilt()` rethrows the captured message.
    try {
      window.hot = new Handsontable(container, {
        data: Array.from({ length: 30 }, (_, row) => [`Company ${row}`, `Country ${row}`, `Name ${row}`, row]),
        colHeaders: ['Company name', 'Country', 'Name', 'Qty'],
        rowHeaders: true,
        layoutDirection: window.htDirection,
        width: 400,
        height: 400,
        dialog: {
          background: window.htBackground,
          contentBackground: window.htContentBackground,
          animation: false,
          content,
          template,
        },
        licenseKey: 'non-commercial-and-evaluation',
      });

      if (window.htFocus) {
        window.hot.addHook('afterDialogFocus', (placement) => {
          if (placement !== 'click') {
            document.querySelector('[data-testid="dialog-input-1"]').focus();
          }
        });
      }

      window.hot.getPlugin('dialog').show();
    } catch (error) {
      window.htBuildError = String(error && error.stack || error);
    }
  </script>
</body>
</html>
