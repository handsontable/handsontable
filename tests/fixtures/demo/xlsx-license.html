<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - xlsx license</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }


    // Which xlsx engine the grids use. `native` is the built-in engine (`importFile: true`,
    // `exportFile: true`, the default here); `exceljs` injects the ExcelJS module as the alternative
    // engine (`engines: { xlsx: ExcelJS }`). ExcelJS is loaded on both legs.
    window.htEngine = ({ exceljs: 'exceljs', native: 'native' })[htParams.get('engine') ?? 'native'];
    if (!window.htEngine) {
      throw new Error('Unknown ?engine= value: ' + JSON.stringify(htParams.get('engine')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    /* Read off the source grid's DOM by the export's class probe. */
    .bold { font-weight: 700; }
  </style>
</head>
<body>
  <!--
    The xlsx license fixture. No grid exists on load: a spec calls `htLicense.create(key)`, which
    (re)builds a richly configured source grid under that license key and an empty import target
    under the same key, then exports and imports in memory through the other helpers. The key is read
    once, when a grid is constructed, so a new key always means new grids.

    window.htLicense:
      create(licenseKey, overrides = {})  builds #source (the settings below, with `overrides`
                                          merged over them) and an empty #target with importFile
                                          (and comments, plus formulas on the full bundle)
      exportBytes(options = {})           source exportAsBlobAsync('xlsx', options), as number[]
      importBytes(bytes, options = {})    target importFromArrayBuffer('xlsx', ...), the result's own
                                          enumerable properties
      warnings()                          the console.warn messages logged since create() began
  -->
  <div id="source" data-testid="source"></div>
  <div id="target" data-testid="target"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The closing tag is split
    // so the HTML parser does not end THIS script block. No HyperFormula on the base bundle: the
    // formula cell exists on the full bundle only, which carries the engine itself.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script src="/tests/node_modules/exceljs/dist/exceljs.min.js"></script>
  <script>
    (() => {
      const sourceEl = document.getElementById('source');
      const targetEl = document.getElementById('target');
      const engineSetting = () => (window.htEngine === 'native' ? true : { engines: { xlsx: ExcelJS } });
      const withFormulas = window.htBundle === 'handsontable.full.min.js';
      const captured = [];
      const originalWarn = console.warn;

      sourceEl.className = `ht-theme-${window.htTheme}`;
      targetEl.className = `ht-theme-${window.htTheme}`;

      // Every console.warn is recorded (and still logged), so a spec can assert on what a key made
      // the engine say. `create()` empties the record first.
      console.warn = function(...args) {
        captured.push(args.map(arg => (arg instanceof Error ? arg.message : String(arg))).join(' '));

        return originalWarn.apply(this, args);
      };

      const stamp = prefix => function(td, row, col) {
        td.setAttribute('data-testid', `${prefix}-${row}-${col}`);
      };

      const sourceData = () => [
        ['Ana García', 4200.5, '2024-01-15', 'Open', 'north'],
        ['James Okafor', 18700, '2023-11-02', 'Closed', 'south'],
        ['Li Wei', 950.25, '2025-03-09', 'Open', 'east'],
        ['Merged label', null, '2025-06-30', 'Closed', 'west'],
        ['Totals', withFormulas ? '=B1+B2' : 22900.5, '2025-12-31', 'Open', 'north'],
        ['Notes', 12.75, '2026-01-02', 'Closed', 'south'],
      ];

      let source = null;
      let target = null;

      window.htLicense = {
        create(licenseKey, overrides = {}) {
          captured.length = 0;

          if (source) {
            source.destroy();
            source = null;
          }
          if (target) {
            target.destroy();
            target = null;
          }

          const sourceSettings = {
            data: sourceData(),
            colHeaders: ['Name', 'Amount', 'Due', 'Status', 'Region'],
            columns: [
              { type: 'text' },
              // Intl options, the format the numeric and date cell types take today: '$0,0.00' and
              // 'YYYY-MM-DD' as strings are no longer supported and would log a warning each.
              { type: 'numeric', numericFormat: { style: 'currency', currency: 'USD', minimumFractionDigits: 2 } },
              { type: 'date', dateFormat: { year: 'numeric', month: '2-digit', day: '2-digit' } },
              { type: 'dropdown', source: ['Open', 'Closed'] },
              { type: 'text' },
            ],
            cell: [
              { row: 0, col: 0, readOnly: true },
              { row: 1, col: 0, comment: { value: 'Check' } },
              { row: 2, col: 0, className: 'htRight bold' },
            ],
            mergeCells: [{ row: 3, col: 0, rowspan: 1, colspan: 2 }],
            hiddenColumns: { columns: [4] },
            fixedRowsTop: 1,
            colWidths: [80, 120, 110, 90, 60],
            comments: true,
            contextMenu: true,
            exportFile: engineSetting(),
            width: 600,
            height: 260,
            afterRenderer: stamp('source'),
            licenseKey,
          };

          if (withFormulas) {
            sourceSettings.formulas = { engine: HyperFormula };
          }

          // The target enables the plugins an import fills (comments, and formulas where the bundle
          // has the engine), so what lands is decided by the license, not by a missing plugin.
          const targetSettings = {
            data: [[]],
            comments: true,
            importFile: engineSetting(),
            afterRenderer: stamp('target'),
            licenseKey,
          };

          if (withFormulas) {
            targetSettings.formulas = { engine: HyperFormula };
          }

          source = new Handsontable(sourceEl, { ...sourceSettings, ...overrides });
          target = new Handsontable(targetEl, targetSettings);
          window.hot = source;
          window.htTarget = target;
        },

        async exportBytes(options = {}) {
          const blob = await source.getPlugin('exportFile').exportAsBlobAsync('xlsx', options);

          return Array.from(new Uint8Array(await blob.arrayBuffer()));
        },

        async importBytes(bytes, options = {}) {
          const result = await target.getPlugin('importFile')
            .importFromArrayBuffer('xlsx', new Uint8Array(bytes).buffer, options);

          return { ...result };
        },

        warnings() {
          return captured.slice();
        },
      };
    })();
  </script>
</body>
</html>
