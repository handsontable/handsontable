<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — emptyDataState layout</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme, bundle and the fixture's own options come from query params, each mapped through a fixed
    // allowlist to LITERALS so a crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default so the fixture stays browsable by hand; an unknown value THROWS
    // instead of falling back — a typo in a spec must be one red test, never a silently mislabeled green
    // one.
    const htParams = new URLSearchParams(location.search);
    const htPick = (name, allowed, fallback) => {
      const value = allowed[htParams.get(name) ?? fallback];

      if (value === undefined) {
        throw new Error(`Unknown ?${name}= value: ${JSON.stringify(htParams.get(name))}`);
      }

      return value;
    };

    window.htTheme = htPick('theme', { main: 'main', horizon: 'horizon', classic: 'classic' }, 'main');
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min = handsontable.full.min.js).
    window.htBundle = htPick('bundle', { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, 'umd');
    window.htDirection = htPick('dir', { ltr: 'ltr', rtl: 'rtl' }, 'ltr');
    // `undefined` leaves `height` out of the settings, as the visual demo's `height=undefined` does.
    window.htHeight = htPick('height', { 400: 400, auto: 'auto', undefined: null }, '400');
    window.htNoColumns = htPick('nocolumns', { 0: false, 1: true }, '0');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the emptyDataState plugin, configured as the visual suite's `/empty-data-state-demo`
    route configures it: a grid with no rows, seven columns with row and column headers, `width: 'auto'`,
    the dropdown menu, filters, navigable headers, and the empty-data-state message. `height` is 400 px,
    `auto`, or left out; `nocolumns=1` declares `columns: []`; `dir=rtl` builds an RTL grid in Arabic,
    which loads the ar-AR language pack, as the demo does.
  -->
  <div data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');

    if (window.htDirection === 'rtl') {
      // Neither bundle carries the language packs.
      document.write('<scr' + 'ipt src="/handsontable/dist/languages/ar-AR.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const settings = {};

    if (window.htHeight !== null) {
      settings.height = window.htHeight;
    }

    settings.columns = window.htNoColumns ? [] : [
      { type: 'text' },
      { type: 'text' },
      { type: 'text' },
      { type: 'date' },
      { type: 'text' },
      { type: 'checkbox' },
      { type: 'numeric' },
    ];

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. `awaitFixtureBuilt()` rethrows the captured message.
    try {
      window.hot = new Handsontable(container, {
        data: [],
        layoutDirection: window.htDirection,
        language: window.htDirection === 'rtl' ? 'ar-AR' : 'en-US',
        rowHeaders: true,
        colHeaders: ['Company name', 'Country', 'Name', 'Sell date', 'Order ID', 'In stock', 'Qty'],
        width: 'auto',
        dropdownMenu: true,
        filters: true,
        navigableHeaders: true,
        emptyDataState: true,
        ...settings,
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      window.htBuildError = String(error && error.stack || error);
    }
  </script>
</body>
</html>
