<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NestedHeaders + currentRow/ColClassName e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document - no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back - a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    .grid { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <!--
    DEV-3012 (dev-handsontable#274). `currentRowClassName`/`currentColClassName` only ever painted
    the LEAF header level - with a NestedHeaders group, or a second row-header column, the
    parent/group header cells never got the class, only the innermost one did.

    Every grid shares the same 2-level column-header group (columns 0-1 grouped under "Group") and a
    second row-header column added through `afterGetRowHeaderRenderers`. The spec selects the body
    cell at the group's SECOND column (not its origin) on purpose - selecting the origin column would
    pass even without the NestedHeaders-side fix, since the redirect that maps a `hiddenHeader`
    placeholder onto the group's visible cell is a no-op when the selected column is already the
    group's own root.
  -->
  <div id="false-grid" class="grid" data-testid="false-grid"></div>
  <div id="header-grid" class="grid" data-testid="header-grid"></div>
  <div id="single-grid" class="grid" data-testid="single-grid"></div>
  <div id="flat-grid" class="grid" data-testid="flat-grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    /**
     * Appends a second row-header column through the documented hook. There is no first-party
     * plugin that groups row headers the way NestedHeaders groups column headers, but the engine
     * already generalizes `countRowHeaders()`/the header-extent scan to N levels through this hook,
     * so it is legitimate scaffolding to exercise the row axis of the fix.
     */
    const SECOND_ROW_HEADER = {
      afterGetRowHeaderRenderers(renderers) {
        renderers.push((row, TH) => {
          TH.textContent = `#${row}`;
        });
      },
    };

    const NESTED_HEADERS = [
      [{ label: 'Group', colspan: 2 }, 'C', 'D'],
      ['A', 'B', 'C2', 'D2'],
    ];

    /**
     * Build one grid. A constructor that throws stamps its message on the container instead of
     * taking the whole page down, so a failure reads as the real error rather than a bare
     * "element not visible".
     */
    function build(testId, settings) {
      const container = document.querySelector(`[data-testid="${testId}"]`);

      container.className = `grid ht-theme-${window.htTheme}`;

      try {
        return new Handsontable(container, Object.assign({
          data: Handsontable.helper.createSpreadsheetData(5, 4),
          colHeaders: true,
          rowHeaders: true,
          currentRowClassName: 'currentRow',
          currentColClassName: 'currentCol',
          licenseKey: 'non-commercial-and-evaluation',
        }, settings));
      } catch (error) {
        container.setAttribute('data-init-error', String(error && error.message));

        return null;
      }
    }

    window.hots = {
      'false-grid': build('false-grid', {
        nestedHeaders: NESTED_HEADERS,
        ...SECOND_ROW_HEADER,
        disableVisualSelection: false,
      }),
      'header-grid': build('header-grid', {
        nestedHeaders: NESTED_HEADERS,
        ...SECOND_ROW_HEADER,
        disableVisualSelection: 'header',
      }),
      'single-grid': build('single-grid', {
        nestedHeaders: NESTED_HEADERS,
        ...SECOND_ROW_HEADER,
        selectionMode: 'single',
      }),
      'flat-grid': build('flat-grid', {}),
    };
  </script>
</body>
</html>
