<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — hidden init, destroy race</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for DEV-2210: a grid initialized inside a hidden container, then
    shown and destroyed inside the IntersectionObserver delivery window.

    Unlike the other fixtures this one does NOT build the grid at parse time —
    the spec drives the whole race through window.runHiddenInitDestroyRace() so
    the rAF/setTimeout ordering is exact. The status element is outside the grid
    container (which destroy() empties) and reaching "settled" means the pending
    observer delivery has had several frames to land.
  -->
  <div data-testid="status">idle</div>
  <div data-testid="grid" style="display: none; min-width: 100px; min-height: 100px"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    const status = document.querySelector('[data-testid="status"]');

    container.className = `ht-theme-${window.htTheme}`;

    /**
     * Run `callback` after `count` animation frames.
     */
    function afterFrames(count, callback) {
      if (count === 0) {
        callback();

        return;
      }

      requestAnimationFrame(() => afterFrames(count - 1, callback));
    }

    // Set to `true` only when the grid really did initialize while invisible —
    // the spec asserts it so a fixture regression cannot silently skip the
    // scenario and still report green.
    window.htHiddenAtInit = false;

    window.runHiddenInitDestroyRace = () => {
      const hot = new Handsontable(container, {
        data: [['A1', 'B1'], ['A2', 'B2']],
        licenseKey: 'non-commercial-and-evaluation',
      });

      window.htHiddenAtInit = hot.rootElement.offsetParent === null;

      // Showing the container makes the next frame's IntersectionObserver
      // snapshot `isIntersecting: true`.
      container.style.display = 'block';

      // rAF callbacks run BEFORE the frame's observer snapshot, so a task
      // posted here runs after that snapshot exists but can beat its delivery —
      // the same ordering the Jasmine teardown hit on a loaded CI runner.
      requestAnimationFrame(() => {
        setTimeout(() => {
          hot.destroy();

          // Give the queued delivery several frames to arrive. If it reaches an
          // unguarded callback it throws, and the spec's pageerror listener
          // catches it before this marker is written.
          afterFrames(5, () => {
            status.textContent = 'settled';
          });
        }, 0);
      });
    };
  </script>
</body>
</html>
