<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable fill handle drag e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <!--
    DEV-140. The fill handle drag decides its direction from the cell under the pointer. The handle
    sits on the selection's bottom-end CORNER, so a pointer moving diagonally leaves the selection on
    both axes at once, and auto-inserted rows appear under a pointer that does not move. Cells carry
    `data-testid="cell-<row>-<col>"`; `window.initFillGrid(overrides)` rebuilds the instance per test.
  -->
  <div id="grid" data-testid="grid"></div>
  <!-- Room below the grid, so a spec can scroll the page while the fill handle is held. -->
  <div style="height: 2000px"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    /**
     * Stamps every cell with a stable test id so the specs hook by `data-testid` rather than by
     * structural CSS.
     *
     * @param {object} instance The Handsontable instance.
     * @param {HTMLTableCellElement} td The cell element.
     * @param {number} row The visual row index.
     * @param {number} col The visual column index.
     */
    function testIdRenderer(instance, td, row, col) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    }

    /**
     * Builds `rows` x `cols` data labelled like spreadsheet cells (`A1`, `B1`, ...).
     *
     * @param {number} rows The number of rows.
     * @param {number} cols The number of columns.
     * @returns {string[][]}
     */
    window.buildCellLabels = function(rows, cols) {
      return Array.from({ length: rows }, (_, row) =>
        Array.from({ length: cols }, (__, col) => `${String.fromCharCode(65 + col)}${row + 1}`));
    };

    /**
     * Rebuilds the grid with the given overrides, so each test starts from a fresh instance, and
     * resets the log of rows the grid created.
     *
     * @param {object} overrides Settings merged over the defaults.
     * @returns {boolean}
     */
    window.initFillGrid = function(overrides = {}) {
      if (window.hot) {
        window.hot.destroy();
      }

      window.createdRowLog = [];
      window.hot = new Handsontable(container, Object.assign({
        data: window.buildCellLabels(10, 6),
        colHeaders: true,
        rowHeaders: true,
        renderer: testIdRenderer,
        fillHandle: true,
        licenseKey: 'non-commercial-and-evaluation',
        afterCreateRow(index, amount, source) {
          window.createdRowLog.push({ index, amount, source });
        },
      }, overrides));

      return true;
    };

    /**
     * The visual corners of the dashed fill preview while the fill handle is dragged, or `null`
     * when no preview is drawn.
     *
     * @returns {number[]|null}
     */
    window.fillPreviewCorners = function() {
      const fill = window.hot.selection.highlight.getFill();

      return fill.isEmpty() ? null : fill.getVisualCorners();
    };

    window.initFillGrid();
  </script>
</body>
</html>
