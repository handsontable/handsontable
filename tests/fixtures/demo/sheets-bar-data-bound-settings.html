<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The workbook under test, through the same fail-loud allowlist.
    window.htWorkbook = ({
      nestedRows: 'nestedRows',
      nestedRowsPadded: 'nestedRowsPadded',
      nestedSummary: 'nestedSummary',
      columnSummary: 'columnSummary',
      formulasSummary: 'formulasSummary',
      mergeCells: 'mergeCells',
    })[htParams.get('workbook') ?? 'nestedRows'];
    if (!window.htWorkbook) {
      throw new Error('Unknown ?workbook= value: ' + JSON.stringify(htParams.get('workbook')));
    }
    // The sheet the workbook opens on; absent keeps the workbook's own choice.
    window.htOpen = ({ 0: 0, 1: 1 })[htParams.get('open') ?? 'default'];
    if (htParams.has('open') && window.htOpen === undefined) {
      throw new Error('Unknown ?open= value: ' + JSON.stringify(htParams.get('open')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    Workbooks whose sheets declare a plugin that reads the grid's data when its settings are
    applied. A sheet switch applies the arriving sheet's settings while the grid still holds the
    departing sheet's data. `?open=` picks the sheet the workbook opens on.
    - nestedRows: 'Plain' (an array of arrays), 'Tree' (nested objects, `nestedRows: true`), and
      'Tree2' (`nestedRows: true`, a parent with three children, the second child hidden).
    - nestedRowsPadded: a grid-level `minRows: 5`, 'Plain', and 'Tree' with one parent and four
      children, five rows, so no padding row belongs to it.
    - nestedSummary: 'Plain', and 'Mixed' with both `nestedRows` and `columnSummary`: a parent with
      three children, the sum of rows 1-3 of `qty` written into the last child's row.
    - columnSummary: 10 rows of numbers (cell = row * 10 + column) on every sheet. 'Small' is 3
      columns wide, 'Big' writes the sum of C1:C9 into E10, 'Wide' has no summary, and 'Big2'
      writes the sum of B1:B9 into F10.
    - formulasSummary: a grid-level `formulas`, 'P' and 'S', both 20x6 numbers, 'S' writing the sum
      of C1:C9 into E20. The `umd` legs load HyperFormula as an external script; the `full-min` legs
      use the engine baked into the bundle.
    - mergeCells: 'A' 25x3, 'B' 34x9 with a merge, two hidden rows above it and three trimmed rows,
      'C' 33x15 with no settings. 'B' opens first.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    // The bundle under test, selected above from the sanitized allowlist. The closing tag is
    // split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    window.consoleMessages = [];
    ['error', 'warn'].forEach((level) => {
      const original = console[level].bind(console);

      console[level] = (...args) => {
        window.consoleMessages.push(`${level}: ${args.map(String).join(' ')}`);
        original(...args);
      };
    });

    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };
    const spreadsheet = Handsontable.helper.createSpreadsheetData;
    const numbers = (rows, cols) => Array.from({ length: rows }, (_, row) => Array.from({ length: cols }, (__, col) => row * 10 + col));

    const treeColumns = [{ data: 'name' }, { data: 'qty' }];
    const workbooks = {
      nestedRows: {
        sheetsBar: {
          sheets: [
            { name: 'Plain', data: [['a', 1]] },
            {
              name: 'Tree',
              data: [{ name: 'Parent', qty: 3, __children: [{ name: 'Child', qty: 1 }] }],
              settings: { nestedRows: true, columns: treeColumns },
            },
            {
              name: 'Tree2',
              data: [{
                name: 'Root',
                qty: 6,
                __children: [{ name: 'First', qty: 1 }, { name: 'Second', qty: 2 }, { name: 'Third', qty: 3 }],
              }],
              settings: { nestedRows: true, columns: treeColumns, hiddenRows: { rows: [2] } },
            },
          ],
        },
      },
      nestedRowsPadded: {
        grid: { minRows: 5 },
        sheetsBar: {
          sheets: [
            { name: 'Plain', data: [['a', 1]] },
            {
              name: 'Tree',
              data: [{
                name: 'Parent',
                qty: 10,
                __children: [{ name: 'C1', qty: 1 }, { name: 'C2', qty: 2 }, { name: 'C3', qty: 3 }, { name: 'C4', qty: 4 }],
              }],
              settings: { nestedRows: true, columns: treeColumns },
            },
          ],
        },
      },
      nestedSummary: {
        sheetsBar: {
          sheets: [
            { name: 'Plain', data: [['a', 1]] },
            {
              name: 'Mixed',
              data: [{
                name: 'Parent',
                qty: 6,
                __children: [{ name: 'C1', qty: 1 }, { name: 'C2', qty: 2 }, { name: 'C3', qty: 3 }],
              }],
              settings: {
                nestedRows: true,
                columns: treeColumns,
                columnSummary: [{ sourceColumn: 1, destinationRow: 3, destinationColumn: 0, type: 'sum', ranges: [[1, 3]] }],
              },
            },
          ],
        },
      },
      columnSummary: {
        sheetsBar: {
          sheets: [
            { name: 'Small', data: numbers(10, 3) },
            {
              name: 'Big',
              data: numbers(10, 6),
              settings: {
                columnSummary: [{ sourceColumn: 2, destinationRow: 9, destinationColumn: 4, type: 'sum', ranges: [[0, 8]] }],
              },
            },
            { name: 'Wide', data: numbers(10, 6) },
            {
              name: 'Big2',
              data: numbers(10, 6),
              settings: {
                columnSummary: [{ sourceColumn: 1, destinationRow: 9, destinationColumn: 5, type: 'sum', ranges: [[0, 8]] }],
              },
            },
          ],
        },
      },
      formulasSummary: {
        grid: { formulas: { engine: HyperFormula } },
        sheetsBar: {
          sheets: [
            { name: 'P', data: numbers(20, 6) },
            {
              name: 'S',
              data: numbers(20, 6),
              settings: {
                columnSummary: [{ sourceColumn: 2, destinationRow: 19, destinationColumn: 4, type: 'sum', ranges: [[0, 8]] }],
              },
            },
          ],
        },
      },
      mergeCells: {
        sheetsBar: {
          activeSheet: 1,
          sheets: [
            { name: 'A', data: spreadsheet(25, 3) },
            {
              name: 'B',
              data: spreadsheet(34, 9),
              settings: {
                mergeCells: [{ row: 13, col: 0, rowspan: 4, colspan: 1 }],
                hiddenRows: { rows: [11, 12] },
                trimRows: [25, 26, 27],
              },
            },
            { name: 'C', data: spreadsheet(33, 15) },
          ],
        },
      },
    };

    const { grid = {}, sheetsBar } = workbooks[window.htWorkbook];

    window.workbook = window.htOpen === undefined ? sheetsBar : { ...sheetsBar, activeSheet: window.htOpen };

    const hot = new Handsontable(container, {
      rowHeaders: true,
      colHeaders: true,
      renderer: testIdRenderer,
      width: 700,
      height: 600,
      ...grid,
      sheetsBar: window.workbook,
      licenseKey: 'non-commercial-and-evaluation',
    });

    window.hot = hot;
  </script>
</body>
</html>
