<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submenu position e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme, bundle, grid direction, document direction, and page width come from the ?theme=/?bundle=/
    // ?dir=/?doc=/?page= query params, mapped through fixed allowlists to LITERALS so a crafted param can
    // never be reflected into the document — no XSS. An ABSENT param keeps the default (main / plain
    // UMD / ltr / ltr / fit) so the fixture stays browsable by hand; an unknown value THROWS instead of
    // falling back — a typo in the project config must be one red leg, never a silently mislabeled green
    // one (nothing else asserts which file loaded).
    const htParams = new URLSearchParams(location.search);

    // Null-prototype maps, so an inherited key ('constructor', 'toString', ...) cannot pass as a value.
    const htThemes = Object.assign(Object.create(null), { main: 'main', horizon: 'horizon', classic: 'classic' });
    const htBundles = Object.assign(Object.create(null), { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' });
    const htDirections = Object.assign(Object.create(null), { ltr: 'ltr', rtl: 'rtl', inherit: 'inherit' });
    const htDocDirections = Object.assign(Object.create(null), { ltr: 'ltr', rtl: 'rtl' });
    const htPages = Object.assign(Object.create(null), { fit: 'fit', wide: 'wide' });

    window.htTheme = htThemes[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = htBundles[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The grid's `layoutDirection`: `inherit` takes the document's.
    window.htDirection = htDirections[htParams.get('dir') ?? 'ltr'];
    if (!window.htDirection) {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(htParams.get('dir')));
    }
    // The DOCUMENT's direction, set before the grid is built. The Jasmine placement tests #11505
    // deleted ran every case under both, with the grid's own direction set or inherited.
    window.htDocDirection = htDocDirections[htParams.get('doc') ?? 'ltr'];
    if (!window.htDocDirection) {
      throw new Error('Unknown ?doc= value: ' + JSON.stringify(htParams.get('doc')));
    }
    document.documentElement.setAttribute('dir', window.htDocDirection);
    // `wide` puts a spacer beside the grid, so the WINDOW can scroll sideways while the grid keeps its
    // size: the scroll handsontable#10967 was about, where a submenu mixed viewport and document
    // coordinates.
    window.htPage = htPages[htParams.get('page') ?? 'fit'];
    if (!window.htPage) {
      throw new Error('Unknown ?page= value: ' + JSON.stringify(htParams.get('page')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 0; } </style>
</head>
<body>
  <!--
    Where a menu's submenu opens relative to the item it belongs to. The grid fills the viewport so a
    right-click near any corner lands on a cell, and it has far more rows and columns than fit, so
    the holder can be scrolled to its bottom and inline end.

    Both menus are SHORT on purpose, three and two items long, with "Alignment" second. Short, because
    which way a submenu opens depends on the room left, and with the full default item list that room
    is one row-height change from flipping: from the top-left corner the Alignment submenu has about
    142 px to spare below on `main` and 5 px on `horizon`. With these menus every point the spec opens
    a menu at clears or misses the room it needs by 56 px or more on every theme. Second, because the
    row a submenu belongs to must not be the menu's first row, or a submenu anchored to the wrong row
    would line up anyway. The window can scroll only with `?page=wide`.
  -->
  <div id="grid" data-testid="grid"></div>
  <script>
    if (window.htPage === 'wide') {
      // Beside the grid, not under it, so the page scrolls sideways and the grid does not move down.
      document.body.style.width = '3000px';
      document.querySelector('[data-testid="grid"]').style.width = '1280px';
    }
  </script>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. The message is stamped on the container and the page object rethrows it,
    // so a broken build reads as its own error instead of a cell that never appeared.
    try {
      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(100, 50),
        renderer: testIdRenderer,
        layoutDirection: window.htDirection,
        rowHeaders: true,
        colHeaders: true,
        colWidths: 100,
        // As tall as the Desktop Chrome viewport (720px) allows, so the bottom corners are on cells.
        height: 700,
        contextMenu: ['copy', 'alignment', 'cut'],
        dropdownMenu: ['clear_column', 'alignment'],
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }
  </script>
</body>
</html>
