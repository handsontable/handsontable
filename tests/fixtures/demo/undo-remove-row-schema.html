<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } #toolbar { margin-bottom: .8rem; } </style>
</head>
<body>
  <!--
    E2E fixture for #5833: two grids whose dataSchema is a function returning non-plain rows.
    "getter" = constructor rows with a non-configurable derived getter (the reporter's fiddle).
    "accessor" = the docs' "Function data source and schema" pattern (function columns[].data).
  -->
  <h2>getter</h2>
  <div id="grid-getter" data-testid="grid-getter"></div>
  <h2>accessor</h2>
  <div id="grid-accessor" data-testid="grid-accessor"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    function testIdRenderer(prefix) {
      return function(instance, td, row, col, prop, value, cellProperties) {
        Handsontable.renderers.TextRenderer.apply(this, arguments);
        td.setAttribute('data-testid', prefix + '-cell-' + row + '-' + col);
      };
    }

    function DataObj(a, b, c) {
      this.a = a; this.b = b; this.c = c;
      Object.defineProperty(this, 'sum', {
        get: function() { return this.a + this.b + this.c; },
        enumerable: true,
      });
    }

    function model(person) {
      var pub = { id: undefined, name: undefined, address: undefined, attr: function() { return pub; } };
      var priv = {};
      // for...in on `undefined` is a no-op; Object.keys(undefined) throws. Handsontable calls
      // dataSchema() with no arguments to build its internal row template, so this must not throw.
      for (var key in person) {
        if (Object.prototype.hasOwnProperty.call(person, key)) { priv[key] = person[key]; }
      }
      pub.attr = function(attr, val) {
        if (typeof val === 'undefined') { return priv[attr]; }
        priv[attr] = val;
        return pub;
      };
      return pub;
    }
    function property(attr) { return function(row, value) { return row.attr(attr, value); }; }

    var common = { rowHeaders: true, colHeaders: true, contextMenu: true, undo: true, licenseKey: 'non-commercial-and-evaluation' };

    var getterContainer = document.querySelector('[data-testid="grid-getter"]');
    getterContainer.className = 'ht-theme-' + window.htTheme;
    window.hotGetter = new Handsontable(getterContainer, Object.assign({}, common, {
      data: [new DataObj(1, 2, 4), new DataObj(7, 4, 1), new DataObj(4, 1, 1)],
      dataSchema: function() { return new DataObj(null, null, null); },
      columns: [{ data: 'a' }, { data: 'b' }, { data: 'c' }, { data: 'sum' }],
      renderer: testIdRenderer('getter'),
    }));

    var accessorContainer = document.querySelector('[data-testid="grid-accessor"]');
    accessorContainer.className = 'ht-theme-' + window.htTheme;
    window.hotAccessor = new Handsontable(accessorContainer, Object.assign({}, common, {
      data: [
        model({ id: 1, name: 'Ted Right', address: 'A' }),
        model({ id: 2, name: 'Frank Honest', address: 'B' }),
        model({ id: 3, name: 'Joan Well', address: 'C' }),
      ],
      dataSchema: model,
      columns: [{ data: property('id') }, { data: property('name') }, { data: property('address') }],
      renderer: testIdRenderer('accessor'),
    }));
  </script>
</body>
</html>
