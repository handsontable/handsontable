<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The workbook under test, through the same fail-loud allowlist.
    window.htWorkbook = ({
      spareRows: 'spareRows',
      cellOption: 'cellOption',
      sameFreeze: 'sameFreeze',
      largerBorders: 'largerBorders',
      movedSummary: 'movedSummary',
      deeperHeaders: 'deeperHeaders',
    })[htParams.get('workbook') ?? 'spareRows'];
    if (!window.htWorkbook) {
      throw new Error('Unknown ?workbook= value: ' + JSON.stringify(htParams.get('workbook')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    Workbooks whose arriving sheet's settings describe its own data. A sheet switch used to apply
    them while the grid still held the departing sheet's data.
    - spareRows: 'Orders' (arrays, `minSpareRows: 1`) and 'Customers' (objects with a `columns` schema).
    - cellOption: 'Alpha' declares `cell: [{ row: 0, col: 0, readOnly: true }]`, 'Beta' declares nothing.
    - sameFreeze: 'A' and 'B' both declare `fixedRowsTop: 1`.
    - largerBorders: 'Small' (1 row) and 'Large' (10 rows, a top border on C6).
    - movedSummary: 'Notes' and 'Totals', whose sum of A1:A2 is written into A3.
    - deeperHeaders: a grid-level `collapsibleColumns`, 'Flat' with one header level and 'Deep' with
      two levels and `collapsibleColumns: false`.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The closing tag is
    // split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    window.pageErrors = [];
    window.addEventListener('error', event => window.pageErrors.push(event.message));

    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };
    const numbers = (rows, cols) => Array.from({ length: rows }, (_, row) => Array.from({ length: cols }, (__, col) => row * 10 + col));

    const workbooks = {
      spareRows: {
        sheetsBar: {
          sheets: [
            { name: 'Orders', data: [['o-1', 10], ['o-2', 20]], settings: { minSpareRows: 1 } },
            {
              name: 'Customers',
              data: [{ name: 'Ann', city: 'Oslo' }],
              settings: { columns: [{ data: 'name' }, { data: 'city' }] },
            },
          ],
        },
      },
      cellOption: {
        sheetsBar: {
          sheets: [
            { name: 'Alpha', data: [['locked', 'free']], settings: { cell: [{ row: 0, col: 0, readOnly: true }] } },
            { name: 'Beta', data: [['b1', 'b2']] },
          ],
        },
      },
      sameFreeze: {
        sheetsBar: {
          sheets: [
            { name: 'A', data: numbers(30, 3), settings: { fixedRowsTop: 1 } },
            { name: 'B', data: numbers(30, 3), settings: { fixedRowsTop: 1 } },
          ],
        },
      },
      largerBorders: {
        sheetsBar: {
          sheets: [
            { name: 'Small', data: numbers(1, 3) },
            {
              name: 'Large',
              data: numbers(10, 3),
              settings: { customBorders: [{ row: 5, col: 2, top: { width: 2, color: 'red' } }] },
            },
          ],
        },
      },
      movedSummary: {
        sheetsBar: {
          sheets: [
            { name: 'Notes', data: [['note']] },
            {
              name: 'Totals',
              data: [[1], [2], [null]],
              settings: {
                columnSummary: [{ sourceColumn: 0, destinationRow: 2, destinationColumn: 0, type: 'sum', ranges: [[0, 1]] }],
              },
            },
          ],
        },
      },
      deeperHeaders: {
        grid: { collapsibleColumns: true },
        sheetsBar: {
          sheets: [
            { name: 'Flat', data: numbers(3, 3), settings: { nestedHeaders: [['A', { label: 'Group', colspan: 2 }]] } },
            {
              name: 'Deep',
              data: numbers(3, 3),
              settings: {
                nestedHeaders: [[{ label: 'Top', colspan: 3 }], ['A', { label: 'Group', colspan: 2 }]],
                collapsibleColumns: false,
              },
            },
          ],
        },
      },
    };

    const { grid = {}, sheetsBar } = workbooks[window.htWorkbook];

    window.workbook = sheetsBar;

    const hot = new Handsontable(container, {
      rowHeaders: true,
      colHeaders: true,
      renderer: testIdRenderer,
      width: 600,
      height: 300,
      ...grid,
      sheetsBar,
      licenseKey: 'non-commercial-and-evaluation',
    });

    window.hot = hot;
  </script>
</body>
</html>
