<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hidden rows/columns Hide context-menu item e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    DEV-164. Right-clicking the top-left corner selects the whole table, and the HiddenRows /
    HiddenColumns plugins used to keep showing "Hide rows" / "Hide columns" on that selection even
    when every row / column was already hidden - a dead entry. Both plugins are on so the two Hide
    items are in the menu; the spec drives the hidden state through the plugin API and re-opens the
    menu on the corner.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // Stamp the row/column header cells so the spec can right-click a specific header - the
    // non-corner path through each Hide item's `hidden()`.
    const stampRowHeader = (row, TH) => TH.setAttribute('data-testid', `rowheader-${row}`);
    const stampColHeader = (col, TH) => TH.setAttribute('data-testid', `colheader-${col}`);

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. The message is stamped on the container and the page object rethrows it,
    // so a broken build reads as its own error instead of a cell that never appeared.
    try {
      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(5, 5),
        renderer: testIdRenderer,
        rowHeaders: true,
        colHeaders: true,
        // Pinned so the rendered window is the same on every theme.
        width: 700,
        height: 400,
        contextMenu: true,
        afterGetRowHeader: stampRowHeader,
        afterGetColHeader: stampColHeader,
        hiddenRows: true,
        hiddenColumns: true,
        // Enabled so the spec can drive the "every row gone but NOTHING hidden by the HiddenRows
        // plugin" state (a trimming map), where the Hide item must stay visible - one of the cases
        // that pins the second clause of `hidden()`. (There is no built-in column-trimming plugin;
        // the column clause is pinned with an empty grid instead - see `loadEmpty`.)
        trimRows: true,
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }

    /**
     * Hide the given visual rows through the plugin API and re-render. Driving the hidden state
     * this way rather than through the menu keeps the test independent of the item under test.
     *
     * @param {number[]} rows Visual row indexes to hide.
     */
    window.hideRows = (rows) => {
      window.hot.getPlugin('hiddenRows').hideRows(rows);
      window.hot.render();
    };

    /**
     * Hide the given visual columns through the plugin API and re-render.
     *
     * @param {number[]} columns Visual column indexes to hide.
     */
    window.hideColumns = (columns) => {
      window.hot.getPlugin('hiddenColumns').hideColumns(columns);
      window.hot.render();
    };

    /**
     * Trim the given visual rows (a trimming map, not a hiding map). Every row leaves the DOM, but
     * the HiddenRows plugin has hidden none of them — the state where the Hide item must stay.
     *
     * @param {number[]} rows Visual row indexes to trim.
     */
    window.trimRows = (rows) => {
      window.hot.getPlugin('trimRows').trimRows(rows);
      window.hot.render();
    };

    /**
     * Replace the data with an empty set, so the grid has no rows and no columns while the headers
     * still render. Renderable rows AND columns are 0, yet neither hiding plugin has hidden
     * anything - the state that pins the second clause of both Hide items' `hidden()`.
     */
    window.loadEmpty = () => {
      window.hot.updateSettings({ data: [] });
      window.hot.render();
    };
  </script>
</body>
</html>
