<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable license branding e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the license branding UI: the corner badge and its popover,
    and the Core-owned hard-stop lock screen. The license key comes from
    ?key= and the grid shape from ?variant=, both mapped through allowlists
    the same fail-loud way as ?theme=/?bundle=. The key alone does not decide
    the state — the spec pins the clock (page.clock) to the instant it wants,
    so one key covers the whole lifecycle.
  -->
  <!--
    Stands in for anything a host page has above the grid that the user could
    be typing into while the grid initializes (a login field, a filter box).
    The lock must not steal its focus - see the lock focus specs.
  -->
  <input id="outside-field" data-testid="outside-field" type="text" />

  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    // The license keys, generated by the `license-key` package and shared with
    // the unit fixtures (handsontable/src/utils/entitlementLicenseKey/__tests__/fixtures.js).
    // Each is the whole key folded to one line - the form the generator prints
    // for pasting. These keys are in the current format, which protects the
    // text, so the block alone would read as invalid.
    //
    //   trial                 — usage_until 2026-09-26, notice 45, grace 15, flag `trial`
    //   trial-external        — the same, with `no-ui-warns` added
    //   subscription          — usage_until 2027-08-12, notice 60, grace 90, no flags
    //   subscription-external — the same, with `no-console-warns` + `no-ui-warns`
    const LICENSE_KEYS = {
      trial: 'This is a Handsontable license key for Test Fixture, issued on 2026-08-12 for the "Fixture Project" project. It includes 1 license: > 1. Trial license under Handsontable Evaluation License Agreement 4.0 of 2026-03-02, for Handsontable on the Enterprise package, for internal use, valid until 2026-09-26 (UTC). Not licensed for production use. To purchase a license, contact sales@handsontable.com. [eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI2LTA5LTI2Iiwibm90aWNlIjo0NSwiZ3JhY2UiOjE1LCJmbGFncyI6WyJ0cmlhbCJdfX0sInYiOjIsInByb3NlIjoiMzg3MzYxOTE5Yzc1YTQ0NTA4NGZmNmM1MmYwMmM0ZDJjNmMyMTVhYzc2YjFkMGRiYTZiMDkzODFmMDkwNjg1YSJ973a630de3fb4f97dd3d82647b57149489e48114b83ac7d5ca92d370a0be18246eecfedca9c2671de91a39840c8c2b6964b5756bf3fc2b7adbe0718167ea55b50]',
      // A trial issued for external use. `no-ui-warns` must silence the badge and the bar, and must
      // NOT silence the hard-stop lock - the flag suppresses warnings, not enforcement.
      'trial-external': 'This is a Handsontable license key for Test Fixture, issued on 2026-08-12 for the "Fixture Project" project. It includes 1 license: > 1. Trial license under Handsontable Evaluation License Agreement 4.0 of 2026-03-02, for Handsontable on the Enterprise package, for internal use, valid until 2026-09-26 (UTC). Not licensed for production use. To purchase a license, contact sales@handsontable.com. [eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI2LTA5LTI2Iiwibm90aWNlIjo0NSwiZ3JhY2UiOjE1LCJmbGFncyI6WyJ0cmlhbCIsIm5vLXVpLXdhcm5zIl19fSwidiI6MiwicHJvc2UiOiIzODczNjE5MTljNzVhNDQ1MDg0ZmY2YzUyZjAyYzRkMmM2YzIxNWFjNzZiMWQwZGJhNmIwOTM4MWYwOTA2ODVhIn0c1dccd7855f9004db2a062d37bdec85f616193de27387b34733659025c4b89e39d18db26e78546db6a8406bc791ae32ecdca985330896764429cc1cf4b1b80b5]',
      subscription: 'This is a Handsontable license key for Test Fixture, issued on 2026-08-12 for the "Fixture Project" project. It includes 1 license: > 1. Subscription license under Handsontable Subscription License Agreement 2.0 of 2022-05-21, for Handsontable on the Enterprise package, for internal use, valid until 2027-08-12 (UTC). Use after that date is not permitted. To renew, contact sales@handsontable.com. [eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI3LTA4LTEyIiwibm90aWNlIjo2MCwiZ3JhY2UiOjkwLCJmbGFncyI6W119fSwidiI6MiwicHJvc2UiOiIwNjIzNWUxYjY5ZmQ1YjNmNjg2NjdhNTcxNmU5YWY5YWU5YTkxYjNkNzc5ZTBlY2FkODIyMjQ2NDU1YjUxZTA0In0e9c5c2a5838f3daf149124a7ad1a4e30710d8367b4814bb1a0092032677fa10fb605cb4325db23ae9078a30024d5df992c12074ab7a31321ef237d22573316fc]',
      'subscription-external': 'This is a Handsontable license key for Test Fixture, issued on 2026-08-12 for the "Fixture Project" project. It includes 1 license: > 1. Subscription license under Handsontable Subscription License Agreement 2.0 of 2022-05-21, for Handsontable on the Enterprise package, for external use, valid until 2027-08-12 (UTC). Use after that date is not permitted. To renew, contact sales@handsontable.com. [eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI3LTA4LTEyIiwibm90aWNlIjo2MCwiZ3JhY2UiOjkwLCJmbGFncyI6WyJuby1jb25zb2xlLXdhcm5zIiwibm8tdWktd2FybnMiXX19LCJ2IjoyLCJwcm9zZSI6IjM1MTdlM2I0OTcyN2Q4MTRlZThlYzY5YWZlOWIwZjJjMWE3YWFmOTYwODc5ZTJlYTNlOTI3NzRhMjg5NDcwNmYifQd5c0390306d9214d72e9d2fe4cb70b658e29c92084b0be19ef2cf00fb79f02c408532752361d68c43e596701f0d56f7f5b41670f37f511fbf43e175b868a6c6e]',
      // The trial key as license-key 4.x issued it, in the earlier format - the shape of the
      // trial keys already in the field. It must read exactly like `trial`.
      'trial-v1': 'This is a Handsontable license key for Test Fixture, issued on 2026-08-12 for the "Fixture Project" project. It includes 1 license: > 1. Trial license under Handsontable Evaluation License Agreement 4.0 of 2026-03-02, for Handsontable on the Enterprise package, for internal use, valid until 2026-09-26 (UTC). Not licensed for production use. To purchase a license, contact sales@handsontable.com. [eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI2LTA5LTI2Iiwibm90aWNlIjo0NSwiZ3JhY2UiOjE1LCJmbGFncyI6WyJ0cmlhbCJdfX19a687a9f4d0d496c1ec86d97d58e971b458995f1a68ca117a6b406fa2f179923dcd42a789e3c56426690cf12c89e70abfbb6f45b96ba55fe49386d9e1b0080f2c]',
      // The two install faults, which block from 18.1 on: the subscription key with the last two
      // characters of its checksum changed, and no key at all. `missing` is the empty string - the
      // fixture only sets `licenseKey` when the value is non-empty.
      tampered: 'This is a Handsontable license key for Test Fixture, issued on 2026-08-12 for the "Fixture Project" project. It includes 1 license: > 1. Subscription license under Handsontable Subscription License Agreement 2.0 of 2022-05-21, for Handsontable on the Enterprise package, for internal use, valid until 2027-08-12 (UTC). Use after that date is not permitted. To renew, contact sales@handsontable.com. [eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI3LTA4LTEyIiwibm90aWNlIjo2MCwiZ3JhY2UiOjkwLCJmbGFncyI6W119fSwidiI6MiwicHJvc2UiOiIwNjIzNWUxYjY5ZmQ1YjNmNjg2NjdhNTcxNmU5YWY5YWU5YTkxYjNkNzc5ZTBlY2FkODIyMjQ2NDU1YjUxZTA0In0e9c5c2a5838f3daf149124a7ad1a4e30710d8367b4814bb1a0092032677fa10fb605cb4325db23ae9078a30024d5df992c12074ab7a31321ef237d2257331600]',
      // A real legacy key that expired on 23/05/2011: valid once, merely lapsed - it must KEEP its
      // bottom bar while the two faults above take the modal.
      'legacy-expired': 'd0134-95841-770f2-c4f21-3751d',
      // The same free key the docs tell people to paste, with the trailing newline an email or a
      // chat window adds to it. It is a LICENSED grid: the whitespace must be trimmed away before
      // the key is classified, or the checksum fails, the key reads as invalid, and 18.1 locks a
      // grid that is entitled to run.
      'non-commercial-padded': 'non-commercial-and-evaluation\n',
      missing: '',
    };

    // Four forms of the subscription key that test that the key protects its text, and the
    // stores a key goes through:
    //   bare-block           - the machine-readable block alone, without the prose (invalid)
    //   edited-prose         - one date in the prose changed, the block untouched (invalid)
    //   subscription-pasted  - every space turned into a CRLF line break, and a line break saved
    //                          as the two characters "\n" at the end, as some .env files and CI
    //                          secrets store one (valid)
    //   subscription-wrapped - the block broken into lines of 60 characters, as a mail client
    //                          wraps it (valid)
    LICENSE_KEYS['bare-block'] = LICENSE_KEYS.subscription.slice(LICENSE_KEYS.subscription.lastIndexOf('['));
    LICENSE_KEYS['edited-prose'] = LICENSE_KEYS.subscription.replace('valid until 2027-08-12', 'valid until 2099-08-12');
    LICENSE_KEYS['subscription-pasted'] = `${LICENSE_KEYS.subscription.replace(/ /g, '\r\n')}\\n`;
    LICENSE_KEYS['subscription-wrapped'] = LICENSE_KEYS.subscription.slice(0, LICENSE_KEYS.subscription.lastIndexOf('[')) +
      LICENSE_KEYS.subscription.slice(LICENSE_KEYS.subscription.lastIndexOf('[')).match(/.{1,60}/g).join('\n');

    // The grid shapes the branding has to survive. Each one exists because it
    // moves the corner: no corner cell at all, a corner narrower than the
    // glyph, a corner holding frozen DATA cells, or a second (nested) grid
    // with a corner clone of its own inside this root.
    const VARIANTS = {
      default: { rowHeaders: true, colHeaders: true },
      'no-row-headers': { rowHeaders: false, colHeaders: true },
      'no-headers-frozen': { rowHeaders: false, colHeaders: false, fixedRowsTop: 2, fixedColumnsStart: 2 },
      'narrow-corner': { rowHeaders: true, colHeaders: true, rowHeaderWidth: 16 },
      dialog: { rowHeaders: true, colHeaders: true, dialog: true },
      // A grid narrower than the modal's longest unbreakable token
      // ('non-commercial-and-evaluation', 29 chars). `width` comes after the shared default below,
      // so the variant wins.
      narrow: { rowHeaders: true, colHeaders: true, width: 150 },
      nested: {
        rowHeaders: true,
        colHeaders: true,
        columns: [
          {
            type: 'handsontable',
            handsontable: { data: [['a', 'b'], ['c', 'd']], rowHeaders: true, colHeaders: true },
          },
          {}, {},
        ],
      },
    };

    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const keyName = htParams.get('key') ?? 'trial';
    const variantName = htParams.get('variant') ?? 'default';

    if (!Object.prototype.hasOwnProperty.call(LICENSE_KEYS, keyName)) {
      throw new Error('Unknown ?key= value: ' + JSON.stringify(keyName));
    }
    if (!Object.prototype.hasOwnProperty.call(VARIANTS, variantName)) {
      throw new Error('Unknown ?variant= value: ' + JSON.stringify(variantName));
    }

    // Focused BEFORE the grid is constructed, so a lock that grabs the keyboard at
    // init would visibly take it from here. The specs assert this keeps focus.
    document.querySelector('[data-testid="outside-field"]').focus();

    // `window.hot` is the handle the page object drives for the API-level steps
    // (updateSettings, destroy, the app's own dialogs, reading the selection).
    window.hot = new Handsontable(container, {
      data: [
        ['A1', 'B1', 'C1'],
        ['A2', 'B2', 'C2'],
        ['A3', 'B3', 'C3'],
        ['A4', 'B4', 'C4'],
      ],
      width: 400,
      height: 200,
      ...(LICENSE_KEYS[keyName] === '' ? {} : { licenseKey: LICENSE_KEYS[keyName] }),
      ...VARIANTS[variantName],
    });
  </script>
</body>
</html>
