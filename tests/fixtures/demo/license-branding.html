<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable license branding e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for the license branding UI: the corner badge and its popover,
    and the Core-owned hard-stop lock screen. The license key comes from
    ?key= and the grid shape from ?variant=, both mapped through allowlists
    the same fail-loud way as ?theme=/?bundle=. The key alone does not decide
    the state — the spec pins the clock (page.clock) to the instant it wants,
    so one key covers the whole lifecycle.
  -->
  <!--
    Stands in for anything a host page has above the grid that the user could
    be typing into while the grid initializes (a login field, a filter box).
    The lock must not steal its focus - see the lock focus specs.
  -->
  <input id="outside-field" data-testid="outside-field" type="text" />

  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    // The license keys, generated by the `license-key` package and shared with
    // the unit fixtures (handsontable/src/utils/entitlementLicenseKey/__tests__/fixtures.js).
    // Only the machine-readable block is kept: the prose in front of it is
    // neither parsed nor checksummed, so the block reads identically.
    //
    //   trial                 — usage_until 2026-09-26, notice 45, grace 15, flag `trial`
    //   trial-external        — the same, with `no-ui-warns` added
    //   subscription          — usage_until 2027-08-12, notice 60, grace 90, no flags
    //   subscription-external — the same, with `no-console-warns` + `no-ui-warns`
    const LICENSE_KEYS = {
      trial: '[eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI2LTA5LTI2Iiwibm90aWNlIjo0NSwiZ3JhY2UiOjE1LCJmbGFncyI6WyJ0cmlhbCJdfX19a687a9f4d0d496c1ec86d97d58e971b458995f1a68ca117a6b406fa2f179923dcd42a789e3c56426690cf12c89e70abfbb6f45b96ba55fe49386d9e1b0080f2c]',
      // A trial issued for external use. `no-ui-warns` must silence the badge and the bar, and must
      // NOT silence the hard-stop lock - the flag suppresses warnings, not enforcement.
      'trial-external': '[eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI2LTA5LTI2Iiwibm90aWNlIjo0NSwiZ3JhY2UiOjE1LCJmbGFncyI6WyJ0cmlhbCIsIm5vLXVpLXdhcm5zIl19fX0dbeff87ec565b90d59175cd5aa86b93abd4164fc2967f9156e289f5db90f0b8c19ddfb44efd92a165b2d1c568c0097c78c243701acf200487372dc8b45a0f1be]',
      subscription: '[eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI3LTA4LTEyIiwibm90aWNlIjo2MCwiZ3JhY2UiOjkwLCJmbGFncyI6W119fX03de5d59e480be17d3c8cd340cb242cab64cac7888cbfba6c975c194f6613b8103792a6929f66852d18c7ac27c8c25fa9ab8a25b5e25f331669746c833a4f8361]',
      'subscription-external': '[eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI3LTA4LTEyIiwibm90aWNlIjo2MCwiZ3JhY2UiOjkwLCJmbGFncyI6WyJuby1jb25zb2xlLXdhcm5zIiwibm8tdWktd2FybnMiXX19fQbf6f3e8356a12fe1b2553ccd263dbc9a6f94c1fdc1aab949b3550865cb150c79027aa06a11c7618d5cbd1e14c4b73dc35f6bb81cd8c33c474194d082e2951106]',
      // The two install faults, which block from 18.1 on: the subscription key with its checksum
      // broken at the payload boundary, and no key at all. `missing` is the empty string - the
      // fixture only sets `licenseKey` when the value is non-empty.
      tampered: '[eyJwcm9kdWN0cyI6eyJoYW5kc29udGFibGUiOnsiY2FwYWJpbGl0aWVzIjpbImNvcmUiXSwidXNhZ2VfdW50aWwiOiIyMDI3LTA4LTEyIiwibm90aWNlIjo2MCwiZ3JhY2UiOjkwLCJmbGFncyI6W119fX03de5d59e480be17d3c8cd340cb242cab64cac7888cbfba6c975c194f6613b8103792a6929f66852d18c7ac27c8c25fa9ab8a25b5e25f331669746c833a4f8300]',
      // A real legacy key that expired on 23/05/2011: valid once, merely lapsed - it must KEEP its
      // bottom bar while the two faults above take the modal.
      'legacy-expired': 'd0134-95841-770f2-c4f21-3751d',
      // The same free key the docs tell people to paste, with the trailing newline an email or a
      // chat window adds to it. It is a LICENSED grid: the whitespace must be trimmed away before
      // the key is classified, or the checksum fails, the key reads as invalid, and 18.1 locks a
      // grid that is entitled to run.
      'non-commercial-padded': 'non-commercial-and-evaluation\n',
      missing: '',
    };

    // The grid shapes the branding has to survive. Each one exists because it
    // moves the corner: no corner cell at all, a corner narrower than the
    // glyph, a corner holding frozen DATA cells, or a second (nested) grid
    // with a corner clone of its own inside this root.
    const VARIANTS = {
      default: { rowHeaders: true, colHeaders: true },
      'no-row-headers': { rowHeaders: false, colHeaders: true },
      'no-headers-frozen': { rowHeaders: false, colHeaders: false, fixedRowsTop: 2, fixedColumnsStart: 2 },
      'narrow-corner': { rowHeaders: true, colHeaders: true, rowHeaderWidth: 16 },
      dialog: { rowHeaders: true, colHeaders: true, dialog: true },
      // A grid narrower than the modal's longest unbreakable token
      // ('non-commercial-and-evaluation', 29 chars). `width` comes after the shared default below,
      // so the variant wins.
      narrow: { rowHeaders: true, colHeaders: true, width: 150 },
      nested: {
        rowHeaders: true,
        colHeaders: true,
        columns: [
          {
            type: 'handsontable',
            handsontable: { data: [['a', 'b'], ['c', 'd']], rowHeaders: true, colHeaders: true },
          },
          {}, {},
        ],
      },
    };

    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const keyName = htParams.get('key') ?? 'trial';
    const variantName = htParams.get('variant') ?? 'default';

    if (!Object.prototype.hasOwnProperty.call(LICENSE_KEYS, keyName)) {
      throw new Error('Unknown ?key= value: ' + JSON.stringify(keyName));
    }
    if (!Object.prototype.hasOwnProperty.call(VARIANTS, variantName)) {
      throw new Error('Unknown ?variant= value: ' + JSON.stringify(variantName));
    }

    // Focused BEFORE the grid is constructed, so a lock that grabs the keyboard at
    // init would visibly take it from here. The specs assert this keeps focus.
    document.querySelector('[data-testid="outside-field"]').focus();

    // `window.hot` is the handle the page object drives for the API-level steps
    // (updateSettings, destroy, the app's own dialogs, reading the selection).
    window.hot = new Handsontable(container, {
      data: [
        ['A1', 'B1', 'C1'],
        ['A2', 'B2', 'C2'],
        ['A3', 'B3', 'C3'],
        ['A4', 'B4', 'C4'],
      ],
      width: 400,
      height: 200,
      ...(LICENSE_KEYS[keyName] === '' ? {} : { licenseKey: LICENSE_KEYS[keyName] }),
      ...VARIANTS[variantName],
    });
  </script>
</body>
</html>
