<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - nested headers with an unlabeled group cell</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    window.htAriaTags = ({ on: true, off: false })[htParams.get('aria') ?? 'on'];
    if (window.htAriaTags === undefined) {
      throw new Error('Unknown ?aria= value: ' + JSON.stringify(htParams.get('aria')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    A nestedHeaders group row shorter than the column count. Nested headers fill the columns the
    row does not cover with header cells that have no label (visual columns in brackets):

      level 0:  Info [0] | Details [1-4]   | Extra [5] | (empty) [6] [7] [8] [9]
      level 1:  L0 ... L9

    Theme, bundle and ariaTags come from query params, mapped through fixed allowlists to literals;
    an unknown value throws. `ariaTags` can only be set at construction, which is why it is a param.

    Every header cell is stamped `data-testid="col-header-<level>-<column>"`, with the level as the
    `afterGetColHeader` hook reports it (0 is the top level). The top overlay renders the copy of each
    header the user sees, so the page object scopes these ids to `.ht_clone_top`.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    try {
      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(30, 10),
        colHeaders: true,
        nestedHeaders: [
          ['Info', { label: 'Details', colspan: 4 }, 'Extra'],
          ['L0', 'L1', 'L2', 'L3', 'L4', 'L5', 'L6', 'L7', 'L8', 'L9'],
        ],
        ariaTags: window.htAriaTags,
        afterGetColHeader(column, TH, level) {
          TH.setAttribute('data-testid', `col-header-${level}-${column}`);
        },
        height: 300,
        licenseKey: window.htTestLicenseKey,
      });
    } catch (error) {
      window.htBuildError = String(error && error.stack || error);
    }
  </script>
</body>
</html>
