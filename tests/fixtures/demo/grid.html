<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Active theme from the ?theme= query param set by the Playwright project.
    // Mapped through a fixed allowlist to a LITERAL (default main), so a crafted
    // ?theme= can never be reflected into the document — no XSS. Exposed as
    // window.htTheme so the grid init below reuses the sanitized value.
    window.htTheme = ({ horizon: 'horizon', classic: 'classic' })[new URLSearchParams(location.search).get('theme')] || 'main';
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // Active bundle from the ?bundle= query param set by the Playwright project
    // — 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads). Same
    // allowlist-to-literal pattern as the theme, so the param can never be
    // reflected into the document.
    window.htBundle = ({ 'full-min': 'handsontable.full.min.js' })[new URLSearchParams(location.search).get('bundle')] || 'handsontable.js';
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } #toolbar { margin-bottom: .8rem; } </style>
</head>
<body>
  <!--
    E2E fixture. Cells are stamped with data-testid via a renderer so tests hook
    into them unambiguously (data-testid="cell-<row>-<col>") instead of brittle
    structural selectors. This mirrors the convention the authoring skill teaches.
  -->
  <div id="toolbar">
    <button data-testid="add-row" type="button">Add row</button>
  </div>
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const hot = new Handsontable(container, {
      data: [
        ['A1', 'B1', 'C1'],
        ['A2', 'B2', 'C2'],
        ['A3', 'B3', 'C3'],
        ['A4', 'B4', 'C4'],
        ['A5', 'B5', 'C5'],
      ],
      colHeaders: true,
      rowHeaders: true,
      renderer: testIdRenderer,
      licenseKey: 'non-commercial-and-evaluation',
    });

    document.querySelector('[data-testid="add-row"]').addEventListener('click', () => {
      hot.alter('insert_row_below', hot.countRows() - 1);
    });
  </script>
</body>
</html>
