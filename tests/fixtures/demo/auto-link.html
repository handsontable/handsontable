<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>autoLink e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    Grid for the `autoLink` option (DEV-2804): URLs found in the rendered text of a cell are wrapped
    in anchors after the cell's own renderer ran. Column A is plain text, column B opts out, column C
    has a custom renderer that writes a span, column D is the `html` cell type holding a user anchor,
    column E has a memoizing renderer, column F holds HYPERLINK formulas so a spec can prove the two
    features converge on one anchor, column G runs in whole-cell mode, and column H has
    `autoLink.strict: false`, which also links bare domains and bare email addresses. HyperFormula is loaded on
    the base-bundle legs only, the same way the formulas fixture does it.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // A same-origin page, so a real click navigation stays local and offline-safe.
    window.localPageUrl = `${location.origin}/tests/fixtures/demo/grid.html`;

    // A renderer that writes its own element into the cell.
    function markerRenderer(instance, td, row, col, prop, value) {
      td.textContent = '';

      const mark = document.createElement('span');

      mark.className = 'custom-mark';
      mark.textContent = value === null || value === undefined ? '' : String(value);
      td.appendChild(mark);
    }

    // A renderer that leaves the cell's DOM untouched when the rendered value has not changed.
    function memoRenderer(instance, td, row, col, prop, value) {
      const next = value === null || value === undefined ? '' : String(value);
      const key = `${row}:${col}:${next}`;

      if (td.dataset.memo === key) {
        return;
      }

      td.dataset.memo = key;
      td.textContent = next;
    }

    window.hot = new Handsontable(container, {
      data: [
        ['https://example.com/one', 'https://example.com/optout', 'go https://example.com/marked', '<a href="https://example.com/user">user link</a>', 'https://example.com/memo', '=HYPERLINK("https://example.com/hf", "HF label")', 'https://example.com/whole', 'google.com'],
        ['Visit https://example.com/two for details.', 'b2', 'c2', 'd2', 'e2', '=HYPERLINK("https://example.com/raw")', 'see https://example.com/inline-off', 'www.example.org/docs'],
        ['mailto:someone@example.com', 'b3', 'c3', 'd3', 'e3', '=HYPERLINK("mailto:hf@example.com")', ' https://example.com/padded ', 'ana.garcia@example.com'],
        ['tel:+48123456789', 'b4', 'c4', 'd4', 'e4', 'f4', 'g4', 'README.md'],
        ['(see https://example.com/paren).', 'b5', 'c5', 'd5', 'e5', 'f5', 'g5', 'report.zip'],
        ['https://example.com/cell-optout', 'b6', 'c6', 'd6', 'e6', 'f6', 'g6', 'node.js'],
        [window.localPageUrl, 'b7', 'c7', 'd7', 'e7', 'f7', 'g7', 'Visit handsontable.com today.'],
        ['javascript:alert(1)', 'b8', 'c8', 'd8', 'e8', 'f8', 'g8', '1.2.3'],
        ['plain text', 'b9', 'c9', 'd9', 'e9', 'f9', 'g9', 'x'],
        ['https://example.com/hotel:deals', 'b10', 'c10', 'd10', 'e10', 'f10', 'g10', 'x'],
        ['https://a.com/xhttps://b.com/y', 'b11', 'c11', 'd11', 'e11', 'f11', 'g11', 'x'],
        ['Grand Hotel:Warsaw', 'b12', 'c12', 'd12', 'e12', 'f12', 'g12', 'x'],
        ['https://web.archive.org/web/2020/https://example.com', 'b13', 'c13', 'd13', 'e13', 'f13', 'g13', 'x'],
        ['https://example.com/a,mailto:b@example.com', 'b14', 'c14', 'd14', 'e14', 'f14', 'g14', 'x'],
        ['google.com', 'b15', 'c15', 'd15', 'e15', 'f15', 'g15', 'x'],
      ],
      autoLink: true,
      formulas: {
        engine: HyperFormula,
        sheetName: 'Sheet1',
        hyperlinks: true,
      },
      columns: [
        {},
        { autoLink: false },
        { renderer: markerRenderer },
        { renderer: 'html' },
        { renderer: memoRenderer },
        {},
        { autoLink: { inline: false } },
        { autoLink: { strict: false } },
      ],
      cells(row, col) {
        if (row === 5 && col === 0) {
          return { autoLink: false };
        }

        if (row === 4 && col === 0) {
          return { autoLink: { target: '_self', className: 'cell-override' } };
        }

        return {};
      },
      // Explicit widths, not auto-sizing: autoColumnSize measures the theme's own font metrics, so
      // the same long-URL content renders at a different width per theme (see tests/AGENTS.md). A
      // fixed width keeps every column, including the last one, inside the rendered band on all six
      // theme x bundle legs. The grid width comfortably exceeds their sum so nothing is virtualized
      // out of the DOM. The height is generous on the row axis the same way: horizon's rows render
      // taller than main's and classic's, and a height sized only for main's row height virtualized
      // the fixture's last data row out of the DOM on horizon (DEV-2804 review).
      colWidths: [220, 160, 200, 90, 160, 160, 220, 200],
      width: 1650,
      height: 800,
      rowHeaders: true,
      colHeaders: true,
      // Stamp test ids without displacing the per-column renderers.
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: 'non-commercial-and-evaluation',
    });
  </script>
</body>
</html>
