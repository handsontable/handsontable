<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - header markup gate</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    Fixture for the markup gate that picks a header's write path (DEV-2642).

    `fastInnerHTML` writes through `innerHTML` when `HTML_CHARACTERS` matches and
    through `textContent` when it does not, so the header label is what is
    parameterized here. Cell data is deliberately fixed and markup-free:
    `textRenderer` writes through `fastInnerText`, so cell values never reach the
    gate however they are spelled.

    The contract has two halves and the fixture has to be able to show both. Prose
    that merely contains `&`, `;`, `<` or `>` must render as text, untouched by the
    sanitizer and with no missing-sanitizer warning. A label holding real markup or
    a real character reference must still take the HTML path.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // Header labels, keyed by ?colHeader=/?nested=. Literals rather than reflected
    // params, for the same reason the theme and bundle are.
    const LABELS = {
      prose: 'Smith & Sons, Ltd.; est. 1920',
      angle: 'Score < 50 > threshold',
      markup: '<b data-testid="markup-marker">ID</b>',
      entity: 'a &amp; b',
    };

    /**
     * Reads one label param, throwing on an unknown value rather than falling back,
     * so a typo in a spec is a red leg instead of a green one asserting nothing.
     */
    const readLabel = (name) => {
      const key = htParams.get(name);

      if (key === null) {
        return null;
      }

      if (!(key in LABELS)) {
        throw new Error('Unknown ?' + name + '= value: ' + JSON.stringify(key));
      }

      return LABELS[key];
    };

    const colHeaderLabel = readLabel('colHeader');
    const nestedLabel = readLabel('nested');

    // Every missing-sanitizer warning the grid emits. The gate decides whether one
    // is warranted at all, so its absence is an assertion, not an absence of one.
    window.__warnings = [];
    const originalWarn = console.warn;

    console.warn = (...args) => {
      window.__warnings.push(args.map(String).join(' '));
      originalWarn.apply(console, args);
    };

    // Every (content, source) pair the grid hands to the sanitizer, so a spec can
    // assert that plain text never reaches it.
    window.__sanitizerCalls = [];

    // ?sanitizer=truncate installs one that rewrites plain text. If the gate ever
    // let a prose label through, the measured and the rendered label would disagree
    // and the column would be sized to a string the user never sees.
    const sanitizer = htParams.get('sanitizer') === 'truncate'
      ? (content, source) => {
        window.__sanitizerCalls.push([content, source]);

        return content.slice(0, 5);
      }
      : undefined;

    const settings = {
      data: [['A1', 'B1'], ['A2', 'B2'], ['A3', 'B3']],
      rowHeaders: true,
      colHeaders: colHeaderLabel === null ? ['A', 'B'] : [colHeaderLabel, 'B'],
      licenseKey: 'non-commercial-and-evaluation',
    };

    if (nestedLabel !== null) {
      settings.nestedHeaders = [
        [{ label: nestedLabel, colspan: 2 }],
        ['A', 'B'],
      ];
    }

    if (sanitizer !== undefined) {
      settings.sanitizer = sanitizer;
    }

    // Reported rather than thrown: a spec asserting that the grid built has to be
    // able to tell "built" from "threw" without reading the console.
    window.__constructed = false;

    try {
      window.hot = new Handsontable(container, settings);
      window.__constructed = true;
    } catch (error) {
      window.__constructError = String(error);
    }
  </script>
</body>
</html>
