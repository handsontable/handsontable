<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Narrow list cell truncation fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);
    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // Only the two cell types that render `htAutocompleteArrow` and wrap around it (#2545 / DEV-28).
    window.htCellType = ({ autocomplete: 'autocomplete', dropdown: 'dropdown' })[htParams.get('cellType') ?? 'autocomplete'];
    if (!window.htCellType) {
      throw new Error('Unknown ?cellType= value: ' + JSON.stringify(htParams.get('cellType')));
    }
    // `narrow` forces a 60px column so a long value cannot fit on one line; `autosize` lets
    // `autoColumnSize` grow the column and asserts nothing is truncated.
    window.htMode = ({ narrow: 'narrow', autosize: 'autosize' })[htParams.get('mode') ?? 'narrow'];
    if (!window.htMode) {
      throw new Error('Unknown ?mode= value: ' + JSON.stringify(htParams.get('mode')));
    }
    window.htDir = ({ ltr: 'ltr', rtl: 'rtl' })[htParams.get('dir') ?? 'ltr'];
    if (!window.htDir) {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(htParams.get('dir')));
    }
  </script>
</head>
<body>
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const CHOICES = ['Al', 'Connecticut readjustment authority', 'Alto'];
    // A long value that overflows a narrow column, and a short one on the same column that fits on a
    // single line - the short cell is the single-line height reference the wrap check compares against
    // (row heights are per-row, so a wrapping long cell grows only its own row).
    const LONG = 'Connecticut readjustment authority';
    const SHORT = 'Al';

    const column = { type: window.htCellType, source: CHOICES };

    const settings = window.htMode === 'autosize'
      ? {
        data: [[LONG], [SHORT]],
        columns: [column],
        autoColumnSize: true,
      }
      : {
        data: [[LONG, LONG], [SHORT, SHORT], [null, null]],
        columns: [{ ...column, width: 60 }, { ...column, width: 60 }],
      };

    window.hot = new Handsontable(container, {
      ...settings,
      layoutDirection: window.htDir,
      colHeaders: true,
      rowHeaders: true,
      // Stamp test ids from `afterRenderer`: a column `type` installs its own renderer, which would
      // override a grid-level `renderer` and leave the typed columns with no test id.
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: 'non-commercial-and-evaluation',
    });
  </script>
</body>
</html>
