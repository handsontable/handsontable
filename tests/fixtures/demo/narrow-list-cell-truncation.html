<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Narrow list cell truncation fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);
    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The three cell types that render `htAutocompleteArrow`: `dropdown` and `handsontable` both
    // delegate to `autocompleteRenderer` like `autocomplete` (DEV-28).
    window.htCellType = ({ autocomplete: 'autocomplete', dropdown: 'dropdown', handsontable: 'handsontable' })[htParams.get('cellType') ?? 'autocomplete'];
    if (!window.htCellType) {
      throw new Error('Unknown ?cellType= value: ' + JSON.stringify(htParams.get('cellType')));
    }
    // `narrow` forces a 60px column so a long value cannot fit; `tall` adds a large `rowHeights` so
    // the single-line cell sits in a tall row (to check the arrow stays beside the first line, not
    // centered); `autosize` lets `autoColumnSize` grow the column and asserts nothing is truncated;
    // `exact` is `narrow` plus the engine's `rowHeightMode: 'exact'`, which moves the cell content
    // into an absolutely positioned `.htCellClip` wrapper (the DEV-28 arrow reservation must follow
    // it there).
    window.htMode = ({ narrow: 'narrow', tall: 'tall', autosize: 'autosize', exact: 'exact', autorowsize: 'autorowsize' })[htParams.get('mode') ?? 'narrow'];
    if (!window.htMode) {
      throw new Error('Unknown ?mode= value: ' + JSON.stringify(htParams.get('mode')));
    }
    window.htDir = ({ ltr: 'ltr', rtl: 'rtl' })[htParams.get('dir') ?? 'ltr'];
    if (!window.htDir) {
      throw new Error('Unknown ?dir= value: ' + JSON.stringify(htParams.get('dir')));
    }
  </script>
</head>
<body>
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const CHOICES = ['Al', 'Connecticut readjustment authority', 'Alto'];
    const LONG = 'Connecticut readjustment authority';
    const SHORT = 'Al';

    // `autocomplete` / `dropdown` take a flat `source`; `handsontable` takes a nested grid config.
    // All three resolve to `autocompleteRenderer` and the `htAutocomplete` class.
    const columnFor = extra => (window.htCellType === 'handsontable'
      ? { type: 'handsontable', handsontable: { data: CHOICES.map(choice => [choice]) }, ...extra }
      : { type: window.htCellType, source: CHOICES, ...extra });

    const settings = window.htMode === 'autosize'
      ? {
        data: [[LONG], [SHORT]],
        columns: [columnFor({})],
        autoColumnSize: true,
      }
      : window.htMode === 'autorowsize'
      ? {
        // A breakable phrase (it has spaces) in a fixed-width column with `autoRowSize`. Without
        // the single-line treatment AutoRowSize would measure it as several wrapped lines and grow
        // the row; the reland keeps it on one line, so the row measures one line tall.
        data: [[LONG], [SHORT]],
        columns: [columnFor({ width: 100 })],
        autoRowSize: true,
      }
      : {
        data: [[LONG, LONG], [SHORT, SHORT], [null, null]],
        columns: [columnFor({ width: 60 }), columnFor({ width: 60 })],
        // A tall row keeps the value on one line (the fix) while the cell box is far taller than a
        // line, so the arrow's vertical anchor is observable. `exact` needs a provided height too:
        // a row is exact only when `rowHeightMode` says so AND the row has a positive height.
        ...(window.htMode === 'tall' ? { rowHeights: 80 } : {}),
        ...(window.htMode === 'exact' ? { rowHeights: 40 } : {}),
      };

    window.hot = new Handsontable(container, {
      ...settings,
      layoutDirection: window.htDir,
      colHeaders: true,
      rowHeaders: true,
      // Stamp test ids from `afterRenderer`: a column `type` installs its own renderer, which would
      // override a grid-level `renderer` and leave the typed columns with no test id.
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: 'non-commercial-and-evaluation',
    });

    // `rowHeightMode` is a rendering-engine setting with no public Handsontable option, so switch it
    // on the Walkontable instance directly (the same path the walkontable exact-row fixture uses),
    // then redraw so every data cell is wrapped in `.htCellClip`.
    if (window.htMode === 'exact') {
      window.hot.view._wt.wtSettings.update('rowHeightMode', 'exact');
      window.hot.render();
    }
  </script>
</body>
</html>
