<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>numericRenderer className on a type change e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document: no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back: a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    .grid { margin-bottom: 1.5rem; }
  </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    `numericRenderer` appends `htRight htNumeric` onto the `className` the cell meta
    stores. When the user set that `className` through `setCellMeta()` or the `cell` option, an
    `updateSettings()` that changed a column `type` (or the grid-level `type`) replayed it, renderer
    tokens included, so the cell kept `htRight htNumeric` after it stopped being numeric.

    Every grid is 3x2 numeric data. The grids are built by the inline script below, AFTER the
    bundle loads; the cases that need a `setCellMeta()` call or an `updateSettings()` call are
    driven from the page object, so the grid is in its numeric state first and the spec can assert
    that before it switches the type. The undo and `moveCells` grids journal or copy the stored
    `className` too, so a renderer's class names must not come back through them either.
  -->
  <div id="set-cell-meta" class="grid" data-testid="set-cell-meta"></div>
  <div id="cell-option" class="grid" data-testid="cell-option"></div>
  <div id="grid-level" class="grid" data-testid="grid-level"></div>
  <div id="restate" class="grid" data-testid="restate"></div>
  <div id="alignment" class="grid" data-testid="alignment"></div>
  <div id="array" class="grid" data-testid="array"></div>
  <div id="baseline" class="grid" data-testid="baseline"></div>
  <div id="undo-later-write" class="grid" data-testid="undo-later-write"></div>
  <div id="move-plain" class="grid" data-testid="move-plain"></div>
  <div id="move-with-class" class="grid" data-testid="move-with-class"></div>
  <div id="undo-row-removal" class="grid" data-testid="undo-row-removal"></div>
  <div id="move-onto-rendered" class="grid" data-testid="move-onto-rendered"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    // The test ids are stamped from `afterRenderer`, NOT from a custom `renderer`: a `renderer`
    // would replace `numericRenderer` and there would be nothing left to test. `data-render-count`
    // lets the page object wait for a draw that follows an `updateSettings()` call.
    function baseSettings(container) {
      let renderCount = 0;

      return {
        data: [[1, 2], [3, 4], [5, 6]],
        colHeaders: true,
        rowHeaders: true,
        afterRenderer(td, row, col) {
          td.setAttribute('data-testid', `cell-${row}-${col}`);
        },
        afterRender() {
          renderCount += 1;
          container.setAttribute('data-render-count', String(renderCount));
        },
        licenseKey: window.htTestLicenseKey,
      };
    }

    /**
     * Build one grid. A constructor that throws must not take the whole page down with it:
     * otherwise the later grids never render and every test fails for the same reason, hiding
     * which scenario actually broke. The thrown message is stamped on the container so a failure
     * reads as the real error instead of a bare "element not visible".
     */
    function build(testId, settings) {
      const container = document.querySelector(`[data-testid="${testId}"]`);

      container.className = `grid ht-theme-${window.htTheme}`;

      try {
        return new Handsontable(container, Object.assign(baseSettings(container), settings));
      } catch (error) {
        container.setAttribute('data-init-error', String(error && error.message));

        return null;
      }
    }

    const numericColumns = () => [{ type: 'numeric' }, { type: 'numeric' }];

    window.hots = {
      // `className` is set after the build, through `setCellMeta()`, by the page object.
      'set-cell-meta': build('set-cell-meta', { columns: numericColumns() }),
      // `className` comes from the `cell` option.
      'cell-option': build('cell-option', {
        columns: numericColumns(),
        cell: [{ row: 0, col: 0, className: 'myMarker' }],
      }),
      // Grid-level `type`, no `columns`.
      'grid-level': build('grid-level', { type: 'numeric' }),
      // Control: the type is restated, not changed.
      restate: build('restate', { columns: numericColumns() }),
      // Control: explicit alignment through the Alignment context menu.
      alignment: build('alignment', { columns: numericColumns(), contextMenu: true, undo: true }),
      // Control: a user array className.
      array: build('array', { columns: numericColumns() }),
      // Baseline: the cell never gets a `className` of its own.
      baseline: build('baseline', { columns: numericColumns() }),
      // The undo journal: a `className` write, then a later one, then an undo.
      'undo-later-write': build('undo-later-write', { columns: numericColumns(), undo: true }),
      // `moveCells`: a numeric cell with no `className` of its own is moved.
      'move-plain': build('move-plain', { columns: numericColumns(), moveCells: true }),
      // `moveCells`: a numeric cell with a user `className` is moved.
      'move-with-class': build('move-with-class', { columns: numericColumns(), moveCells: true }),
      // The undo journal: a row holding a user `className` is removed, then restored by an undo.
      'undo-row-removal': build('undo-row-removal', { columns: numericColumns(), undo: true }),
      // `moveCells`: column 0 is text, so a cell there has no `className` of its own. Column 1 is
      // numeric, so its cells carry the class names the renderer stored.
      'move-onto-rendered': build('move-onto-rendered', {
        columns: [{ type: 'text' }, { type: 'numeric' }],
        moveCells: true,
      }),
    };
  </script>
</body>
</html>
