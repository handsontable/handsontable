<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - exact row heights</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD) so the
    // fixture stays browsable by hand; an unknown value THROWS rather than falling back: a typo
    // in the project config must be one red leg, never a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    // `Object.hasOwn`, not a bare lookup: a plain object inherits `constructor`, `toString` and
    // `__proto__`, so `?theme=constructor` would resolve to a truthy inherited value, sail past the
    // guard below and be written into the document. Only the map's own keys are allowed.
    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick(
      { main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    Fixture for the `rowHeights` and `minRowHeights` options (issue #4021). The page does not build
    the grid: the test calls `window.mountGrid(settings)` so each case states its own options.
    `window.mountGrid(settings)` builds a 6 x 3 grid (`rowCount` changes the 6) with row and column
    headers, destroying the previous one. A `rowHeightsFromArray` entry in the settings becomes a `rowHeights` FUNCTION
    reading that array by visual row, since a function cannot cross the Playwright boundary.
    Cells carry data-testid="cell-<row>-<col>" by visual position.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const fromArray = (heights) => (visualRow) => heights[visualRow];

    window.mountGrid = (settings = {}) => {
      if (window.hot) {
        window.hot.destroy();
      }

      const { rowHeightsFromArray, rowCount = 6, ...rest } = settings;

      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(rowCount, 3),
        rowHeaders: true,
        colHeaders: true,
        renderer: testIdRenderer,
        licenseKey: window.htTestLicenseKey,
        ...rest,
        ...(rowHeightsFromArray ? { rowHeights: fromArray(rowHeightsFromArray) } : {}),
      });
    };

    // `?scenario=thin` builds a grid on load, for the axe scan (`tests/a11y/pages.mjs`): rows at 16px, under every
    // theme's default row height, with a checkbox and a dropdown column so the controls sit in clipped rows.
    if (htParams.get('scenario') === 'thin') {
      try {
        window.mountGrid({
          data: [
            ['Update API docs', true, 'In progress'],
            ['Deploy hotfix', false, 'Blocked'],
            ['Review pull request', true, 'Done'],
            ['Plan release', false, 'In progress'],
          ],
          columns: [
            { type: 'text' },
            { type: 'checkbox' },
            { type: 'dropdown', source: ['In progress', 'Blocked', 'Done'] },
          ],
          colHeaders: ['Task', 'Reviewed', 'Status'],
          rowHeights: 16,
        });
      } catch (error) {
        window.htBuildError = String(error);
      }
    }

    window.updateGrid = (settings = {}) => {
      const { rowHeightsFromArray, ...rest } = settings;

      window.hot.updateSettings({
        ...rest,
        ...(rowHeightsFromArray ? { rowHeights: fromArray(rowHeightsFromArray) } : {}),
      });
    };
  </script>
</body>
</html>
