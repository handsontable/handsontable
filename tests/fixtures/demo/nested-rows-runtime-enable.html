<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - nested rows enabled at runtime</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }

    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[
      htParams.get('bundle') ?? 'umd'
    ];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }

    window.htDataShape = ({ objects: 'objects', arrays: 'arrays' })[htParams.get('data') ?? 'objects'];
    if (!window.htDataShape) {
      throw new Error('Unknown ?data= value: ' + JSON.stringify(htParams.get('data')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <!--
    Fixture for turning NestedRows on with `updateSettings()` (DEV-2938).

    The plugin starts OFF here, which is the whole point: the data manager is fed by the
    `beforeLoadData` / `beforeUpdateData` hooks, and neither of them runs when the plugin is
    switched on later, so this is the only way the first-time-enable path is reached.

    Physical layout of the seeded tree, once the plugin flattens it:
      0  Root A            (parent, level 0)
      1    A-1             (leaf,   level 1)
      2    A-2             (parent, level 1)
      3      A-2-a         (leaf,   level 2)
      4    A-3             (leaf,   level 1)
      5  Root B            (leaf,   level 0)

    `?data=arrays` seeds an array-of-arrays dataset instead, which the plugin cannot handle.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const nestedData = [
      {
        name: 'Root A',
        __children: [
          { name: 'A-1' },
          {
            name: 'A-2',
            __children: [{ name: 'A-2-a' }],
          },
          { name: 'A-3' },
        ],
      },
      { name: 'Root B' },
    ];

    const arrayData = [['Root A'], ['Root B']];
    const isNested = window.htDataShape === 'objects';

    window.consoleErrors = [];

    const nativeConsoleError = console.error.bind(console);

    console.error = (...args) => {
      window.consoleErrors.push(args.map(String).join(' '));
      nativeConsoleError(...args);
    };

    window.hot = new Handsontable(container, {
      data: isNested ? nestedData : arrayData,
      columns: isNested ? [{ data: 'name' }] : [{}],
      colHeaders: ['Name'],
      rowHeaders: true,
      nestedRows: false,
      contextMenu: true,
      renderer: testIdRenderer,
      height: 'auto',
      licenseKey: 'non-commercial-and-evaluation',
    });
  </script>
</body>
</html>
