<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu open failure e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } #spacer { height: 120px; } </style>
</head>
<body>
  <!--
    DEV-41 / DEV-2922. A dropdown menu item whose `name()` throws.

    `name` as a function is a public menu-item feature, and the menu calls it while RENDERING the
    items — that is, inside `hotMenu.init()`, after `Menu.open()` has already set `this.hotMenu`
    (which is all `isOpened()` reads) and before it creates the navigator. A throw in that window
    used to leave the menu "open" for good: every later document `mousedown` reached `close()` and
    died on the missing navigator, the menu could never be opened again, and `destroy()` threw too,
    so the document listener leaked past an SPA page change.

    The throw is switchable at runtime so one test can prove the page RECOVERS — a fixture that
    could only ever throw would leave "no errors" and "nothing works any more" indistinguishable.
  -->
  <div id="spacer"></div>
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    /** Flipped by the page object. While true, the menu item below throws as it renders. */
    window.htMenuShouldThrow = true;

    /** The message the item throws, asserted on so the rethrow is proven to survive the rollback. */
    window.HT_MENU_ITEM_ERROR = 'DEV-41 fixture: menu item name() failed';

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // Fail loud: a constructor that throws must not leave the page looking like a grid that simply
    // has not rendered yet. The message is stamped on the container and the page object rethrows it,
    // so a broken build reads as its own error instead of a cell that never appeared.
    try {
      window.hot = new Handsontable(container, {
        data: Handsontable.helper.createSpreadsheetData(5, 4),
        renderer: testIdRenderer,
        colHeaders: ['Alpha', 'Bravo', 'Charlie', 'Delta'],
        rowHeaders: true,
        // Pinned so the rendered window is the same on every theme - a taller header must not push
        // the cell these tests address out of view.
        width: 700,
        height: 300,
        afterGetColHeader(column, TH) {
          if (column >= 0) {
            TH.setAttribute('data-testid', `header-${column}`);
          }
        },
        dropdownMenu: {
          items: {
            safe_item: { name: 'Safe item' },
            exploding_item: {
              name() {
                if (window.htMenuShouldThrow) {
                  throw new Error(window.HT_MENU_ITEM_ERROR);
                }

                return 'Recovered item';
              },
            },
          },
        },
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }

    /**
     * Stop the menu item from throwing, so a later open can succeed.
     */
    window.htStopThrowing = () => {
      window.htMenuShouldThrow = false;
    };

    /**
     * What the dropdown menu believes about itself. `isOpened()` is the exact invariant DEV-41
     * broke, and it is not observable from the DOM alone: the stranded menu kept `hotMenu` set
     * while its container was already hidden.
     */
    window.htMenuState = () => {
      const menu = window.hot.getPlugin('dropdownMenu').menu;

      return {
        isOpened: menu ? menu.isOpened() : null,
        containerDisplay: menu ? menu.container.style.display : null,
      };
    };

    /**
     * Tear the grid down the way an SPA route change does. Reported rather than thrown, because
     * the point of the check is that `destroy()` COMPLETES — before the fix it threw here, which
     * is what leaked the document listener onto the next page.
     */
    window.htDestroyGrid = () => {
      try {
        window.hot.destroy();

        return 'ok';
      } catch (error) {
        return String(error && error.message);
      }
    };

    /**
     * How many listeners the grid's own EventManager currently holds. Handsontable exposes this
     * counter for its memory-leak tests, and it is the only way to SEE a leaked listener from a
     * test: a leaked `mousedown` handler early-returns once the menu reports itself closed, so
     * "no error on the next click" is green whether or not the listener is still attached.
     */
    window.htListenerCount = () => Handsontable._getListenersCounter();
  </script>
</body>
</html>
