<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — a copy hook editing the source-data flavor</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD); an unknown value
    // THROWS instead of falling back — a typo in the project config must be one
    // red leg, never a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } .grid { margin-bottom: 1rem; } </style>
</head>
<body>
  <div id="grid-a" class="grid" data-testid="grid-a"></div>
  <div id="grid-b" class="grid" data-testid="grid-b"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    // `?hook=` picks what grid A's `beforeCopy` does to the copied data. Mapped through a fixed
    // allowlist; an unknown value throws, like the theme and the bundle.
    const HOOKS = {
      // Masks the first row by building NEW row arrays, the common `map` pattern.
      map: function(data) {
        data.forEach(function(row, index) {
          data[index] = row.map(function(value, col) { return index === 0 && col === 0 ? '' : value; });
        });
      },
      // Removes the first row in place, the documented `splice` pattern.
      splice: function(data) { data.splice(0, 1); },
      // Masks a cell in place, keeping the row array.
      mask: function(data) { data[0][0] = ''; },
    };
    const hook = HOOKS[htParams.get('hook') ?? 'mask'];

    if (!hook) {
      throw new Error('Unknown ?hook= value: ' + JSON.stringify(htParams.get('hook')));
    }

    const containerA = document.querySelector('[data-testid="grid-a"]');
    const containerB = document.querySelector('[data-testid="grid-b"]');

    containerA.className = `ht-theme-${window.htTheme}`;
    containerB.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(prefix) {
      return function(instance, td, row, col, prop, value, cellProperties) {
        Handsontable.renderers.getRenderer('text').apply(this, arguments);
        td.setAttribute('data-testid', `${prefix}-${row}-${col}`);
      };
    };

    let hotA;
    let hotB;

    try {
      hotA = new Handsontable(containerA, {
        data: [[{ secret: 'COPY-HOOK-8101' }], [{ keep: 'COPY-HOOK-8102' }]],
        columns: [{ renderer: testIdRenderer('a-cell'), width: 200 }],
        beforeCopy: hook,
        licenseKey: 'non-commercial-and-evaluation',
      });
      hotB = new Handsontable(containerB, {
        data: [[null], [null], [null]],
        columns: [{ renderer: testIdRenderer('b-cell'), width: 200, parsePastedValue: true }],
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      containerA.setAttribute('data-init-error', String(error && error.message));

      throw error;
    }

    window.hotA = hotA;
    window.hotB = hotB;

    /** The data SOURCE of a cell of grid B, so an object and its string form do not look alike. */
    window.htSourceAtB = function(row, col) {
      const value = hotB.getSourceDataAtCell(row, col);

      if (value === null) return 'null';
      if (typeof value === 'object') return `object:${JSON.stringify(value)}`;

      return `${typeof value}:${value}`;
    };
  </script>
</body>
</html>
