<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - removing a nested parent row with Formulas attached</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright projects,
    // mapped through fixed allowlists to LITERALS so a crafted param can never be reflected into the
    // document. An absent param keeps the default (main / plain UMD); an unknown value THROWS, so a
    // typo in the project config is one red leg rather than a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }

    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[
      htParams.get('bundle') ?? 'umd'
    ];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <!--
    Fixture for DEV-3092: removing a nested parent had to remove its whole subtree from the
    HyperFormula sheet as well as from the grid.

    Formulas' `beforeRemoveRow` listener (priority 260) used to read the removed physical rows
    before NestedRows' `beforeRemoveRow` (priority 300) expanded that list into the parent's whole
    subtree, so the engine only ever removed the rows the caller literally named - the grid removed
    the subtree, the engine kept the leftover descendants, and the two diverged. NestedRows now
    registers that listener with `orderIndex: -1`, so it runs ahead of every default-order listener
    (Formulas, a host `beforeRemoveRow`) and each of them sees the expanded list instead.

    Physical layout, single column (`col1`):
      0  Root A       (parent)
      1    A-1        (parent, one level down)
      2      A-1-a    (leaf, two levels down - the grandchild)
      3    A-2        (leaf, sibling of A-1)
      4  Root B        (parent, a second root)
      5    B-1        (leaf)
      6  x            (plain row, below both trees)
      7  =A7 & "!"    (formula, references `x` - the row directly above it)

    `x` and the formula row sit below both trees on purpose: whichever subtree is removed, they
    stay adjacent to each other, so the formula's computed value is `x!` whenever the engine and the
    grid agree on how many rows moved - and something else whenever they do not, because the engine
    then holds extra leftover rows nobody removed.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // HyperFormula comes from THIS package's own node_modules. Loaded only on the base-bundle legs:
    // handsontable.full.min.js sets `window.HyperFormula` itself.
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    window.sourceData = [
      {
        col1: 'Root A',
        __children: [
          {
            col1: 'A-1',
            __children: [{ col1: 'A-1-a' }],
          },
          { col1: 'A-2' },
        ],
      },
      {
        col1: 'Root B',
        __children: [{ col1: 'B-1' }],
      },
      { col1: 'x' },
      { col1: '=A7 & "!"' },
    ];

    // Recorded by a HOST `beforeRemoveRow` listener (DEV-3092): a plugin-external listener declared
    // in the settings object the way an app's own code would be, kept separate from the plugin's
    // internal hooks so a spec can prove NestedRows' expansion still runs ahead of it after
    // `updateSettings()` clears and re-registers NestedRows' own listener.
    window.hostBeforeRemoveRowLog = [];

    try {
      window.hot = new Handsontable(container, {
        data: window.sourceData,
        columns: [{ data: 'col1' }],
        colHeaders: ['Col1'],
        rowHeaders: true,
        nestedRows: true,
        formulas: {
          engine: HyperFormula,
          sheetName: 'Sheet1',
        },
        beforeRemoveRow(index, amount, physicalRows) {
          window.hostBeforeRemoveRowLog.push(physicalRows.slice());
        },
        afterRenderer(td, row, col) {
          td.setAttribute('data-testid', `cell-${row}-${col}`);
        },
        height: 'auto',
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      window.htFixtureError = error && error.message ? error.message : String(error);
    }
  </script>
</body>
</html>
