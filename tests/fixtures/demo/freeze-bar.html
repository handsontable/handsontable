<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Freeze bar e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    The freezeBar plugin on a grid small enough to scroll. Query params switch the variants a spec needs:
    ?rtl=1 lays the grid out right to left, ?legacy=1 configures the frozen columns with the legacy
    `fixedColumnsLeft` option, ?bar=0 leaves the plugin off, ?cols=0 and ?rows=0 start with nothing frozen,
    ?bottom=N and ?end=N freeze the last N rows and columns, ?sheets=1 turns the sheets bar on with two sheets, ?filters=1 turns Filters on with `filterFixedRows: false`, ?resize=1 turns manualColumnResize and manualRowResize on, ?anc=1 puts the grid, with an automatic height, in a scrolling div, ?headers=0 turns the row and column headers off, ?narrow=1 gives the grid fewer columns and rows than its box (the table is smaller than its container), ?win=1 lets the window scroll the rows (a taller grid with an automatic height), ?pagination=1 pages the rows (it conflicts with frozen rows, so pass ?rows=0), ?aria=0 turns ariaTags off, ?undo=1 turns UndoRedo on, ?hidden=1 hides column 2 and row 2. Every change of the frozen area is
    appended to `window.freezeLog` by the `afterFreezeChange` hook.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    const flag = (name, fallback) => htParams.has(name) ? htParams.get(name) !== '0' : fallback;
    const count = (name, fallback) => htParams.has(name) ? Number(htParams.get(name)) : fallback;

    container.className = `ht-theme-${window.htTheme}`;
    window.freezeLog = [];

    const frozenColumns = count('cols', 2);
    const settings = {
      data: Handsontable.helper.createSpreadsheetData(50, 15),
      rowHeaders: flag('headers', true),
      colHeaders: flag('headers', true),
      width: 500,
      height: 300,
      fixedRowsTop: count('rows', 2),
      fixedRowsBottom: count('bottom', 0),
      fixedColumnsEnd: count('end', 0),
      layoutDirection: flag('rtl', false) ? 'rtl' : 'ltr',
      undoRedo: flag('undo', false),
      ariaTags: flag('aria', true),
      freezeBar: flag('bar', true),
      afterGetColHeader: (col, TH) => TH.setAttribute('data-testid', `colheader-${col}`),
      afterGetRowHeader: (row, TH) => TH.setAttribute('data-testid', `rowheader-${row}`),
      afterFreezeChange: (edge, newCount, oldCount, source) => {
        window.freezeLog.push({ edge, newCount, oldCount, source });
      },
      licenseKey: 'non-commercial-and-evaluation',
    };

    if (flag('legacy', false)) {
      settings.fixedColumnsLeft = frozenColumns;
    } else {
      settings.fixedColumnsStart = frozenColumns;
    }

    if (flag('sheets', false)) {
      settings.sheetsBar = {
        sheets: [
          { name: 'A', data: Handsontable.helper.createSpreadsheetData(50, 15) },
          { name: 'B', data: Handsontable.helper.createSpreadsheetData(50, 15) },
        ],
      };
      delete settings.data;
    }

    if (flag('filters', false)) {
      settings.filters = { filterFixedRows: false };
      settings.dropdownMenu = true;
    }

    if (flag('resize', false)) {
      settings.manualColumnResize = true;
      settings.manualRowResize = true;
    }

    if (flag('anc', false)) {
      // a scrolling ancestor, not the window, scrolls a grid of an automatic height
      const wrapper = document.createElement('div');

      wrapper.setAttribute('data-testid', 'ancestor');
      wrapper.style.cssText = 'height: 300px; width: 700px; overflow: auto; border: 1px solid #ccc;';
      container.parentNode.insertBefore(wrapper, container);
      wrapper.appendChild(container);
      settings.data = Handsontable.helper.createSpreadsheetData(150, 15);
      settings.height = 'auto';
    }

    if (flag('narrow', false)) {
      settings.data = Handsontable.helper.createSpreadsheetData(8, 5);
    }

    if (flag('win', false)) {
      settings.data = Handsontable.helper.createSpreadsheetData(150, 15);
      settings.height = 'auto';
    }

    if (flag('pagination', false)) {
      settings.pagination = { pageSize: 10 };
    }

    if (flag('hidden', false)) {
      settings.hiddenColumns = { columns: [2] };
      settings.hiddenRows = { rows: [2] };
    }

    try {
      window.hot = new Handsontable(container, settings);
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }
  </script>
</body>
</html>
