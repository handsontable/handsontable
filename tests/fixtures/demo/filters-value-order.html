<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture — filters value list, custom order</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    // Null-prototype maps, so an inherited key ('constructor', 'toString', ...) cannot pass as a value.
    const htThemes = Object.assign(Object.create(null), { main: 'main', horizon: 'horizon', classic: 'classic' });
    const htBundles = Object.assign(Object.create(null), { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' });

    window.htTheme = htThemes[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = htBundles[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    E2E fixture for DEV-2579: `filterValueComparator` orders the "Filter by value"
    list. Priority carries a column-level comparator (severity order), Size
    inherits a grid-level one (garment size order), Amount is numeric and has
    NO comparator that fits it, so the grid-level comparator applies there too
    and ranks every number as "unknown" – which proves the grid value really
    cascades. A blank in Priority covers `(Blank cells)` placement. Cells are
    stamped with data-testid via a renderer (data-testid="cell-<row>-<col>") so
    the spec can read the filtered result without structural selectors.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const PRIORITY = ['Critical', 'High', 'Medium', 'Low'];
    const SIZE = ['XS', 'S', 'M', 'L', 'XL'];
    const rankBy = order => (a, b) => {
      const rank = value => (order.indexOf(value) === -1 ? order.length : order.indexOf(value));

      return rank(a) - rank(b);
    };

    // Exposed so a spec can drive `updateSettings()` directly.
    window.hot = new Handsontable(container, {
      data: [
        ['Low', 'M', 100],
        ['High', 'XL', 5],
        ['Critical', 'S', 1000],
        ['Medium', 'XS', 20],
        ['', 'L', 100],
        ['High', 'M', 7],
      ],
      colHeaders: ['Priority', 'Size', 'Amount'],
      rowHeaders: true,
      dropdownMenu: true,
      filters: true,
      // grid level: garment sizes; anything else (numbers, priorities) ranks as "unknown" = last
      filterValueComparator: rankBy(SIZE),
      columns: [
        { filterValueComparator: rankBy(PRIORITY) },
        {},
        { type: 'numeric' },
      ],
      renderer: testIdRenderer,
      width: 600,
      height: 300,
      licenseKey: 'non-commercial-and-evaluation',
    });
  </script>
</body>
</html>
