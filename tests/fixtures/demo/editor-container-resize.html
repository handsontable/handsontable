<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor container-resize e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The layout under test, through the same allowlist pattern: `height` sizes the grid
    // with viewport units, `width` stretches its columns over the container width.
    window.htLayout = ({ height: 'height', width: 'width' })[htParams.get('layout') ?? 'height'];
    if (!window.htLayout) {
      throw new Error('Unknown ?layout= value: ' + JSON.stringify(htParams.get('layout')));
    }
    // `async` parks every validation until a test answers it (`htPendingValidations`), which keeps an
    // edit in the waiting state, and turns column sorting on so a test can reorder rows meanwhile.
    window.htValidator = ({ none: 'none', async: 'async' })[htParams.get('validator') ?? 'none'];
    if (!window.htValidator) {
      throw new Error('Unknown ?validator= value: ' + JSON.stringify(htParams.get('validator')));
    }
    // The editor of the last column: the text editor, a layered one that keeps its list while it
    // is scrolled away (`dropdown`), and two that close when their cell is not rendered.
    window.htEditor = ({ text: 'text', dropdown: 'dropdown', select: 'select', multiselect: 'multiselect' })[htParams.get('editor') ?? 'text'];
    if (!window.htEditor) {
      throw new Error('Unknown ?editor= value: ' + JSON.stringify(htParams.get('editor')));
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    #container { height: 100%; }
  </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    Exercises an open editor while the grid's own size changes. With
    `height: '75vh'`, shrinking the viewport shrinks the grid the way the
    Android soft keyboard does in a WebView that resizes its content; with
    `stretchH: 'all'`, narrowing the viewport moves every column. In both, the
    edited cell must stay rendered and the editor must stay on it.
  -->
  <div id="container">
    <div id="grid" data-testid="grid"></div>
  </div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const isHeightLayout = window.htLayout === 'height';
    const rows = isHeightLayout ? 40 : 10;
    const columns = isHeightLayout ? 12 : 4;
    const data = Array.from({ length: rows }, (_, r) =>
      Array.from({ length: columns }, (_, c) => `R${r + 1}C${c + 1}`));

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const choices = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel'];
    const lastColumn = ({
      text: { renderer: testIdRenderer },
      dropdown: { type: 'dropdown', source: choices },
      select: { editor: 'select', selectOptions: choices },
      multiselect: { type: 'multiselect', source: choices },
    })[window.htEditor];
    const columnsSettings = Array.from({ length: columns }, (_, c) => (c === columns - 1 ? lastColumn : { renderer: testIdRenderer }));

    if (window.htEditor !== 'text') {
      data.forEach((row) => {
        row[columns - 1] = window.htEditor === 'multiselect' ? [] : 'Alpha';
      });
    }

    // The element the open editor places on its cell, and the list it opens next to the cell (if
    // any), read the same way for every editor.
    window.htEditorParts = () => {
      const editor = window.hot.getActiveEditor();

      if (!editor) {
        return { anchor: null, popup: null };
      }

      switch (window.htEditor) {
        case 'select':
          return { anchor: editor.select, popup: null };
        case 'multiselect':
          return { anchor: null, popup: document.querySelector('.ht-multi-select-editor') };
        case 'dropdown':
          return { anchor: editor.TEXTAREA_PARENT, popup: editor.htContainer };
        default:
          return { anchor: editor.TEXTAREA_PARENT, popup: null };
      }
    };

    // Counts the size-changing `refreshDimensions()` runs, so a test can wait for the grid to
    // have reacted to a viewport resize instead of sleeping.
    window.htSizeChanges = 0;
    window.htPendingValidations = [];

    const asyncValidation = window.htValidator === 'async' ? {
      allowInvalid: false,
      columnSorting: true,
      validator(value, callback) {
        window.htPendingValidations.push(callback);
      },
    } : {};

    try {
      window.hot = new Handsontable(container, {
        data,
        rowHeaders: true,
        colHeaders: true,
        width: '100%',
        height: isHeightLayout ? '75vh' : 300,
        stretchH: isHeightLayout ? 'none' : 'all',
        columns: columnsSettings,
        ...asyncValidation,
        licenseKey: window.htTestLicenseKey,
        afterRefreshDimensions(previous, next, isSizeChanged) {
          if (isSizeChanged) {
            window.htSizeChanges += 1;
          }
        },
      });
    } catch (error) {
      window.htBuildError = String(error && error.stack || error);
    }
  </script>
</body>
</html>
