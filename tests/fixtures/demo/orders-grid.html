<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture – an orders grid with filters, sorting, hidden columns and pagination</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD) so the
    // fixture stays browsable by hand; an unknown value THROWS rather than falling back – a typo
    // in the project config must be one red leg, never a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    // `Object.hasOwn`, not a bare lookup: a plain object inherits `constructor`, `toString` and
    // `__proto__`, so `?theme=constructor` would resolve to a truthy inherited value, sail past the
    // guard below and be written into the document. Only the map's own keys are allowed.
    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick(
      { main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');

    // `off` is the js visual demo's shared `/` grid; `10` is its `/pagination-demo` route, ten rows a
    // page.
    window.htPagination = htPick({ off: false, 10: 10 }, htParams.get('pagination'), 'off', 'pagination');
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <!--
    An orders grid with the plugins the js visual demo's shared `/` grid and its `/pagination-demo`
    route run: the dropdown menu with filters, multi-column sorting, columns hidden through the
    context menu, and (with `?pagination=10`) pages of ten rows. The cross-browser visual suite
    filtered, hid and paged these grids in `columns-filter.spec.ts`, `columns-hide.spec.ts` and
    `pagination.spec.ts`; since DEV-3257 the rows, columns and pages each step leaves are asserted
    by the specs that use this fixture.

    The 60 rows are generated, not random. Their countries repeat every ten rows, and five of the
    ten contain "in" (India, China, United Kingdom, Argentina, Philippines), so a search for "In"
    in the Country value list lists 30 rows; India alone is six rows, three of them sold in the
    first half of 2020 – the 6 and 3 the visual spec counted on the demo's data.
  -->
  <div data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The closing tag is split
    // so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const COUNTRIES = [
      'India', 'France', 'China', 'Germany', 'United Kingdom', 'Peru', 'Argentina', 'Japan', 'Philippines', 'Brazil',
    ];
    const COMPANIES = ['Zeta', 'Alpha', 'Mira', 'Echo', 'Kilo', 'Bravo'];

    // Row i: a company name that sorts apart from the row order, a unique product name, a sale date
    // whose month is (i mod 12) + 1, and a country from the repeating list above.
    const data = Array.from({ length: 60 }, (_, index) => [
      `${COMPANIES[index % COMPANIES.length]} ${String(60 - index).padStart(2, '0')}`,
      `Product ${String(index + 1).padStart(2, '0')}`,
      `2020-${String((index % 12) + 1).padStart(2, '0')}-${String((index % 27) + 1).padStart(2, '0')}`,
      index % 3 !== 0,
      (index * 7) % 50,
      `${(index * 13) % 100}%`,
      COUNTRIES[index % COUNTRIES.length],
    ]);

    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // A constructor that throws stamps its message on the container instead of taking the whole
    // page down, so a failure reads as the real error rather than a bare "element not visible".
    try {
      window.hot = new Handsontable(container, {
        data,
        colHeaders: ['Company name', 'Name', 'Sell date', 'In stock', 'Qty', 'Progress', 'Country'],
        columns: [
          { type: 'text' },
          { type: 'text' },
          { type: 'date', dateFormat: { dateStyle: 'short' }, locale: 'en-US' },
          { type: 'checkbox' },
          { type: 'numeric' },
          { type: 'text' },
          { type: 'text' },
        ],
        colWidths: [130, 110, 110, 80, 70, 90, 140],
        rowHeaders: true,
        height: 450,
        width: 900,
        dropdownMenu: true,
        filters: true,
        multiColumnSorting: true,
        contextMenu: true,
        hiddenColumns: { indicators: true },
        // The shared `/` grid makes headers navigable; the pagination route does not.
        navigableHeaders: !window.htPagination,
        ...(window.htPagination ? { pagination: { pageSize: window.htPagination } } : {}),
        afterRenderer(td, row, column) {
          td.setAttribute('data-testid', `cell-${row}-${column}`);
        },
        afterGetColHeader(column, th) {
          if (column >= 0) {
            th.setAttribute('data-testid', `col-header-${column}`);
          }
        },
        licenseKey: 'non-commercial-and-evaluation',
      });
    } catch (error) {
      container.setAttribute('data-init-error', String(error && error.message));
    }
  </script>
</body>
</html>
