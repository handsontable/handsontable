<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - pagination page-size select</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document. An ABSENT param
    // keeps the default (main / plain UMD); an unknown value THROWS instead of
    // falling back, so a config typo is one red leg, never a mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test is appended and the fixture waits for its `load` before building the
    // grid, so a late or failed request can never run the init below with no `Handsontable`.
    const loadBundle = () => {
      const bundleScript = document.createElement('script');

      bundleScript.src = `/handsontable/dist/${window.htBundle}`;
      bundleScript.addEventListener('load', initFixture);
      bundleScript.addEventListener('error', () => {
        throw new Error(`Failed to load the bundle: ${bundleScript.src}`);
      });
      document.head.appendChild(bundleScript);
    };

    function initFixture() {
      const container = document.querySelector('[data-testid="grid"]');

      container.className = `ht-theme-${window.htTheme}`;

      // More rows than a page so the pager (with the page-size select) is rendered, and a fixed
      // height so the whole grid plus its bottom bar stays on screen.
      const data = Array.from({ length: 100 }, (_, row) =>
        Array.from({ length: 5 }, (_, col) => `${row}-${col}`));

      const hot = new Handsontable(container, {
        data,
        colHeaders: true,
        rowHeaders: true,
        height: 400,
        pagination: {
          pageSize: 10,
          pageSizeList: ['auto', 5, 10, 20, 50, 100],
          showPageSize: true,
        },
        layoutDirection: 'ltr',
        licenseKey: 'non-commercial-and-evaluation',
      });

      window.hot = hot;
    }

    loadBundle();
  </script>
</body>
</html>
