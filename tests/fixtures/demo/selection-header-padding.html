<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selection header padding e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    .case { margin-bottom: 2rem; }
    #padded .htCore thead th,
    #padded .htCore tbody th,
    #padded-rtl .htCore thead th,
    #padded-rtl .htCore tbody th {
      padding: 16px 8px;
    }
    #line-break .htCore thead th,
    #line-break .htCore tbody th {
      padding: 16px 8px;
      white-space: pre-wrap;
    }
    #nested .htCore thead th,
    #nested .htCore tbody th {
      padding: 16px 8px;
    }
  </style>
</head>
<body>
  <!--
    DEV-1176. A full-row (or full-column) selection must measure its highlight from the header
    TH, not only from the first data cell. Custom header padding and wrapping labels change the
    header box; if `getDimensionsFromHeader` cannot resolve the header level it falls back to the
    TD and the highlight drifts from the header.
  -->
  <div class="case">
    <h2>Padded headers</h2>
    <div id="padded" data-testid="padded"></div>
  </div>
  <div class="case">
    <h2>Padded headers (RTL)</h2>
    <div id="padded-rtl" data-testid="padded-rtl"></div>
  </div>
  <div class="case">
    <h2>Line-break column headers</h2>
    <div id="line-break" data-testid="line-break"></div>
  </div>
  <div class="case">
    <h2>Nested row headers</h2>
    <div id="nested" data-testid="nested"></div>
  </div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const data = Handsontable.helper.createSpreadsheetData(6, 4);
    const lineBreakHeaders = ['Company\nname', 'Country', 'Code', 'D'];

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${instance.rootElement.dataset.testid}-${row}-${col}`);
    };

    function build(id, settings) {
      const container = document.getElementById(id);

      container.className = `ht-theme-${window.htTheme}`;

      return new Handsontable(container, Object.assign({
        data,
        colHeaders: true,
        rowHeaders: true,
        width: 520,
        height: 280,
        renderer: testIdRenderer,
        licenseKey: 'non-commercial-and-evaluation',
      }, settings));
    }

    window.grids = {
      padded: build('padded', {}),
      paddedRtl: build('padded-rtl', { layoutDirection: 'rtl' }),
      lineBreak: build('line-break', { colHeaders: lineBreakHeaders }),
      nested: build('nested', {
        // `rowHeaders` as an array is one label per row, not extra header levels.
        // Extra levels come from `afterGetRowHeaderRenderers` (TableView already
        // pushed the default renderer). Pushing here makes `G*` the closest level,
        // so `resolveHeaderLevel(2, -1)` must return 1.
        afterGetRowHeaderRenderers(renderers) {
          renderers.push(function(row, TH) {
            TH.innerText = `G${row + 1}`;
          });
        },
      }),
    };
  </script>
</body>
</html>
