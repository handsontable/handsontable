<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - toggle controls in other layouts</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme, bundle and variant come from query params, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document. An ABSENT param keeps the default; an unknown
    // value THROWS rather than falling back, so a typo in the project config is one red leg, never a silently
    // mislabeled green one.
    const htParams = new URLSearchParams(location.search);
    // Own keys only: a bare index would let `?theme=constructor` resolve to an inherited function.
    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick({ main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');
    window.htVariant = htPick(
      { ltr: 'ltr', rtl: 'rtl', frozen: 'frozen', shadow: 'shadow' }, htParams.get('variant'), 'ltr', 'variant');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    One grid with the four controls that act when a press is released: the collapse indicator of a column
    group (CollapsibleColumns), the "check all" checkbox of the Done column (CheckboxHeader), and the row
    checkboxes and the "select all" checkbox (RowSelection). ?variant= lays it out:
      ltr     the plain grid;
      rtl     a right to left grid in a right to left page;
      frozen  the first two columns frozen, so the checkboxes and headers are drawn by overlay clones;
      shadow  the grid is mounted inside an open shadow root, as web component hosts do.
    Columns: Name [0], Done [1], A, B, C [2-4] under the group "Group".
  -->
  <div id="shadow-host" data-testid="shadow-host"></div>
  <div id="grid" data-testid="grid"></div>

  <script>
    // The closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    try {
      let container = document.querySelector('[data-testid="grid"]');

      if (window.htVariant === 'shadow') {
        // The stylesheets are linked INSIDE the shadow root: document styles do not cross the boundary.
        const shadowRoot = document.querySelector('[data-testid="shadow-host"]').attachShadow({ mode: 'open' });

        ['/handsontable/styles/handsontable.min.css', `/handsontable/styles/ht-theme-${window.htTheme}.min.css`]
          .forEach((href) => {
            const link = document.createElement('link');

            link.rel = 'stylesheet';
            link.href = href;
            shadowRoot.appendChild(link);
          });

        container.remove();
        container = document.createElement('div');
        container.setAttribute('data-testid', 'grid');
        shadowRoot.appendChild(container);
      }

      if (window.htVariant === 'rtl') {
        document.documentElement.dir = 'rtl';
      }

      container.className = `ht-theme-${window.htTheme}`;

      window.hot = new Handsontable(container, {
        data: Array.from({ length: 6 }, (_, index) => ({
          name: `Row ${index}`, done: false, a: index, b: index, c: index,
        })),
        columns: [
          { data: 'name' },
          { data: 'done', type: 'checkbox', headerCheckbox: true },
          { data: 'a' },
          { data: 'b' },
          { data: 'c' },
        ],
        nestedHeaders: [
          ['Name', 'Flags', { label: 'Group', colspan: 3 }],
          ['Name', 'Done', 'A', 'B', 'C'],
        ],
        collapsibleColumns: true,
        rowHeaders: true,
        rowSelection: { checkboxLocation: 'rowHeader' },
        fixedColumnsStart: window.htVariant === 'frozen' ? 2 : 0,
        layoutDirection: window.htVariant === 'rtl' ? 'rtl' : 'ltr',
        colWidths: 90,
        width: 560,
        height: 260,
        afterRenderer(td, row, col) {
          td.setAttribute('data-testid', `cell-${row}-${col}`);
        },
        licenseKey: window.htTestLicenseKey,
      });
    } catch (error) {
      // A build failure is rethrown by the page object, so it is one red test, not a missing element.
      window.htBuildError = String(error && error.message ? error.message : error);
    }
  </script>
</body>
</html>
