<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture - editable headers</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the Playwright
    // projects, mapped through fixed allowlists to LITERALS so a crafted param can never be
    // reflected into the document. An ABSENT param keeps the default (main / plain UMD); an
    // unknown value THROWS rather than falling back, so a typo in the project config is one red
    // leg instead of a silently mislabeled green one.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');

    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    The EditableHeaders plugin: column and row headers renamed in the grid. ?mode=sorting turns on
    ColumnSorting, whose header click and Enter sort, so double-click and Enter step aside there.
    ?mode=frozen freezes the first column, so its header is drawn in the corner clone.
    ?mode=default leaves navigableHeaders off (its default), so a header press puts the highlight on a cell.
    ?mode=wide has 20 columns in a 300px grid, so the grid scrolls sideways.
  -->
  <div id="grid" data-testid="grid"></div>
  <input data-testid="outside" aria-label="Outside input">

  <script>
    // The closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');
    // Allowlisted like ?theme=: an unknown value throws instead of silently testing the default.
    const mode = ({ plain: 'plain', sorting: 'sorting', frozen: 'frozen', default: 'default', wide: 'wide' })[htParams.get('mode') ?? 'plain'];

    if (!mode) {
      throw new Error('Unknown ?mode= value');
    }

    container.className = `ht-theme-${window.htTheme}`;
    window.headerChanges = [];

    window.hot = new Handsontable(container, {
      data: mode === 'wide' ?
        Array.from({ length: 5 }, (_, row) => Array.from({ length: 20 }, (__, col) => `R${row}C${col}`)) :
        Array.from({ length: 5 }, (_, row) => [`A${row}`, `B${row}`, `C${row}`]),
      colHeaders: mode === 'wide' ? true : ['Name', 'Price', 'Stock'],
      rowHeaders: true,
      navigableHeaders: mode !== 'default',
      colWidths: mode === 'wide' ? 100 : undefined,
      editableHeaders: { columnHeaders: true, rowHeaders: true },
      columnSorting: mode === 'sorting',
      fixedColumnsStart: mode === 'frozen' ? 1 : 0,
      contextMenu: true,
      dropdownMenu: true,
      undo: true,
      height: 'auto',
      width: mode === 'wide' ? 300 : 500,
      afterHeaderChange(axis, visualIndex, newValue, oldValue) {
        window.headerChanges.push({ axis, visualIndex, newValue, oldValue });
      },
      afterGetColHeader(col, th) {
        if (col >= 0 && !window.hot?.view?.isColumnHeaderCorner(th)) {
          th.setAttribute('data-testid', `col-header-${col}`);
        }
      },
      afterGetRowHeader(row, th) {
        th.setAttribute('data-testid', `row-header-${row}`);
      },
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      licenseKey: window.htTestLicenseKey,
    });
  </script>
</body>
</html>
