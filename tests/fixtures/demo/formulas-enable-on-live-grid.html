<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Formulas enabled on a live grid e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    // `Object.hasOwn`, not a bare lookup: a plain object inherits `constructor`, `toString` and
    // `__proto__`, so `?theme=constructor` would resolve to a truthy inherited value and sail past
    // a truthiness guard. Only the map's own keys are allowed.
    const htPick = (map, value, fallback, label) => {
      const key = value ?? fallback;

      if (!Object.hasOwn(map, key)) {
        throw new Error('Unknown ?' + label + '= value: ' + JSON.stringify(value));
      }

      return map[key];
    };

    window.htTheme = htPick(
      { main: 'main', horizon: 'horizon', classic: 'classic' }, htParams.get('theme'), 'main', 'theme');
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = htPick(
      { umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' }, htParams.get('bundle'), 'umd', 'bundle');
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    A grid built WITHOUT Formulas, with sorting and row moves on. The spec turns Formulas on with
    `updateSettings({ formulas: { engine: HyperFormula } })` on the live grid, after or before a sort.
    With `?build=sheet` the grid is built instead WITHOUT `data`, from the `S1` sheet of an engine
    instance (`window.engine`), and the spec turns Formulas off and on again.
    Every leg runs exactly ONE engine, the same way formulas-grid.html wires it.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // HyperFormula comes from THIS package's own node_modules (see formulas-validated-write.html);
    // loaded ONLY on the base-bundle legs, since handsontable.full.min.js sets it itself.
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    // Mapped through an allowlist, as the theme and the bundle are; an unknown value throws.
    const build = htPick({ data: 'data', sheet: 'sheet' }, htParams.get('build'), 'data', 'build');

    // Each formula doubles its own row's number, so a sort the engine never got leaves the
    // results on the rows they started on.
    const sourceSettings = build === 'data' ? {
      data: [
        [3, '=A1*2'],
        [1, '=A2*2'],
        [2, '=A3*2'],
      ],
    } : (() => {
      window.engine = HyperFormula.buildEmpty({ licenseKey: 'gpl-v3' });
      window.engine.addSheet('S1');
      window.engine.setSheetContent(window.engine.getSheetId('S1'), [
        ['b', 2, '=B1*2'],
        ['a', 1, '=B2*2'],
        ['c', 3, '=B3*2'],
        ['d', 4, '=B4*2'],
      ]);

      return { formulas: { engine: window.engine, sheetName: 'S1' } };
    })();

    window.hot = new Handsontable(container, {
      ...sourceSettings,
      columnSorting: true,
      manualRowMove: true,
      width: 400,
      height: 160,
      rowHeaders: true,
      colHeaders: true,
      afterRenderer(td, row, col) {
        td.setAttribute('data-testid', `cell-${row}-${col}`);
      },
      afterGetColHeader(col, TH) {
        if (col >= 0) {
          TH.setAttribute('data-testid', `col-header-${col}`);
        }
      },
      licenseKey: window.htTestLicenseKey,
    });
  </script>
</body>
</html>
