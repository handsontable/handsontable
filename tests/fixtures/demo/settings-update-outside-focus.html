<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings update with the focus outside the grid</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document. An ABSENT param
    // keeps the default (main / plain UMD); an unknown value THROWS instead of
    // falling back, so a typo in the project config is one red leg.
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    DEV-4083. The options of an example sit next to the grid. A change of an option updates the grid's
    settings and, as the React wrapper does on every render, sends the data along with it. The focus must
    stay on the control that was operated.
  -->
  <label><input type="checkbox" data-testid="option" id="option"> Read-only</label>
  <button type="button" data-testid="action">Action</button>
  <div id="grid" data-testid="grid"></div>

  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const data = [];

    for (let row = 0; row < 8; row++) {
      const cells = [];

      for (let col = 0; col < 5; col++) {
        cells.push(`${String.fromCharCode(65 + col)}${row + 1}`);
      }

      data.push(cells);
    }

    try {
      window.hot = new Handsontable(container, {
        data,
        colHeaders: true,
        rowHeaders: true,
        licenseKey: window.htTestLicenseKey,
        afterRenderer(td, row, col) {
          td.setAttribute('data-row', String(row));
          td.setAttribute('data-col', String(col));

          if (td.closest('.ht_master')) {
            td.setAttribute('data-testid', `cell-${row}-${col}`);
          }
        },
      });
    } catch (error) {
      window.htBuildError = String((error && error.stack) || error);
      throw error;
    }

    // The way a wrapper applies an option: the data goes along with the changed setting.
    document.querySelector('[data-testid="option"]').addEventListener('change', (event) => {
      window.hot.updateSettings({ data: window.hot.getSourceData(), readOnly: event.target.checked });
    });
  </script>
</body>
</html>
