<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text ellipsis line clamp e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 1rem; } </style>
</head>
<body>
  <!--
    PRO-192. `textEllipsis` accepts a number: n >= 2 clamps a cell's text to n lines. The grid is NOT
    built on load. A spec calls `window.mountGrid(settings, cellOverrides)` once, so every test owns
    one instance and picks the exact option shape under test. `cellOverrides` is a plain
    `{ "row,col": { ...meta } }` map folded into a `cells` function, because a function cannot cross
    the `page.evaluate` boundary.

    Rows 0-3 hold the same ~150 character sentence in every cell, which needs four or more lines in a
    150px column. The last row holds one short word per cell and is the one-line reference. Line and
    row heights are content-driven, which jsdom reports as zero, so this can only be checked in a
    real browser.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    window.LONG_TEXT = 'The quick brown fox jumps over the lazy dog while seven wizards quietly box ' +
      'jugs of mellow honey beside a crooked river bank at dawn today, then rest';

    function buildData() {
      const data = [];

      for (let row = 0; row < 4; row++) {
        data.push([window.LONG_TEXT, window.LONG_TEXT, window.LONG_TEXT]);
      }
      data.push(['x', 'x', 'x']);

      return data;
    }

    window.mountGrid = function(settings, cellOverrides) {
      const overrides = cellOverrides || {};

      // Built loudly: a constructor throw is captured where the page object can read and rethrow it.
      try {
        window.hot = new Handsontable(container, {
          data: buildData(),
          width: 600,
          height: 500,
          colWidths: 150,
          licenseKey: 'non-commercial-and-evaluation',
          ...settings,
          cells(row, col) {
            return overrides[`${row},${col}`] || {};
          },
        });
      } catch (error) {
        window.htBuildError = String((error && error.stack) || error);
        throw error;
      }

      // Master cells carry the test id; every overlay's cell carries the row/col pair so a spec can
      // find "the same row" in each clone without a second test id.
      window.hot.addHook('afterRenderer', function(td, row, col) {
        td.setAttribute('data-row', String(row));
        td.setAttribute('data-col', String(col));

        if (td.closest('.ht_master')) {
          td.setAttribute('data-testid', `cell-${row}-${col}`);
        } else {
          td.removeAttribute('data-testid');
        }
      });
      // `renderMode: 'onChange'` repaints only cells it can prove changed, and the hook above was added
      // after the first draw, so the cells already on screen must be marked or they never get a test id.
      window.hot.markAllCellsChanged();
      window.hot.render();
    };
  </script>
</body>
</html>
