<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handsontable e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    #toolbar { margin-bottom: .8rem; }
    /*
      The bar's production SCSS (Task 9) styles the tab strip with `flex: 1 1
      auto`, so it grows to fill whatever layout it sits in. This fixture pins
      it to a fixed, non-growing width instead, so the strip reliably
      overflows regardless of viewport size and the paging-arrow behavior
      under test stays observable. `!important` is required: Handsontable
      injects its own copy of the base CSS into a <style> tag appended to
      <head> at grid-construction time (src/utils/stylesHandler.ts), which
      lands after this block in source order and matches with the same
      selector specificity.
    */
    .handsontable.ht-sheets-bar .ht-sheets-bar__tabs { flex: 0 0 600px !important; }
  </style>
</head>
<body>
  <!--
    E2E fixture. Cells are stamped with data-testid via a renderer so tests hook
    into them unambiguously (data-testid="cell-<row>-<col>") instead of brittle
    structural selectors. This mirrors the convention the authoring skill teaches.
  -->
  <div id="grid" data-testid="grid"></div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist, is appended and the
    // fixture waits for its `load`. `document.write` left the order implicit, and a request
    // that arrived late or failed ran the code below with no `Handsontable` — which surfaced
    // as a rare, unreproducible "element(s) not found" on whichever spec ran first.
    const loadBundle = () => {
      const bundleScript = document.createElement('script');

      bundleScript.src = `/handsontable/dist/${window.htBundle}`;
      bundleScript.addEventListener('load', initFixture);
      bundleScript.addEventListener('error', () => {
        throw new Error(`Failed to load the bundle: ${bundleScript.src}`);
      });
      document.head.appendChild(bundleScript);
    };

    function initFixture() {
    const container = document.querySelector('[data-testid="grid"]');

    container.className = `ht-theme-${window.htTheme}`;

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    const hot = new Handsontable(container, {
      colHeaders: true,
      rowHeaders: true,
      renderer: testIdRenderer,
      // A new sheet is seeded at 1000 rows, and an auto-growing grid would push the bar far
      // below the fold — the paging controls then cannot be reached. A real application gives
      // the grid a viewport for the same reason.
      height: 320,
      sheetsBar: {
        sheets: [
          { name: 'Alpha', data: [['A1', 'A2'], ['A3', 'A4']] },
          { name: 'Beta', data: [['B1', 'B2'], ['B3', 'B4']] },
          { name: 'Gamma', data: [['G1', 'G2'], ['G3', 'G4']] },
        ],
      },
      manualColumnResize: true,
      columnSorting: true,
      layoutDirection: htParams.get('rtl') ? 'rtl' : 'ltr',
      licenseKey: 'non-commercial-and-evaluation',
    });

    window.hot = hot;

    // Every lookup is guarded and nothing here throws. The grid defers its whole init when the
    // container has no layout yet, so the bar can be absent at this point; the previous version
    // dereferenced it immediately, and that one TypeError stopped the script before a single
    // test id was stamped — the page then looked permanently broken to every locator.
    const stamp = (element, id) => {
      if (element) {
        element.setAttribute('data-testid', id);
      }
    };
    const stampBar = () => {
      const bar = document.querySelector('.ht-sheets-bar');

      if (!bar) {
        return;
      }

      stamp(bar, 'sheets-bar');
      bar.querySelectorAll('.ht-sheets-bar__tab').forEach((tab, index) => {
        stamp(tab, `sheet-tab-${index}`);
        stamp(tab.querySelector('.ht-sheets-bar__tab-chevron'), `sheet-tab-chevron-${index}`);
      });
      stamp(bar.querySelector('.ht-sheets-bar__add'), 'sheets-bar-add');
      stamp(bar.querySelector('.ht-sheets-bar__all'), 'sheets-bar-all');
      stamp(bar.querySelector('.ht-sheets-bar__page-prev'), 'sheets-bar-page-prev');
      stamp(bar.querySelector('.ht-sheets-bar__page-next'), 'sheets-bar-page-next');
    };

    stampBar();
    hot.addHook('afterSheetTabChange', stampBar);
    hot.addHook('afterSheetTabAdd', stampBar);
    hot.addHook('afterSheetTabRemove', stampBar);
    hot.addHook('afterSheetTabRename', stampBar);
    hot.addHook('afterSheetTabMove', stampBar);

    // The hooks cover the operations that change the workbook, but the strip is also rebuilt
    // without one — a cancelled rename repaints it, and a deferred init creates it long after
    // this script ran. Watching the DOM re-stamps in both cases. Only element additions are
    // observed, so the attributes written here cannot retrigger it.
    new MutationObserver(stampBar).observe(document.body, { childList: true, subtree: true });
    }

    loadBundle();
  </script>
</body>
</html>
