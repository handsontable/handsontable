<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bottom-slot bar sizing e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }

    // The sizing layout and the bottom-slot plugin under test, from the same fail-loud allowlists.
    window.htVariant = ({
      'css-fixed': 'css-fixed',
      tiny: 'tiny',
      stretch: 'stretch',
      'flex-fill': 'flex-fill',
      'scrollable-ancestor': 'scrollable-ancestor',
      'explicit-height': 'explicit-height',
      'auto-height': 'auto-height',
      'inline-block-host': 'inline-block-host',
    })[htParams.get('variant') ?? 'css-fixed'];
    if (!window.htVariant) {
      throw new Error('Unknown ?variant= value: ' + JSON.stringify(htParams.get('variant')));
    }
    window.htPlugin = ({ pagination: 'pagination', sheetsBar: 'sheetsBar', none: 'none' })[htParams.get('plugin') ?? 'pagination'];
    if (!window.htPlugin) {
      throw new Error('Unknown ?plugin= value: ' + JSON.stringify(htParams.get('plugin')));
    }
  </script>
  <style> body { font-family: sans-serif; margin: 0; } </style>
</head>
<body>
  <!--
    A grid WITHOUT a `height` option inside containers sized by CSS only (DEV-2848). Each variant
    is one of the layouts measured on PR #13409 (bugs 2-4): a fixed CSS box with no overflow, a
    tiny one, one with `stretchH: 'all'`, a flex-filled one, and a scrollable ancestor. The
    `explicit-height` variant is the control: `height: 400` set through the option. `auto-height`
    is the page-owned content-driven shape, `inline-block-host` the shrink-to-fit parent.
  -->
  <div id="shell" data-testid="shell">
    <div id="grid" data-testid="grid"></div>
  </div>

  <script>
    // The bundle under test, selected above from the sanitized allowlist. The
    // closing tag is split so the HTML parser does not end THIS script block.
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script>
    const ROWS = 300;
    const COLS = 12;
    const buildData = (prefix) => Array.from({ length: ROWS }, (_, r) =>
      Array.from({ length: COLS }, (_, c) => `${prefix}${r + 1}C${c + 1}`));
    const alphaData = buildData('R');
    const betaData = buildData('B');

    const testIdRenderer = function(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.TextRenderer.apply(this, arguments);
      td.setAttribute('data-testid', `cell-${row}-${col}`);
    };

    // `grid` and `shell` are inline style strings; `settings` are grid options the variant adds.
    const VARIANTS = {
      'css-fixed': { grid: 'width: 800px; height: 400px;', shell: '', settings: {} },
      tiny: { grid: 'width: 260px; height: 300px;', shell: '', settings: {} },
      stretch: { grid: 'width: 800px; height: 400px;', shell: '', settings: { stretchH: 'all' } },
      'flex-fill': {
        grid: 'flex: 1 1 auto; min-height: 0;',
        shell: 'display: flex; flex-direction: column; height: 500px; width: 800px;',
        settings: {},
      },
      'scrollable-ancestor': { grid: '', shell: 'height: 300px; width: 800px; overflow: auto;', settings: {} },
      'explicit-height': { grid: '', shell: '', settings: { width: 800, height: 400 } },
      // `height: 'auto'` grows the root out of the CSS box; the page owns the vertical axis.
      'auto-height': { grid: 'width: 800px; height: 400px;', shell: '', settings: { height: 'auto' } },
      // A shrink-to-fit host: the wrapper sizes to its widest child, the slots included.
      'inline-block-host': { grid: '', shell: 'display: inline-block;', settings: {} },
    };

    // The sheets bar must not receive a top-level `data` (it owns the data per sheet).
    const PLUGINS = {
      pagination: () => ({ data: alphaData, pagination: { pageSize: 25 } }),
      sheetsBar: () => ({
        sheetsBar: {
          sheets: [
            { name: 'Alpha', data: alphaData },
            { name: 'Beta', data: betaData },
          ],
          activeSheet: 0,
        },
      }),
      none: () => ({ data: alphaData }),
    };

    /**
     * Builds (or rebuilds) the grid in the given layout with the given bottom-slot plugin.
     * `overrides` are grid options applied last (for example `{ height: '100%' }`).
     */
    window.initSlotGrid = function(variant = window.htVariant, plugin = window.htPlugin, overrides = {}) {
      if (window.hot) {
        window.hot.destroy();
      }

      const shell = document.getElementById('shell');
      const oldGrid = document.getElementById('grid');
      const grid = document.createElement('div');
      const layout = VARIANTS[variant];

      grid.id = 'grid';
      grid.setAttribute('data-testid', 'grid');
      grid.className = `ht-theme-${window.htTheme}`;
      grid.setAttribute('style', layout.grid);
      shell.setAttribute('style', layout.shell);
      shell.scrollTop = 0;
      oldGrid.replaceWith(grid);

      window.hot = new Handsontable(grid, {
        rowHeaders: true,
        colHeaders: true,
        renderer: testIdRenderer,
        licenseKey: 'non-commercial-and-evaluation',
        ...PLUGINS[plugin](),
        ...layout.settings,
        ...overrides,
      });

      return true;
    };

    window.initSlotGrid();
  </script>
</body>
</html>
