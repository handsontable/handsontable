<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editor validation wait e2e fixture</title>
  <link rel="stylesheet" href="/handsontable/styles/handsontable.min.css">
  <script>
    // Theme and bundle come from the ?theme=/?bundle= query params set by the
    // Playwright projects, mapped through fixed allowlists to LITERALS so a
    // crafted param can never be reflected into the document — no XSS. An
    // ABSENT param keeps the default (main / plain UMD) so the fixture stays
    // browsable by hand; an unknown value THROWS instead of falling back — a
    // typo in the project config must be one red leg, never a silently
    // mislabeled green one (nothing else asserts which file actually loaded).
    const htParams = new URLSearchParams(location.search);

    window.htTheme = ({ main: 'main', horizon: 'horizon', classic: 'classic' })[htParams.get('theme') ?? 'main'];
    if (!window.htTheme) {
      throw new Error('Unknown ?theme= value: ' + JSON.stringify(htParams.get('theme')));
    }
    // Written into <head> so the themed stylesheet is present before first render.
    document.write('<link rel="stylesheet" href="/handsontable/styles/ht-theme-' + window.htTheme + '.min.css">');
    // 1:1 with the Puppeteer legs (umd = handsontable.js, full-min =
    // handsontable.full.min.js, the exact file `test:production` loads).
    window.htBundle = ({ umd: 'handsontable.js', 'full-min': 'handsontable.full.min.js' })[htParams.get('bundle') ?? 'umd'];
    if (!window.htBundle) {
      throw new Error('Unknown ?bundle= value: ' + JSON.stringify(htParams.get('bundle')));
    }
    // The editor column B edits with, through the same kind of allowlist: `formula` is the
    // FormulaBuilder editor the other columns use too, `text` is the plain text editor.
    window.htEditor = ({ formula: 'formula', text: 'text' })[htParams.get('editor') ?? 'formula'];
    if (!window.htEditor) {
      throw new Error('Unknown ?editor= value: ' + JSON.stringify(htParams.get('editor')));
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    #grid { height: 360px; }
  </style>
  <script src="/tests/fixtures/demo/test-license-key.js"></script>
</head>
<body>
  <!--
    The editor's validation wait. Column B is numeric with an async validator (600 ms, rejects
    negatives) and `allowInvalid: false`; column C holds `=B<n>*2`, numeric too, so the Formulas
    plugin validates it whenever B changes. Row 12 holds B = -5, so a `validateCells()` batch
    (the button) ends invalid: the batch walks the rows from last to first, and its first answer
    is row 12's rejection. The status line counts the B validations in flight and answered, and
    records how many were in flight at the last Enter keydown, so a test proves the edit ran
    inside the batch. No column headers: a data row's `aria-rowindex` is its visual row + 1.
  -->
  <button type="button" data-testid="validate-cells">Validate cells</button>
  <p>
    B validations in flight: <output data-testid="validations-pending">0</output>,
    answered: <output data-testid="validations-answered">0</output>,
    in flight at the last Enter: <output data-testid="pending-at-enter">-</output>
  </p>
  <div id="grid" data-testid="grid"></div>

  <script>
    // The full bundle bakes HyperFormula in; the base bundle needs it as an external script.
    if (window.htBundle === 'handsontable.js') {
      document.write('<scr' + 'ipt src="/tests/node_modules/hyperformula/dist/hyperformula.full.min.js"></scr' + 'ipt>');
    }
  </script>
  <script>
    document.write('<scr' + 'ipt src="/handsontable/dist/' + window.htBundle + '"></scr' + 'ipt>');
  </script>
  <script type="module">
    const container = document.querySelector('[data-testid="grid"]');
    const pendingOutput = document.querySelector('[data-testid="validations-pending"]');
    const answeredOutput = document.querySelector('[data-testid="validations-answered"]');
    const pendingAtEnterOutput = document.querySelector('[data-testid="pending-at-enter"]');
    let pending = 0;
    let answered = 0;

    container.className = `ht-theme-${window.htTheme}`;

    // Capture phase on the window, so the count is read before the grid handles the key.
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        pendingAtEnterOutput.textContent = String(pending);
      }
    }, true);

    /**
     * Rejects negative numbers, 600 ms after it is asked: an async validator.
     *
     * @param {*} value The value to validate.
     * @param {Function} callback Takes the result.
     */
    function asyncNonNegative(value, callback) {
      pending += 1;
      pendingOutput.textContent = String(pending);

      setTimeout(() => {
        callback(Number(value) >= 0);
        pending -= 1;
        answered += 1;
        pendingOutput.textContent = String(pending);
        answeredOutput.textContent = String(answered);
      }, 600);
    }

    // B values 9, 18, 27, …; row 12 (index 11) holds -5.
    const data = Array.from({ length: 12 }, (_, row) => [
      `r${row + 1}`,
      row === 11 ? -5 : 9 * (row + 1),
      `=B${row + 1}*2`,
    ]);

    // The shared fixture contract: a failed module import or a constructor throw lands in
    // `window.htBuildError`, which `awaitFixtureBuilt()` rethrows with its stack.
    try {
      const FormulaBuilderModule = await import('/tests/node_modules/hyperformula-ui/dist/index.js');
      // `type: 'numeric'` brings its own editor, so the column names the one under test explicitly.
      const columnB = {
        type: 'numeric',
        editor: window.htEditor,
        validator: asyncNonNegative,
        allowInvalid: false,
      };

      window.hot = new Handsontable(container, {
        data,
        rowHeaders: true,
        // Wide enough for the formula bar's address box and formula area side by side.
        colWidths: 160,
        editor: 'formula',
        columns: [{}, columnB, { type: 'numeric' }],
        formulas: {
          engine: HyperFormula,
        },
        formulaBuilder: {
          builder: FormulaBuilderModule,
          showFormulaBar: true,
        },
        afterRenderer(td, row, col) {
          td.setAttribute('data-testid', `cell-${row}-${col}`);
        },
        licenseKey: window.htTestLicenseKey,
      });
    } catch (error) {
      window.htBuildError = String((error && error.stack) || error);
      throw error;
    }

    document.querySelector('[data-testid="validate-cells"]').addEventListener('click', () => {
      window.hot.validateCells();
    });
  </script>
</body>
</html>
