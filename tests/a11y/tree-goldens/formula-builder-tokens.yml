# grid
- textbox "Cell address": B2:C3
- textbox "Formula input"
- treegrid:
  - rowgroup:
    - row "1 2 3":
      - gridcell "1"
      - gridcell "2"
      - gridcell "3"
    - 'row "3 #DIV/0! 5"':
      - gridcell "3"
      - gridcell "#DIV/0!" [invalid] [selected]
      - gridcell "5" [selected]
    - 'row "5 6 #NAME?"':
      - gridcell "5"
      - gridcell "6" [selected]
      - gridcell "#NAME?" [invalid] [selected]
    - row:
      - gridcell
      - gridcell
      - gridcell
    - row "#NAME?":
      - gridcell "#NAME?" [invalid]
      - gridcell
      - gridcell
  - rowgroup:
    - row "Select whole grid A B C":
      - gridcell "Select whole grid"
      - columnheader "A"
      - columnheader "B"
      - columnheader "C"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
    - row "5":
      - rowheader "5"
  - rowgroup:
    - row "Select whole grid":
      - gridcell "Select whole grid"
  - rowgroup
