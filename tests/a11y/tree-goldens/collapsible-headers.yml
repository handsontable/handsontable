# grid
- treegrid:
  - rowgroup:
    - row "A1 B1 C1 D1 E1 F1":
      - gridcell "A1"
      - gridcell "B1"
      - gridcell "C1"
      - gridcell "D1"
      - gridcell "E1"
      - gridcell "F1"
    - row "A2 B2 C2 D2 E2 F2":
      - gridcell "A2"
      - gridcell "B2"
      - gridcell "C2"
      - gridcell "D2"
      - gridcell "E2"
      - gridcell "F2"
    - row "A3 B3 C3 D3 E3 F3":
      - gridcell "A3"
      - gridcell "B3"
      - gridcell "C3"
      - gridcell "D3"
      - gridcell "E3"
      - gridcell "F3"
    - row "A4 B4 C4 D4 E4 F4":
      - gridcell "A4"
      - gridcell "B4"
      - gridcell "C4"
      - gridcell "D4"
      - gridcell "E4"
      - gridcell "F4"
    - row "A5 B5 C5 D5 E5 F5":
      - gridcell "A5"
      - gridcell "B5"
      - gridcell "C5"
      - gridcell "D5"
      - gridcell "E5"
      - gridcell "F5"
  - rowgroup:
    - row "A B F":
      - columnheader "A"
      - columnheader "B" [expanded]
      - columnheader "F"
    - row "a b c d e f":
      - columnheader "a"
      - columnheader "b"
      - columnheader "c"
      - columnheader "d"
      - columnheader "e"
      - columnheader "f"
  - rowgroup
