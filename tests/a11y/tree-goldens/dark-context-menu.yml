# grid
- treegrid:
  - rowgroup:
    - row "A1 B1 C1":
      - gridcell "A1"
      - gridcell "B1"
      - gridcell "C1"
    - row "A2 B2 C2":
      - gridcell "A2"
      - gridcell "B2" [selected]
      - gridcell "C2"
    - row "A3 B3 C3":
      - gridcell "A3"
      - gridcell "B3"
      - gridcell "C3"
    - row "A4 B4 C4":
      - gridcell "A4"
      - gridcell "B4"
      - gridcell "C4"
    - row "A5 B5 C5":
      - gridcell "A5"
      - gridcell "B5"
      - gridcell "C5"
  - rowgroup:
    - row "A B C":
      - gridcell
      - columnheader "A"
      - columnheader "B"
      - columnheader "C"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
    - row "5":
      - rowheader "5"
  - rowgroup:
    - row:
      - gridcell
  - rowgroup
  - textbox "B, row 2"
# portal
- menu "Context menu":
  - menuitem "Insert row above"
  - menuitem "Insert row below"
  - separator
  - menuitem "Insert column left"
  - menuitem "Insert column right"
  - separator
  - menuitem "Remove row"
  - menuitem "Remove column"
  - separator
  - menuitem "Undo" [disabled]
  - menuitem "Redo" [disabled]
  - separator
  - menuitemcheckbox "Read only"
  - separator
  - menuitem "Alignment"
  - separator
  - menuitem "Copy"
  - menuitem "Cut"
- status
- status
