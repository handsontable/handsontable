# grid
- textbox "Cell address": B4
- textbox "Formula input"
- treegrid:
  - rowgroup:
    - row "1 2 3":
      - gridcell "1"
      - gridcell "2"
      - gridcell "3"
    - 'row "3 #DIV/0! 5"':
      - gridcell "3"
      - gridcell "#DIV/0!" [invalid]
      - gridcell "5"
    - 'row "5 6 #NAME?"':
      - gridcell "5"
      - gridcell "6"
      - gridcell "#NAME?" [invalid]
