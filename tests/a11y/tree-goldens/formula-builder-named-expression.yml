      - gridcell
      - gridcell [selected]
      - gridcell
    - row "#NAME?":
      - gridcell "#NAME?" [invalid]
      - gridcell
      - gridcell
  - rowgroup:
    - row "Select whole grid A B C":
      - gridcell "Select whole grid"
      - columnheader "A"
      - columnheader "B"
      - columnheader "C"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
    - row "5":
      - rowheader "5"
  - rowgroup:
    - row "Select whole grid":
      - gridcell "Select whole grid"
  - rowgroup
  - combobox "Formula editor" [expanded]: =SUMM
