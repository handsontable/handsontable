# grid
- treegrid:
  - rowgroup:
    - row "Racing Socks Apparel 30 120":
      - gridcell "Racing Socks"
      - gridcell "Apparel"
      - gridcell "30" [selected]
      - gridcell "120"
    - row "Mountain Frame Frames 1890 4":
      - gridcell "Mountain Frame"
      - gridcell "Frames"
      - gridcell "1890" [selected]
      - gridcell "4"
    - row "Cycling Cap Apparel 130 55":
      - gridcell "Cycling Cap"
      - gridcell "Apparel"
      - gridcell "130" [selected]
      - gridcell "55"
    - row "Road Tire Tube Components 59 310":
      - gridcell "Road Tire Tube"
      - gridcell "Components"
      - gridcell "59" [selected]
      - gridcell "310"
    - row "Water Bottle Accessories 9 900":
      - gridcell "Water Bottle"
      - gridcell "Accessories"
      - gridcell "9" [selected]
      - gridcell "900"
  - rowgroup:
    - row "Product Category Price Qty":
      - gridcell
      - columnheader "Product"
      - columnheader "Category"
      - columnheader "Price"
      - columnheader "Qty"
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
    - row "5":
      - rowheader "5"
  - rowgroup:
    - row:
      - gridcell
  - textbox "Price, row 1"
# portal
- menu "Column menu":
  - menuitem "Insert column left" [disabled]
  - menuitem "Insert column right" [disabled]
  - separator
  - menuitem "Remove column" [disabled]
  - separator
  - menuitem "Clear column"
  - separator
  - menuitemcheckbox "Read only"
  - separator
  - menuitem "Alignment"
  - separator
  - menuitem "Filter by condition:":
    - text: "Filter by condition:"
    - listbox: None
  - menuitem "Filter by value:":
    - group "Filter by value:":
      - text: "Filter by value:"
      - textbox "Filter by value:":
        - /placeholder: Search
      - button "Select all"
      - button "Select none"
      - treegrid:
        - rowgroup:
          - row "Checked 9":
            - gridcell "Checked 9":
              - checkbox "Checked" [checked]
              - text: "9"
          - row "Checked 30":
            - gridcell "Checked 30":
              - checkbox "Checked" [checked]
              - text: "30"
          - row "Checked 59":
            - gridcell "Checked 59":
              - checkbox "Checked" [checked]
              - text: "59"
          - row "Checked 130":
            - gridcell "Checked 130":
              - checkbox "Checked" [checked]
              - text: "130"
          - row "Checked 1890":
            - gridcell "Checked 1890":
              - checkbox "Checked" [checked]
              - text: "1890"
  - menuitem "Action bar":
    - button "OK"
    - button "Cancel"
- status
