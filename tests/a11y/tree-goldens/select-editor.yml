# grid
- treegrid:
  - rowgroup:
    - row "Unchecked B1 C1 D1":
      - gridcell "Unchecked":
        - checkbox "Unchecked"
      - gridcell "B1"
      - gridcell "C1"
      - gridcell "D1" [selected]
    - row "Unchecked B2 C2 D2":
      - gridcell "Unchecked":
        - checkbox "Unchecked"
      - gridcell "B2"
      - gridcell "C2"
      - gridcell "D2"
  - rowgroup:
    - row "Select whole grid A B C D":
      - gridcell "Select whole grid"
      - columnheader "A"
      - columnheader "B"
      - columnheader "C"
      - columnheader "D"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
  - rowgroup:
    - row "Select whole grid":
      - gridcell "Select whole grid"
  - rowgroup
  - combobox:
    - option "Option A"
    - option "Option B"
- text: "Page size:"
- combobox "Page size":
  - option "Auto" [selected]
  - option "5"
  - option "10"
  - option "20"
  - option "50"
  - option "100"
- text: 1 - 2 of 5
- navigation "Pagination":
  - button "Go to first page" [disabled]
  - button "Go to previous page" [disabled]
  - text: Page 1 of 3
  - button "Go to next page"
  - button "Go to last page"
# portal
- status: Page 1 of 3
- status
