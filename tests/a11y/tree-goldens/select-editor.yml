# grid
- treegrid:
  - rowgroup:
    - row "Unchecked B1 C1 D1":
      - gridcell "Unchecked":
        - checkbox "Unchecked"
      - gridcell "B1"
      - gridcell "C1"
      - gridcell "D1" [selected]
    - row "Unchecked B2 C2 D2":
      - gridcell "Unchecked":
        - checkbox "Unchecked"
      - gridcell "B2"
      - gridcell "C2"
      - gridcell "D2"
  - rowgroup:
    - row "A B C D":
      - gridcell
      - columnheader "A"
      - columnheader "B"
      - columnheader "C"
      - columnheader "D"
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
  - rowgroup:
    - row:
      - gridcell
  - combobox "D, row 1":
    - option "Option A"
    - option "Option B"
- text: "Page size:"
- combobox "Page size":
  - option "Auto" [selected]
  - option "5"
  - option "10"
  - option "20"
  - option "50"
  - option "100"
- text: 1 - 2 of 5
- navigation "Pagination":
  - button "Go to first page" [disabled]
  - button "Go to previous page" [disabled]
  - text: Page 1 of 3
  - button "Go to next page"
  - button "Go to last page"
# portal
- status: <announcement>
- status
