# grid
- treegrid
  - combobox "D, row 1" [expanded=false]
    - MenuListPopup
      - option "Option A"
      - option "Option B"
  - rowgroup
    - row "Select whole grid A B C D"
      - gridcell "Select whole grid"
      - columnheader "A"
      - columnheader "B"
      - columnheader "C"
      - columnheader "D"
  - rowgroup
    - row "1 Unchecked B1 C1 D1"
      - rowheader "1"
      - gridcell "Unchecked"
        - checkbox "Unchecked"
      - gridcell "B1"
      - gridcell "C1"
      - gridcell "D1" [selected]
    - row "2 Unchecked B2 C2 D2"
      - rowheader "2"
      - gridcell "Unchecked"
        - checkbox "Unchecked"
      - gridcell "B2"
      - gridcell "C2"
      - gridcell "D2"
- combobox "Page size" [expanded=false]: "Auto"
  - MenuListPopup
    - option "Auto" [selected]
    - option "5"
    - option "10"
    - option "20"
    - option "50"
    - option "100"
- navigation "Pagination"
  - button "Go to first page" [disabled]
  - button "Go to previous page" [disabled]
  - button "Go to next page"
  - button "Go to last page"
