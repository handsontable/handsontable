# grid
- treegrid:
  - rowgroup:
    - row "Update API docs Checked In progress":
      - gridcell "Update API docs"
      - gridcell "Checked":
        - checkbox "Checked" [checked]
      - gridcell "In progress"
    - row "Deploy hotfix Unchecked Blocked":
      - gridcell "Deploy hotfix"
      - gridcell "Unchecked":
        - checkbox "Unchecked"
      - gridcell "Blocked"
    - row "Review pull request Checked Done":
      - gridcell "Review pull request"
      - gridcell "Checked":
        - checkbox "Checked" [checked]
      - gridcell "Done"
    - row "Plan release Unchecked In progress":
      - gridcell "Plan release"
      - gridcell "Unchecked":
        - checkbox "Unchecked"
      - gridcell "In progress"
  - rowgroup:
    - row "Select whole grid Task Reviewed Status":
      - gridcell "Select whole grid"
      - columnheader "Task"
      - columnheader "Reviewed"
      - columnheader "Status"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
  - rowgroup:
    - row "Select whole grid":
      - gridcell "Select whole grid"
  - rowgroup
