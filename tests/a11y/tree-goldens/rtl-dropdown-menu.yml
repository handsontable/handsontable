# grid
- treegrid:
  - rowgroup:
    - row "A1 B1 C1 D1":
      - gridcell "A1"
      - gridcell "B1" [selected]
      - gridcell "C1"
      - gridcell "D1"
    - row "A2 B2 C2 D2":
      - gridcell "A2"
      - gridcell "B2" [selected]
      - gridcell "C2"
      - gridcell "D2"
    - row "A3 B3 C3 D3":
      - gridcell "A3"
      - gridcell "B3" [selected]
      - gridcell "C3"
      - gridcell "D3"
    - row "A4 B4 C4 D4":
      - gridcell "A4"
      - gridcell "B4" [selected]
      - gridcell "C4"
      - gridcell "D4"
    - row "A5 B5 C5 D5":
      - gridcell "A5"
      - gridcell "B5" [selected]
      - gridcell "C5"
      - gridcell "D5"
  - rowgroup:
    - row "Name Longer header text City Country":
      - gridcell
      - columnheader "Name"
      - columnheader "Longer header text"
      - columnheader "City"
      - columnheader "Country"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
    - row "5":
      - rowheader "5"
  - rowgroup:
    - row:
      - gridcell
  - rowgroup
  - textbox "Longer header text, row 1"
# portal
- menu "Column menu":
  - menuitem "Insert column left"
  - menuitem "Insert column right"
  - separator
  - menuitem "Remove column"
  - separator
  - menuitem "Clear column"
  - separator
  - menuitemcheckbox "Read only"
  - separator
  - menuitem "Alignment"
