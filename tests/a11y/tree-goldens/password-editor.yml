# grid
- treegrid
  - textbox "Password, row 1": "••"
  - rowgroup
    - row "Select whole grid Password PIN Amount"
      - gridcell "Select whole grid"
      - columnheader "Password"
      - columnheader "PIN"
      - columnheader "Amount"
  - rowgroup
    - row "1 ** #### $10.00"
      - rowheader "1"
      - gridcell "**" [selected]
      - gridcell "####"
      - gridcell "$10.00"
    - row "2 *** #### $20.00"
      - rowheader "2"
      - gridcell "***"
      - gridcell "####"
      - gridcell "$20.00"
    - row "3 ****** #### $30.00"
      - rowheader "3"
      - gridcell "******"
      - gridcell "####"
      - gridcell "$30.00"
    - row "4 #### $40.00"
      - rowheader "4"
      - gridcell
      - gridcell "####"
      - gridcell "$40.00"
