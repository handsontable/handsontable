# grid
- treegrid:
  - rowgroup:
    - 'row "** #### $10.00"':
      - gridcell "**" [selected]
      - gridcell "####"
      - gridcell "$10.00"
    - 'row "*** #### $20.00"':
      - gridcell "***"
      - gridcell "####"
      - gridcell "$20.00"
    - 'row "****** #### $30.00"':
      - gridcell "******"
      - gridcell "####"
      - gridcell "$30.00"
    - row "#### $40.00":
      - gridcell
      - gridcell "####"
      - gridcell "$40.00"
  - rowgroup:
    - row "Select whole grid Password PIN Amount":
      - gridcell "Select whole grid"
      - columnheader "Password"
      - columnheader "PIN"
      - columnheader "Amount"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
  - rowgroup:
    - row "Select whole grid":
      - gridcell "Select whole grid"
  - rowgroup
  - textbox: ab
