# grid
- treegrid:
  - rowgroup:
    - row "Alice Red":
      - gridcell "Alice"
      - gridcell "Red" [selected]
    - row "Bob Green":
      - gridcell "Bob"
      - gridcell "Green" [selected]
    - row "Charlie Blue":
      - gridcell "Charlie"
      - gridcell "Blue" [selected]
    - row "Dave Green":
      - gridcell "Dave"
      - gridcell "Green" [selected]
    - row "Eve Red":
      - gridcell "Eve"
      - gridcell "Red" [selected]
  - rowgroup:
    - row "Name Color":
      - gridcell
      - columnheader "Name"
      - columnheader "Color"
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
    - row "4":
      - rowheader "4"
    - row "5":
      - rowheader "5"
  - rowgroup:
    - row:
      - gridcell
  - textbox "Color, row 1"
# portal
- menu "Column menu":
  - menuitem "Insert column left"
  - menuitem "Insert column right"
  - separator
  - menuitem "Remove column"
  - separator
  - menuitem "Clear column"
  - separator
  - menuitemcheckbox "Read only"
  - separator
  - menuitem "Alignment"
  - separator
  - menuitem "Filter by condition:":
    - text: "Filter by condition:"
    - listbox: None
  - menuitem "Filter by value:":
    - group "Filter by value:":
      - text: "Filter by value:"
      - textbox "Filter by value:":
        - /placeholder: Search
      - button "Select all"
      - button "Select none"
      - checkbox "Blue" [checked]
      - text: Blue
      - checkbox "Green" [checked]
      - text: Green
      - checkbox "Red" [checked]
      - text: Red
  - menuitem "Action bar":
    - button "OK"
    - button "Cancel"
- status
- status
