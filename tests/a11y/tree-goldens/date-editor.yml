# grid
- treegrid:
  - rowgroup:
    - row "Conference 6/10/24 6/10/24 6/10/24 09:30 AM 06/10/2024, 09:30:00":
      - gridcell "Conference"
      - gridcell "6/10/24" [selected]
      - gridcell "6/10/24"
      - gridcell "6/10/24"
      - gridcell "09:30 AM"
      - gridcell "06/10/2024, 09:30:00"
    - row "Kickoff 1/5/24 1/5/24 1/5/24 10:15 AM 01/05/2024, 10:15:00":
      - gridcell "Kickoff"
      - gridcell "1/5/24"
      - gridcell "1/5/24"
      - gridcell "1/5/24"
      - gridcell "10:15 AM"
      - gridcell "01/05/2024, 10:15:00"
    - 'row "Review #bad-value# #bad-value#"':
      - gridcell "Review"
      - gridcell
      - gridcell "#bad-value#"
      - gridcell "#bad-value#"
      - gridcell
      - gridcell
  - rowgroup:
    - row "Select whole grid Event Start Required Required lenient Time Datetime":
      - gridcell "Select whole grid"
      - columnheader "Event"
      - columnheader "Start"
      - columnheader "Required"
      - columnheader "Required lenient"
      - columnheader "Time"
      - columnheader "Datetime"
  - rowgroup
  - rowgroup:
    - row "1":
      - rowheader "1"
    - row "2":
      - rowheader "2"
    - row "3":
      - rowheader "3"
  - rowgroup:
    - row "Select whole grid":
      - gridcell "Select whole grid"
  - rowgroup
  - textbox: 2024-06-10
